<style>
:root{--ink:#111;--grey:#6f6f6f;--line:#e5e5e5;--hover:#bdbdbd;--pad:32px;--gap:28px;--min:190px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--ink);font:14px/1.4 -apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
a:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

header{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;padding:22px var(--pad) 30px}
h1{margin:0;font-size:14px;font-weight:400;letter-spacing:.005em}
header p{margin:0;font-size:13px;color:var(--grey)}

main{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--min),1fr));gap:26px var(--gap);padding:0 var(--pad) 80px}
section{display:contents}
.b{margin:0;min-width:0;display:flex;flex-direction:column;container-type:inline-size}
.sq{position:relative;aspect-ratio:1/1;border:1px solid var(--line);background:#fff;overflow:hidden}
.b:hover .pic,.b:hover .lnk{border-color:var(--hover)}
.sq:focus-within{border-color:var(--ink)}
.sq a:focus-visible{outline-offset:3px}

/* picture blocks: the picture whole, on white */
.pic a{position:absolute;inset:0;display:block}
.pic img{position:absolute;left:4%;top:4%;width:92%;height:92%;object-fit:contain}
.ph{display:flex;align-items:center;justify-content:center;color:var(--grey);font-size:11px}

/* text blocks */
.txt{padding:5.8cqi 6cqi 5cqi;font:clamp(12px,5.6cqi,13px)/1.36 "Times New Roman",Times,serif}
.txt p{margin:0 0 .6em;text-wrap:pretty}
.txt h2{margin:0;font:inherit}
.txt a{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;text-decoration-color:#9a9a9a}
.txt a:hover{text-decoration-color:currentColor}

/* link blocks */
.lnk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:16px;text-align:center;font-size:clamp(11px,5.9cqi,13px);line-height:1.3}
.lnk p{margin:0;text-wrap:balance}
.lnk a::before{content:"";position:absolute;inset:0}
.lnk .s,.arr{color:var(--grey)}

figcaption{margin-top:8px;font-size:11px;line-height:1.3;color:var(--grey);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media (max-width:519px){
  :root{--pad:12px;--gap:10px}
  header{padding:16px var(--pad) 22px}
  main{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:18px;padding-bottom:56px}
  .txt{padding:4.8cqi 5cqi 4cqi;font-size:12px;line-height:1.3}
  .lnk{padding:10px}
  figcaption{margin-top:6px;font-size:10.5px}
}
@media (max-width:349px){
  main{grid-template-columns:minmax(0,1fr)}
}
</style>
