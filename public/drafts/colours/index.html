<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>kes inkersole — 05 colours</title>
<style>
:root { --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; --line: #d4d4d4; --grey: #777; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #fff; color: #111; }
body { display: flex; flex-direction: column; font: 12px/1.4 var(--mono); }
a { color: inherit; text-decoration: none; }
.bar { flex: none; display: flex; align-items: center; gap: 4px 16px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.bar strong { font-weight: normal; }
.bar nav { display: flex; flex-wrap: wrap; gap: 2px; }
.bar nav a { padding: 3px 7px; border: 1px solid transparent; }
.bar nav a:hover { border-color: var(--line); }
.bar nav a[aria-current] { border-color: #111; }
.note { flex: 1 1 260px; min-width: 0; color: var(--grey); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.open { margin-left: auto; text-decoration: underline; text-decoration-color: #aaa; text-underline-offset: 2px; }
iframe { flex: 1 1 auto; width: 100%; border: 0; display: block; }
@media (max-width: 600px) {
  .bar { padding: 8px 12px; gap: 6px 10px; }
  .open { order: 1; }
  .bar nav { order: 2; flex-basis: 100%; }
  .note { order: 3; flex-basis: 100%; }
}
</style>
</head>
<body>
<header class="bar">
<strong>kes — 05 colours</strong>
<nav>
<a href="01/" target="view" data-note="soft blue · the plain link blue, softened: blue text, a pale blue underline, a pale blue wash on hover." aria-current="page">01</a>
<a href="02/" target="view" data-note="old web, pastel · the old web's blue and purple, in pastel: periwinkle links turn lilac once visited; the hairlines go pale blue.">02</a>
<a href="03/" target="view" data-note="pink highlighter · links marked with a pale pink highlighter instead of an underline; a deeper pink on hover.">03</a>
<a href="04/" target="view" data-note="pastel highlighters · every link a different pastel highlighter, cycling pink, peach, butter, mint, sky and lilac.">04</a>
<a href="05/" target="view" data-note="unicorn underline · black links with a thin pastel-rainbow line underneath in place of the grey underline.">05</a>
<a href="06/" target="view" data-note="unicorn hover + sans · plain grey-underlined links that light up pastel rainbow on hover (desktop only); body text in a plain sans, labels stay mono.">06</a>
<a href="07/" target="view" data-note="mint paper · a warm paper white instead of pure white, warmer hairlines, deep teal links with a mint underline and a mint wash on hover.">07</a>
<a href="08/" target="view" data-note="lilac lines · the hairlines and grey labels tinted lilac, violet links with a pale lilac underline.">08</a>
<a href="09/" target="view" data-note="rainbow text · the link text itself in soft rainbow tones (rose, apricot, ochre, sage, sky, violet), dark enough to read.">09</a>
<a href="10/" target="view" data-note="rose + flowers · rose links with a pale pink underline, and a small ascii flower beside the name and at the foot.">10</a>
</nav>
<span class="note" id="note">soft blue · the plain link blue, softened: blue text, a pale blue underline, a pale blue wash on hover.</span>
<a class="open" id="open" href="01/" target="_blank" rel="noopener">open ↗</a>
</header>
<iframe name="view" id="view" src="01/" title="draft"></iframe>
<script>
(function () {
  var links = [].slice.call(document.querySelectorAll('nav a'));
  var view = document.getElementById('view'), note = document.getElementById('note'), open = document.getElementById('open');
  function show(i, push) {
    var a = links[i];
    links.forEach(function (l) { l.removeAttribute('aria-current'); });
    a.setAttribute('aria-current', 'page');
    note.textContent = a.getAttribute('data-note');
    open.href = a.getAttribute('href');
    if (view.getAttribute('src') !== a.getAttribute('href')) view.setAttribute('src', a.getAttribute('href'));
    if (push) history.replaceState(null, '', '#' + a.textContent);
  }
  links.forEach(function (a, i) {
    a.addEventListener('click', function (e) { e.preventDefault(); show(i, true); });
  });
  document.addEventListener('keydown', function (e) {
    var cur = links.findIndex(function (l) { return l.hasAttribute('aria-current'); });
    if (e.key === 'ArrowRight') show((cur + 1) % links.length, true);
    if (e.key === 'ArrowLeft') show((cur + links.length - 1) % links.length, true);
  });
  function fromHash() {
    var i = links.findIndex(function (l) { return '#' + l.textContent === location.hash; });
    if (i >= 0) show(i, false);
  }
  window.addEventListener('hashchange', fromHash);
  fromHash();
})();
</script>
</body>
</html>
