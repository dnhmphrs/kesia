<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>kes inkersole — drafts</title>
<style>
:root { --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; --line: #d4d4d4; --grey: #777; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #fff; color: #111; }
body { display: flex; flex-direction: column; font: 12px/1.4 var(--mono); }
a { color: inherit; text-decoration: none; }
.bar { flex: none; display: flex; align-items: center; gap: 4px 16px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.bar strong { font-weight: normal; }
.bar nav { display: flex; gap: 2px; }
.bar nav a { padding: 3px 7px; border: 1px solid transparent; }
.bar nav a:hover { border-color: var(--line); }
.bar nav a[aria-current] { border-color: #111; }
.note { flex: 1 1 260px; min-width: 0; color: var(--grey); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.open { margin-left: auto; text-decoration: underline; text-decoration-color: #aaa; text-underline-offset: 2px; }
iframe { flex: 1 1 auto; width: 100%; border: 0; display: block; }
@media (max-width: 600px) {
  .bar { padding: 8px 12px; gap: 6px 10px; }
  .note { order: 3; flex-basis: 100%; }
}
</style>
</head>
<body>
<header class="bar">
<strong>kes — drafts</strong>
<nav>
<a href="01/" target="view" data-note="thin grid · 1px hairline cells, kes's name in ascii letters, the three pictures across." aria-current="page">01</a>
<a href="02/" target="view" data-note="directory listing · a readme, then each project a folder led by its picture.">02</a>
<a href="03/" target="view" data-note="contact sheet · the three pictures as equal frames across the full width, small notes beneath.">03</a>
<a href="04/" target="view" data-note="sidebar archive · the text as a small index on the left, the pictures stacked large on the right.">04</a>
<a href="05/" target="view" data-note="full-bleed strip · the three pictures edge to edge across the screen, a strict grid below.">05</a>
</nav>
<span class="note" id="note">thin grid · 1px hairline cells, kes's name in ascii letters, the three pictures across.</span>
<a class="open" id="open" href="01/" target="_blank" rel="noopener">open ↗</a>
</header>
<iframe name="view" id="view" src="01/" title="draft"></iframe>
<script>
(function () {
  var links = [].slice.call(document.querySelectorAll('nav a'));
  var view = document.getElementById('view'), note = document.getElementById('note'), open = document.getElementById('open');
  function show(i, push) {
    var a = links[i];
    links.forEach(function (l) { l.removeAttribute('aria-current'); });
    a.setAttribute('aria-current', 'page');
    note.textContent = a.getAttribute('data-note');
    open.href = a.getAttribute('href');
    if (view.getAttribute('src') !== a.getAttribute('href')) view.setAttribute('src', a.getAttribute('href'));
    if (push) history.replaceState(null, '', '#' + a.textContent);
  }
  links.forEach(function (a, i) {
    a.addEventListener('click', function (e) { e.preventDefault(); show(i, true); });
  });
  document.addEventListener('keydown', function (e) {
    var cur = links.findIndex(function (l) { return l.hasAttribute('aria-current'); });
    if (e.key === 'ArrowRight') show((cur + 1) % links.length, true);
    if (e.key === 'ArrowLeft') show((cur + links.length - 1) % links.length, true);
  });
  function fromHash() {
    var i = links.findIndex(function (l) { return '#' + l.textContent === location.hash; });
    if (i >= 0) show(i, false);
  }
  window.addEventListener('hashchange', fromHash);
  fromHash();
})();
</script>
</body>
</html>
