<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>kes inkersole — workshop 5</title>
<style>
:root{--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--line:#d0d0d0;--grey:#777} *{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:#111} body{display:flex;flex-direction:column;font:12px/1.4 var(--mono)}
a{color:inherit;text-decoration:none}
.bar{flex:none;display:flex;align-items:center;gap:4px 16px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
.bar strong{font-weight:normal} .bar nav{display:flex;flex-wrap:wrap;gap:2px} .bar nav a{padding:3px 7px;border:1px solid transparent}
.bar nav a:hover{border-color:var(--line)} .bar nav a[aria-current]{border-color:#111}
.note{flex:1 1 260px;min-width:0;color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.open{margin-left:auto;text-decoration:underline;text-decoration-color:#aaa;text-underline-offset:2px}
iframe{flex:1 1 auto;width:100%;border:0;display:block}
@media (max-width:600px){.bar{padding:8px 12px;gap:6px 10px} .open{order:1} .bar nav{order:2;flex-basis:100%} .note{order:3;flex-basis:100%}}
</style></head><body>
<header class="bar"><strong>kes — workshop 5</strong>
<nav>
<a href="01/" target="view" data-note="low-tech: 1-bit dithered icons with kB weights, the original on open" aria-current="page">01</a>
<a href="02/" target="view" data-note="lab notebook: graph paper, coordinates, one rose margin rule">02</a>
<a href="03/" target="view" data-note="the paper: Times two-column preprint, figures, footnotes [1]–[24]">03</a>

<a href="07/" target="view" data-note="receipt: a 420px till strip, dashed rules, dot leaders, totals">07</a>
<a href="08/" target="view" data-note="tree: a directory listing with ├── └── and a sticky preview pane">08</a>
<a href="09/" target="view" data-note="datasheet: numbered sections, hairline tables, fig. boxes, running footer">09</a>

</nav>
<span class="note" id="note">low-tech: 1-bit dithered icons with kB weights, the original on open</span>
<a class="open" id="open" href="01/" target="_blank" rel="noopener">open ↗</a></header>
<iframe name="view" id="view" src="01/" title="draft"></iframe>
<script>
(function () {
  var links = [].slice.call(document.querySelectorAll('nav a')), view = document.getElementById('view'), note = document.getElementById('note'), open = document.getElementById('open');
  function show(i) { var a = links[i]; links.forEach(function (l) { l.removeAttribute('aria-current'); }); a.setAttribute('aria-current', 'page');
    note.textContent = a.getAttribute('data-note'); open.href = a.getAttribute('href'); if (view.getAttribute('src') !== a.getAttribute('href')) view.setAttribute('src', a.getAttribute('href'));
    history.replaceState(null, '', '#' + a.textContent); }
  links.forEach(function (a, i) { a.addEventListener('click', function (e) { e.preventDefault(); show(i); }); });
  document.addEventListener('keydown', function (e) { var cur = links.findIndex(function (l) { return l.hasAttribute('aria-current'); });
    if (e.key === 'ArrowRight') show((cur + 1) % links.length); if (e.key === 'ArrowLeft') show((cur + links.length - 1) % links.length); });
  function fromHash() { var i = links.findIndex(function (l) { return '#' + l.textContent === location.hash; }); if (i >= 0) show(i); }
  window.addEventListener('hashchange', fromHash); fromHash();
})();
</script></body></html>
