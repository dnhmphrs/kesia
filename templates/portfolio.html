<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>portfolio — {{site.name}}</title>
  <meta name="description" content="{{site.description}}">
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>{{site.name}}</h1>
</header>

<nav>
  <a href="index.html">home</a>
  <a href="portfolio.html">portfolio</a>
  <a href="writing.html">writing</a>
  <a href="about.html">about</a>
</nav>

<main>
  <h2>Projects</h2>

  {{#projects}}
  <article id="{{id}}">
    <h3>{{title}}</h3>
    <p>{{with}}</p>
    {{#pictures}}
    <img src="{{src}}" width="{{width}}" height="{{height}}" alt="{{alt}}" loading="lazy">
    {{/pictures}}
    {{#text}}
    <p>{{text}}</p>
    {{/text}}
    <p><a href="{{link.url}}">{{link.label}} ↗</a></p>
  </article>
  {{/projects}}

  <h2>For fun</h2>
  <ul>
    {{#fun}}
    <li><a href="{{url}}">{{label}}</a></li>
    {{/fun}}
  </ul>
</main>

<footer>
  <p>{{site.signoff}}</p>
  <p>say hello: <a href="mailto:{{site.email}}">{{site.email}}</a></p>
</footer>

</body>
</html>
