.type = 'bandpass'; bp.frequency.value = 1300; bp.Q.value = .6; g.gain.value = 0;\n\t\tsh.connect(bp).connect(g); g.connect(n.mix); g.connect(n.fx);\n\t\tconst blasts = [[0, .11], [.15, .11], [.3, .11], [.45, .75]];\n\t\t[466, 469.5, 698, 702].forEach(f => {\n\t\t\tconst o = c.createOscillator(); o.type = 'sawtooth';\n\t\t\tblasts.forEach(([s, d]) => { o.frequency.setValueAtTime(f * .9, t + s); o.frequency.exponentialRampToValueAtTime(f, t + s + .035); });\n\t\t\to.frequency.setValueAtTime(f, t + 1); o.frequency.exponentialRampToValueAtTime(f * .96, t + 1.2);\n\t\t\to.connect(sh); o.start(t); o.stop(t + 1.25);\n\t\t});\n\t\tblasts.forEach(([s, d]) => { g.gain.setValueAtTime(0, t + s); g.gain.linearRampToValueAtTime(.2, t + s + .01); g.gain.setValueAtTime(.2, t + s + d - .02); g.gain.linearRampToValueAtTime(0, t + s + d); });\n\t\tif (!playing) say('horn ✧ (press play for the rest)');\n\t}\n\tfunction siren() {\n\t\tif (!ensure()) return;\n\t\tconst c = ac, n = live, t = c.currentTime + .02, len = 1.8;\n\t\tconst o = c.createOscillator(), lfo = c.createOscillator(), lg = c.createGain(), lp = c.createBiquadFilter(), g = c.createGain();\n\t\to.type = 'square'; o.frequency.setValueAtTime(520, t); o.frequency.linearRampToValueAtTime(760, t + len);\n\t\tlfo.type = 'triangle'; lfo.frequency.setValueAtTime(3, t); lfo.frequency.linearRampToValueAtTime(9, t + len);\n\t\tlg.gain.value = 240; lfo.connect(lg).connect(o.frequency);\n\t\tlp.type = 'lowpass'; lp.frequency.value = 2600;\n\t\tg.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.075, t + .02); g.gain.setValueAtTime(.075, t + len - .1); g.gain.linearRampToValueAtTime(0, t + len);\n\t\to.connect(lp).connect(g); g.connect(n.mix); g.connect(n.fx);\n\t\to.start(t); lfo.start(t); o.stop(t + len + .02); lfo.stop(t + len + .02);\n\t\tif (!playing) say('dub siren ✧ (press play for the rest)');\n\t}\n\n\t/* ---- buttons ---- */\n\t$('play').addEventListener('click', play);\n\t$('stop').addEventListener('click', stop);\n\t$('rew').addEventListener('click', rewind);\n\t$('horn').addEventListener('click', horn);\n\t$('siren').addEventListener('click', siren);\n\t$('pat').addEventListener('click', () => {\n\t\twhich = (which + 1) % BREAKS.length; chopped = false; steps = parse(BREAKS[which]);\n\t\tlabel(); say('break: ' + BREAKS[which].name); if (playing) playingStatus();\n\t});\n\t$('chop').addEventListener('click', () => {\n\t\tsteps = chop(parse(BREAKS[which])); chopped = true;\n\t\tlabel(); say('chopped ✂ (press again for a different cut)'); if (playing) playingStatus();\n\t});\n\tui.reese.addEventListener('click', () => {\n\t\treese = !reese; ui.reese.setAttribute('aria-pressed', reese);\n\t\tlabel(); say(reese ? 'reese bass in ✧' : 'just the sub now');\n\t});\n\tui.tune.addEventListener('input', () => {\n\t\tbpm = +ui.tune.value;\n\t\tui.freq.textContent = bpm.toFixed(1); ui.bpm.textContent = bpm + ' bpm';\n\t\tif (live) live.dl.delayTime.setTargetAtTime(.75 * 60 / bpm, ac.currentTime, .05);\n\t\tlabel(); if (playing) playingStatus();\n\t});\n\tui.vol.addEventListener('input', () => { if (ac) vol.gain.setTargetAtTime(level(), ac.currentTime, .02); });\n\n\twindow.kesfm = { play, stop, rewind, horn, siren, render: (s, n) => render(s || 0, n || 6) };\n})();\n\u003c/script>\n\n\u003cscript>(function(){\ndocument.addEventListener('click',function(e){\n  var a=e.target.closest&&e.target.closest('a[href^=\"#\"]');\n  if(!a||e.defaultPrevented)return;\n  var id=decodeURIComponent(a.getAttribute('href').slice(1)),t=id&&document.getElementById(id);\n  if(id&&!t)return;\n  e.preventDefault();\n  t?t.scrollIntoView({block:'start'}):scrollTo(0,0);\n});\naddEventListener('keydown',function(e){\n  if(e.metaKey||e.ctrlKey||e.altKey)return;\n  if(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]'))return;\n  if(['ArrowLeft','ArrowRight','m'].indexOf(e.key)>-1)parent.postMessage({variantKey:e.key},'*');\n});\n})();\u003c/script>\u003c/body>\n\u003c/html>\n"}, {"label": "06", "note": "", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en-GB\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>kes inkersole\u003c/title>\n\u003cmeta name=\"description\" content=\"Kesia Inkersole — freelance creative strategist & internet equalities researcher, based in london.\">\n\u003cmeta name=\"author\" content=\"Kes Inkersole\">\n\u003cmeta name=\"color-scheme\" content=\"light\">\n\u003cmeta name=\"theme-color\" content=\"#ffd60a\">\n\u003clink rel=\"icon\" href=\"/favicon.ico\" sizes=\"any\">\n\u003cmeta property=\"og:type\" content=\"website\">\n\u003cmeta property=\"og:title\" content=\"kes inkersole\">\n\u003cmeta property=\"og:description\" content=\"kes inkersole — freelance creative strategist & internet equalities researcher, based in london.\">\n\u003cmeta property=\"og:image\" content=\"https://kesia-coral.vercel.app/square.png\">\n\u003cmeta property=\"og:url\" content=\"https://kesia-coral.vercel.app\">\n\u003cmeta name=\"twitter:card\" content=\"summary_large_image\">\n\u003cmeta name=\"twitter:image\" content=\"https://kesia-coral.vercel.app/square.png\">\n\u003cstyle>\n:root {\n  /* the soft bit, same as before */\n  --paper: #fff7f1;\n  --ink: #3b1f47;     /* plum, instead of black */\n  --pink: #ff5ca8;\n  --rose: #c42a72;    /* the pink, dark enough to read */\n  --blue: #3d4ee0;    /* links */\n  --lilac: #8d4fcf;   /* links you've been to */\n  --gold: #e7a200;\n  --mint: #23a26b;\n  --butter: #ffec85;\n  --blush: #ffe3ee;\n  --sky: #e7e9ff;\n  /* the 'ard bit */\n  --night: #17111b;   /* black, with a bit of plum in it */\n  --hazard: #ffd60a;  /* warning tape */\n  --acid: #b6ff3b;    /* acid green, only ever on black */\n  --chrome: linear-gradient(180deg, #fff 0%, #e2e3ec 32%, #8d8b9c 48%, #3a3644 52%, #b8b6c6 72%, #fff 100%);\n  --tape: repeating-linear-gradient(-45deg, var(--night) 0 11px, var(--hazard) 11px 22px);\n  --mono: Menlo, Consolas, \"DejaVu Sans Mono\", \"Liberation Mono\", \"Courier New\", monospace;\n  --fat: \"Arial Black\", \"Arial Bold\", Gadget, \"Helvetica Neue\", Arial, sans-serif;\n  --gut: clamp(16px, 3vw, 48px);\n}\nhtml { background: var(--paper); color: var(--ink); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\nbody { margin: 0; padding: 0 var(--gut); font: 17px/1.5 \"Helvetica Neue\", Helvetica, Arial, sans-serif; overflow-x: clip; }\n::selection { background: var(--hazard); color: var(--night); }\n\na { color: var(--blue); text-decoration-color: #3d4ee055; text-underline-offset: 3px; }\na:visited { color: var(--lilac); }\na:hover { color: var(--rose); text-decoration: underline wavy var(--pink); }\na:focus-visible, button:focus-visible, input:focus-visible { outline: 3px dashed var(--pink); outline-offset: 3px; }\n\nh1, h2, h3 { margin: 0 0 .6em; }\nul, ol { list-style: none; margin: 0; padding: 0; }\nli { padding-left: 1.3em; margin-bottom: .3em; }\nli::before { content: \"☆\"; display: inline-block; width: 1.3em; margin-left: -1.3em; color: var(--gold); }\nli:hover::before { content: \"★\"; color: var(--pink); }\nmark { background: linear-gradient(transparent 45%, var(--butter) 45%, var(--butter) 92%, transparent 92%); color: inherit; }\n.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }\n\n/* ---------- warning tape, top and bottom of the page ---------- */\n.tape { margin: 0 calc(-1 * var(--gut)); background: var(--hazard); color: var(--night); overflow: hidden; border-block: 7px solid transparent; border-image: var(--tape) 7; }\n.tape div { display: flex; width: max-content; animation: run 60s linear infinite; }\n.tape span { font: 900 13px/1 var(--fat); letter-spacing: .08em; text-transform: uppercase; white-space: pre; padding: 6px 0 5px; }\n@keyframes run { to { transform: translateX(-50%); } }\n\n/* ---------- ascii. all plain ascii characters, so it lines up in any monospace font ---------- */\n.art { font: 15px/1.15 var(--mono); margin: 0; white-space: pre; color: var(--ink); }\n.art .p { color: var(--pink); }\n.art .n { color: var(--pink); font-weight: bold; }\n.art .r { color: var(--rose); font-weight: bold; }\n.art .b, .wire { color: var(--blue); }\n.art .y { color: var(--gold); }\n.art .l { color: var(--lilac); }\n.art .g { color: var(--mint); }\n.art .k { color: var(--ink); }\n.wire i { color: var(--pink); font-style: normal; }\n.shut { display: none; }\nheader:hover .open { display: none; }\nheader:hover .shut { display: inline; }\n\n/* the banner is 120 characters wide, so it's sized to fill the page */\nheader { container-type: inline-size; margin: 22px 0 26px; }\n.banner { font-size: 1vw; font-size: min(32px, 100cqi / 73.8); }\n.banner.small { display: none; font-size: min(17px, 100cqi / 30.8); }\n\n/* ---------- hello ---------- */\n.hello { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 4fr) auto; gap: 32px 48px; align-items: start; margin-bottom: 56px; }\n.hello p { font-size: 1.15rem; margin: 0 0 .8em; max-width: 34em; }\n\n/* the \"hello my name is\" sticker, slapped on */\n.slap { display: inline-block; margin: 0 0 22px; background: #fff; border-radius: 14px; overflow: hidden; transform: rotate(-2.5deg); box-shadow: 0 0 0 3px var(--pink), 5px 7px 0 3px #3b1f4722; text-align: center; }\n.slap b { display: block; background: var(--pink); color: #fff; font: 900 26px/1 var(--fat); letter-spacing: .06em; text-transform: uppercase; padding: 10px 28px 2px; }\n.slap small { display: block; background: var(--pink); color: #fff; font: bold 13px/1 var(--mono); padding: 2px 0 9px; }\n.slap span { display: block; padding: 4px 34px 16px 26px; font: italic 900 clamp(48px, 5.4vw, 72px)/1.05 var(--fat); color: var(--ink); letter-spacing: -.06em; transform: skewX(-12deg) rotate(-3deg); }\n.slap span i { font-style: normal; color: var(--pink); font-size: .6em; vertical-align: .35em; letter-spacing: 0; }\n\n/* lately, as an early-90s rave flyer (but it's lorem ipsum) */\n.flyer { position: relative; background: var(--night); color: #f4eef7; border-radius: 6px; padding: 22px 24px 16px; box-shadow: 6px 6px 0 var(--pink); transform: rotate(.8deg); margin-top: 8px; }\n.flyer .pre { font: bold 12px/1.2 var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--acid); margin: 0 0 4px; }\n.flyer h2 { font: italic 900 clamp(44px, 4.4vw, 64px)/1 var(--fat); letter-spacing: -.04em; margin: 0 0 .25em; }\n.chrome { background: var(--chrome); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 1px #ffffff66; filter: drop-shadow(3px 3px 0 var(--pink)); padding-right: .1em; }\n.flyer li::before { content: \"✦\"; color: var(--acid); }\n.flyer li:hover::before { content: \"✦\"; color: var(--pink); }\n.flyer .fine { font: 12px/1.4 var(--mono); color: #c9bfd0; border-top: 2px dashed #ffffff33; padding-top: 10px; margin: 14px 0 0; }\n.burst { position: absolute; right: 14px; top: -26px; width: 92px; height: 92px; display: grid; place-items: center; text-align: center; background: var(--hazard); color: var(--night); font: 900 13px/1.05 var(--fat); text-transform: uppercase; clip-path: polygon(50% 0, 61% 18%, 82% 8%, 80% 30%, 100% 36%, 86% 52%, 100% 68%, 79% 72%, 82% 93%, 61% 83%, 50% 100%, 39% 83%, 18% 93%, 21% 72%, 0 66%, 14% 52%, 0 36%, 20% 30%, 18% 8%, 39% 18%); transform: rotate(12deg); }\n.bunny:hover { animation: hop .5s; }\n@keyframes hop { 40% { transform: translateY(-8px); } }\n\n/* ---------- kes fm, the jungle machine ---------- */\n.radio { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 40px 56px; align-items: start; margin-bottom: 64px; }\n.box { container-type: inline-size; position: relative; background: var(--night); color: #efe8f3; border-radius: 28px; padding: 26px clamp(14px, 2.4vw, 30px) 22px; margin-top: 30px; box-shadow: inset 0 0 0 3px #4a4352, inset 0 0 0 6px var(--night), inset 0 0 0 8px #9b98aa, 0 10px 0 -2px #00000022; }\n.box::before { /* the handle */ content: \"\"; position: absolute; left: 22%; right: 22%; top: -26px; height: 30px; border: 7px solid #9b98aa; border-bottom: 0; border-radius: 20px 20px 0 0; }\n.box .strip { position: absolute; left: 34px; top: -12px; background: var(--hazard); border-block: 5px solid transparent; border-image: var(--tape) 5; color: var(--night); font: 900 11px/1 var(--fat); letter-spacing: .1em; padding: 4px 10px 3px; text-transform: uppercase; transform: rotate(-3deg); }\n.brand { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin: 6px 0 2px; }\n.brand b { font: italic 900 clamp(34px, 4vw, 54px)/1 var(--fat); letter-spacing: -.03em; }\n.lamp { font: bold 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; border: 2px solid #5c5465; color: #8c8396; border-radius: 99px; padding: 5px 10px 4px; }\n.box.on .lamp { border-color: #ff3b6b; color: #fff; background: #ff3b6b; box-shadow: 0 0 14px #ff3b6b; }\n.ident { font: 13px/1.4 var(--mono); color: #bdb3c6; margin: 0 0 16px; }\n.mid { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: center; }\n.spk { position: relative; width: clamp(84px, 8.4vw, 128px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, #3b3442 0 13%, #09070b 14% 18%, #2f2836 19% 42%, #09070b 43% 46%, #262029 47% 68%, #09070b 69% 72%, #57505f 73%); box-shadow: 0 0 0 4px #9b98aa, 0 0 0 7px #2a2430; transition: transform .07s; }\n.spk::after { content: \"♡\"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--pink); font: bold 15px/1 var(--mono); }\n.box.thump .spk { transform: scale(1.06); }\n.lcd { background: #0a1806; color: var(--acid); border-radius: 10px; padding: 10px 12px 8px; box-shadow: inset 0 0 0 2px #24391b, inset 0 0 22px #b6ff3b1f; text-shadow: 0 0 6px #b6ff3b88; font: 14px/1.45 var(--mono); }\n.lcd p { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.cells { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 3px; margin: 8px 0; }\n.cells span { text-align: center; border: 1px solid #2c4a1f; border-radius: 3px; font: bold 12px/20px var(--mono); color: #79a646; text-shadow: none; }\n.cells span:nth-child(4n+1) { border-color: #4f7a35; }\n.cells .rv { color: var(--pink); }\n.cells .st { text-decoration: underline; }\n.cells .on { background: var(--acid); color: var(--night); }\n.cass { display: flex; align-items: center; gap: 10px; margin-top: 10px; background: #ece6f1; color: var(--night); border-radius: 8px; padding: 7px 10px; box-shadow: inset 0 0 0 2px #b9b1c2; font: bold 12px/1.3 var(--mono); }\n.cass span { flex: 1; text-align: center; background: var(--blush); border-radius: 4px; padding: 3px 6px; }\n.reel { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 3px dashed var(--night); background: radial-gradient(circle, #fff 0 24%, var(--night) 25% 34%, #cfc8d6 35%); animation: spin 1.4s linear infinite paused; }\n.box.on .reel { animation-play-state: running; }\n@keyframes spin { to { transform: rotate(-360deg); } }\n\n.keys { display: flex; flex-wrap: wrap; gap: 12px 10px; margin: 20px 0 6px; }\n.key { font: 900 16px/1 var(--fat); text-transform: lowercase; padding: 13px 16px 12px; border-radius: 9px; border: 2px solid var(--night); background: linear-gradient(#fdfcff, #c8c4d2); color: var(--night); box-shadow: 0 4px 0 #7a7486, 0 5px 0 2px var(--night); cursor: pointer; }\n.key:active { transform: translateY(3px); box-shadow: 0 1px 0 #7a7486, 0 2px 0 2px var(--night); }\n.key.play { background: linear-gradient(#ecffcf, var(--acid)); }\n.key.stop { background: var(--hazard); font-size: 18px; padding-inline: 22px; }\n.key.pull { background: linear-gradient(#ffd6ea, var(--pink)); }\n.key[disabled] { opacity: .4; cursor: not-allowed; transform: none; }\n.ctl { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; margin-top: 16px; font: 13px/1.2 var(--mono); color: #cfc6d8; }\n.grp { display: inline-flex; align-items: center; gap: 8px; }\n.grp > span:first-child { color: #9f95aa; }\n.pill { display: inline-flex; border: 2px solid #5c5465; border-radius: 99px; overflow: hidden; }\n.ctl button { font: bold 13px/1 var(--mono); background: transparent; color: #efe8f3; border: 0; padding: 8px 11px 7px; cursor: pointer; }\n.ctl button + button { border-left: 2px solid #5c5465; }\n.ctl button[aria-pressed=\"true\"] { background: var(--acid); color: var(--night); }\n.ctl .solo { border: 2px solid #5c5465; border-radius: 99px; }\n.ctl .solo[disabled] { opacity: .4; cursor: not-allowed; }\n.ctl label { display: inline-flex; align-items: center; gap: 8px; }\n.ctl input[type=\"range\"] { width: 120px; accent-color: var(--pink); }\n.ctl output { color: var(--acid); min-width: 2.5em; }\n.textin { margin: 18px 0 0; padding-top: 12px; border-top: 2px dashed #ffffff26; font: 13px/1.4 var(--mono); color: #bdb3c6; }\n.box a { color: var(--acid); text-decoration-color: #b6ff3b66; }\n.box a:hover { color: var(--pink); }\n.smiley { position: absolute; right: 22px; top: -30px; width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--night); transform: rotate(14deg);\n  background: radial-gradient(circle at 26% 62%, #ff8fc2 0 9%, transparent 10%), radial-gradient(circle at 74% 62%, #ff8fc2 0 9%, transparent 10%), var(--hazard); }\n.smiley::before { content: \"\"; position: absolute; left: 30%; top: 22%; width: 9%; height: 24%; border-radius: 50%; background: var(--night); box-shadow: 15px 0 0 var(--night); }\n.smiley::after { content: \"\"; position: absolute; left: 22%; right: 22%; top: 40%; height: 30%; border: 4px solid var(--night); border-top: 0; border-radius: 0 0 99px 99px; }\n.nope .keys, .nope .ctl { display: none; }\n.sorry { display: none; }\n.nope .sorry { display: block; }\n\n.notes p { margin: 0 0 .9em; max-width: 36em; }\n.notes .how li::before { content: \"→\"; color: var(--pink); }\n.due { margin-top: 22px; background: var(--butter); border-radius: 18px; padding: 18px 22px 8px; position: relative; }\n.due::before { content: \"\"; position: absolute; left: 24px; top: -9px; width: 86px; height: 18px; background: var(--tape); transform: rotate(-4deg); }\n.due h3 { font: bold 1rem/1.3 var(--mono); color: var(--rose); }\n.due p { font-size: .97rem; }\n\n/* tags, like a marker on a bus seat */\n.tag { display: inline-block; margin: 0 0 .7em; font: italic 900 clamp(24px, 2.3vw, 32px)/1.1 var(--fat); letter-spacing: -.05em; color: var(--blue); transform: rotate(-2deg) skewX(-10deg); text-shadow: 2px 2px 0 var(--butter); }\n.tag::after { content: \"\"; display: block; height: 4px; width: 86%; margin: 3px 0 0 6%; background: currentColor; border-radius: 99px; transform: rotate(-1.2deg); }\n.tag i { font-style: normal; font-size: .55em; letter-spacing: 0; vertical-align: .3em; color: var(--pink); }\n.tag.rose { color: var(--rose); }\n.tag.mint { color: var(--mint); }\n.tag.lilac { color: var(--lilac); }\n\n/* ---------- the wall, with a throw-up on it ---------- */\n.wall { position: relative; margin: 0 0 32px; padding: 26px 24px 30px; border-radius: 6px;\n  background:\n    linear-gradient(var(--paper) 3px, transparent 0) 0 0 / 100% 30px,\n    conic-gradient(at 3px 50%, transparent 75%, var(--paper) 0) 0 0 / 64px 60px,\n    conic-gradient(at 3px 50%, transparent 75%, var(--paper) 0) 32px 30px / 64px 60px,\n    var(--blush); }\n.throw { position: relative; z-index: 0; margin: 0; font: 900 clamp(36px, 5.6vw, 84px)/1.02 var(--fat); letter-spacing: -.03em; color: var(--pink); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; transform: rotate(-2deg);\n  text-shadow: 1px 1px 0 var(--ink), 2px 2px 0 var(--ink), 3px 3px 0 var(--ink), 4px 4px 0 var(--ink), 5px 5px 0 var(--ink), 6px 6px 0 var(--ink), 8px 7px 0 var(--butter); }\n.throw .sm { font-size: .62em; color: var(--sky); white-space: nowrap; }\n.dr { position: relative; }\n.dr::after { content: \"\"; position: absolute; z-index: -1; left: 38%; top: 70%; width: .14em; height: .62em; background: var(--pink); border: 3px solid var(--ink); border-top: 0; border-radius: 0 0 99px 99px; transform-origin: top; animation: drip 5s ease-in-out infinite alternate; }\n.sm .dr::after { background: var(--sky); }\n.dr:nth-of-type(2n)::after { height: .9em; animation-delay: -2s; }\n@keyframes drip { from { transform: scaleY(.55); } to { transform: scaleY(1.08); } }\n.wall .smiley { right: 4%; top: auto; bottom: -22px; transform: rotate(-10deg); }\n\n.funds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px 40px; margin-bottom: 56px; }\n.funds p { margin: 0 0 .6em; max-width: 36em; }\n.photos { position: relative; display: flex; gap: 8px; padding-top: 6px; }\n.photos::before, .photos::after { content: \"\"; position: absolute; z-index: 1; top: -2px; width: 64px; height: 16px; background: var(--tape); opacity: .92; }\n.photos::before { left: 10px; transform: rotate(-7deg); }\n.photos::after { right: 10px; transform: rotate(6deg); }\n.photos img { flex: 1.5 1 0; min-width: 0; height: auto; border-radius: 8px; background: var(--sky); transition: transform .2s; }\n.photos img.tall { flex-grow: .75; }\n.photos img:nth-child(2n) { background: var(--blush); }\n.photos img:hover { transform: rotate(-2deg); }\n.photos img:nth-child(2n):hover { transform: rotate(2deg); }\n.cap { font: 13px/1.4 var(--mono); color: var(--lilac); }\n.funds a { font-weight: bold; }\n\n.lists { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 48px; margin-bottom: 24px; }\n.lists section { margin-bottom: 32px; }\n.pods { grid-column: span 2; }\n\n/* podcasts, as a tape pack */\n.pack { background: var(--night); color: #fff; border-radius: 8px 8px 0 0; padding: 12px 16px 10px; margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; box-shadow: 5px 5px 0 var(--lilac); }\n.pack b { font: italic 900 clamp(24px, 2.3vw, 32px)/1 var(--fat); letter-spacing: -.04em; }\n.pack small { font: bold 12px/1.2 var(--mono); color: var(--acid); letter-spacing: .14em; text-transform: uppercase; }\n.tapes { counter-reset: tape; columns: 2; column-gap: 14px; border: 3px solid var(--night); border-top: 0; border-radius: 0 0 8px 8px; padding: 14px 14px 6px; background: var(--paper); box-shadow: 5px 5px 0 var(--lilac); }\n.tapes li { counter-increment: tape; break-inside: avoid; position: relative; padding: 8px 12px 8px 58px; margin: 0 0 10px; border: 2px solid var(--ink); border-radius: 5px; background: var(--sky); line-height: 1.35; }\n.tapes li:nth-child(4n+2) { background: var(--blush); }\n.tapes li:nth-child(4n+3) { background: var(--butter); }\n.tapes li:nth-child(4n+4) { background: #dff5e8; }\n.tapes li::before { content: \"tape \" counter(tape, decimal-leading-zero); position: absolute; left: 0; top: 0; bottom: 0; width: 46px; margin: 0; display: grid; place-items: center; background: var(--night); color: var(--hazard); font: bold 10px/1.1 var(--mono); text-align: center; padding: 0 4px; border-radius: 2px 0 0 2px; }\n.tapes li:hover::before { content: \"tape \" counter(tape, decimal-leading-zero); color: var(--acid); }\n\n.crowd, .sky { overflow: hidden; }\n.crowd { margin: 8px 0 36px; }\n\n/* the serious bit, stencilled */\n.serious { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 32px 56px; align-items: start; margin-bottom: 48px; }\n.serious > div > p:first-of-type { font-size: 1.25rem; max-width: 34em; }\n.stencil { font: 900 clamp(30px, 3.4vw, 46px)/1 var(--fat); letter-spacing: .1em; text-transform: uppercase; }\n.stencil span { color: transparent; background: linear-gradient(var(--ink) 0 45%, transparent 45% 55%, var(--ink) 55%); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 0 3px #3b1f4766); }\n.stencil i { font: normal bold 1rem var(--mono); letter-spacing: 0; text-transform: none; color: var(--pink); vertical-align: middle; margin-left: .4em; }\n\n/* say hi, through a bus window, with someone's marker on it */\n.hi { position: relative; border-radius: 26px; padding: 30px 26px 14px; background: linear-gradient(155deg, #f4f8ff 0%, #dfe9ff 45%, #eef2ff 46%, #e3ecff 100%); box-shadow: inset 0 0 0 7px var(--night), 0 0 0 9px var(--pink), 0 0 0 13px var(--night); margin: 13px; }\n.hi p { margin: 0 0 .8em; max-width: 40em; }\n.hi .next { font: bold 12px/1.2 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--hazard); background: var(--night); display: inline-block; padding: 6px 10px 5px; border-radius: 4px; }\n.scrawl { position: absolute; right: 22px; top: 18px; font: italic 900 30px/1 var(--fat); color: var(--rose); opacity: .78; letter-spacing: -.08em; transform: rotate(-9deg) skewX(-16deg); }\n.scrawl::after { content: \"\"; display: block; height: 3px; background: currentColor; border-radius: 99px; margin-top: 2px; transform: rotate(4deg); }\n\n@media (prefers-reduced-motion: reduce) {\n  .tape div, .dr::after, .reel { animation: none; }\n  .box.thump .spk { transform: none; }\n}\n@media (max-width: 1240px) {\n  .lists { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }\n}\n@media (max-width: 1100px) {\n  .hello { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }\n  .hello > div:first-child { grid-row: span 2; }\n  .radio { grid-template-columns: minmax(0, 1fr); }\n  .notes { max-width: 760px; }\n}\n@media (max-width: 900px) {\n  .funds, .serious { grid-template-columns: minmax(0, 1fr); }\n  .funds > div { max-width: 640px; }\n}\n@media (max-width: 760px) {\n  body { font-size: 16px; }\n  .banner.big { display: none; }\n  .banner.small { display: block; }\n  .hello, .lists { grid-template-columns: minmax(0, 1fr); }\n  .hello > div:first-child { grid-row: auto; }\n  .pods { grid-column: auto; }\n  .tapes { columns: 1; }\n  .art { font-size: 13px; }\n  .flyer { transform: none; }\n  .wall { padding: 20px 14px 26px; }\n}\n@container (max-width: 540px) {\n  .spk { display: none; }\n  .mid { grid-templat \u003c/i>\u003c/div>\n\u003c/div>\n\u003cspan class=\"spk\" aria-hidden=\"true\">\u003c/span>\n\u003c/div>\n\n\u003cdiv class=\"keys\">\n\u003cbutton class=\"key play\" id=\"play\" type=\"button\">▶ play\u003c/button>\n\u003cbutton class=\"key stop\" id=\"stop\" type=\"button\">■ stop\u003c/button>\n\u003cbutton class=\"key pull\" id=\"pull\" type=\"button\" disabled>⟲ pull up\u003c/button>\n\u003cbutton class=\"key\" id=\"chop\" type=\"button\">✂ chop\u003c/button>\n\u003c/div>\n\n\u003cdiv class=\"ctl\">\n\u003cspan class=\"grp\" role=\"group\" aria-label=\"break\">\u003cspan>break\u003c/span> \u003cspan class=\"pill\">\u003cbutton type=\"button\" data-pat=\"amen\" aria-pressed=\"true\">amen-ish\u003c/button>\u003cbutton type=\"button\" data-pat=\"roller\" aria-pressed=\"false\">roller\u003c/button>\u003cbutton type=\"button\" data-pat=\"chopped\" aria-pressed=\"false\">chopped\u003c/button>\u003c/span>\u003c/span>\n\u003cspan class=\"grp\" role=\"group\" aria-label=\"bass\">\u003cspan>bass\u003c/span> \u003cspan class=\"pill\">\u003cbutton type=\"button\" data-bass=\"sub\" aria-pressed=\"false\">sub\u003c/button>\u003cbutton type=\"button\" data-bass=\"reese\" aria-pressed=\"true\">reese\u003c/button>\u003cbutton type=\"button\" data-bass=\"off\" aria-pressed=\"false\">off\u003c/button>\u003c/span>\u003c/span>\n\u003cbutton type=\"button\" class=\"solo\" id=\"sparkle\" aria-pressed=\"false\">✧ sparkles\u003c/button>\n\u003cbutton type=\"button\" class=\"solo\" id=\"siren\" disabled>⚠ siren\u003c/button>\n\u003clabel>tuning \u003cinput type=\"range\" id=\"bpm\" min=\"160\" max=\"175\" step=\"1\" value=\"170\"> \u003coutput id=\"bpmv\" for=\"bpm\">170\u003c/output>\u003c/label>\n\u003clabel>volume \u003cinput type=\"range\" id=\"vol\" min=\"0\" max=\"100\" step=\"1\" value=\"60\">\u003c/label>\n\u003c/div>\n\u003cp class=\"sorry\">(your browser can't do web audio, so the radio's off tonight. sorry x)\u003c/p>\n\u003cp class=\"textin\">text-in line: \u003ca href=\"mailto:inkersolekesia@gmail.com\">inkersolekesia@gmail.com\u003c/a> ✧ \u003ckbd>esc\u003c/kbd> stops it too\u003c/p>\n\u003cp class=\"vh\" id=\"say\" aria-live=\"polite\">\u003c/p>\n\u003c/div>\n\n\u003cdiv class=\"notes\">\n\u003ch2 class=\"tag\" id=\"fm-h\">kes fm \u003ci>(the jungle machine)\u003c/i>\u003c/h2>\n\u003cp>it's a tiny jungle machine, and it stays quiet until you press play. \u003cb>■ stop\u003c/b> (or esc) cuts it straight off. it starts at a sensible volume, but maybe check yours first.\u003c/p>\n\u003cp>everything you hear is synthesised in your browser, live. there are no samples: a little drum break gets built from scratch at 136bpm, then sped up to 170, chopped and rewound, which is roughly how jungle producers flipped the amen.\u003c/p>\n\u003cul class=\"how\">\n\u003cli>\u003cb>✂ chop\u003c/b> reshuffles the break (changes land on the next bar)\u003c/li>\n\u003cli>\u003cb>⟲ pull up\u003c/b> rewinds it and brings it back from the top\u003c/li>\n\u003cli>\u003cb>tuning\u003c/b> moves it between 160 and 175bpm\u003c/li>\n\u003cli>\u003cb>✧ sparkles\u003c/b> is the cute bit, \u003cb>⚠ siren\u003c/b> is a dub siren\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"due\">\n\u003ch3>credit where it's due\u003c/h3>\n\u003cp>jungle came out of london in the early 90s, out of Black British sound system culture: reggae and dub sound systems, MCs, breakbeats and hardcore rave, carried on pirate radio, dubplates and tape packs. this page borrows the look, so it should say where the look comes from.\u003c/p>\n\u003cp>the amen break is a few seconds of Gregory C. Coleman's drumming on The Winstons' \"Amen, Brother\" (1969). it's one of the most sampled recordings ever, and the band never saw royalties for it. the machine here doesn't touch the recording, but the pattern is still his. who gets credited (and paid) when culture gets copied around the internet is an internet equalities question too.\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\n\u003cdiv class=\"wall\">\n\u003ch2 class=\"throw\">pr\u003cspan class=\"dr\">o\u003c/span>jects \u003cspan class=\"sm\">(f\u003cspan class=\"dr\">o\u003c/span>r fun\u003cspan class=\"dr\">d\u003c/span>s)\u003c/span>\u003c/h2>\n\u003cspan class=\"smiley\" aria-hidden=\"true\">\u003c/span>\n\u003c/div>\n\n\u003c!-- photos are placeholders. when the real ones go in, say what's in them in alt=\"\" -->\n\n\u003cdiv class=\"funds\">\n\u003cdiv>\n\u003cp class=\"photos\">\u003cimg src=\"https://picsum.photos/seed/morning/480/320\" width=\"240\" height=\"160\" alt=\"\">\n\u003cimg class=\"tall\" src=\"https://picsum.photos/seed/oslash/240/320\" width=\"120\" height=\"160\" alt=\"\">\u003c/p>\n\u003cp class=\"cap\">lorem ipsum dolor sit amet, photos by lorem ipsum\u003c/p>\n\u003cp>\u003ca href=\"https://www.instagram.com/p/CwOEAMetgc1/?img_index=1\">MØRNING Ø\u003c/a>\u003cbr>\nlorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.\u003c/p>\n\u003c/div>\n\n\u003cdiv>\n\u003cp class=\"photos\">\u003cimg class=\"tall\" src=\"https://picsum.photos/seed/networked/240/320\" width=\"120\" height=\"160\" alt=\"\">\n\u003cimg src=\"https://picsum.photos/seed/worlds/480/320\" width=\"240\" height=\"160\" alt=\"\">\u003c/p>\n\u003cp class=\"cap\">lorem ipsum dolor (left), consectetur adipiscing (right)\u003c/p>\n\u003cp>\u003ca href=\"https://co-matter.com/project/networked-worlds\">networked worlds\u003c/a> (co—matter)\u003cbr>\nduis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.\u003c/p>\n\u003c/div>\n\n\u003cdiv>\n\u003cp class=\"photos\">\u003cimg class=\"tall\" src=\"https://picsum.photos/seed/dirty/240/320\" width=\"120\" height=\"160\" alt=\"\">\n\u003cimg clas  = t % (n - 1);\n      wires[i].innerHTML = \"-\".repeat(at) + \"\u003ci>&lt;3\u003c/i>\" + \"-\".repeat(n - 2 - at);\n    }\n  }, 90);\n}\n\u003c/script>\n\n\u003cscript>\n// KES FM: a tiny jungle machine. web audio only, no samples, nothing loads.\n// it builds a drum break from scratch at 136bpm (the amen's tempo), then plays it back\n// sped up to 170, chopped into 16ths like a sampler would. it never starts on its own.\n(function () {\n  var AC = window.AudioContext || window.webkitAudioContext;\n  var box = document.getElementById(\"fm\");\n  if (!box) return;\n  if (!AC || !window.OfflineAudioContext) { box.classList.add(\"nope\"); return; }\n\n  function $(id) { return document.getElementById(id); }\n  var lcd1 = $(\"lcd1\"), lcd2 = $(\"lcd2\"), cellsEl = $(\"cells\"), say = $(\"say\"), lamp = $(\"lamp\");\n  var bPlay = $(\"play\"), bStop = $(\"stop\"), bPull = $(\"pull\"), bChop = $(\"chop\"), bSpark = $(\"sparkle\"), bSiren = $(\"siren\");\n  var rBpm = $(\"bpm\"), oBpm = $(\"bpmv\"), rVol = $(\"vol\");\n\n  // ---- the score. 4 bars of 16ths, the shape of the amen. X = snare, x = ghost snare, C = crash\n  var KICK  = [\"x.x.......xx....\", \"x.x.......xx....\", \"x.x.......x.....\", \"..xx......x.....\"];\n  var SNARE = [\"....X..x.x..X..x\", \"....X..x.x..X..x\", \"....X..x.x....X.\", \".x..X..x.x....X.\"];\n  var RIDE  = [\"x.x.x.x.x.x.x.x.\", \"x.x.x.x.x.x.x.x.\", \"x.x.x.x.x.x.x.x.\", \"x.x.x.x.x.C...x.\"];\n  var ORIG = 136, SL = 60 / ORIG / 4, STEPS = 64;\n  var LETTER = [];\n  for (var i = 0; i \u003c STEPS; i++) {\n    var b = i >> 4, j = i & 15, k = KICK[b][j], s = SNARE[b][j], c = RIDE[b][j];\n    LETTER.push(k === \"x\" ? \"K\" : s === \"X\" ? \"S\" : s === \"x\" ? \"s\" : c === \"C\" ? \"C\" : \"·\");\n  }\n\n  // ---- the bassline, in G minor: [step, length in 16ths, midi note, slide from]\n  var LINE = [[0, 6, 31], [6, 3, 31], [10, 6, 34], [16, 8, 31], [24, 4, 29, 31], [28, 4, 36],\n              [32, 10, 39], [42, 6, 38, 39], [48, 6, 38], ute */\n  --paper: #fdf8ef;  /* unbleached cotton */\n  --ink:   #3b2440;  /* plum, not black */\n  --pink:  #e8508e;\n  --blue:  #4a5be0;\n  --lilac: #8e57c9;  /* visited links */\n  --butter:#ffe58a;  /* highlighter */\n  --blush: #fde8ef;\n  --aida:  #f6ecda;  /* cross-stitch cloth */\n  --holes: #e7d7bc;\n  /* 'ard */\n  --black: #141114;\n  --hazard:#ffd400;  /* warning tape */\n  --acid:  #b8ff2e;\n  --chrome: linear-gradient(180deg, #fff 0%, #e4e9ef 24%, #98a3b0 46%, #353b45 50%, #c3cbd5 58%, #fff 80%, #b4bcc6 100%);\n  --gut: clamp(16px, 3vw, 48px);\n}\nhtml { background: var(--paper); }\nbody {\n  margin: 0;\n  padding: 0 var(--gut);\n  color: var(--ink);\n  background: var(--paper);\n  font: 18px/1.45 \"Times New Roman\", Times, serif;\n  overflow-x: hidden;\n}\n::selection { background: var(--pink); color: #fff; }\n\na { color: var(--blue); text-underline-offset: .15em; }\na:visited { color: var(--lilac); }\na:hover { color: var(--pink); text-decoration-style: wavy; }\n\nmark { background: var(--butter); color: inherit; padding: 0 .15em; border-radius: .2em; }\nmark.acid { background: var(--acid); }\n\nh2 { font-size: 1.15em; font-weight: normal; margin: 1.4em 0 .4em; }\nh2 span { color: var(--pink); }\n\nul { padding-left: 1.4em; list-style: \"☆  \"; }\nli { margin: .25em 0; }\nli::marker { color: var(--pink); }\nli:hover { list-style: \"★  \"; }\np { max-width: 38em; }\n\n.kao { color: var(--pink); white-space: nowrap; }\nbutton { font: 15px \"Times New Roman\", Times, serif; color: var(--ink); background: var(--blush); border: 1px solid var(--pink); border-radius: 1em; padding: .15em .8em; cursor: pointer; }\nbutton:hover { background: #fff; }\nbutton:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }\n\n/* ---------- warning tape, strung edge to edge ---------- */\n.tape {\n  margin: 0 calc(-1 * var(--gut));\n  padding: 7px 0;\n  overflow: hidden;\n  background: repeating-linear-gradient(-45deg em -0.002em 0 var(--black),\n    0.030em -0.005em 0 var(--black),\n    0.047em -0.002em 0 var(--black),\n    0.062em 0.008em 0 var(--black),\n    0.072em 0.023em 0 var(--black),\n    0.105em 0.080em 0 var(--black),\n    0.102em 0.097em 0 var(--black),\n    0.092em 0.112em 0 var(--black),\n    0.077em 0.122em 0 var(--black),\n    0.060em 0.125em 0 var(--black),\n    0.043em 0.122em 0 var(--black),\n    0.028em 0.112em 0 var(--black),\n    0.018em 0.097em 0 var(--black),\n    0.015em 0.080em 0 var(--black),\n    0.018em 0.063em 0 var(--black),\n    0.028em 0.048em 0 var(--black),\n    0.043em 0.038em 0 var(--black),\n    0.060em 0.035em 0 var(--black),\n    0.077em 0.038em 0 var(--black),\n    0.092em 0.048em 0 var(--black),\n    0.102em 0.063em 0 var(--black),\n    0.165em 0.070em 0 var(--acid),\n    0.161em 0.097em 0 var(--acid),\n    0.151em 0.122em 0 var(--acid),\n    0.134em 0.144em 0 var(--acid),\n    0.113em 0.161em 0 var(--acid),\n    0.087em 0.171em 0 var(--acid),\n    0.060em 0.175em 0 var(--acid),\n    0.033em 0.171em 0 var(--acid),\n    0.008em 0.161em 0 var(--acid),\n    -0.014em 0.144em 0 var(--acid),\n    -0.031em 0.122em 0 var(--acid),\n    -0.041em 0.097em 0 var(--acid),\n    -0.045em 0.070em 0 var(--acid),\n    -0.041em 0.043em 0 var(--acid),\n    -0.031em 0.018em 0 var(--acid),\n    -0.014em -0.004em 0 var(--acid),\n    0.007em -0.021em 0 var(--acid),\n    0.033em -0.031em 0 var(--acid),\n    0.060em -0.035em 0 var(--acid),\n    0.087em -0.031em 0 var(--acid),\n    0.113em -0.021em 0 var(--acid),\n    0.134em -0.004em 0 var(--acid),\n    0.151em 0.017em 0 var(--acid),\n    0.161em 0.043em 0 var(--acid);\n}\n/* paint running off the bottom of the letters */\n.drip {\n  position: absolute; top: .72em; left: var(--x); width: .075em; height: var(--h);\n  background: var(--pink); border: .018em solid var(--ink); border-top: 0; border-radius: 0 0 .06em .06em;\n  transform-origin: top; animation: drip 2.4s cubic-bezier(.5, 0, .3, 1) both;\n}\n.drip::after { content: \"\"; position: absolute; left: -.03em; bottom: -.06em; width: .1em; height: .11em; border-radius: 50%; background: var(--pink); border: .018em solid var(--ink); border-top-color: transparent; box-sizing: border-box; }\n@keyframes drip { from { transform: scaleY(.15); } }\n.shine { position: absolute; color: #fff; font-size: .16em; line-height: 1; text-shadow: none; pointer-events: none; }\n.chrome {\n  display: inline-block;\n  font: 900 clamp(50px, 9.4vw, 134px)/1 Impact, Haettenschweiler, \"Arial Narrow Bold\", \"Liberation Sans Narrow\", \"Arial Black\", sans-serif;\n  font-synthesis: none; letter-spacing: .01em;\n  background: var(--chrome); -webkit-background-clip: text; background-clip: text; color: transparent;\n  -webkit-text-stroke: .016em var(--black);\n  filter: drop-shadow(.035em .045em 0 var(--black)) drop-shadow(.03em .04em 0 var(--pink));\n}\n.chrome::selection, .throw::selection { color: #fff; }\n\n/* sticker slaps */\n.stickers { display: flex; align-items: center; gap: 1.4em; font-size: 15px; margin-left: auto; }\n.hello {\n  width: 12em; padding: .45em 0 .9em; text-align: center;\n  background: var(--pink); color: #fff; border: 2px solid var(--black); border-radius: .9em;\n  box-shadow: 4px 4px 0 var(--black); transform: rotate(-5deg);\n  font: 700 14px/1.2 Arial, Helvetica, sans-serif;\n}\n.hello b { display: block; font: 900 2.3em/1 \"Arial Black\", Arial, sans-serif; letter-spacing: .03em; }\n.hello small { display: block; font-size: 1em; margin: .15em 0 .5em; }\n.hello span { display: block; background: #fff; color: var(--black); padding: .2em 0 .1em; }\n.hello em { display: inline-block; font: italic 900 2.7em/1.15 \"Arial Black\", Arial, sans-serif; letter-spacing: -.05em; transform: skewX(-10deg) rotate(-3deg); text-shadow: 0 0 1px var(--black); }\n.smiley { position: relative; width: 5.2em; height: 5.2em; border-radius: 50%; background: var(--hazard); border: .22em solid var(--black); box-shadow: 4px 4px 0 var(--black); transform: rotate(9deg); flex: none; }\n.smiley::before { content: \"\"; position: absolute; left: 29%; top: 22%; width: .62em; height: 1.25em; border-radius: 50%; background: var(--black); box-shadow: 1.5em 0 0 var(--black); }\n.smiley::after { content: \"\"; position: absolute; left: 17%; right: 17%; top: 30%; height: 45%; border-bottom: .38em solid var(--black); border-radius: 50%; }\n\n/* ---------- cross-stitch, now on a black bomber as well as cotton ---------- */\n.band { container-type: inline-size; margin: 0 calc(-1 * var(--gut)); }\n.aida {\n  --cloth: var(--aida);\n  margin: 0; overflow: hidden;\n  background: var(--cloth); color: var(--holes);\n  font: 16px/.72 ui-monospace, Menlo, Consolas, \"DejaVu Sans Mono\", \"Courier New\", monospace;\n}\n.aida b { font-weight: normal; color: var(--pink); }\n.aida .b { color: var(--blue); }\n.aida .y { color: #eea92a; }\n.aida .g { color: #3aa86b; }\n.aida .i { color: var(--ink); }\n.aida .w { color: #fff; }\n.night { --cloth: #151215; color: #2c272c; }\n.night .y { color: var(--hazard); }\n.night .g { color: var(--acid); }\n.night .b { color: #8f9bff; }\n.night .w { color: #dfe3e8; }\n.aida:hover .h { animation: blink 1s steps(1) infinite; }\n.onair .aida .h { animation: blink var(--beat, .353s) steps(1) infinite; }  /* the little screen's heart keeps time with the radio */\n@keyframes blink { 50% { color: var(--cloth); } }\n.wide { display: none; font-size: min(16px, 100cqi / 140 / .61); }  /* 140 stitches always fit; past that it's just more rig */\n.narrow { font-size: min(16px, 100cqi / 41 / .61); }\n.small { display: inline-block; max-width: 100%; margin-top: .4em; font-size: min(16px, 100cqi / 41 / .61); }\n.chain { font-size: 13px; }\n\n/* ---------- intro ---------- */\n.top { display: grid; gap: 0 2.5em; padding: .6em 0 .4em; }\n.top p:last-child { margin-bottom: 0; }\n.top h2:first-child { margin-top: .6em; }\n/* a sewn-on patch with warning tape over the corner */\n.patch { position: relative; align-self: start; background: var(--blush); padding: .3em 1.2em .6em; margin: 1.6em 0 1em; border-radius: 6px; outline: 2px dashed #f2a3c2; outline-offset: -7px; }\n.patch-tape {\n  position: absolute; top: -.85em; left: .8em; max-width: calc(100% - 1.6em); margin: 0;\n  padding: .15em .7em; transform: rotate(-2deg);\n  background: repeating-linear-gradient(-45deg, var(--black) 0 8px, var(--hazard) 8px 16px);\n  font: 700 12px/1.6 Arial, Helvetica, sans-serif; letter-spacing: .14em; text-transform: uppercase;\n}\n.patch-tape span { background: var(--black); color: var(--hazard); padding: 0 .5em; }\n\n/* ---------- warning tape with a running stitch through it ---------- */\nhr { position: relative; border: 0; height: 18px; margin: 2.6em calc(-1 * var(--gut)); background: repeating-linear-gradient(-45deg, var(--black) 0 12px, var(--hazard) 12px 24px); }\nhr::before { content: \"\"; position: absolute; left: 0; right: 0; top: 7px; border-top: 4px dashed var(--pink); }\n\n/* ---------- the rig: kes fm ---------- */\n.rig {\n  display: grid; gap: 2.2em; align-items: start;\n  margin: 2em calc(-1 * var(--gut)) 0; padding: 2.6em var(--gut) 3em;\n  background: var(--black); color: #f1ecf4;\n}\n.rig > * { min-width: 0; }\n.deck {\n  color: var(--black);\n  background: linear-gradient(180deg, #f6f8fa 0%, #cfd5dc 38%, #a9b0b9 50%, #d9dee4 63%, #f0f2f5 100%);\n  border: 3px solid #000; border-radius: 22px; padding: 1em clamp(.8em, 2vw, 1.4em) 1.1em;\n  box-shadow: inset 0 2px 0 #fff, 7px 7px 0 var(--pink);\n}\n.deck h2 { display: flex; flex-wrap: wrap; align-items: baseline; gap: .1em .6em; margin: 0 0 .5em; }\n.deck h2 small { font: italic 17px/1.2 \"Times New Roman\", Times, serif; color: var(--ink); }\n.stencil {\n  font: 900 2.3em/1 Impact, Haettenschweiler, \"Arial Black\", sans-serif; font-synthesis: none; letter-spacing: .05em; text-transform: uppercase;\n  background: linear-gradient(180deg, #111 0 45%, transparent 45% 55%, #111 55%); -webkit-background-clip: text; background-clip: text; color: transparent;\n}\n.lamp { display: inline-block; width: .7em; height: .7em; margin-left: .2em; border-radius: 50%; background: #6b5d63; border: 2px solid #000; vertical-align: .1em; }\n.on .lamp { background: var(--pink); box-shadow: 0 0 10px var(--pink); }\n\n.lcd {\n  display: flex; flex-wrap: wrap; align-items: baseline; gap: .2em 1em;\n  background: #0d1609; color: var(--acid); border: 3px solid #000; border-radius: 10px; padding: .55em .8em .6em;\n  font: 15px/1.35 ui-monospace, Menlo, Consolas, \"DejaVu Sans Mono\", monospace;\n  text-shadow: 0 0 6px rgba(184, 255, 46, .55);\n  box-shadow: inset 0 0 18px rgba(184, 255, 46, .12);\n}\n.freq { font-size: 2.1em; line-height: 1; letter-spacing: .02em; }\n.freq small { font-size: .42em; }\n.onair-txt { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: #59723a; text-shadow: none; }\n.on .onair-txt { color: var(--pink); text-shadow: 0 0 6px var(--pink); }\n.mc { flex: 1 1 100%; min-height: 2.7em; overflow-wrap: anywhere; }\n\n/* a pink cassette with a hazard-tape label */\n.cassette { position: relative; max-width: 380px; margin: 1em auto .9em; aspect-ratio: 1.6; background: var(--blush); border: 3px solid #000; border-radius: 14px; box-shadow: 4px 4px 0 #000; }\n.cassette::before, .cassette::after { content: \"✿\"; position: absolute; bottom: 4%; color: var(--pink); font-size: 16px; line-height: 1; }\n.cassette::before { left: 4%; } .cassette::after { right: 4%; }\n.label { position: absolute; inset: 9% 7% 22%; background: #fff; border: 2px solid #000; border-radius: 6px; overflow: hidden; text-align: center; }\n.label p { margin: 0; max-width: none; padding: 0 .5em; white-space: nowrap; overflow: hidden; background: repeating-linear-gradient(-45deg, var(--black) 0 7px, var(--hazard) 7px 14px); font: 700 11px/1.7 Arial, Helvetica, sans-serif; letter-spacing: .12em; text-transform: uppercase; }\n.label p span { background: var(--black); color: var(--hazard); padding: 0 .4em; }\n.label i { display: block; margin-top: .2em; font: italic 14px/1.2 \"Times New Roman\", Times, serif; color: var(--ink); }\n.window { position: absolute; left: 21%; right: 21%; top: 47%; height: 24%; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; background: #2b2230; border: 2px solid #000; border-radius: 999px; }\n.reel { width: 26%; aspect-ratio: 1; border-radius: 50%; border: 3px solid #fff; background: repeating-conic-gradient(#fff 0 22deg, var(--pink) 22deg 60deg); }\n.on .reel { animation: spin 1.4s linear infinite; }\n.rewind .reel { animation: spin .22s linear infinite reverse; }\n@keyframes spin { to { transform: rotate(360deg); } }\n\n.lights { display: grid; grid-template-columns: repeat(16, 1fr); gap: 4px; margin: 0 0 1em; }\n.lights i { height: 13px; border-radius: 4px; background: #4b4048; border: 2px solid #000; }\n.lights i:nth-child(4n+1) { background: #6a5d66; }\n.lights i.on { background: var(--acid); }\n.lights i.k { background: var(--hazard); }\n.lights i.s { background: var(--pink); }\n\n.controls { display: grid; gap: .65em; }\n.row { display: flex; flex-wrap: wrap; align-items: center; gap: .5em; margin: 0; padding: 0; border: 0; min-width: 0; }\n.lab { width: 4.2em; font: 700 11px/1 Arial, Helvetica, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #3d3640; }\n.deck button {\n  font: 700 14px/1 Arial, Helvetica, sans-serif; color: var(--black);\n  background: #fff; border: 2px solid #000; border-radius: 999px; padding: .55em .9em;\n  box-shadow: 0 3px 0 #000;\n}\n.deck button:hover { background: var(--butter); }\n.deck button:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }\n.deck button[aria-pressed=\"true\"] { background: var(--pink); color: #fff; }\n.deck .big { font-size: 17px; padding: .6em 1.1em; }\n.deck .go { background: var(--acid); }\n.deck .go[aria-pressed=\"true\"] { background: var(--acid); color: var(--black); box-shadow: 0 1px 0 #000, 0 0 0 3px var(--pink); }\n.deck .halt { background: var(--hazard); }\n.deck .rew { background: var(--blush); }\n.deck label { display: flex; align-items: center; gap: .5em; font: 700 11px/1 Arial, Helvetica, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #3d3640; }\n.deck input[type=\"range\"] { width: 8.5em; accent-color: var(--pink); }\n.fine { margin: 1em 0 0; font-size: 15px; line-height: 1.35; color: #2d2730; }\n\n/* the flyer: for this website, not a real night */\n.flyer {\n  position: relative; container-type: inline-size; color: var(--black); background: var(--hazard);\n  border: 3px solid #000; padding: 1.1em 1.2em 1.2em; box-shadow: 7px 7px 0 var(--acid);\n  font: 15px/1.35 Arial, Helvetica, sans-serif;\n}\n.flyer p { margin: 0; }\n.flyer .pres { font: italic 19px/1.2 \"Times New Roman\", Times, serif; }\n.flyer .head { margin: .1em 0 .15em; font: 900 min(84px, 17cqi)/.86 Impact, Haettenschweiler, \"Arial Black\", sans-serif; font-synthesis: none; text-transform: uppercase; letter-spacing: .01em; text-shadow: .045em .045em 0 var(--pink); }\n.flyer .sub { font-weight: 700; margin-bottom: .8em; }\n.flyer dl { display: grid; grid-template-columns: auto 1fr; gap: .25em .8em; margin: 0 0 .9em; border-top: 2px solid #000; border-bottom: 2px solid #000; padding: .6em 0; }\n.flyer dt { font: 900 11px/1.6 Arial, Helvetica, sans-serif; letter-spacing: .12em; text-transform: uppercase; }\n.flyer dd { margin: 0; font-family: \"Times New Roman\", Times, serif; font-size: 17px; line-height: 1.25; }\n.flyer .terms { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; line-height: 1.6; }\n.flyer .info { margin-top: .7em; font-size: 14px; }\n.flyer a { color: var(--black); font-weight: 700; }\n.free { position: absolute; top: -.9em; right: -.4em; padding: .55em .7em; background: var(--pink); color: #fff; border: 2px solid #000; border-radius: 50%; transform: rotate(12deg); font: 900 13px/1 \"Arial Black\", Arial, sans-serif; text-transform: uppercase; }\n\n/* liner notes */\n.notes { font-size: 17px; }\n.notes h2 { margin-top: 0; color: var(--acid); }\n.notes p { margin: 0 0 .9em; }\n.notes b { font-weight: normal; background: var(--pink); color: #fff; padding: 0 .2em; }\n\n/* ---------- photos, fly-posted ---------- */\n.photos { display: flex; flex-wrap: wrap; gap: 2em 2em; align-items: flex-start; padding: 2.6em .4em 0; }\n.photos figure { position: relative; margin: 0; flex: 1 1 40%; background: #fff; padding: 8px 8px 10px; border: 2px solid var(--black); box-shadow: 4px 4px 0 var(--black); transform: rotate(var(--t, 0deg)); }\n.photos figure::before { content: \"\"; position: absolute; top: -12px; left: 50%; width: 84px; height: 22px; margin-left: -42px; transform: rotate(-3deg); background: rgba(255, 229, 138, .85); }\n.photos figure:nth-child(even)::before { background: repeating-linear-gradient(-45deg, var(--black) 0 7px, var(--hazard) 7px 14px); opacity: .9; }\n.photos img { display: block; width: 100%; height: auto; background: var(--blush); }\n.photos figcaption { font: 14px/1.35 \"Courier New\", Courier, monospace; margin-top: .5em; }\n\n/* ---------- the tape pack ---------- */\n.pack { margin: 0 0 1.2em; }\n.pack .chrome { font-size: clamp(40px, 6vw, 76px); }\n.pack small { display: block; margin-top: .2em; font: italic 18px/1.3 \"Times New Roman\", Times, serif; color: var(--ink); }\n.lists { column-gap: 2.2em; }\n.lists section {\n  break-inside: avoid; container-type: inline-size;\n  margin: 0 0 2em; padding: 0 1em .9em;\n  background: var(--card, var(--blush)); border: 2px solid var(--black); border-radius: 4px; box-shadow: 5px 5px 0 var(--black);\n}\n.lists section:nth-child(7n+2) { --card: #fff4c7; }\n.lists section:nth-child(7n+3) { --card: #e9e3fb; }\n.lists section:nth-child(7n+5) { --card: #ddf6e4; }\n.lists section:nth-child(7n+6) { --card: #fff; }\n.lists section:nth-child(7n+7) { --card: #e2ecff; }\n.spine { display: flex; justify-content: space-between; gap: 1em; margin: 0 -1em; padding: .35em 1em; background: var(--black); color: var(--hazard); font: 700 12px/1.3 Arial, Helvetica, sans-serif; letter-spacing: .16em; text-transform: uppercase; }\n.spine span:last-child { color: var(--acid); }\n.lists h2 { margin-top: .7em; }\n/* the night bus: marker on the window */\n.lists .bus { --card: linear-gradient(165deg, #2a3557 0%, #161c33 55%, #0e1222 100%); color: #ebe9fb; border-radius: 16px; position: relative; overflow: hidden; }\n.bus .spine { background: #000; }\n.bus h2 span { color: #ff9cc5; }\n.bus a { color: #ffb4d3; }\n.bus a:visited { color: #d8bdff; }\n.bus a:hover { color: var(--acid); }\n.bus li::marker { color: var(--acid); }\n.tag { display: block; width: fit-content; margin: .4em .3em 0 auto; transform: rotate(-7deg) skewX(-14deg); font: italic 900 30px/1 \"Arial Black\", Arial, sans-serif; letter-spacing: -.05em; color: var(--pink); text-shadow: 0 0 1px var(--pink), 0 0 6px rgba(232, 80, 142, .45); }\n.tag::after { content: \"\"; display: inline-block; width: 3px; height: 18px; margin-left: -.9em; background: var(--pink); vertical-align: -18px; border-radius: 0 0 2px 2px; }\n/* cut along the dotted line */\n.cut { position: relative; border: 2px dashed var(--pink); padding: .6em 1em; margin: 1.2em 0 .2em; background: rgba(255, 255, 255, .6); }\n.cut::before { content: \"✂\\FE0E\"; position: absolute; top: -.8em; left: .8em; padding: 0 .25em; background: var(--card, var(--blush)); color: var(--pink); font-size: 1.1em; line-height: 1.4; }\n\nfooter { padding-top: .4em; }\n.signoff { font: 700 13px/1.6 Arial, Helvetica, sans-serif; letter-spacing: .14em; text-transform: uppercase; }\nfooter .band { margin-top: 1.6em; }\n\n@media (min-width: 641px) {\n  .wide { display: block; }\n  .narrow { display: none; }\n}\n@media (min-width: 720px) {\n  .top { grid-template-columns: 1fr 1fr; }\n  .patch { grid-column: 1 / -1; }\n  .lists { columns: 2; }\n  .rig { grid-template-columns: 1fr 1fr; }\n  .deck { grid-column: 1 / -1; }\n}\n@media (min-width: 960px) {\n  .photos { flex-wrap: nowrap; }\n  .photos figure { flex: var(--r); }  /* --r = width ÷ height, so every photo ends up the same height */\n}\n@media (min-width: 1040px) {\n  .top { grid-template-columns: 1fr 1fr 1fr; }\n  .patch { grid-column: auto; }\n  .lists { columns: 3; }\n  .rig { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr); }\n  .deck { grid-column: auto; }\n}\n@media (min-width: 1760px) { .lists { columns: 4; } }\n@media (max-width: 640px) {\n  body { font-size: 17px; }\n  .stickers { font-size: 12px; margin-left: 0; }\n  .deck .big { font-size: 15px; padding: .55em .85em; }\n  .lab { width: 100%; }\n  .label p { font-size: 10px; letter-spacing: .05em; }\n}\n@media (prefers-reduced-motion: reduce) {\n  .tape p, .drip, .on .reel, .rewind .reel { animation: none; }\n  .aida:hover .h, .onair .aida .h { animation: none; }\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv class=\"tape\" aria-hidden=\"true\">\u003cp>\u003cspan>◉ on air ✧ kes fm ✧ live from a browser tab near you ✧ big up all the junglists ✧ big up everyone on one bar of signal ✧ shout-outs + requests: inkersolekesia@gmail.com ✧ the rig's further down, press play ✧\u003c/span>\u003cspan>◉ on air ✧ kes fm ✧ live from a browser tab near you ✧ big up all the junglists ✧ big up everyone on one bar of signal ✧ shout-outs + requests: inkersolekesia@gmail.com ✧ the rig's further down, press play ✧\u003c/span>\u003c/p>\u003c/div>\n\n\u003cheader class=\"mast\">\n\u003ch1>\u003cspan class=\"throw\">kes\u003ci class=\"drip\" style=\"--x:.13em; --h:.42em\" aria-hidden=\"true\">\u003c/i>\u003ci class=\"drip\" style=\"--x:.93em; --h:.26em; animation-delay:.3s\" aria-hidden=\"true\">\u003c/i>\u003ci class=\"drip\" style=\"--x:1.5em; --h:.5em; animation-delay:.6s\" aria-hidden=\"true\">\u003c/i>\u003cspan class=\"shine\" style=\"left:.16em; top:.12em\" aria-hidden=\"true\">✦\u003c/span>\u003cspan class=\"shine\" style=\"left:1.38em; top:.3em\" aria-hidden=\ esc). the sub wants headphones.\u003c/p>\n\u003c/div>\n\n\u003cdiv class=\"flyer\">\n\u003cspan class=\"free\" aria-hidden=\"true\">free\u003c/span>\n\u003cp class=\"pres\">kes inkersole presents\u003c/p>\n\u003cp class=\"head\">this website\u003c/p>\n\u003cp class=\"sub\">an all-day, all-night session in a browser tab\u003c/p>\n\u003cdl>\n\u003cdt>on the decks\u003c/dt>\u003cdd>the amen break, rebuilt (credits →)\u003c/dd>\n\u003cdt>on the mic\u003c/dt>\u003cdd>the little green display\u003c/dd>\n\u003cdt>sound by\u003c/dt>\u003cdd>whatever speakers you've got\u003c/dd>\n\u003cdt>visuals\u003c/dt>\u003cdd>picsum placeholders\u003c/dd>\n\u003cdt>lasers\u003c/dt>\u003cdd>none, sorry\u003c/dd>\n\u003c/dl>\n\u003cp class=\"terms\">admission free ✧ no dress code ✧ all welcome\u003cbr>no cookies ✧ no trackers ✧ no analytics\u003cbr>loads on one bar of signal\u003c/p>\n\u003cp class=\"info\">info line: \u003ca href=\"mailto:inkersolekesia@gmail.com\">inkersolekesia@gmail.com\u003c/a>\u003c/p>\n\u003c/div>\n\n\u003cdiv class=\"notes\">\n\u003ch2>liner notes \u003cspan>☆\u003c/span>\u003c/h2>\n\u003cp>this page borrows from jungle (the breaks, the pirate radio idents, the flyers, the tape packs), so it should say where they come from.\u003c/p>\n\u003cp>jungle came out of london in the early 90s: Black British sound system culture (reggae, dub, dancehall, the soundclash) meeting rave and breakbeat hardcore, carried across the city by pirate radio.\u003c/p>\n\u003cp>the amen break is four bars of drumming by \u003cb>G.C. Coleman\u003c/b> of The Winstons, from their 1969 b-side \"Amen, Brother\". it's one of the most sampled recordings ever made, and the band never got royalties for it. the machine here doesn't use a sample, it rebuilds the pattern from synthesised hits, but the groove is still his. big up G.C. Coleman.\u003c/p>\n\u003cp>which is the internet equalities question too: who made the thing, who gets the credit, who gets paid.\u003c/p>\n\u003c/div>\n\u003c/section> " : \".\", s: i \u003c 2 ? \"g\" : i \u003c 5 ? \"x\" : \"X\", h: \".\" });\n      return ev.slice(0, 8).concat(roll);\n    }\n    if (r \u003c .8) return ev.slice(8, 12).concat(ev.slice(4, 8), ev.slice(0, 4), ev.slice(12));  // beats swapped round\n    return ev.slice(0, 12).concat([{ k: \".\", s: \"X\", h: \".\" }, { k: \".\", s: \"x\", h: \".\" }, { k: \".\", s: \"X\", h: \".\" }, { k: \".\", s: \"x\", h: \".\" }]);\n  }\n  function schedule(n, t) {\n    var i = n % 16;\n    if (i === 0 || !st.bar) st.bar = barEvents(Math.floor(n / 16));\n    var e = st.bar[i], tt = t + (i % 2 ? stepDur() * .06 : 0);  // a little swing on the off-sixteenths\n    if (e.k === \"x\") kick(tt, .95);\n    if (e.s === \"X\") snare(tt, .9, 1);\n    else if (e.s === \"x\") snare(tt, .5, .7);\n    else if (e.s === \"g\") snare(tt, .2, .45);\n    if (e.h === \"r\") ride(tt, i % 4 === 0 ? .24 : .18);\n    else if (e.h === \"h\") hat(tt, .2, .04);\n    else if (e.h === \"o\") hat(tt, .2, .22);\n    else if (e.h === \"c\") crash(tt, .35);\n    var bi = n % 64;\n    PLATES[st.plate].bass.forEach(function (nt) { if (nt[0] === bi) bassNote(t, nt[2], nt[1] * stepDur()); });\n    if (st.bells && BELLS[n % 32]) bell(t, BELLS[n % 32]);\n    if (n % 64 === 0 && n > 0) queue.push({ t: t, mc: true });\n    queue.push({ t: tt, i: i, k: e.k === \"x\", s: e.s !== \".\" });\n  }\n  function tick() {\n    var ahead = ctx.currentTime + (document.hidden ? 1.2 : .12);\n    while (st.next \u003c ahead) {\n      schedule(st.step, st.next);\n      st.next += stepDur();\n      st.step++;\n    }\n  }\n  function draw() {\n    if (!st.playing) return;\n    var now = ctx.currentTime;\n    while (queue.length && queue[0].t \u003c= now) {\n      var q = queue.shift();\n      if (q.mc) { var L = lines(); line = (line + 1) % L.length; say(L[line]); continue; }\n      for (var j = 0; j \u003c 16; j++) lights[j].className = j === q.i ? (q.s ? \"on s\" : q.k ? \"on k\" : \"on\") : \"\";\n    }\n    raf = requestAnimationFrame(draw);\n  }\n\n  // ---- buttons ----\n  function setVol() { if (out) out.gain.setTargetAtTime(.6 * st.vol * st.vol, ctx.currentTime, .02); }\n  function play() {\n    if (st.playing) return;\n    if (!ctx) setup();\n    if (ctx.state === \"suspended\") ctx.resume();\n    newSession();\n    st.playing = true; st.rewinding = false; st.step = 0; st.bar = null; st.next = ctx.currentTime + .08;\n    queue.length = 0; line = 0;\n    timer = setInterval(tick, 25); tick();\n    rig.classList.add(\"on\"); document.body.classList.add(\"onair\");\n    document.body.style.setProperty(\"--beat\", (60 / st.bpm).toFixed(3) + \"s\");\n    playBtn.setAttribute(\"aria-pressed\", \"true\"); playBtn.textContent = \"▶ on air\";\n    onairEl.textContent = \"on air\";\n    say(lines()[0]);\n    raf = requestAnimationFrame(draw);\n  }\n  function stop() {\n    if (!st.playing) return;\n    st.playing = false; clearInterval(timer); cancelAnimationFrame(raf);\n    var s = sess, t = ctx.currentTime; sess = null;\n    s.bus.gain.cancelScheduledValues(t); s.bus.gain.setTargetAtTime(0, t, .03);\n    setTimeout(function () { s.osc.forEach(function (o) { try { o.stop(); } catch (e) {} }); s.bus.disconnect(); }, 400);\n    queue.length = 0;\n    lights.forEach(function (l) { l.className = \"\"; });\n    rig.classList.remove(\"on\", \"rewind\"); document.body.classList.remove(\"onair\");\n    playBtn.setAttribute(\"aria-pressed\", \"false\"); playBtn.textContent = \"▶ play\";\n    onairEl.textContent = \"off air\";\n    say(\"off air. thanks for tuning in x\");\n  }\n  // the rewind: spin it back, then drop it again from the top\n  function pullUp() {\n    if (!st.playing) { say(\"press play first, then pull it up ⟲\"); return; }\n    if (st.rewinding) return;\n    st.rewinding = true;\n    var s = sess, t = ctx.currentTime + .03, len = 1.1, N = 96;\n    var fr = new Float32Array(N), fr2 = new Float32Array(N), cut = new Float32Array(N), gn = new Float32Array(N);\n    for (var i = 0; i \u003c N; i++) {\n      var x = i / (N - 1), sp = Math.abs(Math.sin(Math.PI * x * 4.5)) * (1 + 2 * x);\n      fr[i] = 70 + 520 * sp; fr2[i] = fr[i] * 1.5; cut[i] = 300 + 2600 * sp;\n      gn[i] = (.03 + .2 * Math.min(1, sp)) * (1 - x * x);\n    }\n    s.bus.gain.cancelScheduledValues(t); s.bus.gain.setTargetAtTime(0, t, .02);\n    var a = ctx.createOscillator(), b = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();\n    a.type = \"sawtooth\"; b.type = \"square\"; f.type = \"lowpass\";\n    a.frequency.setValueCurveAtTime(fr, t, len); b.frequency.setValueCurveAtTime(fr2, t, len);\n    f.frequency.setValueCurveAtTime(cut, t, len); g.gain.setValueCurveAtTime(gn, t, len);\n    a.connect(f); b.connect(f); f.connect(g); g.connect(limiter);\n    var n = ctx.createBufferSource(), nf = ctx.createBiquadFilter(), ng = ctx.createGain();\n    n.buffer = noise; nf.type = \"bandpass\"; nf.Q.value = 1.5; nf.frequency.setValueCurveAtTime(cut, t, len);\n    ng.gain.setValueCurveAtTime(gn, t, len);\n    n.connect(nf); nf.connect(ng); ng.connect(limiter);\n    a.start(t); b.start(t); n.start(t); a.stop(t + len + .05); b.stop(t + len + .05); n.stop(t + len + .05);\n    say(\"pull up! ⟲ come again\");\n    rig.classList.add(\"rewind\");\n    var drop = t + len + .3;\n    st.step = 0; st.bar = null; st.next = drop; queue.length = 0;\n    s.bus.gain.setTargetAtTime(1, drop - .015, .004);\n    setTimeout(function () {\n      rig.classList.remove(\"rewind\");\n      if (sess !== s) return;\n      st.rewinding = false;\n      crash(drop, .4);\n    }, (drop - ctx.currentTime - .15) * 1000);\n  }\n  function siren() {\n    if (!st.playing) { say(\"press play first, then sound the siren\"); return; }\n    var t = ctx.currentTime + .01, o = ctx.createOscillator(), lfo = ctx.createOscillator(), depth = ctx.createGain(), lp = ctx.createBiquadFilter(), g = ctx.createGain();\n    o.type = \"square\"; lfo.type = \"triangle\";\n    o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(880, t + 1.6);\n    lfo.frequency.setValueAtTime(5, t); lfo.frequency.linearRampToValueAtTime(9, t + 1.6);\n    depth.gain.value = 240; lfo.connect(depth); depth.connect(o.frequency);\n    lp.type = \"lowpass\"; lp.frequency.value = 2200;\n    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.07, t + .05);\n    g.gain.setValueAtTime(.07, t + 1.5); g.gain.exponentialRampToValueAtTime(.0001, t + 1.8);\n    o.connect(lp); lp.connect(g); g.connect(sess.bus); g.connect(sess.fx);\n    o.start(t); lfo.start(t); o.stop(t + 1.85); lfo.stop(t + 1.85);\n  }\n  function press(group, btn) {\n    document.querySelectorAll(group).forEach(function (b) { b.setAttribute(\"aria-pressed\", b === btn ? \"true\" : \"false\"); });\n  }\n\n  playBtn.addEventListener(\"click\", play);\n  $(\"stop\").addEventListener(\"click\", stop);\n  $(\"rew\").addEventListener(\"click\", pullUp);\n  $(\"siren\").addEventListener(\"click\", siren);\n  document.querySelectorAll(\"[data-plate]\").forEach(function (b) {\n    b.addEventListener(\"click\", function () {\n      st.plate = +b.dataset.plate; press(\"[data-plate]\", b);\n      say(\"plate \" + (st.plate + 1) + \": \" + PLATES[st.plate].name + (st.playing ? \" (drops in on the next bar)\" : \"\"));\n    });\n  });\n  document.querySelectorAll(\"[data-bass]\").forEach(function (b) {\n    b.addEventListener(\"click\", function () { st.bass = b.dataset.bass; press(\"[data-bass]\", b); setBass(); say(\"bass: \" + st.bass); });\n  });\n  $(\"chop\").addEventListener(\"click\", function () {\n    st.chop = !st.chop; this.setAttribute(\"aria-pressed\", st.chop);\n    say(st.chop ? \"chop it up ✂ every other bar gets re-edited\" : \"chops off, straight break\");\n  });\n  $(\"sparkle\").addEventListener(\"click\", function () {\n    st.bells = !st.bells; this.setAttribute(\"aria-pressed\", st.bells);\n    say(st.bells ? \"sparkles on ✧ a music box over the amen\" : \"sparkles off\");\n  });\n  $(\"vol\").addEventListener(\"input\", function () { st.vol = +this.value; setVol(); });\n  $(\"bpm\").addEventListener(\"input\", function () {\n    st.bpm = +this.value; bpmOut.textContent = st.bpm.toFixed(1);\n    document.body.style.setProperty(\"--beat\", (60 / st.bpm).toFixed(3) + \"s\");\n    if (sess) sess.delay.delayTime.setTargetAtTime(stepDur() * 3, ctx.currentTime, .05);\n  });\n  document.addEventListener(\"keydown\", function (e) { if (e.key === \"Escape\") stop(); });\n})();\n\u003c/script>\n\u003cscript>(function(){\ndocument.addEventListener('click',function(e){\n  var a=e.target.closest&&e.target.closest('a[href^=\"#\"]');\n  if(!a||e.defaultPrevented)return;\n  var id=decodeURIComponent(a.getAttribute('href').slice(1)),t=id&&document.getElementById(id);\n  if(id&&!t)return;\n  e.preventDefault();\n  t?t.scrollIntoView({block:'start'}):scrollTo(0,0);\n});\naddEventListener('keydown',function(e){\n  if(e.metaKey||e.ctrlKey||e.altKey)return;\n  if(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]'))return;\n  if(['ArrowLeft','ArrowRight','m'].indexOf(e.key)>-1)parent.postMessage({variantKey:e.key},'*');\n});\n})();\u003c/script>\u003c/body>\n\u003c/html>\n"}, {"label": "08", "note": "Cute pink homepage meets warning tape, a CSS graf throw-up, an acid rave flyer and a playable KES FM 170.0 jungle boombox, plus amen-break credits.", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en-GB\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>kes inkersole ♡\u003c/title>\n\u003cmeta name=\"description\" content=\"Kesia Inkersole — freelance creative strategist &amp; internet equalities researcher, based in london.\">\n\u003cmeta name=\"author\" content=\"Kes Inkersole\">\n\u003cmeta name=\"keywords\" content=\"Kesia Inkersole, Kes Inkersole, creative strategist, internet equalities, researcher, London, UAL\">\n\u003cmeta name=\"color-scheme\" content=\"light\">\n\u003clink rel=\"icon\" href=\"/favicon.ico\" sizes=\"any\">\n\u003cmeta property=\"og:type\" content=\"website\">\n\u003cmeta property=\"og:title\" content=\"kes inkersole\">\n\u003cmeta property=\"og:description\" content=\"kes inkersole — freelance creative strategist &amp; internet equalities researcher, based in london.\">\n\u003cmeta property=\"og:image\" content=\"https://kesia-coral.vercel.app/square.png\">\n\u003cmeta property=\"og:url\" content=\"https://kesia-coral.vercel.app\">\n\u003cmeta name=\"twitter:card\" content=\"summary_large_image\">\n\u003cmeta name=\"twitter:title\" content=\"kes inkersole\">\n\u003cmeta name=\"twitter:description\" content=\"kes inkersole — freelance creative strategist &amp; internet equalities researcher, based in london.\">\n\u003cmeta name=\"twitter:image\" content=\"https://kesia-coral.vercel.app/square.png\">\n\u003cstyle>\n/* kes: the whole palette lives here.\n   soft side: strawberry, periwinkle, butter, a bit of leaf.\n   'ard side: warning tape, acid, chrome, 3am black. neither side wins. */\n:root {\n  --paper: #fff8f3;\n  --ink: #2e1f33;\n  --pink: #e4427f;\n  --pink-ink: #b8235a;\n  --blue: #3a4bd1;\n  --plum: #8a3fa8;\n  --leaf: #3d9a5c;\n  --butter: #fff3b8;\n  --blush: #ffe3ec;\n  --sky: #e6eaff;\n  --tape: #ffd60a;\n  --night: #141116;\n  --acid: #b5f23d;\n  --chrome: linear-gradient(180deg, #ffffff 0%, #c3c8d0 24%, #f6f7f9 42%, #7c8490 60%, #dfe2e7 80%, #9ea5af 100%);\n  --mono: ui-monospace, Menlo, Consolas, \"DejaVu Sans Mono\", \"Courier New\", monospace;\n  --loud: Impact, \"Haettenschweiler\", \"Arial Narrow Bold\", \"Arial Black\", sans-serif;\n  --fat: \"Arial Black\", \"Arial Bold\", Gadget, Arial, sans-serif;\n  --gut: clamp(1rem, 4vw, 4rem);\n}\n* { box-sizing: border-box; }\nbody {\n  margin: 0;\n  padding: 0 var(--gut);\n  background: var(--paper);\n  color: var(--ink);\n  font: 1.125rem/1.45 \"Times New Roman\", Times, serif;\n}\n::selection { background: var(--acid); color: var(--night); }\na { color: var(--blue); text-decoration-thickness: 1px; text-underline-offset: .15em; }\na:visited { color: var(--plum); }\na:hover { background: var(--blush); color: var(--pink-ink); }\nmark { background: var(--butter); color: inherit; padding: 0 .15em; }\nh1 { font-size: 3rem; font-weight: normal; margin: 0 0 1rem; line-height: 1.1; }\nh1 span { color: var(--pink); display: inline-block; transition: transform .3s; }\nh1:hover span { transform: scale(1.25) rotate(-12deg); }\nh2 { font: 1rem/1.3 var(--mono); color: var(--pink-ink); margin: 0 0 .7rem; }\nul { margin: 0; padding-left: 1.4em; list-style: \"☆ \"; }\nli::marker { color: var(--pink); }\nli:hover { list-style-type: \"★ \"; }\nli + li { margin-top: .3em; }\n\n/* tracklist numbers: the page is a tape, side A then side B */\n.trk { display: inline-block; font: 1rem/1 var(--loud); letter-spacing: .04em; background: var(--night); color: var(--tape); padding: .2em .35em .15em; margin-right: .45em; transform: rotate(-4deg); }\n\n/* ascii: b = pink, i = leaf, em = periwinkle */\npre { font: 15px/1.1 var(--mono); margin: 0; color: var(--blue); }\npre b, pre i, pre em { font: inherit; }\npre b { color: var(--pink); }\npre i { color: var(--leaf); }\npre em { color: var(--blue); }\n\n/* WARNING TAPE ---------------------------------------------------------- */\n.tape {\n  margin: 0 calc(-1 * var(--gut));\n  overflow: hidden;\n  background: var(--tape);\n  color: var(--night);\n  font: 1.05rem/1 var(--loud);\n  letter-spacing: .07em;\n  text-transform: uppercase;\n  white-space: nowrap;\n  border-block: 3px solid var(--night);\n}\n.tape::before, .tape::after {\n  content: \"\"; display: block; height: 7px;\n  background: repeating-linear-gradient(-45deg, var(--night) 0 7px, var(--tape) 7px 14px);\n}\n.tape div { display: flex; width: max-content; animation: tape 60s linear infinite; }\n.tape span { padding: .45rem 0 .4rem; }\n.tape:hover div { animation-play-state: paused; }\n@keyframes tape { to { transform: translateX(-50%); } }\n\n/* two strips crossing over the top of the station */\n.cross { position: relative; height: 7rem; margin: 0 calc(-1 * var(--gut)) -3.4rem; overflow: hidden; z-index: 2; pointer-events: none; }\n.cross .tape { position: absolute; left: -10%; width: 120%; margin: 0; top: 2rem; transform: rotate(-2.2deg); }\n.cross .tape + .tape { transform: rotate(1.8deg); background: var(--acid); }\n.cross .tape + .tape::before, .cross .tape + .tape::after { background: repeating-linear-gradient(45deg, var(--night) 0 7px, var(--acid) 7px 14px); }\n.cross .tape div { animation-duration: 90s; }\n.cross .tape + .tape div { animation-direction: reverse; }\n\n/* TOP: hello, the wall, the flyer --------------------------------------- */\nheader {\n  display: grid;\n  grid-template-columns: minmax(0, 29rem) minmax(0, 1fr) minmax(15rem, 22rem);\n  grid-template-areas: \"hello wall flyer\";\n  column-gap: clamp(2rem, 4vw, 4rem);\n  row-gap: 2.5rem;\n  align-items: center;\n  padding: 3rem 0 1rem;\n}\n.hello { grid-area: hello; }\n.hello p { margin: 0 0 .6em; }\n.hello .ident { font: .95rem/1.3 var(--mono); color: var(--pink-ink); margin-bottom: 1.2rem; }\n.hello .ident b { background: var(--night); color: var(--acid); font-weight: normal; padding: .1em .4em; }\n\n/* graf. a throw-up, done in css, on my own wall */\n.wall { grid-area: wall; container-type: inline-size; text-align: center; padding: 1rem 0; }\n.throwup {\n  position: relative;\n  display: inline-block;\n  isolation: isolate;\n  margin: 0;\n  padding: .12em .3em .38em .18em;\n  font-family: var(--fat);\n  font-weight: 900;\n  font-size: 7rem;\n  font-size: clamp(4rem, 30cqi, 10rem);\n  line-height: .9;\n  letter-spacing: -.05em;\n  color: var(--pink);\n  white-space: nowrap;\n  user-select: none;\n}\n.throwup > span {\n  position: relative; z-index: 1; display: inline-block;\n  text-shadow:\n    .03em 0 var(--ink), -.03em 0 var(--ink), 0 .03em var(--ink), 0 -.03em var(--ink),\n    .022em .022em var(--ink), -.022em .022em var(--ink), .022em -.022em var(--ink), -.022em -.022em var(--ink),\n    .065em 0 var(--acid), -.065em 0 var(--acid), 0 .065em var(--acid), 0 -.065em var(--acid),\n    .046em .046em var(--acid), -.046em .046em var(--acid), .046em -.046em var(--acid), -.046em -.046em var(--acid),\n    .085em .02em var(--ink), .02em .085em var(--ink), .1em .1em 0 var(--ink), .12em .12em 0 var(--ink);\n}\n.throwup > span:nth-child(1) { transform: rotate(-9deg) translateY(.03em); }\n.throwup > span:nth-child(2) { transform: rotate(6deg) translateY(-.07em); margin-left: -.02em; }\n.throwup > span:nth-child(3) { transform: rotate(-3deg) translateY(.02em); margin-left: -.03em; }\n.drip {\n  position: absolute; z-index: -1; top: .6em; left: 20%;\n  width: .085em; height: .62em;\n  background: var(--pink);\n  border-radius: 0 0 .06em .06em;\n  box-shadow: 0 0 0 .022em var(--ink);\n  transform-origin: top;\n  animation: drip 5s ease-in-out infinite alternate;\n}\n.drip::after { content: \"\"; position: absolute; left: -.015em; bottom: -.04em; width: .115em; height: .115em; border-radius: 50%; background: var(--pink); }\nspan:nth-child(2) > .drip { left: 44%; height: .82em; animation-delay: -2s; }\nspan:nth-child(3) > .drip { left: 52%; height: .5em; animation-delay: -3.5s; }\n@keyframes drip { from { transform: scaleY(.8); } to { transform: scaleY(1.06); } }\n.arrow {\n  position: absolute; z-index: -1; right: -.62em; top: -.08em;\n  font-size: .5em; font-style: normal; color: var(--acid);\n  transform: rotate(-38deg);\n  text-shadow: .05em 0 var(--ink), -.05em 0 var(--ink), 0 .05em var(--ink), 0 -.05em var(--ink), .1em .1em 0 var(--ink);\n}\n.spark { position: absolute; z-index: 2; font-style: normal; font-size: .3em; color: #fff; text-shadow: .06em 0 var(--ink), -.06em 0 var(--ink), 0 .06em var(--ink), 0 -.06em var(--ink); }\n.spark:nth-of-type(1) { left: .2em; top: .5em; }\n.spark:nth-of-type(2) { right: .9em; bottom: .25em; font-size: .22em; color: var(--tape); }\n\n/* a sticker slap */\n.nametag {\n  display: block; width: 12.5rem; margin: .4rem auto 0;\n  background: #fff; color: #fff;\n  border-radius: .7rem; overflow: hidden;\n  box-shadow: 0 0 0 2px rgba(46, 31, 51, .15), 4px 5px 0 rgba(46, 31, 51, .2);\n  transform: rotate(-5deg);\n  text-align: center;\n}\n.nametag b { display: block; background: var(--blue); font: 1.9rem/1 var(--fat); letter-spacing: .06em; padding: .45rem 0 .05rem; }\n.nametag small { display: block; background: var(--blue); font: bold .8rem/1 Arial, sans-serif; padding: .2rem 0 .5rem; }\n.nametag span { display: block; color: var(--pink); font: italic bold 2.6rem/1.15 \"Times New Roman\", Times, serif; padding: .15rem 0 .1rem; transform: rotate(-5deg) skewX(-14deg); text-shadow: 1px 1px 0 var(--pink-ink), 0 0 3px rgba(228, 66, 127, .45); }\n.nametag::after { content: \"\"; display: block; height: .7rem; background: var(--blue); }\n\n/* the flyer */\n.flyer {\n  grid-area: flyer;\n  position: relative;\n  background: var(--acid);\n  color: var(--night);\n  padding: 1.9rem 1.5rem 1.3rem;\n  transform: rotate(1.3deg);\n  box-shadow: 7px 7px 0 var(--night);\n}\n.flyer::before, .flyer::after {\n  content: \"\"; position: absolute; top: -.7rem; width: 5rem; height: 1.4rem;\n  background: repeating-linear-gradient(-45deg, var(--night) 0 7px, var(--tape) 7px 14px);\n  opacity: .92;\n}\n.flyer::before { left: -.4rem; transform: rotate(-24deg); }\n.flyer::after { right: -.4rem; transform: rotate(21deg); }\n.flyer .presents { font: 1rem/1 var(--loud); letter-spacing: .14em; text-transform: uppercase; margin: 0 0 .35rem; }\n.flyer h2 {\n  font: 2.7rem/1 var(--fat); letter-spacing: -.03em; color: var(--pink); margin: 0 0 1rem;\n  text-shadow: .035em 0 var(--night), -.035em 0 var(--night), 0 .035em var(--night), 0 -.035em var(--night), .025em .025em var(--night), -.025em -.025em var(--night), .025em -.025em var(--night), -.025em .025em var(--night), .09em .09em 0 #fff;\n}\n.flyer h2 span { font: 1.1rem var(--mono); color: var(--night
