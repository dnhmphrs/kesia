e class=\"piece\" id=\"piece-008\">\n  \u003cp class=\"meta\">\u003cspan class=\"no\">008\u003c/span> \u003ctime datetime=\"2026-09-14\">14 september 2026\u003c/time>\u003c/p>\n  \u003ch2>ut enim ad minima\u003c/h2>\n  \u003cdiv class=\"text\">\n    \u003cp>Ut enim ad minima veniam, quis nostrum exercitationem ullam corporis suscipit laboriosam. Nisi ut aliquid ex ea commodi consequatur?\u003c/p>\n  \u003c/div>\n\u003c/article>\n\n\u003carticle class=\"piece\" id=\"piece-007\">\n  \u003cp class=\"meta\">\u003cspan class=\"no\">007\u003c/span> \u003ctime datetime=\"2026-09-02\">2 september 2026\u003c/time>\u003c/p>\n  \u003ch2>quis autem vel eum\u003c/h2>\n  \u003cdiv class=\"text\">\n    \u003cp>Quis autem vel eum iure reprehenderit qui in ea voluptate velit esse quam nihil molestiae consequatur, vel illum qui dolorem eum fugiat quo voluptas nulla pariatur. At vero eos et accusamus et iusto odio dignissimos ducimus qui blanditiis praesentium voluptatum deleniti atque corrupti quos dolores et quas molestias excepturi sint.\u003c/p>\n  \u003c/div>\n\u003c/article>\n\n\u003carticle class=\"piece\" id=\"piece-006\">\n  \u003cp class=\"meta\">\u003cspan class=\"no\">006\u003c/span> \u003ctime datetime=\"2026-08-26\">26 august 2026\u003c/time>\u003c/p>\n  \u003ch2>at vero eos\u003c/h2>\n  \u003cdiv class=\"text\">\n    \u003cp>at vero eos\u003cbr>et accusamus\u003cbr>et iusto odio\u003cbr>dignissimos ducimus\u003c/p>\n  \u003c/div>\n\u003c/article>\n\n\u003carticle class=\"piece\" id=\"piece-005\">\n  \u003cp class=\"meta\">\u003cspan class=\"no\">005\u003c/span> \u003ctime datetime=\"2026-08-11\">11 august 2026\u003c/time>\u003c/p>\n  \u003ch2>nam libero\u003c/h2>\n  \u003cdiv class=\"text\">\n    \u003cp>Nam libero tempore, cum soluta nobis est eligendi optio cumque nihil impedit.\u003c/p>\n  \u003c/div>\n\u003c/article>\n\n\u003carticle class=\"piece\" id=\"piece-004\">\n  \u003cp class=\"meta\">\u003cspan class=\"no\">004\u003c/span> \u003ctime datetime=\"2026-07-30\">30 july 2026\u003c/time>\u003c/p>\n  \u003ch2>temporibus autem\u003c/h2>\n  \u003cdiv class=\"text\">\n    \u003cp>Temporibus autem quibusdam et aut officiis debitis aut rerum necessitatibus saepe eveniet ut et voluptates repudiandae sint et molestiae non recusandae.\u003c/p>\n    \u003cp>Itaque earum rerum hic tenetur a sapiente delectus, ut aut reiciendis voluptatibus maiores alias consequatur aut perferendis doloribus asperiores repellat.\u003c/p>\n  \u003c/div>\n\u003c/article>\n\n\u003carticle class=\"piece\" id=\"piece-003\">\n  \u003cp class=\"meta\">\u003cspan class=\"no\">003\u003c/span> \u003ctime datetime=\"2026-07-12\">12 july 2026\u003c/time>\u003c/p>\n  \u003ch2>itaque earum rerum\u003c/h2>\n  \u003cdiv class=\"text\">\n    \u003cp>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.\u003c/p>\n    \u003cp>Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.\u003c/p>\n    \u003cp>Sed ut perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium. Nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit aut fugit.\u003c/p>\n    \u003cp>Neque porro quisquam est.\u003c/p>\n  \u003c/div>\n\u003c/article>\n\n\u003carticle class=\"piece\" id=\"piece-002\">\n  \u003cp class=\"meta\">\u003cspan class=\"no\">002\u003c/span> \u003ctime datetime=\"2026-06-24\">24 june 2026\u003c/time>\u003c/p>\n  \u003ch2>duis aute irure\u003c/h2>\n  \u003cdiv class=\"text\">\n    \u003cp>Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident.\u003c/p>\n  \u003c/div>\n\u003c/article>\n\n\u003carticle class=\"piece\" "rose\">(_)   \u003c/b>\u003cb class=\"stem\">|     \\|       |/     |/  \u003c/b>\u003cb class=\"lilac\">(_)   \u003c/b>\u003cb class=\"stem\">|       |/    \\|    |   \u003c/b>\u003cb class=\"rose\">(_)   \u003c/b>\u003cb class=\"stem\">|/     |/     |   \\|   \u003c/b>\u003cb class=\"peri\">(_)      \u003c/b>\u003cb class=\"stem\">|/     |/   |   \\|    \u003c/b>\u003cb class=\"rose\">(_)     \u003c/b>\u003cb class=\"stem\">|/     |   \\|   \u003c/b>\u003cb class=\"rose\">(_)\u003c/b>\n   \u003cb class=\"stem\">\\|      |    |    |    \\|     \\|      |    |      |      \\|     \\|    |    |      \\|      |    |    |   \\|     \\|      |    |    |      \\|     \\|    |    |     |     \\|      |    |    |\u003c/b>\u003c/pre>\n  \u003c/div>\n\u003c/footer>\n\n\u003cscript>(function(){\nvar PAGES=[\"index.html\", \"writing.html\"];\ndocument.addEventListener('click',function(e){\n  var a=e.target.closest&&e.target.closest('a[href]');\n  if(!a||e.defaultPrevented)return;\n  var h=a.getAttribute('href'),m=h.replace(/^\\.\\//,'').split('#'),p=m[0],id=m[1]||'';\n  if(p===''&&h.charAt(0)==='#'){\n    var t=id&&document.getElementById(decodeURIComponent(id));\n    if(id&&!t)return;\n    e.preventDefault();t?t.scrollIntoView({block:'start'}):scrollTo(0,0);return;\n  }\n  if(PAGES.indexOf(p)>-1||p==='/'||p==='.'){\n    e.preventDefault();parent.postMessage({variantPage:PAGES.indexOf(p)>-1?p:'index.html',hash:id},'*');\n  }\n});\naddEventListener('keydown',function(e){\n  if(e.metaKey||e.ctrlKey||e.altKey)return;\n  if(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]'))return;\n  if(['ArrowLeft','ArrowRight','m'].indexOf(e.key)>-1)parent.postMessage({variantKey:e.key},'*');\n});\nif(location.hash.length>1){var t=document.getElementById(decodeURIComponent(location.hash.slice(1)));t&&t.scrollIntoView();}\n})();\u003c/script>\u003c/body>\n\u003c/html>\n"}}, {"label": "02", "note": "White lo-fi four-column grid: pink heart-sign masthead, KES FM in hairlines with a speaker face, three framed project slices, starred link columns; writing is “chainmail”, an email-fed log.", "pages": {"index.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en-GB\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cmeta name=\"color-scheme\" content=\"light\">\n\u003ctitle>kes inkersole\u003c/title>\n\u003cmeta name=\"description\" content=\"kes inkersole, freelance creative strategist &amp; internet equalities researcher, based in london.\">\n\u003cstyle>\n/* kes inkersole. white paper, black ink, electric-blue links, a hot-pink highlight, and the pink of the heart name.\n   one unit (24px, the body line height) sets every gap. one grid: four columns on a wide screen, two on a tablet, one on a phone.\n   three type sizes: 13px mono for labels, 16px sans for reading, 32px for the name and the greeting. */\n:root {\n  --u: 24px;\n  --edge: 16px;\n  --gap: 48px;\n  --ink: #000;\n  --paper: #fff;\n  --blue: #0033ff;   /* links */\n  --pink: #ff3399;   /* the highlight, and the hearts */\n  --blush: #ffe3f0;  /* the heart sign's ground */\n  --dot: #fbc3dd;    /* the heart sign's unlit dots */\n  --sans: \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n  --mono: ui-monospace, Menlo, Consolas, \"DejaVu Sans Mono\", \"Liberation Mono\", \"Courier New\", monospace;\n  --serif: \"Times New Roman\", Times, serif;\n}\n@media (min-width: 700px)  { :root { --edge: var(--u); } }\n@media (min-width: 1200px) { :root { --edge: calc(var(--u) * 2); --gap: var(--u); } }\n@media (min-width: 1400px) { :root { --gap: calc(var(--u) * 2); } }\n\n*, *::before, *::after { box-sizing: border-box; }\nhtml { background: var(--paper); color: var(--ink); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\nbody { margin: 0; padding: var(--u) var(--edge) 0; background: var(--paper); font: 16px/24px var(--sans); overflow-wrap: break-word; }\nh1, h2, h3, p, ul, dl, dd, figure { margin: 0; }\nh2, h3 { font-size: inherit; }\n\na { color: var(--blue); text-decoration-thickness: 1px; text-underline-offset: 3px; }\na:visited { color: var(--blue); text-decoration-style: dotted; }\na:hover { background: var(--pink); color: var(--ink); text-decoration: none; }\na:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }\n::selection { background: var(--pink); color: var(--ink); }\n\n.mono, .label { font: 13px/24px var(--mono); }\n.label { font-weight: 400; }\n.sym, .heart { color: var(--pink); font-style: normal; }\n\n/* the grid */\n.grid { display: grid; grid-template-columns: minmax(0, 1fr); column-gap: var(--gap); }\n@media (min-width: 700px)  { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }\n@media (min-width: 1200px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }\n\n/* ascii drawings: pure ascii in a monospace font, recoloured to the page */\n.art { margin: 0; font: 13px/1.15 var(--mono); white-space: pre; color: var(--ink); }\n.art b { font-weight: inherit; }\n\n/* ---------- running head ---------- */\n.head { font: 13px/24px var(--mono); grid-template-columns: minmax(0, 1fr) auto; }\n@media (min-width: 700px)  { .head { grid-template-columns: repeat(2, minmax(0, 1fr)); } }\n@media (min-width: 1200px) { .head .nav { grid-column: 4; } }\n\n/* ---------- the heart sign (i5-03), sized from the width so it always fits ---------- */\n.sign { container-type: inline-size; margin: calc(var(--u) * 2) 0; }\n.sign pre { margin: 0; font: bold min(19px, calc(100cqw / 101.9))/1.22 var(--mono); color: var(--dot); width: fit-content;\n  background: linear-gradient(var(--blush), var(--blush)) 1.5ch .5lh / calc(100% - 3ch) calc(100% - 1lh) no-repeat; }\n.sign s { text-decoration: none; color: var(--ink); font-weight: normal; }\n.sign b { color: var(--pink); }\n.sign b.h { color: var(--blue); animation: blink 1.6s steps(1) infinite; }\n.sign .small { display: none; }\n@container (max-width: 999px) {\n  .sign .big { display: none; }\n  .sign .small { display: block; font-size: min(19px, calc(100cqw / 25.9)); }\n}\n@keyframes blink { 50% { color: var(--pink); } }\n\n/* ---------- top: hello, about, the card, KES FM ---------- */\n.top { row-gap: calc(var(--u) * 2); align-items: start; }\n.hello h1 { font: italic 400 32px/48px var(--serif); margin-bottom: var(--u); }\n.about p + p { margin-top: var(--u); }\n.card { border: 1px solid var(--ink); padding: calc(var(--u) - 1px); }\n.card .name { font: 700 32px/48px var(--sans); letter-spacing: -.04em; }\n.card .role { margin-bottom: var(--u); }\n.card dl { display: grid; grid-template-columns: calc(var(--u) * 3) minmax(0, 1fr); margin: var(--u) 0; }\n.card dt { font: 13px/24px var(--mono); }\n.card dd + dt { margin-top: calc(var(--u) / 2); }\n.card dd + dt + dd { margin-top: calc(var(--u) / 2); }\n@media (min-width: 700px) {\n  .top { grid-template-rows: auto auto 1fr; }\n  .hello { grid-column: 1; grid-row: 1; }\n  .about { grid-column: 1; grid-row: 2; }\n  .card { grid-column: 2; grid-row: 1 / span 2; }\n  .fm { grid-column: 1 / -1; grid-row: 3; }\n}\n@media (min-width: 1200px) {\n  .top { grid-template-rows: auto 1fr; }\n  .about { grid-column: 2 / span 2; grid-row: 1; columns: 2; column-gap: var(--gap); }\n  .card { grid-column: 4; grid-row: 1 / span 2; }\n  .fm { grid-column: 1 / span 3; grid-row: 2; }\n}\n\n/* ---------- KES FM: the speaker stack (i7-05) is its face, the deck is drawn in hairlines ---------- */\n.fm { display: grid; grid-template-columns: minmax(0, 1fr); align-items: start; }\n.fm .face { container-type: inline-size; margin-bottom: var(--u); }\n.speaker { font-size: min(13px, calc(100cqw / 22.4)); width: fit-content; }\n.speaker .c, .speaker .b, .speaker .y, .speaker .i { color: var(--ink); }\n.speaker .p { color: var(--pink); }\n.speaker .g { color: var(--blue); }\n.speaker.thump { animation: thump .18s ease-out; }\n@keyframes thump { 35% { transform: translateY(2px); } }\n@media (min-width: 700px) {\n  .fm { column-gap: var(--gap); grid-template-columns: calc((100% - var(--gap)) / 2) minmax(0, 1fr); grid-template-rows: auto auto 1fr; }\n  .fm .face { grid-column: 1; grid-row: 1 / span 3; margin: 0; }\n  .fm > :not(.face) { grid-column: 2; }\n}\n@media (min-width: 1200px) {\n  .fm { grid-template-columns: calc((100% - 2 * var(--gap)) / 3) minmax(0, 1fr); }\n}\n#fm-h { font: 700 13px/24px var(--mono); }\n.deck { margin-top: var(--u); }\n.lcd { container-type: inline-size; border: 1px solid var(--ink); padding: calc(var(--u) / 2); font: 13px/24px var(--mono); }\n.lcd-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 var(--u); }\nbody.on-air .status { background: var(--pink); }\n.ticker { overflow: hidden; white-space: nowrap; }\n.ticker > div { display: inline-block; animation: run 70s linear infinite paused; }\n.ticker span { padding-right: .5em; }\nbody.on-air .ticker > div { animation-play-state: running; }\n@keyframes run { to { translate: -50% 0; } }\n.tracker { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); text-align: center; }\n@container (min-width: 520px) { .tracker { grid-template-columns: repeat(32, minmax(0, 1fr)); } }\n.tracker .rest { opacity: .35; }\n.tracker .rev { color: var(--pink); }\n.tracker .up { color: var(--blue); }\n.tracker .roll { text-decoration: underline; text-underline-offset: 3px; }\n.tracker .on { background: var(--pink); color: var(--ink); }\n.lcd-info { display: flex; flex-wrap: wrap; gap: 0 var(--u); }\n.lcd-info .rev { color: var(--pink); }\n.lcd-info .up { color: var(--blue); }\n.keys { display: flex; flex-wrap: wrap; align-items: center; gap: calc(var(--u) / 2) var(--u); margin-top: calc(var(--u) / 2); }\n.keys > div { display: flex; flex-wrap: wrap; align-items: center; row-gap: 4px; }\n.keys .lbl { font: 13px/24px var(--mono); margin-right: calc(var(--u) / 2); }\n.keys button { font: 13px/1 var(--mono); color: var(--ink); background: var(--paper); border: 1px solid var(--ink); border-radius: 0; margin: 0; padding: 9px 10px; cursor: pointer; }\n.keys > div > button + button { margin-left: -1px; }\n.keys button:hover { background: var(--pink); }\n.keys button:active { translate: 0 1px; }\n.keys button[aria-pressed=\"true\"] { background: var(--ink); color: var(--paper); }\n.keys .go, .keys .stop { font-weight: 700; }\n.keys .go[aria-pressed=\"true\"] { background: var(--pink); color: var(--ink); }\n.vol { font: 13px/24px var(--mono); display: flex; align-items: center; gap: calc(var(--u) / 2); }\n.vol input { width: calc(var(--u) * 4); margin: 0; accent-color: var(--ink); }\n.textin { margin-top: calc(var(--u) / 2); font: 13px/24px var(--mono); }\n.floatstop { position: fixed; right: var(--edge); bottom: var(--edge); z-index: 5; font: 700 13px/1 var(--mono); color: var(--ink); background: var(--pink);\n  border: 1px solid var(--ink); border-radius: 0; padding: 12px 14px; cursor: pointer; }\n.floatstop[hidden] { display: none; }\n\n/* ---------- three projects, as slices (i10-08), each one framed on the grid ---------- */\n.projects { margin-top: calc(var(--u) * 4); }\n.projects > .label { margin-bottom: var(--u); }\n.slice { border-top: 1px solid var(--ink); padding: var(--u) 0 calc(var(--u) * 2); row-gap: var(--u); align-items: start; }\n.slice:last-child { border-bottom: 1px solid var(--ink); }\n.what { display: grid; grid-template-columns: calc(var(--u) * 2) minmax(0, 1fr); }\n.what .n { font: 13px/24px var(--mono); grid-row: 1 / span 2; }\n.what h3 { font-weight: 700; }\n.what .kind { font: 13px/24px var(--mono); }\n.slice img { display: block; width: 100%; height: auto; border: 1px solid var(--ink); filter: grayscale(1); } /* placeholders: drop the grayscale when the real photos go in */\n.slice .at { font: 13px/24px var(--mono); }\n@media (min-width: 700px) {\n  .slice .what { grid-column: 1; grid-row: 1; }\n  .slice img { grid-column: 2; grid-row: 1 / span 3; }\n  .slice .note { grid-column: 1; grid-row: 2; }\n  .slice .at { grid-column: 1; grid-row: 3; }\n}\n@media (min-width: 1200px) {\n  .slice img { grid-column: 2; grid-row: 1; }\n  .slice .note { grid-column: 3; grid-row: 1; }\n  .slice .at { grid-column: 4; grid-row: 1; }\n}\n\n/* ---------- everything else: section titles, symbols and star bullets (i5-07, i5-09), between hairline column rules ---------- */\n.links { margin-top: calc(var(--u) * 4); row-gap: calc(var(--u) * 2); }\n.links .label { margin-bottom: var(--u); }\n.stars { list-style: \"☆  \"; padding-left: var(--u); }\n.stars li + li { margin-top: calc(var(--u) / 2); }\n.stars li::marker { color: var(--pink); }\n.stars li:hover { list-style-type: \"★  \"; }\n@media (min-width: 700px) {\n  .links > section { position: relative; }\n  .links > section:nth-child(even)::before { content: \"\"; position: absolute; top: 0; bottom: 0; left: calc(var(--gap) / -2); border-left: 1px solid var(--ink); }\n}\n@media (min-width: 1200px) {\n  .links > section:not(:first-child)::before { content: \"\"; position: absolute; top: 0; bottom: 0; left: calc(var(--gap) / -2); border-left: 1px solid var(--ink); }\n}\n\n/* ---------- the end: thanks, the low-tech note, the bunny, the garden ---------- */\n.foot { margin-top: calc(var(--u) * 4); row-gap: var(--u); align-items: end; }\n.bye { font: italic 400 32px/48px var(--serif); }\n.lowtech { font: 13px/24px var(--mono); max-width: 64ch; }\n.bunny .p { color: var(--pink); }\n.bunny .g { color: var(--ink); }\n.bunny:hover { animation: hop .5s; }\n@keyframes hop { 40% { transform: translateY(-8px); } }\n@media (min-width: 1200px) {\n  .lowtech { grid-column: 2 / span 2; }\n  .bunny { grid-column: 4; }\n}\n.garden { overflow: hidden; margin-top: calc(var(--u) * 2); }\n.garden .rose { color: var(--pink); }\n.garden .peri { color: var(--blue); }\n.garden .lilac, .garden .stem { color: var(--ink); }\n\n@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } -------- the buttons ----------\n  function say(s) { statusEl.textContent = s; }\n  function ui() {\n    document.body.classList.toggle(\"on-air\", onAir);\n    $(\"#go\").setAttribute(\"aria-pressed\", onAir);\n    floatStop.hidden = !onAir;\n    document.querySelectorAll(\"[data-break]\").forEach(function (b) { b.setAttribute(\"aria-pressed\", b.dataset.break === pattern); });\n    $(\"#chop\").setAttribute(\"aria-pressed\", pattern === \"chop\");\n    document.querySelectorAll(\"[data-bass]\").forEach(function (b) { b.setAttribute(\"aria-pressed\", b.dataset.bass === bassMode); });\n    $(\"#cute\").setAttribute(\"aria-pressed\", cute);\n    infoEl.textContent = \"break: \" + (pattern === \"chop\" ? \"your chop\" : pattern) + \" · bass: \" + bassMode + \" · cute: \" + (cute ? \"on ✿\" : \"off\") + \" · \" + BPM + \"bpm\";\n    var html = \"\";\n    pats[pattern].forEach(function (t) {\n      html += t ? '\u003cspan class=\"' + (t.rev ? \"rev \" : \"\") + (t.up ? \"up \" : \"\") + (t.n > 1 ? \"roll\" : \"\") + '\">' + t.label + \"\u003c/span>\" : '\u003cspan class=\"rest\">--\u003c/span>';\n    });\n    tracker.innerHTML = html;\n    if (tracker.children[shown] && onAir) tracker.children[shown].classList.add(\"on\");\n  }\n  function go() {\n    if (onAir) return;\n    wantOn = true;\n    if (!ac) build();\n    if (ac.resume) ac.resume();\n    say(\"tuning in…\");\n    (breakBuf ? Promise.resolve() : recordBreak()).then(function () {\n      if (!wantOn || !ac) return;\n      onAir = true; step = 0; queue = []; nextT = ac.currentTime + .08;\n      clearInterval(timer); timer = setInterval(tick, 25); tick();\n      cancelAnimationFrame(raf); raf = requestAnimationFrame(draw);\n      say(\"● on air ♪\");\n      ui();\n    }).catch(function (e) { say(\"no signal, your browser said no\"); console.warn(e); });\n  }\n  function stop() {\n    wantOn = false; onAir = false;\n    clearInterval(timer); timer = null; cancelAnimationFrame(raf);\n    if (ac) {\n      var a = ac, m = master;\n      hush(a.currentTime);\n      m.gain.setTargetAtTime(0, a.currentTime, .01);\n      ac = null; B = null;\n      setTimeout(function () { if (a.close) a.close(); }, 150);\n    }\n    if (tower) tower.classList.remove(\"lit\");\n    if (!happy) look();\n    say(\"off air\");\n    ui();\n  }\n  // ⟲ the DJ pulls the record back by hand and drops it again from the top\n  function pullUp() {\n    if (!onAir || !ac) return;\n    clearInterval(timer);\n    var t = ac.currentTime + .01;\n    hush(t);\n    var s = ac.createBufferSource(), g = ac.createGain(), pos = ((shown + 1) % 32) * OSTEP;\n    s.buffer = revBuf; s.loop = true;\n    s.playbackRate.setValueAtTime(RATE, t);\n    s.playbackRate.linearRampToValueAtTime(RATE * 3, t + .4);\n    s.playbackRate.exponentialRampToValueAtTime(.2, t + 1.05);\n    g.gain.value = 0; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.8, t + .02);\n    g.gain.setValueAtTime(.8, t + .75); g.gain.linearRampToValueAtTime(0, t + 1.05);\n    s.connect(g); g.connect(drums);\n    s.start(t, Math.max(0, revBuf.duration - pos)); s.stop(t + 1.1);\n    live.push({ s: s, end: t + 1.1 });\n    say(\"⟲ pull up! from the top…\");\n    if (!happy) look(\"@\");\n    step = 0; nextT = t + 1.15;\n    timer = setInterval(tick, 25);\n    setTimeout(function () { if (onAir) { say(\"● on air ♪\"); if (!happy) look(); } }, 1150);\n  }\n  // a dub siren, sound system style\n  function siren() {\n    if (!ac) build();\n    if (ac.resume) ac.resume();\n    var t = ac.currentTime + .02, o = ac.createOscillator(), l = ac.createOscillator(), lg = ac.createGain(), g = ac.createGain(), f = ac.createBiquadFilter();\n    o.type = \"square\"; o.frequency.setValueAtTime(380, t); o.frequency.exponentialRampToValueAtTime(820, t + 1.2);\n    l.type = \"square\"; l.frequency.setValueAtTime(4, t); l.frequency.linearRampToValueAtTime(10, t + 1.4);\n    lg.gain.value = 90; l.connect(lg); lg.connect(o.frequency);\n    f.type = \"lowpass\"; f.frequency.value = 1800;\n    g.gain.value = 0; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.09, t + .03);\n    g.gain.setValueAtTime(.09, t + 1.25); g.gain.linearRampToValueAtTime(0, t + 1.5);\n    o.connect(f); f.connect(g); g.connect(comp); g.connect(echoIn);\n    o.start(t); l.start(t); o.stop(t + 1.55); l.stop(t + 1.55);\n    live.push({ s: o, end: t + 1.55 }, { s: l, end: t + 1.55 });\n  }\n\n  $(\"#go\").onclick = go;\n  $(\"#stop\").onclick = stop;\n  floatStop.onclick = stop;\n  $(\"#pullup\").onclick = pullUp;\n  $(\"#siren\").onclick = siren;\n  $(\"#chop\").onclick = function () { chop(); pattern = \"chop\"; ui(); };\n  $(\"#cute\").onclick = function () { cute = !cute; ui(); };\n  $(\"#vol\").oninput = function () { if (ac) master.gain.setTargetAtTime(vol(), ac.currentTime, .03); };\n  document.querySelectorAll(\"[data-break]\").forEach(function (b) { b.onclick = function () { pattern = b.dataset.break; ui(); }; });\n  document.querySelectorAll(\"[data-bass]\").forEach(function (b) { b.onclick = function () { bassMode = b.dataset.bass; bassMix(); ui(); }; });\n  ui();\n})();\n\n\n\u003c/script>\n\u003cscript>(function(){\nvar PAGES=[\"index.html\", \"writing.html\"];\ndocument.addEventListener('click',function(e){\n  var a=e.target.closest&&e.target.closest('a[href]');\n  if(!a||e.defaultPrevented)return;\n  var h=a.getAttribute('href'),m=h.replace(/^\\.\\//,'').split('#'),p=m[0],id=m[1]||'';\n  if(p===''&&h.charAt(0)==='#'){\n    var t=id&&document.getElementById(decodeURIComponent(id));\n    if(id&&!t)return;\n    e.preventDefault();t?t.scrollIntoView({block:'start'}):scrollTo(0,0);return;\n  }\n  if(PAGES.indexOf(p)>-1||p==='/'||p==='.'){\n    e.preventDefault();parent.postMessage({variantPage:PAGES.indexOf(p)>-1?p:'index.html',hash:id},'*');\n  }\n});\naddEventListener('keydown',function(e){\n  if(e.metaKey||e.ctrlKey||e.altKey)return;\n  if(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]'))return;\n  if(['ArrowLeft','ArrowRight','m'].indexOf(e.key)>-1)parent.postMessage({variantKey:e.key},'*');\n});\nif(location.hash.length>1){var t=document.getElementById(decodeURIComponent(location.hash.slice(1)));t&&t.scrollIntoView();}\n})();\u003c/script>\u003c/body>\n\u003c/html>\n", "writing.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en-GB\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cmeta name=\"color-scheme\" content=\"light\">\n\u003ctitle>chainmail · kes inkersole\u003c/title>\n\u003cmeta name=\"description\" content=\"chainmail: short pieces of writing by kes inkersole, sent in by email.\">\n\u003cstyle>\n/* chainmail, kes's writing. the same paper, ink, grid and unit as the index (24px; four columns, two, one).\n   one reading column in the middle of the grid, the date in the margin, real space between pieces. */\n:root {\n  --u: 24px;\n  --edge: 16px;\n  --gap: 48px;\n  --ink: #000;\n  --paper: #fff;\n  --blue: #0033ff;   /* links */\n  --pink: #ff3399;   /* the highlight, and the hearts */\n  --sans: \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n  --mono: ui-monospace, Menlo, Consolas, \"DejaVu Sans Mono\", \"Liberation Mono\", \"Courier New\", monospace;\n  --serif: \"Times New Roman\", Times, serif;\n}\n@media (min-width: 700px)  { :root { --edge: var(--u); } }\n@media (min-width: 1200px) { :root { --edge: calc(var(--u) * 2); --gap: var(--u); } }\n@media (min-width: 1400px) { :root { --gap: calc(var(--u) * 2); } }\n\n*, *::before, *::after { box-sizing: border-box; }\nhtml { background: var(--paper); color: var(--ink); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\nbody { margin: 0; padding: var(--u) var(--edge) 0; background: var(--paper); font: 16px/24px var(--sans); overflow-wrap: break-word; }\nh1, h2, p, figure { margin: 0; }\nh2 { font-size: inherit; }\n\na { color: var(--blue); text-decoration-thickness: 1px; text-underline-offset: 3px; }\na:visited { color: var(--blue); text-decoration-style: dotted; }\na:hover { background: var(--pink); color: var(--ink); text-decoration: none; }\na:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }\n::selection { background: var(--pink); color: var(--ink); }\n\n.mono { font: 13px/24px var(--mono); }\n.heart { color: var(--pink); font-style: normal; }\n\n.grid { display: grid; grid-template-columns: minmax(0, 1fr); column-gap: var(--gap); }\n@media (min-width: 700px)  { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }\n@media (min-width: 1200px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }\n\n.art, pre { margin: 0; font: 13px/1.15 var(--mono); white-space: pre; color: var(--ink); }\npre b { font-weight: inherit; }\n\n/* ---------- running head ---------- */\n.head { font: 13px/24px var(--mono); grid-template-columns: minmax(0, 1fr) auto; }\n@media (min-width: 700px)  { .head { grid-template-columns: repeat(2, minmax(0, 1fr)); } }\n@media (min-width: 1200px) { .head .nav { grid-column: 4; } }\n\n/* ---------- the top: the love-heart computer (i5-08), its cable of \u003c3s running off the page.\n   that's where the emails come in. hover and the hearts go down the wire ---------- */\n.mast { margin-top: calc(var(--u) * 2); align-items: end;\n  grid-template-areas: \"pc\" \"cable\" \"intro\" \"address\"; }\n.pc { grid-area: pc; color: var(--blue); }\n.pc b { color: var(--pink); }\n.cable { grid-area: cable; display: flex; color: var(--blue); }\n.cable b { color: var(--pink); }\n.wire { flex: 1; overflow: hidden; padding-bottom: 3px; }\n.wire span { display: inline-block; margin-left: -30ch; animation: send 6s linear infinite paused; }\n.mast:hover .wire span { animation-play-state: running; }\n@keyframes send { to { transform: translateX(30ch); } }\n.intro { grid-area: intro; margin-top: calc(var(--u) * 2); }\n.intro h1 { font: italic 400 32px/48px var(--serif); }\n.intro h1 .mono { font-style: normal; }\n.intro p { margin-top: var(--u); max-width: 34em; }\n.address { grid-area: address; margin-top: var(--u); }\n@media (min-width: 700px) {\n  .mast { grid-template-areas: \"pc intro\" \"cable cable\" \". address\"; }\n  .intro { margin: 0 0 var(--u); }\n}\n@media (min-width: 1200px) {\n  .mast { grid-template-areas: \"pc intro intro address\" \"cable cable cable cable\"; }\n  .address { margin: 0 0 var(--u); }\n}\n\n/* ---------- the pieces. each emailed piece is one \u003carticle class=\"piece\">, newest first ---------- */\n.pieces { margin-top: calc(var(--u) * 4); }\n.piece { border-top: 1px solid var(--ink); padding: var(--u) 0 calc(var(--u) * 3); }\n.piece .meta { font: 13px/24px var(--mono); margin-bottom: var(--u); }\n.piece h2 { font-weight: 700; margin-bottom: var(--u); }\n.piece .text { max-width: 34em; }\n.piece .text p + p { margin-top: var(--u); }\n.pieces .piece:last-child { border-bottom: 1px solid var(--ink); }\n@media (min-width: 700px) {\n  .piece .meta { grid-column: 1; grid-row: 1 / span 2; margin: 0; }\n  .piece h2, .piece .text { grid-column: 2; }\n}\n@media (min-width: 1200px) {\n  .piece h2, .piece .text { grid-column: 2 / span 2; }\n}\n\n/* ---------- the end ---------- */\n.foot { margin-top: calc(var(--u) * 4); row-gap: var(--u); align-items: end; }\n.bye { font: italic 400 32px/48px var(--serif); }\n.foot .mono { max-width: 64ch; }\n@media (min-width: 1200px) { .foot .mono { grid-column: 2 / span 2; } }\n.garden { overflow: hidden; margin-top: calc(var(--u) * 2); }\n.garden .rose { color: var(--pink); }\n.garden .peri { color: var(--blue); }\n.garden .lilac, .garden .stem { color: var(--ink); }\n\n@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"head grid\">\n  \u003cp>\u003ca href=\"index.html\">kes inkersole\u003c/a>\u003c/p>\n  \u003cp class=\"nav\">\u003ca href=\"index.html\">index\u003c/a> · \u003cspan aria-current=\"page\">writ /p>\n  \u003ch2>nemo enim\u003c/h2>\n  \u003cdiv class=\"text\">\n    \u003cp>Nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit aut fugit. Quis autem vel eum iure reprehenderit qui in ea voluptate velit esse quam nihil molestiae consequatur?\u003c/p>\n  \u003c/div>\n\u003c/article>\n\n\u003carticle class=\"piece grid\" id=\"p008\">\n  \u003cp class=\"meta\">\u003ca href=\"#p008\">008\u003c/a>\u003cbr>\u003ctime datetime=\"2026-09-26\">26 sep 2026\u003c/time>\u003c/p>\n  \u003ch2>quis autem vel eum\u003c/h2>\n  \u003cdiv class=\"text\">\n    \u003cp>Quis autem vel eum iure reprehenderit qui in ea voluptate velit esse quam nihil molestiae consequatur, vel illum qui dolorem eum fugiat quo voluptas nulla pariatur. At vero eos et accusamus et iusto odio dignissimos ducimus qui blanditiis praesentium voluptatum deleniti atque corrupti quos dolores et quas molestias excepturi sint occaecati cupiditate non provident, similique sunt in culpa qui officia deserunt mollitia animi.\u003c/p>\n  \u003c/div>\n\u003c/article>\n\n\u003carticle class=\"piece grid\" id=\"p007\">\n  \u003cp class=\"meta\">\u003ca href=\"#p007\">007\u003c/a>\u003cbr>\u003ctime datetime=\"2026-09-19\">19 sep 2026\u003c/time>\u003c/p>\n  \u003ch2>at vero eos\u003c/h2>\n  \u003cdiv class=\"text\">\n    \u003cp>At vero eos et accusamus.\u003c/p>\n  \u003c/div>\n\u003c/article>\n\n\u003carticle class=\"piece grid\" id=\"p006\">\n  \u003cp class=\"meta\">\u003ca href=\"#p006\">006\u003c/a>\u003cbr>\u003ctime datetime=\"2026-09-12\">12 sep 2026\u003c/time>\u003c/p>\n  \u003ch2>nam libero tempore\u003c/h2>\n  \u003cdiv class=\"text\">\n    \u003cp>nam libero tempore\u003cbr>cum soluta nobis\u003cbr>est eligendi optio\u003cbr>cumque nihil impedit\u003c/p>\n    \u003cp>quo minus id quod maxime placeat facere possimus.\u003c/p>\n  \u003c/div>\n\u003c/article>\n\n\u003carticle class=\"piece grid\" id=\"p005\">\n  \u003cp class=\"meta\">\u003ca href=\"#p005\">005\u003c/a>\u003cbr>\u003ctime datetime=\"2026-09-03\">3 sep 2026\u003c/time>\u003c/p>\n  \u003ch2>temporibus autem quibusdam\u003c/h2>\n  \u003cdiv class=\"text\">\n    \u003cp>Temporibus autem quibusdam et aut officiis debitis aut rerum necessitatibus saepe eveniet ut et voluptates repudiandae sint et molestiae non recusandae. Itaque earum rerum hic tenetur a sapiente delectus, ut aut reiciendis voluptatibus maiores alias consequatur aut perferendis doloribus asperiores repellat.\u003c/p>\n    \u003cp>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.\u003c/p>\n    \u003cp>Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum. Curabitur pretium tincidunt lacus, nulla gravida orci a odio.\u003c/p>\n    \u003cp>Nullam varius, turpis et commodo pharetra, est eros bibendum elit, nec luctus magna felis sollicitudin mauris. Integer in mauris eu nibh euismod gravida.\u003c/p>\n  \u003c/div>\n\u003c/article>\n\n\u003carticle class=\"piece grid\" id=\"p004\">\n  \u003cp class=\"meta\">\u003ca href=\"#p004\">004\u003c/a>\u003cbr>\u003ctime datetime=\"2026-08-27\">27 aug 2026\u003c/time>\u003c/p>\n  \u003ch2>itaque earum\u003c/h2>\n  \u003cdiv class=\"text\">\n    \u003cp>Itaque earum rerum hic tenetur a sapiente delectus, ut aut reiciendis voluptatibus maiores alias consequatur. Duis ac turpis. Integer rutrum ante eu lacus.\u003c/p>\n  \u003c/div>\n\u003c/article>\n\n\u003carticle class=\"piece grid\" id=\"p003\">\n  \u003cp class=\"meta\">\u003ca href=\"#p003\">003\u003c/a>\u003cbr>\u003ctime datetime=\"2026-08-16\">16 aug 2026\u003c/time>\u003c/p>\n  \u003ch2>ut enim ad minima veniam\u003c/h2>\n  \u003cdiv class=\"text\">\n    \u003cp>Ut enim ad minima veniam, quis nostrum exercitationem ullam corporis suscipit laboriosam, nisi ut aliquid ex ea commodi consequatur. Vestibulum ante ipsum primis in faucibus orci luctus et ultrices posuere cubilia curae; aliquam erat volutpat.\u003c/p>\n    \u003cp>Pellentesque habitant morbi tristique senectus et netus et malesuada fames ac turpis egestas. Vestibulum tortor quam, feugiat vitae, ultricies eget, tempor sit amet, ante.\u003c/p>\n  \u003c/div>\n\u003c/article>\n\n\u003carticle class=\"piece grid\" id=\"p002\">\n  \u003cp class=\"meta\">\u003ca href=\"#p002\">002\u003c/a>\u003cbr>\u003ctime datetime=\"2026-08-02\">2 aug 2026\u003c/time>\u003c/p>\n  \u003ch2>neque porro\u003c/h2>\n  \u003cdiv class=\"text\">\n    \u003cp>Neque porro quisquam est, qui dolorem ipsum quia dolor sit amet.\u003c/p>\n  \u003c/div>\n\u003c/article>\n\n\u003carticle class=\"piece grid\" id=\"p001\">\n  \u003cp class=\"meta\">\u003ca href=\"#p001\">001\u003c/a>\u003cbr>\u003ctime datetime=\"2026-07-20\">20 jul 2026\u003c/time>\u003c/p>\n  \u003ch2>duis aute irure\u003c/h2>\n  \u003cdiv class=\"text\">\n    \u003cp>Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum. Praesent dapibus, neque id cursus faucibus, tortor neque egestas augue, eu vulputate magna eros eu erat.\u003c/p>\n  \u003c/div>\n\u003c/article>\n\n\u003c/main>\n\n\u003cfooter class=\"foot grid\">\n  \u003cp class=\"bye\">thanks for reading \u003cspan class=\"heart\">♡\u003c/span>\u003c/p>\n  \u003cp class=\"mono\">that's everything so far, newest at the top. new pieces arrive by email: (address tbc). \u003ca href=\"index.html\">back to the index\u003c/a>\u003c/p>\n\u003c/footer>\n\n\u003c!-- a little garden, so the page has somewhere soft to end -->\n\u003cpre class=\"art garden\" aria-hidden=\"true\">    \u003cb class=\"rose\">_                             \u003c/b>\u003cb class=\"lilac\">_ o: ui-monospace, Menlo, Monaco, Consolas, \"Liberation Mono\", \"Courier New\", monospace;\n  --serif: \"Times New Roman\", Times, serif;\n  --side: calc(var(--u) * 2);\n  --gap: calc(var(--u) * 2);\n  color-scheme: light;\n}\nhtml { background: var(--paper); color: var(--ink); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\nbody { margin: 0 auto; max-width: 1920px; padding: calc(var(--u) * 2) var(--side) 0; font: 16px/24px var(--sans); }\np, h1, h2, h3, ul, dl, dd, figure { margin: 0; }\n::selection { background: var(--pink); color: var(--ink); }\n\na { color: var(--blue); text-decoration-thickness: 1px; text-underline-offset: 3px; }\na:visited { color: var(--blue); }\na:hover, a:focus-visible { background: var(--pink); color: var(--ink); text-decoration: none; outline: none; }\n\n.m { font: 13px/24px var(--mono); }\n.sym, .heart, .pk { color: var(--pink); font-style: normal; }\n.title { font: 400 13px/24px var(--mono); }\n\n/* the grid */\n.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: var(--gap); }\n.band { margin-top: calc(var(--u) * 4); }\n\n/* ---------- the name, in \u003c3s on a pink sign ---------- */\n.sign { container-type: inline-size; margin: 0 0 calc(var(--u) * 4); }\n.sign pre { margin: 0; font-family: var(--mono); font-weight: bold; color: var(--dot); line-height: 1.22; font-size: min(19px, calc(100cqw / 101.9)); width: fit-content;\n  background: linear-gradient(var(--blush), var(--blush)) 1.5ch .5lh / calc(100% - 3ch) calc(100% - 1lh) no-repeat; }\n.sign s { text-decoration: none; color: var(--ink); font-weight: normal; }\n.sign b { font-weight: inherit; color: var(--pink); }\n.sign b.h { color: var(--blue); animation: blink 1.6s steps(1) infinite; }\n@keyframes blink { 50% { color: var(--pink); } }\n.sign .small { display: none; }\n@container (max-width: 879px) {\n  .sign .big { display: none; }\n  .sign .small { display: block; font-size: min(16px, calc(100cqw / 25.9)); }\n}\n\n/* ---------- hello, margin-top: var(--u); }\n.lcd { font: 13px/24px var(--mono); border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }\n.lcd-top { display: flex; flex-wrap: wrap; justify-content: space-between; column-gap: 2ch; }\n.status { padding: 0 .5ch; }\nbody.on-air .status { background: var(--pink); }\n.ticker { overflow: hidden; white-space: nowrap; }\n.ticker > div { display: inline-block; }\n.ticker span { padding-right: .5em; }\n@keyframes run { to { translate: -50% 0; } }\n@media (prefers-reduced-motion: no-preference) { body.on-air .ticker > div { animation: run 70s linear infinite; } }\n.tracker { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); text-align: center; }\n.tracker .rest { opacity: .35; }\n.tracker .rev { color: var(--pink); }\n.tracker .up { color: var(--blue); }\n.tracker .roll { text-decoration: underline; }\n.tracker .on { background: var(--pink); color: var(--ink); }\n.lcd-info { display: flex; flex-wrap: wrap; column-gap: 2ch; }\n.lcd-info .rev { color: var(--pink); }\n.lcd-info .up { color: var(--blue); }\n\n.keys { margin-top: var(--u); font: 13px/24px var(--mono); }\n.keys > div, .keys > label { display: block; padding-left: 6ch; text-indent: -6ch; }\n.keys > div:not([role]) { text-indent: 0; }\n.keys .lbl { display: inline-block; width: 6ch; text-indent: 0; }\n.keys button { font: 13px/24px var(--mono); color: var(--ink); background: none; border: 0; border-radius: 0; padding: 0; margin: 0 1ch 0 0; cursor: pointer; text-indent: 0; }\n.keys button::before { content: \"[\"; }\n.keys button::after { content: \"]\"; }\n.keys button[aria-pressed=\"true\"] { background: var(--ink); color: var(--paper); }\n.keys .go[aria-pressed=\"true\"] { background: var(--pink); color: var(--ink); }\n.keys button:hover, .keys button:focus-visible { background: var(--pink); color: var(--ink); outline: none; }\n.vol input { width: calc(var(--u) * 5); margin: 0; vertical-align: middle; accent-color: var(--ink); }\n.textin { margin-top: var(--u); font: 13px/24px var(--mono); }\n.floatstop { position: fixed; right: var(--u); bottom: var(--u); z-index: 5; font: 13px/24px var(--mono); background: var(--pink); color: var(--ink); border: 0; border-radius: 0; padding: 0 1ch; cursor: pointer; }\n.floatstop[hidden] { display: none; }\n\n/* ---------- three projects, as slices ---------- */\n.slices .title { margin-bottom: 0; }\n.slice { border-top: 1px solid var(--ink); padding: var(--u) 0 calc(var(--u) * 2); align-items: start; }\n.slice:last-child { border-bottom: 1px solid var(--ink); }\n.what { padding-left: calc(var(--u) * 2); }\n.what .n { display: inline-block; width: calc(var(--u) * 2); margin-left: calc(var(--u) * -2); }\n.what h3 { display: inline; font: inherit; }\n.pic img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: cover; background: #eee; filter: grayscale(1); }\n.note p { max-width: 34em; }\n\n/* ---------- everything else, as links ---------- */\n.more { align-items: stretch; }\n.more .col { position: relative; }\n.more .col + .col::before { content: \"\"; position: absolute; top: 0; bottom: 0; left: calc(var(--gap) / -2); border-left: 1px solid var(--ink); }\n.stars { list-style: \"☆  \"; padding-left: var(--u); }\n.stars + .title { margin-top: calc(var(--u) * 2); }\n.stars li::marker { color: var(--ink); }\n.stars li:hover { list-style-type: \"★  \"; }\n.stars li:hover::marker { color: var(--pink); }\n\n/* ---------- the end ---------- */\n.foot { border-top: 1px solid var(--ink); padding-top: var(--u); align-items: start; }\n.foot .bye { grid-column: 3; font: italic 400 40px/48px var(--serif); letter-spacing: -.01em; }\n.foot .low { max-width: 40em; }\n.garden-bed { container-type: inline-size; margin-top: calc(var(--u) * 4); }\n.garden { margin: 0; font-family: var(--mono); font-size: max(11px, calc(100cqw / 113.6)); line-height: 1.2; white-space: pre; overflow: hidden; color: var(--ink); }\n.garden b { font-weight: normal; }\n.garden .rose { color: var(- ------------------------------------------------------------\n   chainmail. the same rules as the home page:\n   one unit (--u, 24px), one grid, three type sizes,\n   black on white, blue links, pink highlight. no scripts on this page.\n   --------------------------------------------------------------- */\n:root {\n  --u: 24px;\n  --ink: #000;\n  --paper: #fff;\n  --blue: #0038ff;\n  --pink: #ff3399;\n  --sans: \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n  --mono: ui-monospace, Menlo, Monaco, Consolas, \"Liberation Mono\", \"Courier New\", monospace;\n  --serif: \"Times New Roman\", Times, serif;\n  --side: calc(var(--u) * 2);\n  --gap: calc(var(--u) * 2);\n  color-scheme: light;\n}\nhtml { background: var(--paper); color: var(--ink); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\nbody { margin: 0 auto; max-width: 1920px; padding: calc(var(--u) * 2) var(--side) 0; font: 16px/24px var(--sans); }\np, h1, h2, figure { margin: 0; }\n::selection { background: var(--pink); color: var(--ink); }\n\na { color: var(--blue); text-decoration-thickness: 1px; text-underline-offset: 3px; }\na:visited { color: var(--blue); }\na:hover, a:focus-visible { background: var(--pink); color: var(--ink); text-decoration: none; outline: none; }\n\n.m { font: 13px/24px var(--mono); }\n.heart, .pk { color: var(--pink); font-style: normal; }\n.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: var(--gap); }\n\n/* ---------- the top: the little computer the pieces arrive at ---------- */\n.home { margin-bottom: calc(var(--u) * 2); }\n.mailhead { grid-template-areas: \"pc intro intro\" \"cable cable cable\"; }\n.pc { grid-area: pc; align-self: end; }\n.intro { grid-area: intro; align-self: start; }\n.cable { grid-area: cable; }\n.intro h1 { font: italic 400 40px/48px var(--serif); letter-spacing: -.01em; margin-bottom: var(--u); }\n.intro p { max-width: 34em; }\n.intro p + p { margin-top: var(--u); }\n\n.pc, .cable { margin: 0; font: 13px/1.1 var(--mono); color: var(--ink); }\n.pc b, .cable b { font: inherit; color: var(--pink); }\n.cable { display: flex; }\n.wire { flex: 1; overflow: hidden; padding-bottom: 3px; }\n.wire span { display: inline-block; margin-left: -30ch; animation: send 6s linear infinite paused; }\n.mailhead:hover .wire span { animation-play-state: running; }   /* hover the top and the hearts go down the wire */\n@keyframes send { to { transform: translateX(30ch); } }\n\n/* ---------- the pieces: a text moodboard, newest first ---------- */\n.pieces { margin-top: calc(var(--u) * 2); columns: 3; column-gap: var(--gap); column-rule: 1px solid var(--ink); }\n.piece { break-inside: avoid; padding-bottom: calc(var(--u) * 3); }\n.piece .meta { font: 13px/24px var(--mono); }\n.piece h2 { font: 700 16px/24px var(--sans); letter-spacing: -.01em; margin-bottom: var(--u); }\n.piece .text p + p { margin-top: var(--u); }\n\n/* ---------- the end ---------- */\n.foot { border-top: 1px solid var(--ink); padding-top: var(--u); margin-top: var(--u); align-items: start; }\n.foot .bye { grid-column: 3; font: italic 400 40px/48px var(--serif); letter-spacing: -.01em; }\n.garden-bed { container-type: inline-size; margin-top: calc(var(--u) * 4); }\n.garden { margin: 0; font-family: var(--mono); font-size: max(11px, calc(100cqw / 113.6)); line-height: 1.2; white-space: pre; overflow: hidden; color: var(--ink); }\n.garden b { font-weight: normal; }\n.garden .rose { color: var(--pink); }\n.garden .lilac, .garden .peri { color: var(--blue); }\n.garden .stem { color: var(--ink); }\n\n@media (max-width: 1199px) {\n  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n  .mailhead { grid-template-areas: \"pc intro\" \"cable cable\"; }\n  .pieces { columns: 2; }\n  .foot .bye { grid-column: 2; }\n}\n@media (max-width: 699px) {\n  :root { --side: var(--u); }\n  body { padding-top: var(--u); }\n  .grid { grid-template-columns: minmax(0, 1fr); }\n  .mailhead { grid-template-areas: \"intro\" \"pc\" \"cable\"; }\n "rose\">(_)\u003c/b>\n   \u003cb class=\"stem\">\\|      |    |    |    \\|     \\|      |    |      |      \\|     \\|    |    |      \\|      |    |    |   \\|     \\|      |    |    |      \\|     \\|    |    |     |     \\|      |    |    |\u003c/b>\u003c/pre>\n\u003c/div>\n\n\u003cscript>(function(){\nvar PAGES=[\"index.html\", \"writing.html\"];\ndocument.addEventListener('click',function(e){\n  var a=e.target.closest&&e.target.closest('a[href]');\n  if(!a||e.defaultPrevented)return;\n  var h=a.getAttribute('href'),m=h.replace(/^\\.\\//,'').split('#'),p=m[0],id=m[1]||'';\n  if(p===''&&h.charAt(0)==='#'){\n    var t=id&&document.getElementById(decodeURIComponent(id));\n    if(id&&!t)return;\n    e.preventDefault();t?t.scrollIntoView({block:'start'}):scrollTo(0,0);return;\n  }\n  if(PAGES.indexOf(p)>-1||p==='/'||p==='.'){\n    e.preventDefault();parent.postMessage({variantPage:PAGES.indexOf(p)>-1?p:'index.html',hash:id},'*');\n  }\n});\naddEventListener('keydown',function(e){\n  if(e.metaKey||e.ctrlKey||e.altKey)return;\n  if(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]'))return;\n  if(['ArrowLeft','ArrowRight','m'].indexOf(e.key)>-1)parent.postMessage({variantKey:e.key},'*');\n});\nif(location.hash.length>1){var t=document.getElementById(decodeURIComponent(location.hash.slice(1)));t&&t.scrollIntoView();}\n})();\u003c/script>\u003c/body>\n\u003c/html>\n"}}, {"label": "04", "note": "Pink \u003c3 name over a ruled three-column grid: greeting, bunny CV card, speaker-faced KES FM, three grey slices; chainmail: heart-computer cable over a three-column note moodboard.", "pages": {"index.html": "\u003c!doctype html>\n\u003chtml lang=\"en-GB\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cmeta name=\"color-scheme\" content=\"light\">\n\u003ctitle>kes inkersole\u003c/title>\n\u003cmeta name=\"description\" content=\"kes inkersole (kesia on paper): freelance creative strategist and internet equalities researcher, based in london.\">\n\u003cstyle>\n/* kes inkersole.\n   white paper, black ink, electric blue links, hot pink under your mouse, and the pink of the heart name.\n   one unit: --u, the 24px line. every gap is a multiple of it.\n   one grid: three columns (two on a tablet, one on a phone).\n   three sizes: 13px mono for labels and drawings, 16px sans for reading, 40px times italic for saying hello. */\n:root {\n  --ink: #000;\n  --paper: #fff;\n  --blue: #0038ff;   /* links */\n  --pink: #ff2d87;   /* hearts, symbols, and the highlight under your mouse */\n  --blush: #ffe3ef;  /* behind the name */\n  --dot: #ffbcd7;    /* the name's unlit dots */\n  --u: 24px;\n  --gap: calc(2 * var(--u));\n  --edge: calc(2 * var(--u));\n  --sans: \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n  --mono: ui-monospace, Menlo, Consolas, \"DejaVu Sans Mono\", \"Liberation Mono\", \"Courier New\", monospace;\n  --serif: \"Times New Roman\", Times, serif;\n}\nhtml { background: var(--paper); color: var(--ink); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\nbody { margin: 0; padding: var(--edge) var(--edge) 0; font: 16px/24px var(--sans); overflow-x: hidden; overflow-wrap: break-word; }\nh1, h2, h3, p, ul, dl, dd, pre { margin: 0; }\nh1, h2, h3 { font: inherit; }\np + p { margin-top: var(--u); }\n.lbl + p { margin-top: 0; }\n::selection { background: var(--pink); color: var(--ink); }\n\na { color: var(--blue); text-decoration-thickness: 1px; text-underline-offset: .2em; }\na:visited { text-decoration-style: dotted; }\na:hover { background: var(--pink); color: var(--ink); text-decoration: none; }\na:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }\n.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }\n\n/* the three sizes */\n.lbl, #fm-h, .card dt { font: 13px/24px var(--mono); }\n.display { font: italic 400 40px/48px var(--serif); letter-spacing: -.01em; }\n.heart, .sym { color: var(--pink); font-style: normal; }\n\n/* the drawings: kept exactly as drawn, recoloured to black, pink and blue */\npre { font: 13px/15px var(--mono); white-space: pre; }\npre b, pre i { font: inherit; }\n\n/* the one grid */\n.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: var(--gap); align-items: start; }\n.band { margin-top: calc(4 * var(--u)); padding-top: calc(var(--u) - 1px); border-top: 1px solid var(--ink); }\n\n/* ---------- the name, in tiny \u003c3s ---------- */\n.sign { container-type: inline-size; }\n.sign pre { color: var(--dot); line-height: 1.22; font-size: min(19px, calc(100cqw / 101.9)); font-weight: bold; width: fit-content;\n  background: linear-gradient(var(--blush), var(--blush)) 1.5ch .5lh / calc(100% - 3ch) calc(100% - 1lh) no-repeat; }\n.sign s { text-decoration: none; color: var(--ink); font-weight: normal; }\n.sign b { color: var(--pink); }\n.sign b.h { animation: blink 1.6s steps(1) infinite; }\n@keyframes blink { 50% { color: var(--blue); } }\n.sign .small { display: none; }\n\n/* ---------- hello, the card, the radio ---------- */\n.top { margin-top: calc(2 * var(--u)); grid-template-areas: \"hi hi card\" \"lede prac card\" \"fm fm card\"; grid-template-rows: auto auto 1fr; }\n.hi { grid-area: hi; }\n.lede { grid-area: lede; margin-top: var(--u); }\n.prac { grid-area: prac; margin-top: var(--u); }\n.card { grid-area: card; }\n.top > .fm { grid-area: fm; margin-top: calc(3 * var(--u)); }\n\n/* the card: bio, portfolio and cv on one page, like the flyer, minus the rave */\n.card { border: 1px solid var(--ink); padding: calc(var(--u) - 1px); }\n.card dl { display: grid; grid-template-columns: 10ch minmax(0, 1fr); margin-top: var(--u); }\n.card .bunny { margin-top: calc(2 * var(--u)); width: fit-content; }\n.card .info { margin-top: var(--u); }\n.bunny .p { color: var(--pink); }\n.bunny .g { color: var(--ink); }\n.bunny:hover { animation: hop .5s; }\n@keyframes hop { 40% { transform: translateY(-8px); } }\n\n/* KES FM: the speaker is its face, the deck is plain type between two rules */\n.fm { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: var(--gap); align-items: start;\n  grid-template-areas: \"h deck\" \"face deck\" \"ident deck\"; grid-template-rows: auto auto 1fr; }\n#fm-h { grid-area: h; font-weight: 700; }\n.speaker { grid-area: face; margin-top: var(--u); color: var(--ink); width: fit-content; }\n.ident { grid-area: ident; margin-top: var(--u); }\n.deck { grid-area: deck; font: 13px/24px var(--mono); }\n.speaker .c, .speaker .b, .speaker .i { color: var(--ink); }\n.speaker .p, .speaker .y { color: var(--pink); }\n.speaker .g { color: var(--blue); }\n.speaker.lit .p { color: var(--blue); }\n.speaker .sound.thump { animation: thump .3s steps(1); }\n@keyframes thump { 0% { color: var(--pink); } }\n\n.lcd-top { display: flex; flex-wrap: wrap; justify-content: space-between; column-gap: var(--u); }\nbody.on-air .status { color: var(--pink); }\n.ticker { overflow: hidden; white-space: nowrap; border-block: 1px solid var(--ink); }\n.ticker > div { display: inline-block; }\n.ticker span { padding-right: .5em; }\n@keyframes run { to { translate: -50% 0; } }\n@media (prefers-reduced-motion: no-preference) { .ticker > div { animation: run 70s linear infinite; } }\n.tracker { display: grid; grid-template-columns: repeat(16, auto); justify-content: space-between; }\n.tracker span { padding: 0 2px; margin: 0 -2px; }\n.tracker .rest { opacity: .35; }\n.tracker .roll { text-decoration: underline; text-underline-offset: .2em; }\n.tracker .on { background: var(--pink); color: var(--ink); }\n.deck .rev { color: var(--pink); }\n.deck .up { color: var(--blue); }\n.tracker .on.rev, .tracker .on.up { color: var(--ink); }\n.lcd-info { display: flex; flex-direction: column; }\n\n.keys { margin-top: var(--u); }\n.keys > div { display: flex; flex-wrap: wrap; align-items: center; padding-left: 7ch; }\n.keys > div + div { margin-top: -1px; }\n.keys .lbl { width: 7ch; margin-left: -7ch; }\n.keys button { box-sizing: border-box; height: 24px; margin: 0; padding: 0 1ch; font: 13px/22px var(--mono); color: var(--ink); background: var(--paper);\n  border: 1px solid var(--ink); border-radius: 0; cursor: pointer; }\n.keys > div > button + button { margin-left: -1px; }\n.keys button:hover, .keys button[aria-pressed=\"true\"]:hover { background: var(--pink); color: var(--ink); }\n.keys button:active { translate: 0 1px; }\n.keys button[aria-pressed=\"true\"] { background: var(--ink); color: var(--paper); }\n.keys .go, .keys .stop { font-weight: 700; }\n.keys .go { color: var(--blue); }\n.keys .go[aria-pressed=\"true\"] { background: var(--pink); color: var(--ink); }\n.vol { display: grid; grid-template-columns: 7ch auto; justify-content: start; align-items: center; margin-top: var(--u); }\n.vol input { width: 10em; margin: 0; accent-color: var(--ink); }\n.textin { margin-top: var(--u); }\n.floatstop { position: fixed; right: var(--u); bottom: var(--u); z-index: 5; box-sizing: border-box; height: 24px; padding: 0 1ch;\n  font: 700 13px/22px var(--mono); color: var(--ink); background: var(--pink); border: 1px solid var(--ink); border-radius: 0; cursor: pointer; }\n.floatstop:hover { background: var(--paper); }\n.floatstop[hidden] { display: none; }\n\n/* ---------- three projects, one slice each ---------- */\n.slice .pic { display: block; }\n.slice .pic img { display: block; width: 100%; height: auto; background: #eee; filter: grayscale(1); }\n.slice .pic:hover { background: var(--pink); }\n.slice .pic:hover img { mix-blend-mode: multiply; }\n.slice .cap { margin-top: var(--u); }\n.slice .cap .lbl { display: flex; justify-content: space-between; column-gap: var(--u); }\n\n/* ---------- everything else, as links ---------- */\n.links { align-items: stretch; }\n.links > div > section + section { margin-top: calc(2 * var(--u)); }\n.links ul { padding-left: 1.6em; list-style: \"☆  \"; }\n.links li:hover { list-style-type: \"★  \"; }\n.links li:hover::marker { color: var(--pink); }\n.soft { font: 13px/24px var(--mono); }\n.rules > * + * { position: relative; }\n.rules > * + *::before { content: \"\"; position: absolute; top: calc(-1 * var(--u)); bottom: 0; left: calc(var(--gap) / -2); border-left: 1px solid var(--ink); }\n\n/* ---------- the end ---------- */\n.foot { align-items: baseline; }\n.garden { margin-top: calc(4 * var(--u)); overflow: hidden; }\n.garden .rose { color: var(--pink); }\n.garden .peri { color: var(--blue); }\n.garden .lilac, .garden .stem { color: var(--ink); }\n\n/* ---------- tablet: two columns ---------- */\n@media (max-width: 1099px) {\n  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n  .sign .big { display: none; }\n  .sign .small { display: block; font-size: min(16px, calc(100cqw / 25.9)); }\n  .top { grid-template-areas: \"hi hi\" \"lede prac\" \"fm fm\" \"card card\"; grid-template-rows: auto; }\n  .top > .card { margin-top: calc(3 * var(--u)); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: var(--gap); align-items: start;\n    grid-template-areas: \"a dl\" \"b dl\"; padding: calc(var(--u) - 1px) calc(var(--u) - 1px); }\n  .card-a { grid-area: a; } .card dl { grid-area: dl; margin-top: 0; } .card-b { grid-area: b; }\n  .projects { grid-template-columns: minmax(0, 1fr); row-gap: calc(2 * var(--u)); }\n  .slice { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: var(--gap); align-items: start; }\n  .slice .cap { margin-top: 0; }\n  .links { row-gap: calc(2 * var(--u)); }\n  .links > :nth-child(3)::before { display: none; }\n  .foot { grid-template-areas: \"bye bye\" \"note hi2\"; row-gap: var(--u); }\n  .foot > :nth-child(1) { grid-area: bye; } .foot > :nth-child(2) { grid-area: note; } .foot > :nth-child(3) { grid-area: hi2; }\n}\n\n/* ---------- phone: one column ---------- */\n@media (max-width: 699px) {\    // one bass voice that stays on: a sine sub, plus two detuned saws for the reese\n    var o1 = ac.createOscillator(), o2 = ac.createOscillator(), sub = ac.createOscillator(), lfo = ac.createOscillator();\n    var saw = ac.createGain(), subG = ac.createGain(), grit = ac.createWaveShaper(), lpf = ac.createBiquadFilter(), lfoG = ac.createGain(), env = ac.createGain();\n    o1.type = o2.type = \"sawtooth\"; o1.detune.value = -13; o2.detune.value = 13; sub.type = \"sine\";\n    lpf.type = \"lowpass\"; lpf.frequency.value = 480; lpf.Q.value = 4; lfo.frequency.value = .23; lfoG.gain.value = 300;\n    lfo.connect(lfoG); lfoG.connect(lpf.frequency);\n    grit.curve = shaper(2.5);\n    o1.connect(saw); o2.connect(saw); saw.connect(lpf); lpf.connect(env);\n    sub.connect(grit); grit.connect(subG); subG.connect(env);\n    env.gain.value = 0; env.connect(bassBus);\n    [o1, o2, sub, lfo].forEach(function (o) { o.start(); });\n    B = { o1: o1, o2: o2, sub: sub, saw: saw, subG: subG, env: env };\n    bassMix();\n  }\n  function bassMix() {\n    if (!B) return;\n    var t = ac.currentTime, r = bassMode === \"reese\";\n    B.saw.gain.setTargetAtTime(r ? .28 : 0, t, .05);\n    B.subG.gain.setTargetAtTime(r ? .5 : .85, t, .05);\n    if (bassMode === \"off\") B.env.gain.setTargetAtTime(0, t, .03);\n  }\n\n  function slice(tok, t, d, v) {\n    var s = ac.createBufferSource(), g = ac.createGain();\n    s.buffer = tok.rev ? revBuf : breakBuf;\n    s.playbackRate.value = RATE * (tok.up ? 1.26 : 1);\n    var off = tok.rev ? revBuf.duration - (tok.s + 1) * OSTEP : tok.s * OSTEP;\n    g.gain.value = 0;\n    g.gain.setValueAtTime(0, t);\n    g.gain.linearRampToValueAtTime(v, t + (tok.rev ? .01 : .0015));\n    g.gain.setValueAtTime(v, t + d - .004);\n    g.gain.linearRampToValueAtTime(0, t + d + .002);\n    s.connect(g); g.connect(drums);\n    s.start(t, Math.max(0, off)); s.stop(t + d + .01);\n    live.push({ s: s, end: t + d + .01 });\n  }\n  function hz(semi) { return 43.65 * Math.pow(2 u003ctitle>chainmail · kes inkersole\u003c/title>\n\u003cmeta name=\"description\" content=\"chainmail: short pieces of writing by kes inkersole, sent in by email.\">\n\u003cstyle>\n/* chainmail: kes's writing. same paper, ink, grid and unit as the home page.\n   one unit: --u, the 24px line. one grid: three columns. three sizes: 13 / 16 / 40. no scripts. */\n:root {\n  --ink: #000;\n  --paper: #fff;\n  --blue: #0038ff;\n  --pink: #ff2d87;\n  --u: 24px;\n  --gap: calc(2 * var(--u));\n  --edge: calc(2 * var(--u));\n  --sans: \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n  --mono: ui-monospace, Menlo, Consolas, \"DejaVu Sans Mono\", \"Liberation Mono\", \"Courier New\", monospace;\n  --serif: \"Times New Roman\", Times, serif;\n}\nhtml { background: var(--paper); color: var(--ink); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\nbody { margin: 0; padding: var(--edge) var(--edge) 0; font: 16px/24px var(--sans); overflow-x: hidden; overflow-wrap: break-word; }\nh1, h2, h3, p, pre { margin: 0; }\nh1, h2, h3 { font: inherit; }\np + p { margin-top: var(--u); }\n.lbl + p { margin-top: 0; }\n::selection { background: var(--pink); color: var(--ink); }\n\na { color: var(--blue); text-decoration-thickness: 1px; text-underline-offset: .2em; }\na:visited { text-decoration-style: dotted; }\na:hover { background: var(--pink); color: var(--ink); text-decoration: none; }\na:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }\n\n.lbl { font: 13px/24px var(--mono); }\n.display { font: italic 400 40px/48px var(--serif); letter-spacing: -.01em; }\n.heart { color: var(--pink); font-style: normal; }\n\npre { font: 13px/15px var(--mono); white-space: pre; }\npre b, pre i, pre em { font: inherit; }\n\n.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: var(--gap); align-items: start; }\n.band { margin-top: calc(4 * var(--u)); padding-top: calc(var(--u) - 1px); border-top: 1px solid var(--ink); }\n\n/* ---------- the top: the love-heart computer, and its cable of \u003c3s running under everything ---------- */\n.whead { margin-top: calc(2 * var(--u)); grid-template-areas: \"pc t how\" \"cable cable cable\"; align-items: end; }\n.pc { grid-area: pc; color: var(--ink); }\n.wt { grid-area: t; }\n.how { grid-area: how; }\n.wt .display + p { margin-top: var(--u); }\n.pc b, .cable b { color: var(--pink); }\n.cable { grid-area: cable; display: flex; color: var(--ink); }\n.wire { flex: 1; overflow: hidden; padding-bottom: 3px; }\n.wire span { display: inline-block; margin-left: -30ch; animation: send 6s linear infinite paused; }\n.whead:hover .wire span { animation-play-state: running; }\n@keyframes send { to { transform: translateX(30ch); } }\n\n/* ---------- the pieces: a text moodboard, newest first ---------- */\n.pieces { margin-top: calc(2 * var(--u)); columns: 3; column-gap: var(--gap); column-rule: 1px solid var(--ink); }\n.piece { break-inside: avoid; padding-bottom: calc(2 * var(--u)); }\n.piece .meta { display: flex; justify-content: space-between; column-gap: var(--u); }\n.piece h2 { font-weight: 700; }\n.piece .text { max-width: 36em; }\n\n/* ---------- the end ---------- */\n.foot { align-items: baseline; }\n.garden { margin-top: calc(4 * var(--u)); overflow: hidden; }\n.garden .rose { color: var(--pink); }\n.garden .peri { color: var(--blue); }\n.garden .lilac, .garden .stem { color: var(--ink); }\n\n@media (max-width: 1099px) {\n  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n  .whead { grid-template-areas: \"t t\" \"pc how\" \"cable cable\"; }\n  .wt { margin-bottom: calc(2 * var(--u)); }\n  .pieces { columns: 2; }\n  .foot { grid-template-areas: \"bye bye\" \"note hi2\"; row-gap: var(--u); }\n  .foot > :nth-child(1) { grid-area: bye; } .foot > :nth-child(2) { grid-area: note; } .foot > :nth-child(3) { grid-area: hi2; }\n}\n@media (max-width: 699px) {\n  :root { --edge: var(--u); }\n  .grid { grid-template-columns: minmax(0, 1fr); }\n  .whead { grid-template-areas: \"t\" \"how\" \"pc\" \"cable\"; }\n  .how, .pc { margin-top: var(--u); }\n  .wt { margin-bottom: 0; }\n  .pieces { columns: 1; }\n  .foot { grid-template-areas: \"bye\" \"note\" \"hi2\"; }\n}\n@media (prefers-reduced-motion: reduce) { .wire span { animation: none; } }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cp class=\"lbl\">\u003ca href=\"index.html\">← kes inkersole\u003c/a>\u003c/p>\n\n\u003cheader class=\"whead grid\">\n\u003cpre class=\"pc\" role=\"img\" aria-label=\"ascii drawing of a little computer with a heart on its screen, its cable running off the edge of the page\">\n  ______________________\n |  __________________  |\n | |                  | |\n | |   \u003cb>&lt;3&lt;3\u003c/b>    \u003cb>&lt;3&lt;3\u003c/b>   | |\n | | \u003cb>&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3\u003c/b> | |\n | | \u003cb>&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3\u003c/b> | |\n | |   \u003cb>&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3\u003c/b>   | |\n | |     \u003cb>&lt;3&lt;3&lt;3&lt;3\u003c/b>     | |\n | |       \u003cb>&lt;3&lt;3\u003c/b>       | |\n | |        \u003cb>&lt;3\u003c/b>        | |\n | |__________________| |\n |                      |\n |  \u003cb>o\u003c/b>          ______   |\n |______________________|\\\n   |__________________|   \\\u003c/pre>\n\u003cdiv class=\"wt\">\n\u003ch1 class=\"display\">chainmail \u003cspan class=\"heart\">♡\u003c/span>\u003c/h1>\n\u003cp>my own writing. short pieces, the kind i write in my notes app, sent here by email and collected over time into a kind of text moodboard.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"how\">\n\u003cp class=\"lbl\">by email\u003c/p>\n\u003cp>each piece arrives as an email to (address tbc). the subject line becomes its title and the newest one lands at the top.\u003c/p>\n\u003c/div>\n\u003cpre class=\"cable\" aria-hidden=\"true\">\u003cspan>                           \\\u003c/span>\u003cspan class=\"wire\">\u003cspan>_____________\u003cb>&lt;3\u003c/b>____________________________\u003cb>&lt;3\u003c/b>______ }}, {"label": "05", "note": "Three-column white handout: pink heart-sign masthead, framed CV card and speaker-faced KES FM, three greyscale slices; chainmail is a three-column moodboard of emailed notes.", "pages": {"index.html": "\u003c!doctype html>\n\u003chtml lang=\"en-GB\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cmeta name=\"color-scheme\" content=\"light\">\n\u003ctitle>kes inkersole\u003c/title>\n\u003cmeta name=\"description\" content=\"kes inkersole (kesia on paper), freelance creative strategist &amp; internet equalities researcher, based in london.\">\n\u003cmeta name=\"author\" content=\"Kes Inkersole\">\n\u003cstyle>\n/* ------------------------------------------------------------------\n   kes' little corner of the internet.\n   white, black, electric blue links, a hot pink highlight. that's it.\n   one unit (--u, the line height) and one grid (three columns).\n   ------------------------------------------------------------------ */\n:root {\n  --ink: #000;\n  --paper: #fff;\n  --blue: #1f3dff;      /* electric blue: links */\n  --pink: #ff1f8f;      /* hot pink: the hover highlight, and the hearts */\n  --blush: #ffe3ef;     /* the pink ground of the heart sign */\n  --unlit: #ffbcdb;     /* the sign's unlit dots */\n  --u: 24px;            /* the one unit: every gap is a multiple of it */\n  --gap: calc(2 * var(--u));\n  --edge: calc(2 * var(--u));\n  --sans: \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n  --mono: ui-monospace, Menlo, Monaco, Consolas, \"Liberation Mono\", \"Courier New\", monospace;\n  --serif: \"Times New Roman\", Times, serif;\n  color-scheme: light;\n}\n*, *::before, *::after { box-sizing: border-box; }\nhtml { background: var(--paper); color: var(--ink); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\nbody { margin: 0; padding: var(--u) var(--edge) 0; background: var(--paper); font: 16px/24px var(--sans); }\np, h1, h2, h3, ul, dl, dd { margin: 0; }\nh2, h3 { font: inherit; }\na { color: var(--blue); text-decoration-thickness: 1px; text-underline-offset: .18em; }\na:hover { background: var(--pink); color: var(--ink); }\n::selection { background: var(--pink); color: var(--ink); }\n:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }\n\n/* three sizes: 13 mono for labels, 16 sans for reading, 32 italic for saying hello */\n.mono, .head, .sub, dt, .kick, .meta, .note, .links-foot, .lcd, .keys, .textin, .floatstop { font: 13px/24px var(--mono); }\nh1, .bye { font: italic 400 32px/48px var(--serif); }\n.heart, .sym { color: var(--pink); font-style: normal; }\npre { margin: 0; font: 13px/16px var(--mono); color: var(--ink); }\npre b { font-weight: inherit; }\n\n/* one grid: three columns, gutters of two units */\n.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: var(--gap); align-items: start; }\n.band { margin-top: calc(4 * var(--u)); border-top: 1px solid var(--ink); padding-top: calc(var(--u) - 1px); }\n.read { max-width: 34em; }\n\n/* ---------- running head ---------- */\n.head p { margin: 0; }\n\n/* ---------- the sign: kes inkersole in tiny \u003c3s ---------- */\n.sign { container-type: inline-size; margin-top: calc(2 * var(--u)); }\n.sign pre { color: var(--unlit); font-weight: bold; line-height: 1.23; font-size: min(16px, calc(100cqw / 101.9)); width: fit-content;\n  background: linear-gradient(var(--blush), var(--blush)) 1.5ch .5lh / calc(100% - 3ch) calc(100% - 1lh) no-repeat; }\n.sign s { text-decoration: none; color: var(--ink); font-weight: normal; }\n.sign b { color: var(--pink); }\n.sign b.h { animation: blink 1.6s steps(1) infinite; }\n@keyframes blink { 50% { color: var(--unlit); } }\n.sign .small { display: none; }\n\n/* ---------- hello + the card ---------- */\n.intro { margin-top: calc(3 * var(--u)); }\n.hello p { margin-top: var(--u); }\n.card { grid-column: 2 / 4; position: relative; margin: var(--u) calc(-1 * var(--u)) 0;\n  border: 1px solid var(--ink); padding: calc(2 * var(--u) - 1px) calc(var(--u) - 1px) calc(var(--u) - 1px);\n  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: var(--gap); }\n.card .legend { position: absolute; top: -13px; left: calc(var(--u) - 9px); padding: 0 8px; background: var(--paper); }\n.facts > div { display: grid; grid-template-columns: calc(4 * var(--u)) minmax(0, 1fr); }\n.side { align-self: stretch; display: flex; flex-direction: column; }\n.bunny { margin-top: auto; padding-top: var(--u); }\n.bunny .p { color: var(--pink); }\n.bunny .g { color: var(--ink); }\n.bunny:hover { animation: hop .5s; }\n@keyframes hop { 40% { transform: translateY(-8px); } }\n\n/* ---------- KES FM: label, speaker, deck ---------- */\n.fm { grid-template-areas: \"h . .\" \"i s d\"; row-gap: var(--u); }\n#fm-h { grid-area: h; }\n.ident { grid-area: i; }\n.speaker { grid-area: s; padding-bottom: 8px; }\n.deck { grid-area: d; }\n.speaker .p { color: var(--pink); }\n.speaker .c, .speaker .g, .speaker .y, .speaker .b, .speaker .i { color: var(--ink); }\n.speaker .sound { color: var(--blue); }\nbody:not(.on-air) .speaker .sound { visibility: hidden; }   /* the waves only come off it when it's playing */\n.speaker.lit .cone { color: var(--blue); }\n.speaker .sound.thump { animation: thump .18s steps(1); }\n@keyframes thump { from, to { color: var(--pink); } }\n.lcd { border: 1px solid var(--ink); padding: 11px 12px; }\n.lcd-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 var(--u); }\nbody.on-air .status { color: var(--pink); }\n.ticker { overflow: hidden; white-space: nowrap; }\n.ticker > div { display: inline-block; }\n.ticker span { padding-right: .5em; }\n.tracker { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); text-align: center; }\n.tracker .rest { opacity: .35; }\n.tracker .rev { color: var(--pink); }\n.tracker .up { color: var(--blue); }\n.tracker .roll { text-decoration: underline; }\n.tracker .on { background: var(--pink); color: var(--ink); }\n.lcd-info { display: flex; flex-wrap: wrap; gap: 0 1em; }\n.lcd-info .rev { color: var(--pink); }\n.lcd-info .up { color: var(--blue); }\n.keys { display: flex; flex-wrap: wrap; align-items: center; gap: 12px var(--u); margin-top: var(--u); }\n.keys > div { display: flex; flex-wrap: wrap; align-items: center; gap: 0 6px; }\n.keys .lbl { margin-right: 2px; }\n.keys button { font: inherit; color: var(--ink); background: none; border: 0; border-radius: 0; padding: 0; margin: 0; cursor: pointer; }\n.keys button::before { content: \"[\"; }\n.keys button::after { content: \"]\"; }\n.keys .go, .keys .stop { font-weight: 700; }\n.keys button:hover { background: var(--pink); color: var(--ink); }\n.keys button[aria-pressed=\"true\"] { background: var(--ink); color: var(--paper); }\n.keys .go[aria-pressed=\"true\"] { background: var(--pink); color: var(--ink); }\n.vol { display: flex; align-items: center; gap: 8px; }\n.vol input { width: calc(4 * var(--u)); margin: 0; accent-color: var(--ink); }\n.textin { margin-top: var(--u); }\n.floatstop { position: fixed; right: var(--u); bottom: var(--u); z-index: 5; font-weight: 700; color: var(--paper); background: var(--ink);\n  border: 0; border-radius: 0; padding: 0 12px; cursor: pointer; }\n.floatstop:hover { background: var(--pink); color: var(--ink); }\n.floatstop[hidden] { display: none; }\n@keyframes run { to { translate: -50% 0; } }\n@media (prefers-reduced-motion: no-preference) { body.on-air .ticker > div { animation: run 70s linear infinite; } }\n\n/* ---------- three projects, as slices ---------- */\n.slices { margin-top: var(--u); }\n.slice .pic { display: block; }\n.slice .pic:hover { background: none; }\n.slice img { display: block; width: 100%; height: auto; background: var(--blush); filter: grayscale(1); }\n.slice:hover img { filter: none; }\n.slice h3 { position: relative; margin-top: var(--u); }\n.slice .n { position: absolute; left: calc(-2 * var(--u)); top: 0; width: calc(2 * var(--u) - 12px); text-align: right; font: 13px/24px var(--mono); }\n\n/* ---------- everything else, as links ---------- */\n.more ul { margin-top: var(--u); padding: 0; list-style: outside \"☆ \"; }\n.more li::marker { color: var(--ink); }\n.more li:hover { list-style-type: \"★ \"; }\n.more li:hover::marker { color: var(--pink); }\n.more ul + .sub { margin-top: calc(2 * var(--u)); }\n.more .go { margin-top: var(--u); }\n\n/* ---------- the end, and somewhere soft to land ---------- */\n.foot .links-foot a { display: inline-block; }\n.garden { margin: calc(3 * var(--u)) calc(-1 * var(--edge)) 0; overflow: hidden; }\n.garden b { font-weight: normal; }\n.garden .p { color: var(--pink); }\n.garden .b, .garden .l { color: var(--blue); }\n.garden .y, .garden .g, .garden .k { color: var(--ink); }\n.garden s, .garden u { text-decoration: none; }\n.garden u, .garden:hover s { display: none; }\n.garden:hover u { display: inline; }   /* the bunny wakes up when you come near */\n\n/* ---------- smaller screens ---------- */\n@media (max-width: 1199px) {\n  .card { grid-template-columns: minmax(0, 1fr); }\n  .side { margin-top: var(--u); }\n}\n@media (max-width: 1099px) {\n  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n  .head p:last-child { grid-column: 1 / -1; }\n  .card { grid-column: 2; }\n  .fm { grid-template-areas: \"h h\" \"i i\" \"s d\"; }\n  .slices, .more { row-gap: calc(2 * var(--u)); }\n  .foot { row-gap: var(--u); }\n  .tracker { grid-template-columns: repeat(8, minmax(0, 1fr)); }\n}\n@media (max-width: 959px) {\n  .sign .big { display: none; }\n  .sign .small { display: block; font-size: min(16px, calc(100cqw / 25.9)); }\n}\n@media (max-width: 699px) {\n  :root { --edge: 16px; }\n  .grid { grid-template-columns: minmax(0, 1fr); }\n  .head p:last-child { grid-column: auto; }\n  .card { grid-column: auto; margin: calc(2 * var(--u)) 0 0; }\n  .card .legend { left: calc(var(--u) - 9px); }\n  .fm { grid-template-areas: \"h\" \"i\" \"s\" \"d\"; }\n  .band { margin-top: calc(3 * var(--u)); }\n  .slice .n { position: static; margin-right: 8px; }\n  .more ul { padding-left: 1.4em; }\n}\n@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }\n\u003c/style>\n\u003c/head>\n\u003cbody id=\"top\">\n\n\u003cheader class=\"head grid\">\n  \u003cp>welcome to kes' little corner of the internet\u003c/p>\n  \u003cp>london, available for work\u003c/p>\n  \u003cp>\u003ca href=\"writing.html\">writing →\u003c/a>\u003c/p>\n\u003c/header>\n\n\u003c!-- the sign: every lit dot is a little \u003c3 (INDEX (5), variant 03) -->\n\u003cdiv class=\"sign\" role=\"img\" aria-label=\"kes inkersole, spelled out in tiny \u003c3 hearts on a pink dot-matrix sign\">\n\u003cpre class=\"big\">\u003cs> .---------------------------------------------------------------------------------------------------------------------------------------------------------------------. \u003c/s>\n\u003cs> |\u003c/s> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .\u003cs> | \u003c/s>\n\u003cs> |\u003c/s> . .\u003cb>&lt;3\u003c/b> . . . . . . . . . . . . . . . . . . . . .\u003cb>&lt;3\u003c/b> . . . . . . . .\u003cb>&lt;3\u003c/b> . . . . . . . . . . . . . . . . . . . . . . . . . . . . .\u003cb>&lt;3&lt;3\u003c/b> . . . . . . . . . . . . . . . . .\u003cs> | \u003c/s>\n\u003cs> |\u003c/s> . .\u003cb>&lt;3\u003c/b> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .\u003cb>&lt;3\u003c/b> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .\u003cb>&lt;3\u003c/b> . . . . . . . . .\u003cb class=\"h\">&lt;3&lt;3\u003c/b> .\u003cb class=\"h\">&lt;3&lt;3\u003c/b> . . .\u003cs> | \u003c/s>\n\u003cs> |\u003c/s> . .\u003cb>&lt;3\u003c/b> . .\u003cb>&lt;3\u003c/b> . . .\u003cb>&lt;3&lt;3&lt;3\u003c/b> . . .\u003cb>&lt;3&lt;3&lt;3&lt;3\u003c/b> . . . .\u003cb>&lt;3&lt;3\u003c/b> . .\u003cb>&lt;3\u003c/b> .\u003
