n: ' + pat + (playing ? ', from the next bar' : ''));\n    });\n  });\n  $('vol').addEventListener('input', function () {\n    if (ctx && (playing || ctx.state === 'running')) out.gain.setTargetAtTime(volume(), ctx.currentTime, 0.03);\n  });\n  document.addEventListener('keydown', function (e) {\n    if (e.key === 'Escape' && ctx && ctx.state === 'running') stop();\n  });\n})();\n\u003c/script>\n\n\u003cscript>(function(){\ndocument.addEventListener('click',function(e){\n  var a=e.target.closest&&e.target.closest('a[href^=\"#\"]');\n  if(!a||e.defaultPrevented)return;\n  var id=decodeURIComponent(a.getAttribute('href').slice(1)),t=id&&document.getElementById(id);\n  if(id&&!t)return;\n  e.preventDefault();\n  t?t.scrollIntoView({block:'start'}):scrollTo(0,0);\n});\naddEventListener('keydown',function(e){\n  if(e.metaKey||e.ctrlKey||e.altKey)return;\n  if(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]'))return;\n  if(['ArrowLeft','ArrowRight','m'].indexOf(e.key)>-1)parent.postMessage({variantKey:e.key},'*');\n});\n})();\u003c/script>\u003c/body>\n\u003c/html>\n"}, {"label": "04", "note": "Cute network ASCII wired to a sound system: holo-chrome “kes” throw-up, rave flyer, warning tape, synthesised jungle machine on a “radio kes” pirate station.", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en-GB\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>kes inkersole\u003c/title>\n\u003cmeta name=\"description\" content=\"Kesia Inkersole — freelance creative strategist & internet equalities researcher, based in london.\">\n\u003cmeta name=\"author\" content=\"Kes Inkersole\">\n\u003cmeta name=\"keywords\" content=\"Kesia Inkersole, Kes Inkersole, creative strategist, internet equalities, researcher, London, UAL\">\n\u003cmeta property=\"og:type\" content=\"website\">\n\u003cmeta property=\"og:title\" content=\"kes inkersole\">\n\u003cmeta property=\"og:description\" content=\"kes inkersole — freelance creative strategist & internet equalities researcher, based in london.\">\n\u003cmeta property=\"og:image\" content=\"https://kesia-coral.vercel.app/square.png\">\n\u003cmeta property=\"og:url\" content=\"https://kesia-coral.vercel.app\">\n\u003cmeta name=\"twitter:card\" content=\"summary_large_image\">\n\u003cmeta name=\"twitter:title\" content=\"kes inkersole\">\n\u003cmeta name=\"twitter:description\" content=\"kes inkersole — freelance creative strategist & internet equalities researcher, based in london.\">\n\u003cmeta name=\"twitter:image\" content=\"https://kesia-coral.vercel.app/square.png\">\n\u003clink rel=\"icon\" href=\"/favicon.ico\">\n\u003cstyle>\n:root {\n  /* the soft ones from before */\n  --paper: #fdf7ee;\n  --ink: #33203a;\n  --pink: #cf2d6b;\n  --blue: #3550e0;\n  --butter: #ffe56b;\n  --blush: #ffe3ee;\n  /* and the 'ard ones */\n  --night: #141015;\n  --tape: #ffd400;\n  --acid: #b8ff3c;\n  --chrome: linear-gradient(180deg, #fff 0%, #e4e7ee 24%, #9aa0ae 46%, #3a3f4c 50%, #c3c8d3 55%, #fff 80%, #b3b8c4 100%);\n  --chrome-soft: linear-gradient(180deg, #fff 0%, #e2e5eb 46%, #bcc1cc 52%, #f1f2f5 100%);\n  --holo: linear-gradient(172deg, #fff 0%, #ffe3ee 22%, #cdbdff 44%, #6c6488 50%, #c4f4ff 57%, #fff3a8 80%, #fff 100%);\n  --mono: ui-monospace, Menlo, Consolas, \"Liberation Mono\", \"Courier New\", monospace;\n  --fat: \"Arial Black\", \"Arial Bold\", Impact, sans-serif;\n  --pad: clamp(16px, 3vw, 48px);\n}\nhtml { background: var(--paper); }\nbody { margin: 0; padding: 0 var(--pad); overflow-x: clip; color: var(--ink); font: 18px/1.45 Times, \"Times New Roman\", serif; }\n::selection { background: var(--acid); color: var(--night); }\na { color: var(--blue); text-underline-offset: 3px; overflow-wrap: anywhere; }\na:visited { color: var(--pink); }\na:hover { background: var(--butter); text-decoration-style: wavy; }\n:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }\n\n/* the drawings. only plain ascii inside a \u003cpre>, so they line up in any monospace font */\npre { font: 14px/1.15 var(--mono); margin: 0; overflow: hidden; }\npre b, pre .b { font-weight: normal; color: var(--pink); }\npre i { font-style: normal; color: var(--blue); }\npre .w { color: #d3c4cc; }\npre .k { color: var(--ink); font-weight: bold; }\npre .y { background: var(--butter); color: var(--ink); }\npre .g { background: var(--night); color: var(--acid); }\npre .tag { color: var(--blue); font-weight: bold; font-style: italic; }\n/* hover the computer, the speakers or the bus */\npre .hi, pre:hover .idle { display: none; }\npre:hover .hi { display: inline; }\n.banner { font-size: min(17px, .98vw); margin-top: 22px; }\n.banner.phone { display: none; font-size: min(15px, 3.1vw); }\n\n/* warning tape */\n.tape { position: relative; margin: 0 calc(var(--pad) * -1); padding: 16px 0 15px; overflow: hidden; white-space: nowrap; background: var(--tape); color: #111; font: 900 13px/1 var(--fat); letter-spacing: .14em; text-transform: uppercase; }\n.tape::before, .tape::after { content: \"\"; position: absolute; left: 0; right: 0; height: 7px; background: repeating-linear-gradient(-45deg, #111 0 9px, var(--tape) 9px 18px); }\n.tape::before { top: 0; }\n.tape::after { bottom: 0; }\n.tape-wrap { margin: 44px calc(var(--pad) * -1); padding: 18px 0; overflow: hidden; }\n.tape-wrap .tape { margin: 0 -30px; transform: rotate(-1.4deg); }\n\n/* things sit side by side when there's room and stack when there isn't */\n.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(18em, 100%), 1fr)); align-items: start; gap: 36px 48px; margin: 36px 0; }\n.row > * { margin: 0; min-width: 0; }\np, li { max-width: 34em; }\nul { padding-left: 1.5em; list-style-type: \"☆ \"; }\nul.hearts { list-style-type: \"♡ \"; }\nul.notes { list-style-type: \"♪ \"; }\nli::marker { color: var(--pink); }\nli { margin-bottom: .35em; }\n.tint { background: var(--blush); padding: 20px 24px; }\n.tint > :first-child { margin-top: 0; }\n.tint > :last-child { margin-bottom: 0; }\nimg { display: block; max-width: 100%; height: auto; aspect-ratio: 4 / 3; background: var(--blush); }\nfigure { margin: 0; }\n.small { font: 14px/1.6 var(--mono); }\n.bye { font-size: 1.5em; }\n\n/* side a / side b, like the back of a record */\nol.side { list-style: none; padding-left: 2.4em; counter-reset: t; }\nol.side li { counter-increment: t; position: relative; }\nol.side li::before { content: var(--s) counter(t); position: absolute; left: -2.4em; top: .2em; font: 13px/1.4 var(--mono); color: var(--pink); }\nol.side-a { --s: \"a\"; }\nol.side-b { --s: \"b\"; }\n\n/* headings are stickers slapped on, all slightly different */\n[role=heading] { display: inline-block; margin: 0 0 .8em; font: 14px/1.3 var(--mono); background: linear-gradient(transparent 50%, var(--butter) 50%); }\n.side-tag { display: inline-block; margin-right: 7px; padding: 3px 6px 2px; background: var(--night); color: var(--tape); font: 900 10px/1 var(--fat); letter-spacing: .1em; text-transform: uppercase; vertical-align: 1px; }\n.slap { padding: 5px 10px; background: #fff; border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); transform: rotate(-2deg); }\n.hazard { padding: 5px 10px 5px 30px; border: 2px solid #111; color: #111; background: repeating-linear-gradient(-45deg, #111 0 6px, var(--tape) 6px 12px) left / 20px 100% no-repeat, var(--tape); transform: rotate(1deg); }\n.stencil { background: none; font: 900 16px/1 var(--fat); letter-spacing: .16em; text-transform: uppercase; -webkit-mask-image: linear-gradient(#000 46%, transparent 46% 56%, #000 56%); mask-image: linear-gradient(#000 46%, transparent 46% 56%, #000 56%); text-shadow: 0 0 5px rgba(51, 32, 58, .4); }\n.nightbus { padding: 5px 10px; background: var(--night); color: var(--acid); transform: rotate(1.5deg); }\n\n/* hello, i'm kes: a throw-up */\nh1 { margin: 0 0 .2em; font-weight: normal; line-height: 1; }\nh1 .hello { display: block; font: italic 30px/1.1 Times, \"Times New Roman\", serif; }\nh1 .heart { font-size: 40px; color: var(--pink); vertical-align: top; }\n.throw { position: relative; display: inline-block; isolation: isolate; margin: .1em .06em .45em .04em; padding-right: .12em; font: 900 clamp(92px, 10vw, 156px)/.9 var(--fat); letter-spacing: -.06em; transform: rotate(-4deg); }\n.throw .front { display: inline-block; background: var(--holo); -webkit-background-clip: text; background-clip: text; color: transparent; }\n.throw .back { position: absolute; left: 0; top: 0; z-index: -1; color: var(--ink); -webkit-text-stroke: .15em var(--ink); text-shadow: 1px 1px 0 var(--pink), 2px 2px 0 var(--pink), 3px 3px 0 var(--pink), 4px 4px 0 var(--pink), 5px 5px 0 var(--pink), 6px 6px 0 var(--pink), 7px 7px 0 var(--pink), 8px 8px 0 var(--ink), 9px 9px 0 var(--ink); }\n.throw .sp { position: absolute; font-size: .2em; line-height: 1; }\n.throw .s1 { left: 16%; top: 14%; color: #fff; }\n.throw .s2 { right: -.4em; top: -.3em; color: var(--pink); font-size: .26em; }\n.drip { position: absolute; top: .72em; z-index: -2; width: .07em; height: var(--h); background: var(--ink); border-radius: 0 0 .04em .04em; animation: drip 2.8s cubic-bezier(.5, 0, .8, .6) .3s both; }\n.drip::after { content: \"\"; position: absolute; left: 50%; bottom: -.06em; width: .12em; height: .13em; margin-left: -.06em; border-radius: 50%; background: inherit; }\n.drip.p { background: var(--pink); }\n@keyframes drip { from { height: .02em; } }\n\n/* the photo, taped up, with a smiley slapped on it */\n.snap { position: relative; padding: 10px; background: #fff; box-shadow: 6px 6px 0 var(--ink); transform: rotate(-1.5deg); }\n.snap img { width: 100%; }\n.snap::before { content: \"\"; position: absolute; z-index: 1; left: -12px; top: 14px; width: 96px; height: 22px; background: repeating-linear-gradient(-45deg, #111 0 8px, var(--tape) 8px 16px); opacity: .92; transform: rotate(-34deg); }\n.smiley { position: absolute; z-index: 1; right: 6px; top: -18px; width: 66px; height: 66px; border: 3px solid var(--night); border-radius: 50%; background: radial-gradient(7% 12% at 35% 38%, var(--night) 96%, transparent), radial-gradient(7% 12% at 65% 38%, var(--night) 96%, transparent), var(--tape); transform: rotate(14deg); }\n.smiley::before { content: \"\"; position: absolute; left: 22%; right: 22%; top: 46%; height: 26%; border: 4px solid var(--night); border-top: 0; border-radius: 0 0 50% 50% / 0 0 100% 100%; }\n.smiley::after { content: \"\"; position: absolute; left: 58%; top: 96%; width: 6px; height: 20px; background: var(--tape); border: 3px solid var(--night); border-top: 0; border-radius: 0 0 6px 6px; }\n\n/* the \"available for work\" rave flyer */\n.flyer { position: relative; margin: -24px 6px 0 18px; padding: 22px 20px 18px; background: var(--night); color: var(--paper); box-shadow: 6px 6px 0 var(--pink); transform: rotate(1.2deg); }\n.flyer p { margin: 0; }\n.flyer a { color: var(--butter); }\n.flyer a:visited { color: var(--blush); }\n.flyer a:hover { background: var(--pink); color: #fff; }\n.presents { font: 12px/1.3 var(--mono); letter-spacing: .12em; color: var(--acid); }\n.flyer-h { margin: 6px 0 4px !important; font: 900 clamp(26px, 2.5vw, 38px)/.95 var(--fat); text-transform: uppercase; background: var(--chrome); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(2px 2px 0 var(--pink)); }\n.kao { font-size: 18px; }\n.lineup { margin: 10px 0 !important; font: 12px/1.5 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--acid); }\n.lineup i { font-style: normal; color: var(--pink); }\n.info { font-size: 17px; }\n.fine { margin-top: 12px !important; font: 11px/1.5 var(--mono); color: rgba(253, 247, 238, .65); }\n\n/* a cassette for \"lately\" */\n.cassette { margin-top: 14px; font-size: 13px; }\n\n/* ---------------------------------------------------------------- radio kes */\n.radio { position: relative; margin: 44px calc(var(--pad) * -1); padding: 46px var(--pad) 52px; background: var(--night); color: var(--paper); }\n.radio::before, .radio::after { content: \"\"; position: absolute; left: 0; right: 0; height: 10px; background: repeating-linear-gradient(-45deg, var(--tape) 0 12px, var(--night) 12px 24px); }\n.radio::before { top: 0; }\n.radio::after { bottom: 0; }\n.radio a { color: var(--butter); }\n.radio a:visited { color: var(--blush); }\n.radio a:hover { background: var(--pink); color: #fff; }\n.locked { margin: 0; font: 14px var(--mono); color: var(--acid); }\n.station { display: inline-block; margin: .08em 0 .2em; font: italic 900 clamp(44px, 7vw, 104px)/.92 var(--fat); text-transform: uppercase; letter-spacing: -.03em; background: var(--chrome); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(4px 4px 0 var(--pink)); }\n.freq { color: var(--acid); -webkit-text-fill-color: var(--acid); }\n.ident-sub { margin: 0; max-width: 40em; color: rgba(253, 247, 238, .85); }\n.deck { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1.5fr) minmax(0, 1fr); gap: 36px 44px; align-items: start; margin-top: 30px; }\n.deck > * { min-width: 0; }\n\n.plinth { position: relative; padding: 16px; aspect-ratio: 1; border: 2px solid #000; border-radius: 10px; background: linear-gradient(150deg, #36363d, #18181c); box-shadow: 0 6px 0 #000; }\n.plate { position: relative; width: 100%; aspect-ratio: 1; border-radius: 50%; background: repeating-radial-gradient(circle, #0b0b0d 0 1.5px, #212127 1.5px 3px); box-shadow: 0 0 0 3px #050505, 0 0 0 5px #44444c; }\n.label { position: absolute; inset: 31%; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 11% 0 13%; border-radius: 50%; background: var(--blush); color: var(--ink); font: 9px/1.25 var(--mono); text-align: center; }\n.label b { font: italic 900 19px/1 var(--fat); color: var(--pink); transform: rotate(-8deg); }\n.label::after { content: \"\"; position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; margin: -3.5px; border-radius: 50%; background: #111; }\n.sheen { position: absolute; inset: 16px; border-radius: 50%; pointer-events: none; background: conic-gradient(from 20deg, transparent 0 30deg, rgba(255, 255, 255, .15) 45deg, transparent 62deg 200deg, rgba(255, 255, 255, .1) 220deg, transparent 240deg); }\n.arm { position: absolute; top: 6%; right: 8%; width: 9px; height: 60%; border-radius: 5px; background: linear-gradient(90deg, #8c919c, #fff 45%, #7a7f8a); transform-origin: 50% 4%; transform: rotate(22deg); transition: transform .6s; }\n.arm::before { content: \"\"; position: absolute; top: -9px; left: 50%; width: 26px; height: 26px; margin-left: -13px; border-radius: 50%; background: radial-gradient(#fff, #8a8f99 60%, #333); }\n.arm::after { content: \"\"; position: absolute; bottom: -14px; left: -5px; width: 18px; height: 22px; border-radius: 3px; background: linear-gradient(#ddd, #888); transform: rotate(-12deg); }\n.radio.on .arm { transform: rotate(33deg); }\n.radio.on .plate { animation: spin 1.8s linear infinite; }\n.radio .plate.rewind { animation: spin .3s linear infinite reverse; }\n@keyframes spin { to { transform: rotate(360deg); } }\n.note { margin: 16px 0 0; font: 13px/1.5 var(--mono); color: rgba(253, 247, 238, .75); }\n\n.lcd { padding: 12px 14px 10px; border: 3px solid #2c3036; border-radius: 8px; background: #0d1708; color: var(--acid); font: 13px/1.4 var(--mono); text-shadow: 0 0 6px rgba(184, 255, 60, .5); box-shadow: inset 0 0 30px rgba(184, 255, 60, .08); }\n.lcd p { margin: 0; max-width: none; }\n.lcd-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; letter-spacing: .12em; }\n.onair { opacity: .3; }\n.radio.on .onair { opacity: 1; color: #ff5c96; text-shadow: 0 0 8px #ff5c96; animation: blink 1.2s ease-in-out infinite; }\n@keyframes blink { 50% { opacity: .35; } }\n.ticker { margin: 8px 0; padding: 3px 0; overflow: hidden; white-space: nowrap; border-block: 1px dashed rgba(184, 255, 60, .35); }\n.ticker span { display: inline-block; padding-left: 100%; animation: tick 46s linear infinite; }\n.radio:not(.on) .ticker span { animation: none; padding-left: 0; }\n@keyframes tick { to { transform: translateX(-100%); } }\n.eq { height: 5em; margin: 6px 0; font: 12px/1 var(--mono); color: var(--acid); }\n.steps { display: grid; grid-template-columns: repeat(16, 1fr); gap: 3px; margin: 8px 0; }\n.steps i { height: 10px; border: 1px solid rgba(184, 255, 60, .4); border-radius: 1px; }\n.steps i:nth-child(4n+1) { border-color: var(--acid); }\n.steps i.on { background: var(--acid); box-shadow: 0 0 8px var(--acid); }\n.steps i.on.hit { background: #ff5c96; border-color: #ff5c96; box-shadow: 0 0 8px #ff5c96; }\n.readout { font-size: 12px; opacity: .7; }\n\n.keys { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 16px; }\n.key { padding: 12px 13px 11px; border: 2px solid #000; border-radius: 5px; background: var(--chrome-soft); color: #111; font: 900 13px/1 var(--fat); letter-spacing: .03em; text-transform: uppercase; box-shadow: 0 5px 0 #000; cursor: pointer; }\n.key:hover { filter: brightness(1.08); }\n.key:active, .radio.on .key.play { transform: translateY(4px); box-shadow: 0 1px 0 #000; }\n.key.play { background: var(--acid); }\n.key.stop { background: var(--pink); color: #fff; }\n.key.pull { background: var(--tape); }\n.sw { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 8px; font: 13px var(--mono); }\n.sw > span { width: 4.6em; color: rgba(253, 247, 238, .7); }\n.sw button { padding: 6px 9px; border: 1px solid rgba(253, 247, 238, .45); border-radius: 3px; background: transparent; color: var(--paper); font: 13px/1 var(--mono); cursor: pointer; }\n.sw button[aria-pressed=true] { border-color: var(--acid); background: var(--acid); color: #111; }\n.faders { display: grid; gap: 10px; margin-top: 14px; font: 13px var(--mono); }\n.faders label { display: grid; grid-template-columns 003c times; r++)\n        for (var i = 0; i \u003c len && b.length \u003c 16; i++) b.push(Object.assign({}, src[start + i]));\n    }\n    b[0].k = 1;\n    if (roll) for (var j = 12; j \u003c 16; j++) b[j] = { k: j === 12 ? 1 : 0, s: 0.35 + (j - 12) * 0.2, h: 0, c: 0, roll: 1 };\n    return b;\n  }\n\n  /* ---------- the sound system */\n  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }\n  function gain(x) { var g = AC.createGain(); g.gain.value = x; return g; }\n  function curve(k) {\n    var n = 1024, c = new Float32Array(n);\n    for (var i = 0; i \u003c n; i++) { var x = i / (n - 1) * 2 - 1; c[i] = Math.tanh(k * x) / Math.tanh(k); }\n    return c;\n  }\n  function chain() { for (var i = 0; i \u003c arguments.length - 1; i++) arguments[i].connect(arguments[i + 1]); }\n  function track(n) {\n    live.push(n);\n    n.onended = function () { var i = live.indexOf(n); if (i > -1) live.splice(i, 1); };\n  }\n  function volCurve(x) { return 0.75 * x * x; }\n  function sd() { return 60 / bpm / 4; }\n\n  function boot() {\n    if (AC) return true;\n    var C = window.AudioContext || window.webkitAudioContext;\n    if (!C) { say(\"this browser can't do web audio, sorry x\"); return false; }\n    AC = new C();\n    var lim = AC.createDynamicsCompressor();\n    lim.threshold.value = -10; lim.knee.value = 6; lim.ratio.value = 14; lim.attack.value = 0.002; lim.release.value = 0.12;\n    out.master = gain(volCurve(vol));\n    chain(out.master, lim, AC.destination);\n    analyser = AC.createAnalyser(); analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0.72;\n    out.master.connect(analyser);\n    fData = new Uint8Array(analyser.frequencyBinCount);\n    out.music = gain(1); out.music.connect(out.master);\n    out.fx = gain(0.9); out.fx.connect(out.master);\n\n    // drums: drive -> saturation -> glue compressor\n    out.drive = gain(1);\n    var sh = AC.createWaveShaper(); sh.curve = curve(1.6); sh.oversample = '2x';\n    out.post = gain(0.8);\n    var dc = AC.createDynamicsCompressor();\n    dc.threshold.value = -16; dc.ratio.value = 4; dc.attack.value = 0.004; dc.release.value = 0.09;\n    chain(out.drive, sh, out.post, dc, out.music);\n\n    // reese: detuned saws into a wobbling lowpass, a bit dirty\n    out.rf = AC.createBiquadFilter(); out.rf.type = 'lowpass'; out.rf.frequency.value = 430; out.rf.Q.value = 6;\n    var lfo = AC.createOscillator(); lfo.frequency.value = 0.17;\n    var lfoAmt = gain(280); chain(lfo, lfoAmt, out.rf.frequency); lfo.start();\n    var rsh = AC.createWaveShaper(); rsh.curve = curve(2.5);\n    out.reese = gain(0.5);\n    chain(out.rf, rsh, out.reese, out.music);\n    out.sub = gain(0.9); out.sub.connect(out.music);\n\n    // cute: pads + bells, with a dub echo\n    out.cute = gain(0.6); out.cute.connect(out.music);\n    out.padf = AC.createBiquadFilter(); out.padf.type = 'lowpass'; out.padf.frequency.value = 1100; out.padf.Q.value = 0.6;\n    out.padf.connect(out.cute);\n    out.dly = AC.createDelay(1.5); out.dly.delayTime.value = 3 * sd();\n    var fb = gain(0.38), dlf = AC.createBiquadFilter(); dlf.type = 'lowpass'; dlf.frequency.value = 2600;\n    chain(out.dly, dlf, fb, out.dly);\n    var wet = gain(0.5); chain(dlf, wet, out.music);\n    out.cute.connect(out.dly);\n\n    noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);\n    var d = noiseBuf.getChannelData(0);\n    for (var i = 0; i \u003c d.length; i++) d[i] = Math.random() * 2 - 1;\n\n    applyXf();\n    sizeEq();\n    requestAnimationFrame(draw);\n    return true;\n  }\n\n  function applyXf() {\n    if (!AC) return;\n    var c = Math.cos(xf * Math.PI / 2), a = Math.sin(xf * Math.PI / 2), t = AC.currentTime;\n    out.cute.gain.setTargetAtTime(c * 0.85, t, 0.05);\n    out.reese.gain.setTargetAtTime(a * 0.7, t, 0.05);\n    out.drive.gain.setTargetAtTime(0.75 + xf * 2.4, t, 0.05);\n    out.post.gain.setTargetAtTime(0.85 / (1 + xf * 0.9), t, 0.05);\n  }\n\n  /* ---------- voices */\n  function env(g, t, peak, a, dur) {\n    g.gain.setValueAtTime(0.0001, t);\n    g.gain.exponentialRampToValueAtTime(peak, t + a);\n    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);\n  }\n  function osc(type, f, t, end, dest) {\n    var o = AC.createOscillator(); o.type = type; o.frequency.value = f;\n    o.connect(dest); o.start(t); o.stop(end); track(o);\n    return o;\n  }\n  function noise(t, dur, v, type, f, dest, q) {\n    var s = AC.createBufferSource(); s.buffer = noiseBuf;\n    var fl = AC.createBiquadFilter(); fl.type = type; fl.frequency.value = f; if (q) fl.Q.value = q;\n    var g = AC.createGain(); env(g, t, v, 0.002, dur);\n    chain(s, fl, g, dest);\n    s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.02); track(s);\n  }\n  function kick(t, v) {\n    var g = AC.createGain(); env(g, t, v, 0.003, 0.32); g.connect(out.drive);\n    var o = osc('sine', 160, t, t + 0.34, g);\n    o.frequency.setValueAtTime(165, t);\n    o.frequency.exponentialRampToValueAtTime(55, t + 0.06);\n    o.frequency.exponentialRampToValueAtTime(42, t + 0.3);\n    noise(t, 0.015, v * 0.3, 'highpass', 2500, out.drive);\n  }\n  function snare(t, v) {\n    var g = AC.createGain(); env(g, t, 0.5 * v, 0.002, 0.13); g.connect(out.drive);\n    var o = osc('triangle', 240, t, t + 0.15, g);\n    o.frequency.setValueAtTime(250, t); o.frequency.exponentialRampToValueAtTime(178, t + 0.05);\n    noise(t, 0.16 + v * 0.06, 0.7 * v, 'bandpass', 2400, out.drive, 0.7);\n    noise(t, 0.07, 0.4 * v, 'highpass', 6500, out.drive);\n  }\n  var METAL = [205.3, 304.4, 369.6, 522.7, 540, 800];\n  function ride(t, v) {\n    var g = AC.createGain(); env(g, t, 0.13 * v, 0.002, 0.22);\n    var bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 9000; bp.Q.value = 0.9;\n    var hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 6500;\n    chain(bp, hp, g, out.drive);\n    for (var i = 0; i \u003c METAL.length; i++) osc('square', METAL[i], t, t + 0.24, bp);\n  }\n  function crash(t, v) {\n    noise(t, 1.2, 0.22 * v, 'highpass', 4500, out.drive);\n    var g = AC.createGain(); env(g, t, 0.07 * v, 0.003, 1.0);\n    var hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 5000;\n    chain(hp, g, out.drive);\n    for (var i = 0; i \u003c METAL.length; i++) osc('square', METAL[i] * 1.5, t, t + 1.05, hp);\n  }\n  function reese(t, dur, m) {\n    var f = mtof(m + 12), g = AC.createGain();\n    g.gain.setValueAtTime(0.0001, t);\n    g.gain.exponentialRampToValueAtTime(0.3, t + 0.03);\n    g.gain.setValueAtTime(0.3, t + dur - 0.07);\n    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);\n    g.connect(out.rf);\n    [-17, 0, 17].forEach(function (d) {\n      var o = osc('sawtooth', f, t, t + dur + 0.02, g);\n      o.detune.value = d + Math.random() * 4 - 2;\n    });\n    var sg = AC.createGain();\n    sg.gain.setValueAtTime(0.0001, t);\n    sg.gain.exponentialRampToValueAtTime(0.5, t + 0.02);\n    sg.gain.setValueAtTime(0.5, t + dur - 0.06);\n    sg.gain.exponentialRampToValueAtTime(0.0001, t + dur);\n    sg.connect(out.sub);\n    osc('sine', mtof(m), t, t + dur + 0.02, sg);\n  }\n  function sub(t, dur, m) {\n    var f = mtof(m + 12), g = AC.createGain();\n    g.gain.setValueAtTime(0.0001, t);\n    g.gain.exponentialRampToValueAtTime(0.62, t + 0.006);\n    g.gain.setTargetAtTime(0.45, t + 0.05, 0.1);\n    g.gain.setTargetAtTime(0.0001, t + dur - 0.05, 0.03);\n    g.connect(out.sub);\n    var o = osc('sine', f, t, t + dur + 0.2, g);\n    o.frequency.setValueAtTime(f * 1.5, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.04);\n    var h = gain(0.12); h.connect(g);\n    osc('triangle', f * 2, t, t + dur + 0.2, h);\n  }\n  function pad(t, dur, notes) {\n    notes.forEach(function (n) {\n      var g = AC.createGain();\n      g.gain.setValueAtTime(0.0001, t);\n      g.gain.exponentialRampToValueAtTime(0.035, t + 0.6);\n      g.gain.setValueAtTime(0.035, t + dur - 0.5);\n      g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.4);\n      g.connect(out.padf);\n      [-9, 9].forEach(function (d) { osc('sawtooth', mtof(n), t, t + dur + 0.45, g).detune.value = d; });\n    });\n  }\n  function bell(t, m, v) {\n    var f = mtof(m), g = AC.createGain(); env(g, t, v, 0.003, 1.4); g.connect(out.cute);\n    var c = osc('sine', f, t, t + 1.45, g);\n    var mg = AC.createGain();\n    mg.gain.setValueAtTime(f * 2.2, t); mg.gain.exponentialRampToValueAtTime(1, t + 0.9);\n    mg.connect(c.frequency);\n    osc('sine', f * 3.5, t, t + 1.45, mg);\n  }\n  function horn(t) {\n    var sh = AC.createWaveShaper(); sh.curve = curve(3);\n    var lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3800;\n    var pk = AC.createBiquadFilter(); pk.type = 'peaking'; pk.frequency.value = 1400; pk.gain.value = 8; pk.Q.value = 1;\n    chain(sh, lp, pk, out.fx);\n    [[0, 0.13], [0.2, 0.13], [0.4, 0.62]].forEach(function (b) {\n      var s = t + b[0], e = s + b[1], g = AC.createGain();\n      g.gain.setValueAtTime(0.0001, s);\n      g.gain.exponentialRampToValueAtTime(0.16, s + 0.012);\n      g.gain.setValueAtTime(0.16, e);\n      g.gain.exponentialRampToValueAtTime(0.0001, e + 0.05);\n      g.connect(sh);\n      [440, 443.5, 659].forEach(function (f) {\n        var o = osc('sawtooth', f, s, e + 0.06, g);\n        o.frequency.setValueAtTime(f * 0.86, s); o.frequency.exponentialRampToValueAtTime(f, s + 0.045);\n      });\n    });\n  }\n  function spinback(t) {\n    // the record getting pulled back: a grainy, swooping whoosh\n    var s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;\n    var bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 2.5;\n    var f = bp.frequency;\n    f.setValueAtTime(500, t); f.exponentialRampToValueAtTime(4500, t + 0.18); f.exponentialRampToValueAtTime(350, t + 0.5);\n    f.exponentialRampToValueAtTime(2600, t + 0.66); f.exponentialRampToValueAtTime(160, t + 0.95);\n    var am = gain(0.5), lfo = AC.createOscillator(); lfo.type = 'square'; lfo.frequency.value = 23;\n    var la = gain(0.5); chain(lfo, la, am.gain); lfo.start(t); lfo.stop(t + 1.05);\n    var g = AC.createGain();\n    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.6, t + 0.03);\n    g.gain.setValueAtTime(0.45, t + 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.0);\n    chain(s, bp, am, g, out.fx); s.start(t); s.stop(t + 1.05);\n    var lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800;\n    var g2 = AC.createGain(); env(g2, t, 0.14, 0.02, 1.0); chain(lp, g2, out.fx);\n    var o = AC.createOscillator(); o.type = 'sawtooth'; o.connect(lp);\n    var of = o.frequency;\n    of.setValueAtTime(180, t); of.exponentialRampToValueAtTime(1100, t + 0.18); of.exponentialRampToValueAtTime(120, t + 0.5);\n    of.exponentialRampToValueAtTime(700, t + 0.66); of.exponentialRampToValueAtTime(35, t + 0.95);\n    o.start(t); o.stop(t + 1.05);\n  }\n\n  /* ---------- the sequencer */\n  function barFor(n) {\n    if (chopLeft > 0) { chopLeft--; return chop(chopLeft === 0); }\n    if (pattern === 'amen' && n % 8 === 7) return chop(true);\n    var bars = PAT[pattern].bars;\n    return bars[n % bars.length];\n  }\n  function hum(x) { return x * (0.88 + Math.random() * 0.24); }\n  function tick() {\n    while (nextTime \u003c AC.currentTime + 0.12) {\n      if (step === 0) cur = barFor(barNo);\n      var s = cur[step], t = nextTime, g = (barNo % 4) * 16 + step;\n      if (s.k) kick(t, hum(0.95));\n      if (s.s) { snare(t, hum(s.s)); if (s.roll) snare(t + sd() / 2, hum(s.s * 0.8)); }\n      if (s.h) ride(t, hum(s.h));\n      if (s.c) crash(t, 0.8);\n      var line = bassMode === 'reese' ? REESE : SUB;\n      for (var i = 0; i \u003c line.length; i++) if (line[i][0] === g) {\n        if (bassMode === 'reese') reese(t, line[i][1] * sd(), line[i][2]);\n        else sub(t, line[i][1] * sd() * 0.9, line[i][2]);\n      }\n      if (xf \u003c 0.97) {\n        if (g % 32 === 0) pad(t, 32 * sd(), CHORDS[g === 0 ? 0 : 1]);\n        var every = pattern === 'half' ? 6 : 3;\n        if ((barNo * 16 + step) % every === 0 && Math.random() \u003c 0.55)\n          bell(t, BELLS[Math.random() * BELLS.length | 0], 0.09 + Math.random() * 0.06);\n      }\n      uiQ.push([t, step, barNo, !!(s.k || s.s > 0.5)]);\n      nextTime += sd();\n      if (++step === 16) { step = 0; barNo++; }\n    }\n  }\n\n  function describe() { return PAT[pattern].name + ', ' + bassMode + ', ' + bpm + 'bpm'; }\n  function setOn(on) {\n    onAir = on;\n    radio.classList.toggle('on', on);\n  }\n  function play(quiet) {\n    if (!boot()) return;\n    if (AC.state === 'suspended') AC.resume();\n    if (playing) return;\n    clearTimeout(pullT);\n    playing = true; step = 0; barNo = 0; chopLeft = 0;\n    out.music.gain.cancelScheduledValues(AC.currentTime);\n    out.music.gain.setValueAtTime(1, AC.currentTime);\n    nextTime = AC.currentTime + 0.08;\n    tick();\n    timer = setInterval(tick, 25);\n    setOn(true);\n    if (!quiet) say('▶ on air ヽ(⌐■_■)ノ♪ ' + describe());\n  }\n  function stop(quiet) {\n    clearTimeout(pullT);\n    plate.classList.remove('rewind');\n    setOn(false);\n    if (!AC) return;\n    playing = false; clearInterval(timer); timer = null;\n    var t = AC.currentTime;\n    out.music.gain.cancelScheduledValues(t);\n    out.music.gain.setTargetAtTime(0, t, 0.012);\n    live.slice().forEach(function (n) { try { n.stop(t + 0.07); } catch (e) {} });\n    live = []; uiQ = [];\n    if (lit) { lit.className = ''; lit = null; }\n    readout.textContent = PAT[pattern].name + ' · ' + bassMode + ' · ' + bpm + 'bpm · bar -.--';\n    if (!quiet) say('■ off air. the rest of the page is quiet, promise');\n  }\n  function pullUp() {\n    if (!boot()) return;\n    if (AC.state === 'suspended') AC.resume();\n    stop(true);\n    spinback(AC.currentTime + 0.02);\n    setOn(true);\n    plate.classList.add('rewind');\n    say('\u003c\u003c pull up!! come again, from the top');\n    pullT = setTimeout(function () {\n      plate.classList.remove('rewind');\n      play(true);\n      horn(AC.currentTime + 0.05);\n      say('▶ from the top ヽ(⌐■_■)ノ♪ ' + describe());\n    }, 1150);\n  }\n\n  /* ---------- the screen */\n  function sizeEq() {\n    eqCols = Math.max(12, Math.min(90, Math.floor(eqEl.clientWidth / 7.25)));\n  }\n  function draw() {\n    requestAnimationFrame(draw);\n    var t = AC.currentTime, last = null;\n    while (uiQ.length && uiQ[0][0] \u003c= t) last = uiQ.shift();\n    if (last && playing) {\n      if (lit) lit.className = '';\n      lit = cells[last[1]];\n      lit.className = last[3] ? 'on hit' : 'on';\n      readout.textContent = PAT[pattern].name + ' · ' + bassMode + ' · ' + bpm + 'bpm · bar ' + (last[2] % 4 + 1) + '.' + (last[1] \u003c 9 ? '0' : '') + (last[1] + 1);\n    }\n    analyser.getByteFrequencyData(fData);\n    var rows = 5, hs = [], lines = [];\n    for (var c = 0; c \u003c eqCols; c++) {\n      var lo = Math.floor(Math.pow(2, c / eqCols * 8.6)), hi = Math.max(lo + 1, Math.floor(Math.pow(2, (c + 1) / eqCols * 8.6)));\n      var m = 0;\n      for (var i = lo; i \u003c hi && i \u003c fData.length; i++) if (fData[i] > m) m = fData[i];\n      hs.push(m / 255 * rows * 1.15);\n    }\n    for (var r = rows; r > 0; r--) {\n      var s = '';\n      for (c = 0; c \u003c eqCols; c++) s += hs[c] >= r ? '|' : hs[c] >= r - 0.5 ? '.' : (r === 1 ? '_' : ' ');\n      lines.push(s);\n    }\n    eqEl.textContent = lines.join('\\n');\n  }\n\n  /* ---------- the buttons */\n  $('play').addEventListener('click', function () { play(); });\n  $('stop').addEventListener('click', function () { stop(); });\n  $('pull').addEventListener('click', pullUp);\n  $('chop').addEventListener('click', function () {\n    if (!playing) play(true);\n    chopLeft = 2;\n    say('✂ chopping up the next two bars');\n  });\n  $('horn').addEventListener('click', function () {\n    if (!boot()) return;\n    if (AC.state === 'suspended') AC.resume();\n    horn(AC.currentTime + 0.02);\n    say('air horn ✧ synthesised, no horns were harmed');\n  });\n  function pick(attr, cb) {\n    var btns = [].slice.call(document.querySelectorAll('[data-' + attr + ']'));\n    btns.forEach(function (b) {\n      b.addEventListener('click', function () {\n        btns.forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });\n        cb(b.getAttribute('data-' + attr));\n        say((playing ? '▶ next bar: ' : 'set: ') + describe());\n      });\n    });\n  }\n  pick('pat', function (p) { pattern = p; });\n  pick('bass', function (b) { bassMode = b; });\n  $('xf').addEventListener('input', function () { xf = this.value / 100; applyXf(); });\n  $('vol').addEventListener('input', function () {\n    vol = this.value / 100;\n    if (AC) out.master.gain.setTargetAtTime(volCurve(vol), AC.currentTime, 0.03);\n  });\n  $('bpm').addEventListener('input', function () {\n    bpm = +this.value;\n    $('freq').textContent = bpm; $('freq2').textContent = bpm + '.0';\n    if (AC) out.dly.delayTime.setTargetAtTime(3 * sd(), AC.currentTime, 0.1);\n  });\n  window.addEventListener('resize', function () { if (AC) sizeEq(); });\n})();\n\u003c/script>\n\n\u003cscript>(function(){\ndocument.addEventListener('click',function(e){\n  var a=e.target.closest&&e.target.closest('a[href^=\"#\"]');\n  if(!a||e.defaultPrevented)return;\n  var id=decodeURIComponent(a.getAttribute('href').slice(1)),t=id&&document.getElementById(id);\n  if(id&&!t)return;\n  e.preventDefault();\n  t?t.scrollIntoView({block:'start'}):scrollTo(0,0);\n});\naddEventListener('keydown',function(e){\n  if(e.metaKey||e.ctrlKey||e.altKey)return;\n  if(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]'))return;\n  if(['ArrowLeft','ArrowRight','m'].indexOf(e.key)>-1)parent.postMessage({variantKey:e.key},'*');\n});\n})();\u003c/script>\u003c/body>\n\u003c/html>\n"}, {"label": "05", "note": "Cute ASCII hearts page clashed with a black “kes fm” pirate radio band: synthesised amen-ish jungle tape deck, warning tape, throw-ups, rave flyer, liner notes.", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en-GB\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>kes (kesia) inkersole\u003c/title>\n\u003cmeta name=\"description\" content=\"Kesia Inkersole — freelance creative strategist & internet equalities researcher, based in london.\">\n\u003cmeta name=\"author\" content=\"Kes Inkersole\">\n\u003cmeta name=\"keywords\" content=\"Kesia Inkersole, Kes Inkersole, creative strategist, internet equalities, researcher, London, UAL\">\n\u003clink rel=\"icon\" href=\"/favicon.ico\" sizes=\"any\">\n\n\u003c!-- the little preview card you get when someone pastes the link into imessage / slack / linkedin -->\n\u003cmeta property=\"og:type\" content=\"website\">\n\u003cmeta property=\"og:title\" content=\"kes inkersole\">\n\u003cmeta property=\"og:description\" content=\"kes inkersole — freelance creative strategist & internet equalities researcher, based in london.\">\n\u003cmeta property=\"og:image\" content=\"https://kesia-coral.vercel.app/square.png\">\n\u003cmeta property=\"og:url\" content=\"https://kesia-coral.vercel.app\">\n\u003cmeta name=\"twitter:card\" content=\"summary_large_image\">\n\u003cmeta name=\"twitter:title\" content=\"kes inkersole\">\n\u003cmeta name=\"twitter:description\" content=\"kes inkersole — freelance creative strategist & internet equalities researcher, based in london.\">\n\u003cmeta name=\"twitter:image\" content=\"https://kesia-coral.vercel.app/square.png\">\n\n\u003cstyle>\n/* kes's colours. change one here and it changes everywhere */\n:root {\n\t--paper: #fff5f2;  /* page */\n\t--ink: #2e1f3a;    /* text, a very dark plum */\n\t--pink: #df3a7b;\n\t--blush: #ffd7e6;\n\t--blue: #3a4bdc;   /* links */\n\t--sky: #6c7ef0;    /* blue bits in the drawings */\n\t--mist: #dde3ff;\n\t--lilac: #8b40bd;  /* links you've already clicked */\n\t--leaf: #379659;\n\t--butter: #fff2ad;\n\t--gold: #cf970b;\n\n\t/* the jungle got in */\n\t--night: #151019;  /* rave black, with a bit of plum left in it */\n\t--hazard: #ffd60a; /* warning-tape yellow */\n\t--acid: #a8ff1f;   /* only ever on black, it vanishes on the pink paper */\n\t--hot: #ff5ea8;    /* the pink, turned up so it glows on black */\n\t--chrome: linear-gradient(180deg, #fff 0%, #dcdee6 36%, #6d7180 50%, #f3f4f8 58%, #a3a6b2 100%);\n\t--tape: repeating-linear-gradient(-45deg, var(--hazard) 0 9px, var(--night) 9px 18px);\n\n\t--mono: ui-monospace, Menlo, Consolas, \"Courier New\", monospace;\n\t--marker: \"Marker Felt\", \"Comic Sans MS\", \"Chalkboard SE\", cursive;\n\t--fat: \"Arial Black\", Impact, \"Arial Bold\", Arial, sans-serif;\n\t--edge: clamp(16px, 4vw, 56px); /* space at the sides of the page */\n}\n\nhtml { background: radial-gradient(#f7d9e2 1px, transparent 1.5px) 0 0 / 22px 22px, var(--paper); color: var(--ink); -webkit-text-size-adjust: 100%; } /* faint dots, like cross-stitch fabric */\nbody { margin: 0; padding: 28px var(--edge) 0; font: 17px/1.5 Times, \"Times New Roman\", serif; }\n::selection { background: #ffc4dc; }\n\na { color: var(--blue); text-underline-offset: 2px; }\na:visited { color: var(--lilac); }\na:hover { color: var(--pink); background: var(--blush); }\n\nh1 { font-size: 2em; margin: .3em 0 .4em; }\n/* headings get a highlighter stripe (a fat underline pulled up behind the letters, so it follows the text when it wraps)\n   ...and now the highlighter drips, like a paint pen pressed too hard */\nh2 { font-size: 1.2em; margin: 0 0 .7em; text-decoration: underline var(--hl, var(--butter)); text-decoration-thickness: .5em; text-underline-offset: -.3em; text-decoration-skip-ink: none; position: relative; isolation: isolate; }\nh2::after { content: \"\"; position: absolute; z-index: -1; left: .45em; top: 1.1em; width: .2em; height: .85em; border-radius: 0 0 .12em .12em; background: var(--hl, var(--butter)); box-shadow: 1.15em -.32em 0 var(--hl, var(--butter)), 2.3em -.5em 0 -.03em var(--hl, var(--butter)), 3.2em -.2em 0 -.02em var(--hl, var(--butter)); }\np { margin: 0 0 1em; max-width: 36em; }\n\nul { padding-left: 1.3em; margin: 0 0 1em; }\nli { list-style-type: \"☆  \"; margin-bottom: .15em; }\nli:hover { list-style-type: \"★  \"; }\nli::marker { color: var(--pink); }\n\ndt { font-weight: bold; margin-top: 1em; }\ndd { margin: .15em 0 0; }\n\n/* photos are pasted up: a strip of warning tape or pink washi tape holds each one on */\nfigure { display: inline-block; margin: .9em .5em .3em 0; vertical-align: top; position: relative; }\nfigure img { display: block; max-width: 100%; height: auto; background: var(--mist); border: 5px solid #fff; box-shadow: 0 1px 4px #2e1f3a26; }\nfigure:nth-of-type(even) img { rotate: 1.5deg; }\nfigure:nth-of-type(odd) img { rotate: -1deg; }\nfigure::before { content: \"\"; position: absolute; z-index: 1; top: -8px; left: 50%; width: 46px; height: 13px; translate: -50% 0; rotate: -5deg; background: var(--tape); opacity: .93; }\nfigure:nth-of-type(even)::before { rotate: 4deg; background: #ffb3cfdd; }\nfigcaption { font: 12px/1.3 var(--mono); margin-top: .4em; width: 0; min-width: 100%; } /* wraps at the photo's width */\n\n/* rows of side-by-side bits that fall into one column on a phone */\n.row { display: flex; flex-wrap: wrap; gap: 36px clamp(28px, 4vw, 64px); margin: 0 0 40px; }\n.row > * { flex: 1 1 18em; max-width: 36em; min-width: 0; container-type: inline-size; } /* so drawings can size themselves to their column (cqw) */\n\n/* the ascii drawings. pure ascii in a monospace font so everything lines up */\n.art { font: 14px/1.15 var(--mono); margin: 0; color: var(--sky); }\n.p { color: var(--pink); }\n.b { color: var(--sky); }\n.g { color: var(--leaf); }\n.y { color: var(--gold); }\n.i { color: var(--ink); }\n.w { color: #a796b3; } /* brick + concrete */\n.c { color: #c3c6d1; } /* chrome, for drawings on black */\n\n.name { font-size: min(17px, 100cqw / 32); } /* shrinks to fit its column */\n.doodles { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 24px 48px; margin-top: 36px; }\n.doodles .art { font-size: 15px; }\n.bus { margin-bottom: 12px; font-size: min(14px, 100cqw / 23); position: relative; }\n\n/* someone's tagged the bus window. pinned to the drawing's own character grid so it moves with it */\n.bus .tag { position: absolute; left: 2.4em; top: 3.05em; /* in the tag's own em (1.85x the drawing), so about col 7, row 5 */ font: italic 900 1.85em/1 var(--marker); color: var(--ink); letter-spacing: -.06em; rotate: -9deg; opacity: .82; pointer-events: none; }\n.bus .tag i { font-style: normal; color: var(--pink); font-size: .6em; }\n\n/* the cables + garden run right to the edge of the screen, and get cut off there */\n.cable, .garden { overflow: hidden; margin: 8px calc(-1 * var(--edge)) 44px; padding: 0 var(--edge); }\n.cable.flip { display: flex; justify-content: flex-end; } /* this one comes in from the left */\n.cable.flip pre { flex: none; }\n.garden { margin-bottom: 0; padding: 0; }\n\n/* little jokes */\n.mac .h, .ding { visibility: hidden; }\n.mac .h { display: none; }\n.mac:hover .a { display: none; }\n.mac:hover .h { display: inline; visibility: visible; }\n.bus:hover .ding { visibility: visible; }\n\n.new { background: var(--butter); padding: 14px 18px 4px; align-self: flex-start; --hl: #fff; position: relative; margin-top: 30px; }\n.new::before { content: \"\"; position: absolute; top: -9px; left: 22px; width: 92px; height: 18px; background: var(--tape); rotate: -3deg; } /* taped up */\ndetails { background: var(--blush); padding: 12px 16px; align-self: flex-start; }\nsummary { cursor: pointer; color: var(--pink); }\ndetails p { margin: .8em 0 0; }\n\n/* ---------- sticker slaps ---------- */\n.slaps { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; }\n.hello { width: 208px; background: var(--pink); border-radius: 12px; padding: 8px 8px 10px; text-align: center; color: #fff; rotate: -4deg; box-shadow: 0 2px 5px #2e1f3a40; font-family: Arial, sans-serif; }\n.hello b { display: block; font: 900 31px/1 var(--fat); letter-spacing: .04em; }\n.hello small { display: block; font-size: 12px; font-weight: 700; margin: 3px 0 6px; }\n.hello span { display: block; background: #fff; color: var(--ink); border-radius: 4px; padding: 6px 0 12px; font: italic 900 50px/1 var(--marker); letter-spacing: -.07em; }\n.hello span i { font-style: normal; color: var(--pink); font-size: .45em; vertical-align: super; }\n.smiley { flex: none; width: 66px; height: 66px; border-radius: 50%; border: 3px solid var(--night); position: relative; rotate: 10deg; box-shadow: 0 2px 5px #2e1f3a40;\n\tbackground: radial-gradient(circle at 34% 38%, var(--night) 0 4.5px, transparent 5px), radial-gradient(circle at 66% 38%, var(--night) 0 4.5px, transparent 5px), radial-gradient(ellipse at 22% 58%, #ff8fbf 0 6px, transparent 7px), radial-gradient(ellipse at 78% 58%, #ff8fbf 0 6px, transparent 7px), var(--hazard); }\n.smiley::after { content: \"\"; position: absolute; left: 22%; right: 22%; top: 46%; height: 28%; border: 3px solid var(--night); border-top: 0; border-radius: 0 0 50% 50% / 0 0 100% 100%; }\n.caution { background: var(--hazard); color: var(--night); font: 900 12px/1.25 var(--fat); text-transform: uppercase; letter-spacing: .04em; padding: 7px 10px; border: 5px solid; border-image: var(--tape) 5; rotate: 3deg; max-width: 13em; box-shadow: 0 2px 5px #2e1f3a40; }\n\n/* ---------- warning tape across the page ---------- */\n.tape-wrap { overflow: hidden; margin: 10px calc(-1 * var(--edge)) 0; padding: 16px 0; }\n.tape { rotate: -1.4deg; margin: 0 -60px; background: var(--hazard); border-block: 3px solid var(--night); white-space: nowrap; overflow: hidden; }\n.tape.down { rotate: 1deg; }\n.track { display: inline-flex; align-items: stretch; animation: slide 60s linear infinite; }\n.tape.down .track { animation-direction: reverse; animation-duration: 80s; }\n.track span { font: 900 15px/1 var(--fat); letter-spacing: .06em; color: var(--night); padding: 7px 16px; text-transform: uppercase; }\n.track span.lc { text-transform: none; }\n.track i { width: 60px; background: var(--tape); flex: none; }\n@keyframes slide { to { transform: translateX(-50%); } }\n\n/* ---------- the black bit: kes fm ---------- */\n.band { background: radial-gradient(#a8ff1f1f 1px, transparent 1.5px) 0 0 / 22px 22px, var(--night); color: #f3ebf6; margin: 0 calc(-1 * var(--edge)); padding: 30px var(--edge) 50px; }\n.band .row { margin: 0; }\n.band .p { color: var(--hot); }\n.band .y { color: var(--hazard); }\n.band .g { color: var(--acid); }\n.band .b { color: #a9b6ff; }\n.band .i { color: #6c6475; }\n.band p { line-height: 1.55; }\n.col-deck { flex-basis: 20em; max-width: 30em; }\n.col-flyer { flex-basis: 16em; max-width: 25em; }\n\n/* a throw-up: bubble letters, white outline, yellow 3d, and a bit of overspray */\n.throw { margin: 0 0 30px; font: 900 clamp(56px, 15vw, 128px)/.95 var(--fat); letter-spacing: -.05em; color: var(--hot); text-decoration: none; isolation: auto;\n\ttext-shadow: .035em 0 #fff, .03em .0175em #fff, .0175em .03em #fff, 0 .035em #fff, -.0175em .03em #fff, -.03em .0175em #fff, -.035em 0 #fff, -.03em -.0175em #fff, -.0175em -.03em #fff, 0 -.035em #fff, .0175em -.03em #fff, .03em -.0175em #fff,\n\t\t.05em .055em var(--hazard), .065em .075em var(--hazard), .08em .095em var(--hazard), .095em .115em var(--hazard), .11em .135em #8a6f00, 0 0 .35em #ff5ea866; }\n.throw .l { display: inline-block; }\n.throw .l:nth-child(1) { rotate: -7deg; }\n.throw .l:nth-child(2) { rotate: 5deg; translate: 0 -.05em; }\n.throw .l:nth-child(3) { rotate: -3deg; translate: 0 .03em; }\n.throw .l:nth-child(5) { rotate: 6deg; translate: 0 -.04em; }\n.throw .l:nth-child(6) { rotate: -5deg; }\n.throw::after { content: \"\"; position: absolute; z-index: 1; left: .32em; top: .86em; width: .055em; height: .32em; border-radius: 0 0 .05em .05em; background: var(--hot); box-shadow: .62em -.12em 0 var(--hot), 1.38em -.06em 0 var(--hot), 1.8em -.16em 0 var(--hot), 2.5em -.09em 0 var(--hot); }\n.throw > span:first-child { display: inline-block; padding-bottom: .3em; }\n.throw small { display: block; font: 700 14px/1.5 var(--mono); letter-spacing: .03em; color: var(--acid); text-shadow: none; margin-top: 16px; max-width: 46em; }\n.throw .sticker { display: inline-block; vertical-align: top; margin: .1em 0 0 .35em; padding: .5em .7em; font: 900 13px/1.1 var(--fat); letter-spacing: .04em; text-shadow: none; color: var(--night); background: var(--acid); rotate: 8deg; border-radius: 3px; }\n\n.stencil { font: 900 21px/1.1 var(--fat); text-transform: uppercase; letter-spacing: .14em; margin: 26px 0 12px; color: transparent;\n\tbackground: linear-gradient(180deg, var(--hazard) 0 45%, transparent 45% 56%, var(--hazard) 56%); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 0 5px #ffd60a55); }\n\n.stack { font-size: min(14px, 100cqw / 23); color: #c3c6d1; }\n\n/* ---------- the deck ---------- */\n.deck { background: linear-gradient(172deg, #f7f7fb 0%, #cfd1da 28%, #9c9fac 47%, #eceef4 55%, #b6b9c4 82%, #e3e4ea 100%); border-radius: 16px; padding: 14px 14px 12px; color: var(--night);\n\tbox-shadow: inset 0 1px 0 #fff, inset 0 -2px 0 #0003, 0 8px 0 #000, 0 16px 34px #000a; font: 13px/1.35 Arial, Helvetica, sans-serif; }\n.deck-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 10px; }\n.deck-head b { font: 900 18px/1 var(--fat); letter-spacing: .05em; }\n.deck-head b i { font-style: normal; color: var(--pink); }\n.deck-head span { font: 10px var(--mono); text-transform: uppercase; letter-spacing: .1em; opacity: .7; }\n.lcd { margin: 10px 0; background: #0c1508; color: var(--acid); border-radius: 8px; padding: 10px 12px 12px; box-shadow: inset 0 2px 10px #000, 0 1px 0 #fff9; font: 14px/1.35 var(--mono); text-shadow: 0 0 6px #a8ff1f88; }\n.lcd-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }\n.lcd .freq b { font-size: 38px; letter-spacing: -.03em; }\n.lcd .pat { font-size: 12px; text-transform: uppercase; color: var(--hot); text-shadow: 0 0 6px #ff5ea888; text-align: right; }\n.lcd .mc { min-height: 2.7em; margin: 4px 0 8px; }\n.leds { display: grid; grid-template-columns: repeat(16, 1fr); gap: 3px; }\n.leds i { height: 8px; border-radius: 2px; background: #1f3017; }\n.leds i:nth-child(4n+1) { background: #33502a; }\n.leds i.on { background: var(--hot); box-shadow: 0 0 8px var(--hot); }\n.cass { display: flex; align-items: center; gap: 12px; background: #1d1722; border-radius: 10px; padding: 10px 14px; box-shadow: inset 0 2px 7px #000; }\n.reel { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 5px solid #3b3342; box-sizing: border-box;\n\tbackground: radial-gradient(circle, #1d1722 0 20%, transparent 21%), repeating-conic-gradient(#f3ebf6 0 16deg, #5a4f63 16deg 60deg); }\n.clabel { flex: 1; min-width: 0; text-align: center; background: var(--blush); color: var(--ink); border-radius: 3px; border-top: 6px solid var(--pink); padding: 4px 6px 6px; font: italic 700 17px/1.15 var(--marker); rotate: -1deg; }\n.clabel small { display: block; font: 11px/1.3 var(--mono); }\n.on .reel { animation: spin 1.8s linear infinite; }\n.rew .reel { animation: spin .3s linear infinite reverse; }\n@keyframes spin { to { transform: rotate(1turn); } }\n.keys { display: flex; flex-wrap: wrap; gap: 8px 7px; margin: 14px 0 12px; }\n.keys button { flex: 1 1 auto; min-width: 4.6em; font: 700 13px/1 Arial, Helvetica, sans-serif; color: #f3ebf6; background: linear-gradient(#3b3342, #151019); border: 0; border-radius: 5px 5px 9px 9px; padding: 11px 9px 12px; box-shadow: 0 4px 0 #000, inset 0 1px 0 #ffffff33; cursor: pointer; }\n.keys button:hover { color: var(--acid); }\n.keys button:active, .keys button.down { translate: 0 3px; box-shadow: 0 1px 0 #000, inset 0 1px 0 #ffffff33; }\n.keys button:focus-visible, .dials input:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }\n.keys .k-play { background: linear-gradient(#cbff66, #8bd80f); color: var(--night); }\n.keys .k-stop { background: linear-gradient(#ffe35c, #f2c200); color: var(--night); font-size: 14px; }\n.keys .k-play:hover, .keys .k-stop:hover { color: var(--pink); }\n.keys [aria-pressed=\"true\"] { background: linear-gradient(#ff86bd, #df3a7b); color: #fff; }\n.dials { display: flex; flex-wrap: wrap; gap: 8px 18px; font: 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; }\n.dials label { display: flex; align-items: center; gap: 8px; flex: 1 1 13em; min-width: 0; }\n.dials input { flex: 1; min-width: 0; accent-color: var(--pink); }\n.dials output { min-width: 5.5em; }\n.deck-note { font: 12px/1.45 var(--mono); margin: 10px 0 0; color: #3d3148; }\n\n/* ---------- the flyer (it's for this page. there is no rave) ---------- */\n.flyer { background: #fffdf3; color: var(--night); padding: 16px 16px 14px; border: 10px solid; border-image: var(--tape) 10; rotate: 1.3deg; box-shadow: 0 10px 28px #000c; }\n.flyer p { margin: 0; }\n.flyer .pres { font: 700 12px var(--mono); letter-spacing: .3em; text-transform: uppercase; text-align: center; }\n.flyer .chrome { font: italic 900 min(50px, 15cqw)/.95 Impact, var(--fat); text-transform: uppercase; text-align: center; margin: 6px 0 4px;\n\tbackground: var(--chrome); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 1.5px var(--night); }\n.flyer .sub { text-align: center; font-style: italic; font-size: 15px; }\n.flyer .smile { display: block; width: fit-content; margin: 10px auto 4px; font-size: 14px; color: var(--night); background: radial-gradient(ellipse closest-side, var(--hazard) 82%, transparent 84%); }\n.bill { font: 13px/1.45 var(--mono); margin: 10px 0; }\n.bill div { display: flex; align-items: baseline; }\n.bill div::before { content: \"\"; order: 1; flex: 1 1 1em; min-width: .6em; border-bottom: 2px dotted #15101966; margin: 0 5px; }\n.bill dt { order: 0; margin: 0; font-weight: 700; text-transform: uppercase; white-space: nowrap; }\n.bill dd { order: 2; margin: 0; text-align: right; overflow-wrap: anywhere; }\n.flyer .amen { font: 900 19px/1.15 var(--fat); text-align: center; color: var(--pink); margin: 12px 0 6px; letter-spacing: -.01em; }\n.flyer .fine { font: 11px/1.4 var(--mono); text-align: center; }\n\n.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }\n\nfooter { padding: 4px 0 40px; }\n\n/* in a narrow column (phones, small tablets) the name drops its heart so the letters can be bigger */\n@container (max-width: 480px) {\n\t.name { font-size: min(17px, 100cqw / 21); }\n\t.name .end { display: none; }\n}\n@media (max-width: 600px) {\n\t.doodles { gap: 20px; }\n\t.doodles .art { font-size: 12px; }\n\t.band { padding-top: 22px; }\n\t.flyer { rotate: .6deg; }\n}\n@media (prefers-reduced-motion: reduce) {\n\t.track, .on .reel, .rew .reel { animation: none; }\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv class=\"row\">\n\t\u003cdiv>\n\t\t\u003cpre class=\"art name\" aria-hidden=\"true\">\u003cspan class=p>&lt;3\u003c/span>\n\u003cspan class=p>&lt;3\u003c/span>\n\u003cspan class=p>&lt;3    &lt;3      &lt;3&lt;3&lt;3      &lt;3&lt;3&lt;3&lt;3\u003c/span>\u003cspan class=end>\u003cspan class=y>    &lt;3&lt;3  &lt;3&lt;3\u003c/span>\u003c/span>\n\u003cspan class=p>&lt;3  &lt;3      &lt;3      &lt;3  &lt;3        \u003c/span>\u003cspan class=end>\u003cspan class=y>  &lt;3&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3\u003c/span>\u003c/span>\n\u003cspan class=p>&lt;3&lt;3        &lt;3&lt;3&lt;3&lt;3&lt;3    &lt;3&lt;3&lt;3  \u003c/span>\u003cspan class=end>\u003cspan class=y>    &lt;3&lt;3&lt;3&lt;3&lt;3\u003c/span>\u003c/span>\n\u003cspan class=p>&lt;3  &lt;3      &lt;3                  &lt;3\u003c/span>\u003cspan class=end>\u003cspan class=y>      &lt;3&lt;3&lt;3\u003c/span>\u003c/span>\n\u003cspan to spell them out)\");\n\tconsole.log('big up everyone who opens devtools. try kesfm.horn() or kesfm.siren()');\n\n\tdocument.addEventListener('visibilitychange', function () {\n\t\tdocument.title = document.hidden ? 'come back ♡' : 'kes (kesia) inkersole';\n\t});\n\u003c/script>\n\n\u003cscript>\n/* ---------- kes fm: a tiny jungle machine ----------\n   web audio only. every drum, the sub, the reese, the horn and the siren are synthesised here: no samples, nothing loads.\n   it never starts by itself. play starts it, stop stops everything. */\n(() => {\n\tconst $ = id => document.getElementById(id);\n\tconst deck = $('deck');\n\tconst AC = window.AudioContext || window.webkitAudioContext;\n\tconst OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;\n\tif (!deck) return;\n\tconst leds = [...deck.querySelectorAll('.leds i')];\n\tconst ui = { mc: $('mc'), status: $('status'), freq: $('freq'), bpm: $('bpm'), patname: $('patname'), clab: $('clab'), play: $('play'), reese: $('reese'), vol: $('vol'), tune: $('tune') };\n\n\t/* the breaks: 4 bars of 16 steps. three lanes per bar: kick, snare, cymbals\n\t   kick  x = hit, o = soft\n\t   snare x = hit, m = medium, g = ghost, r = roll (two 32nds)\n\t   cymbals r = ride, h = closed hat, o = open hat, c = crash */\n\tconst BREAKS = [\n\t\t{ name: 'amen-ish', bars: [\n\t\t\t['x.x.......xx....', '....x..m.m..x..m', 'r.r.r.r.r.r.r.r.'],\n\t\t\t['x.x.......xx....', '....x..m.m..x..m', 'r.r.r.r.r.rhr.r.'],\n\t\t\t['x.x.......x.....', '....x..m.m....x.', 'r.r.r.r.r.r.r.r.'],\n\t\t\t['..xx......x.....', '.m..x..m.m....x.', 'r.r.r.r.r.c.r.r.'] ] },\n\t\t{ name: 'rollers', bars: [\n\t\t\t['x.........x.....', '....x..g.g..x..g', 'h.hhh.h.h.hhh.ho'],\n\t\t\t['x.........x.x...', '....x..g....x.g.', 'h.hhh.h.h.hhh.h.'],\n\t\t\t['x.........x.....', '....x..g.g..x..g', 'h.hhh.h.h.hhh.ho'],\n\t\t\t['x.........x..x..', '....x..g..g.x.gg', 'h.hhh.h.h.hhh.h.'] ] },\n\t\t{ name: 'half-time', bars: [\n\t\t\t['x.....x...x.....', '........x......g', 'r...r...r...r...'],\n\t\t\t['x.........x.x...', '..g.....x....g..', 'r...r...r...r.h.'],\n\t\t\t['x.....x...x.....', '........x......g', 'r...r...r...r...'],\n\t\t\t['x...x.....x.....', '..g.....x..g.xgr', 'r...r...r...r...'] ] },\n\t];\n\t// the bassline, in g minor, half-time like a dub bassline: [start step, length in steps, midi note]\n\tconst BASS = [[0, 7, 31], [10, 2, 31], [12, 4, 34], [16, 6, 36], [24, 3, 34], [28, 4, 29], [32, 7, 31], [42, 2, 38], [44, 4, 34], [48, 10, 27], [60, 4, 29]];\n\tconst bassAt = []; BASS.forEach(b => { bassAt[b[0]] = b; });\n\n\tconst SHOUTS = [\n\t\t'big up all the junglists ♡',\n\t\t'kes fm, 170.0, broadcasting from one browser tab',\n\t\t'big up everyone on bad wifi',\n\t\t'text-ins: inkersolekesia@gmail.com',\n\t\t'lorem ipsum dolor sit amen',\n\t\t'no samples. every hit made from scratch (ﾉ◕ヮ◕)ﾉ*:･ﾟ✧',\n\t\t'big up everyone reading the alt text',\n\t\t'big up LCF + CCI',\n\t\t'rewind button is right there ↓',\n\t\t'big up anyone who views source',\n\t\t'this is a website, not a radio station ✧',\n\t];\n\n\tfunction parse(br) {\n\t\tconst out = [];\n\t\tbr.bars.forEach(([K, S, C]) => {\n\t\t\tfor (let i = 0; i \u003c 16; i++) {\n\t\t\t\tconst s = { p: 1 };\n\t\t\t\tif (K[i] === 'x') s.k = 1; else if (K[i] === 'o') s.k = .6;\n\t\t\t\tif (S[i] === 'x') s.s = 1; else if (S[i] === 'm') s.s = .55; else if (S[i] === 'g') s.s = .28; else if (S[i] === 'r') { s.s = .8; s.roll = 1; }\n\t\t\t\tif (C[i] !== '.') s.h = C[i];\n\t\t\t\tout.push(s);\n\t\t\t}\n\t\t});\n\t\treturn out;\n\t}\n\tconst roll = () => [{ s: .4, roll: 1, p: 1, h: 'h' }, { s: .55, roll: 1, p: 1 }, { s: .72, roll: 1, p: 1.06, h: 'h' }, { s: .95, roll: 1, p: 1.12 }];\n\tconst pick = a => a[Math.floor(Math.random() * a.length)];\n\t// chop: rebuild the 4 bars beat by beat out of slices of the break, the way jungle producers cut breaks up\n\tfunction chop(src) {\n\t\tlet out = [];\n\t\tfor (let b = 0; b \u003c 16; b++) {\n\t\t\tconst r = Math.random();\n\t\t\tlet beat;\n\t\t\tif (b === 0) beat = src.slice(0, 4);\n\t\t\telse if (b % 4 === 3 && r \u003c .3) beat = roll();\n\t\t\telse if (r \u003c .4) beat = src.slice(b * 4, b * 4 + 4);\n\t\t\telse if (r \u003c .85) { const j = Math.floor(Math.random() * 16) * 4; beat = src.slice(j, j + 4); }\n\t\t\telse { const j = Math.floor(Math.random() * 32) * 2; const two = src.slice(j, j + 2); beat = two.concat(two); } // stutter\n\t\t\tbeat = beat.map(s => Object.assign({}, s));\n\t\t\tif (Math.random() \u003c .25) { const p = pick([.86, 1.12, 1.26]); beat.forEach(s => { if (s.s) s.p = p; }); } // re-pitched snares\n\t\t\tout = out.concat(beat);\n\t\t}\n\t\tout.splice(60, 4, ...roll()); // always land on a fill\n\t\treturn out;\n\t}\n\n\t/* ---- sound ---- */\n\tconst noises = new WeakMap();\n\tfunction noise(c) {\n\t\tlet b = noises.get(c);\n\t\tif (!b) {\n\t\t\tb = c.createBuffer(1, c.sampleRate, c.sampleRate);\n\t\t\tconst d = b.getChannelData(0);\n\t\t\tfor (let i = 0; i \u003c d.length; i++) d[i] = Math.random() * 2 - 1;\n\t\t\tnoises.set(c, b);\n\t\t}\n\t\treturn b;\n\t}\n\tconst curves = {};\n\tfunction curve(k) {\n\t\tif (!curves[k]) {\n\t\t\tconst a = new Float32Array(1024);\n\t\t\tfor (let i = 0; i \u003c 1024; i++) { const x = i / 1023 * 2 - 1; a[i] = Math.tanh(k * x) / Math.tanh(k); }\n\t\t\tcurves[k] = a;\n\t\t}\n\t\treturn curves[k];\n\t}\n\tfunction burst(c, out, t, v, dur, type, f, q) {\n\t\tconst s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();\n\t\ts.buffer = noise(c); fl.type = type; fl.frequency.value = f; if (q) fl.Q.value = q;\n\t\tg.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);\n\t\ts.connect(fl).connect(g).connect(out);\n\t\ts.start(t, Math.random() * .8); s.stop(t + dur + .02);\n\t}\n\tfunction tone(c, out, t, type, f1, f2, v, dur) {\n\t\tconst o = c.createOscillator(), g = c.createGain();\n\t\to.type = type;\n\t\to.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur * .5);\n\t\tg.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);\n\t\to.connect(g).connect(out); o.start(t); o.stop(t + dur + .02);\n\t}\n\tfunction kick(c, out, t, v) {\n\t\tconst o = c.createOscillator(), g = c.createGain();\n\t\to.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(48, t + .08);\n\t\tg.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .004); g.gain.exponentialRampToValueAtTime(.0001, t + .3);\n\t\to.connect(g).connect(out); o.start(t); o.stop(t + .32);\n\t\tburst(c, out, t, v * .3, .015, 'highpass', 3000);\n\t}\n\tfunction snare(c, out, t, v, p) {\n\t\tp = p || 1;\n\t\ttone(c, out, t, 'triangle', 250 * p, 185 * p, v * .75, .12);\n\t\ttone(c, out, t, 'sine', 340 * p, 330 * p, v * .2, .18); // the ring\n\t\tburst(c, out, t, v * .95, .19, 'bandpass', 3000 * p, .6);\n\t\tburst(c, out, t, v * .45, .08, 'highpass', 7000);\n\t}\n\tfunction metal(c, out, t, v, dur, hp) {\n\t\tconst g = c.createGain(), bp = c.createBiquadFilter(), hf = c.createBiquadFilter();\n\t\tbp.type = 'bandpass'; bp.frequency.value = 9000; bp.Q.value = .8;\n\t\thf.type = 'highpass'; hf.frequency.value = hp;\n\t\tg.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .002); g.gain.exponentialRampToValueAtTime(.0001, t + dur);\n\t\tg.connect(bp).connect(hf).connect(out);\n\t\t[205.3, 304.4, 369.6, 522.7, 540, 800].forEach(f => {\n\t\t\tconst o = c.createOscillator(); o.type = 'square'; o.frequency.value = f * 1.6;\n\t\t\to.connect(g); o.start(t); o.stop(t + dur + .02);\n\t\t});\n\t}\n\tconst ride = (c, out, t, v) => { metal(c, out, t, v * .5, .3, 6000); burst(c, out, t, v * .35, .22, 'highpass', 8000); };\n\tconst hat = (c, out, t, v, dur) => burst(c, out, t, v, dur, 'highpass', 8000);\n\tconst crash = (c, out, t, v) => { metal(c, out, t, v * .6, 1.4, 4000); burst(c, out, t, v * .7, 1.3, 'highpass', 5000); };\n\n\tfunction bassNote(c, n, t, dur, midi) {\n\t\tconst f = 440 * Math.pow(2, (midi - 69) / 12), end = t + dur;\n\t\tconst env = (g, peak, a) => { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.setValueAtTime(peak, end - .05); g.gain.exponentialRampToValueAtTime(.0001, end); };\n\t\t// the sub: a sine that drops into the note, and sags a little at the end of long ones\n\t\tconst o = c.createOscillator(), g = c.createGain();\n\t\to.frequency.setValueAtTime(f * 1.25, t); o.frequency.exponentialRampToValueAtTime(f, t + .06);\n\t\tif (dur > .5) { o.frequency.setValueAtTime(f, end - .14); o.frequency.exponentialRampToValueAtTime(f * .94, end); }\n\t\tenv(g, .9, .01); o.connect(g).connect(n.bass); o.start(t); o.stop(end + .02);\n\t\t// an octave up, quietly, so laptop speakers can hear the line\n\t\tconst h = c.createOscillator(), hg = c.createGain(); h.type = 'triangle';\n\t\th.frequency.setValueAtTime(f * 2.5, t); h.frequency.exponentialRampToValueAtTime(f * 2, t + .06);\n\t\tenv(hg, .16, .01); h.connect(hg).connect(n.bass); h.start(t); h.stop(end + .02);\n\t\tif (reese) {\n\t\t\t// two detuned saws through a moving filter: the reese\n\t\t\tconst rg = c.createGain(); env(rg, .8, .03); rg.connect(n.reese);\n\t\t\t[-15, 14].forEach(d => {\n\t\t\t\tconst s = c.createOscillator(); s.type = 'sawtooth'; s.frequency.value = f * 2; s.detune.value = d;\n\t\t\t\ts.connect(rg); s.start(t); s.stop(end + .02);\n\t\t\t});\n\t\t}\n\t}\n\n\t// the mixer. built once for the speakers, and again inside an offline context for the rewind\n\tfunction build(c, dest) {\n\t\tconst n = {};\n\t\tn.mix = c.createGain();\n\t\tn.comp = c.createDynamicsCompressor();\n\t\tn.comp.threshold.value = -14; n.comp.knee.value = 10; n.comp.ratio.value = 4; n.comp.attack.value = .004; n.comp.release.value = .15;\n\t\tn.mix.connect(n.comp).connect(dest);\n\t\tn.drums = c.createGain(); n.drums.gain.value = .8;\n\t\tconst grit = c.createWaveShaper(); grit.curve = curve(1.8); // a bit of crunch, like a break sampled off vinyl\n\t\tconst top = c.createBiquadFilter(); top.type = 'lowpass'; top.frequency.value = 12000;\n\t\tn.drums.connect(grit).connect(top).connect(n.mix);\n\t\tn.bass = c.createGain(); n.bass.gain.value = .6; n.bass.connect(n.mix);\n\t\tn.reese = c.createGain(); n.reese.gain.value = .3;\n\t\tconst rs = c.createWaveShaper(); rs.curve = curve(2.5);\n\t\tconst rf = c.createBiquadFilter(); rf.type = 'lowpass'; rf.frequency.value = 560; rf.Q.value = 7;\n\t\tn.lfo = c.createOscillator(); n.lfo.frequency.value = .21;\n\t\tconst lg = c.createGain(); lg.gain.value = 380; n.lfo.connect(lg).connect(rf.frequency); n.lfo.start();\n\t\tconst ro = c.createGain(); ro.gain.value = .6;\n\t\tn.reese.connect(rs).connect(rf).connect(ro).connect(n.mix);\n\t\t// dub echo, for the horn and the siren\n\t\tn.fx = c.createGain(); n.fx.connect(n.mix);\n\t\tn.dl = c.createDelay(2); n.dl.delayTime.value = .75 * 60 / bpm;\n\t\tconst fb = c.createGain(); fb.gain.value = .42;\n\t\tconst df = c.createBiquadFilter(); df.type = 'bandpass'; df.frequency.value = 1400; df.Q.value = .5;\n\t\tconst wet = c.createGain(); wet.gain.value = .5;\n\t\tn.fx.connect(n.dl); n.dl.connect(df).connect(fb).connect(n.dl); df.connect(wet).connect(n.mix);\n\t\treturn n;\n\t}\n\n\tfunction hit(c, n, s, t, sd) {\n\t\tconst hu = () => .88 + Math.random() * .12; // a bit of human\n\t\tif (s.k) kick(c, n.drums, t, s.k * hu());\n\t\tif (s.s) {\n\t\t\tif (s.roll) { snare(c, n.drums, t, s.s * .62, s.p); snare(c, n.drums, t + sd / 2, s.s * .8, s.p); }\n\t\t\telse snare(c, n.drums, t, s.s * hu(), s.p);\n\t\t}\n\t\tif (s.h === 'r') ride(c, n.drums, t, .22 * hu());\n\t\telse if (s.h === 'h') hat(c, n.drums, t, .16 * hu(), .035);\n\t\telse if (s.h === 'o') hat(c, n.drums, t, .15, .16);\n\t\telse if (s.h === 'c') crash(c, n.drums, t, .3);\n\t}\n\tfunction bassStep(c, n, i, t, sd) { const b = bassAt[i]; if (b) bassNote(c, n, t, b[1] * sd - .01, b[2]); }\n\n\t/* ---- state ---- */\n\tlet ac = null, vol = null, live = null, timer = 0, rewTimer = 0;\n\tlet playing = false, rewinding = false, crashNext = false, rafOn = false;\n\tlet step = 0, nextT = 0, bpm = 170, which = 0, chopped = false, reese = false, shoutI = 0;\n\tlet steps = parse(BREAKS[0]);\n\tconst queue = [];\n\tconst level = () => { const v = ui.vol.value / 100; return v * v * LEVEL; };\n\tconst LEVEL = .85; // full volume peaks just under 0dB; the default (50) sits around -12dB\n\n\tfunction ensure() {\n\t\tif (!AC) { say(\"this browser can't do web audio, sorry ♡\"); return false; }\n\t\ttry {\n\t\t\tif (!ac) {\n\t\t\t\tac = new AC();\n\t\t\t\tvol = ac.createGain(); vol.gain.value = level(); vol.connect(ac.destination);\n\t\t\t\tlive = build(ac, vol);\n\t\t\t}\n\t\t\tif (ac.state === 'suspended') ac.resume();\n\t\t\treturn true;\n\t\t} catch (e) { say(\"couldn't start the audio, sorry ♡\"); return false; }\n\t}\n\tconst say = t => { ui.mc.textContent = t; };\n\tconst status = t => { ui.status.textContent = t; };\n\tfunction label() {\n\t\tconst nm = BREAKS[which].name + (chopped ? ' ✂' : '');\n\t\tui.patname.textContent = nm;\n\t\tui.clab.textContent = nm + ' · ' + bpm + ' bpm' + (reese ? ' · reese' : '');\n\t}\n\tfunction playingStatus() { status('playing ' + BREAKS[which].name + (chopped ? ', chopped' : '') + ' at ' + bpm + ' bpm. the yellow stop button stops everything.'); }\n\n\tfunction tick() {\n\t\tconst sd = 60 / bpm / 4;\n\t\twhile (nextT \u003c ac.currentTime + .12) {\n\t\t\thit(ac, live, steps[step], nextT, sd);\n\t\t\tif (crashNext && step === 0) { crash(ac, live.drums, nextT, .32); crashNext = false; }\n\t\t\tbassStep(ac, live, step, nextT, sd);\n\t\t\tqueue.push([step, nextT]);\n\t\t\tnextT += sd;\n\t\t\tstep = (step + 1) % 64;\n\t\t}\n\t}\n\tfunction run() { nextT = ac.currentTime + .06; clearInterval(timer); timer = setInterval(tick, 25); tick(); }\n\tfunction draw() {\n\t\tif (!playing) { rafOn = false; leds.forEach(l => l.classList.remove('on')); return; }\n\t\tlet cur = null;\n\t\twhile (queue.length && queue[0][1] \u003c= ac.currentTime)
