0; i \u003c n; i++) { var x = i / (n - 1) * 2 - 1; c[i] = Math.tanh(k * x) / Math.tanh(k); }\n    return c;\n  }\n  function level() { return 0.75 * vol * vol; }\n\n  function boot() {\n    if (ctx) return;\n    ctx = new AC();\n    out = ctx.createGain();\n    master = ctx.createGain(); master.gain.value = level();\n    var comp = ctx.createDynamicsCompressor();\n    comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.12;\n    analyser = ctx.createAnalyser(); analyser.fftSize = 1024; wave = new Uint8Array(analyser.fftSize);\n    master.connect(comp); comp.connect(out); out.connect(analyser); analyser.connect(ctx.destination);\n\n    // drums go through a bit of grit and a slightly dark filter, like an old sampler\n    var grit = ctx.createWaveShaper(); grit.curve = drive(2.4); grit.oversample = '2x';\n    var dark = ctx.createBiquadFilter(); dark.type = 'lowpass'; dark.frequency.value = 11000;\n    drums = ctx.createGain(); drums.gain.value = 0.8;\n    drums.connect(grit); grit.connect(dark); dark.connect(master);\n\n    // reese: a resonant lowpass that drifts open and shut\n    bassF = ctx.createBiquadFilter(); bassF.type = 'lowpass'; bassF.frequency.value = 520; bassF.Q.value = 5;\n    var lfo = ctx.createOscillator(), depth = ctx.createGain();\n    lfo.frequency.value = 0.23; depth.gain.value = 300;\n    lfo.connect(depth); depth.connect(bassF.frequency); lfo.start();\n    var growl = ctx.createWaveShaper(); growl.curve = drive(1.6);\n    reeseBus = ctx.createGain();\n    bassF.connect(growl); growl.connect(reeseBus); reeseBus.connect(master);\n    subBus = ctx.createGain(); subBus.connect(master);\n\n    noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);\n    var d = noise.getChannelData(0);\n    for (var i = 0; i \u003c d.length; i++) d[i] = Math.random() * 2 - 1;\n  }\n\n  function env(g, t, peak, attack, decay) {\n    g.gain.setValueAtTime(0.0001, t);\n    g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + attack);\n    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);\n  }\n  function hiss(t, v, type, f, q, dur) {\n    var s = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();\n    s.buffer = noise; fl.type = type; fl.frequency.value = f; fl.Q.value = q;\n    env(g, t, v, 0.002, dur);\n    s.connect(fl); fl.connect(g); g.connect(drums);\n    s.start(t, Math.random() * 0.6); s.stop(t + dur + 0.05);\n  }\n\n  /* the kit */\n  function kick(t, v) {\n    var o = ctx.createOscillator(), g = ctx.createGain();\n    o.frequency.setValueAtTime(170, t);\n    o.frequency.exponentialRampToValueAtTime(55, t + 0.06);\n    o.frequency.exponentialRampToValueAtTime(42, t + 0.25);\n    env(g, t, v, 0.003, 0.26);\n    o.connect(g); g.connect(drums); o.start(t); o.stop(t + 0.32);\n    hiss(t, v * 0.3, 'bandpass', 3200, 1, 0.012);\n  }\n  function snare(t, v) {\n    hiss(t, v * 0.85, 'bandpass', 1700, 0.6, v > 0.6 ? 0.2 : 0.09);\n    hiss(t, v * 0.45, 'highpass', 6000, 0.7, 0.08);\n    var o = ctx.createOscillator(), g = ctx.createGain();\n    o.type = 'triangle';\n    o.frequency.setValueAtTime(230, t); o.frequency.exponentialRampToValueAtTime(170, t + 0.05);\n    env(g, t, v * 0.7, 0.002, 0.07);\n    o.connect(g); g.connect(drums); o.start(t); o.stop(t + 0.12);\n  }\n  function hat(t, v, open) { hiss(t, v * 0.32, 'highpass', 8000, 0.8, open ? 0.2 : 0.035); }\n  var METAL = [263, 400, 421, 474, 587, 845];\n  function ride(t, v, crash) {\n    var bp = ctx.createBiquadFilter(), hp = ctx.createBiquadFilter(), g = ctx.createGain(), dur = crash ? 1.1 : 0.32;\n    bp.type = 'bandpass'; bp.frequency.value = 9500; bp.Q.value = 0.6;\n    hp.type = 'highpass'; hp.frequency.value = 6000;\n    env(g, t, v * (crash ? 0.16 : 0.09), 0.002, dur);\n    METAL.forEach(function (f) {\n      var o = ctx.createOscillator(); o.type = 'square'; o.frequency.value = f * 1.9;\n      o.connect(bp); o.start(t); o.stop(t + dur + 0.05);\n    });\n    bp.connect(hp); hp.connect(g); g.connect(drums);\n    if (crash) hiss(t, v * 0.25, 'highpass', 5000, 0.5, 0.9);\n  }\n\n  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }\n  function bassNote(t, m, dur) {\n    var f = mtof(m), end = t + dur;\n    var s = ctx.createOscillator(), sg = ctx.createGain();\n    s.frequency.value = f;\n    sg.gain.setValueAtTime(0.0001, t); sg.gain.exponentialRampToValueAtTime(0.42, t + 0.012);\n    sg.gain.setValueAtTime(0.42, end - 0.03); sg.gain.exponentialRampToValueAtTime(0.0001, end);\n    s.connect(sg); sg.connect(subBus); s.start(t); s.stop(end + 0.02);\n    if (bassMode !== 0) return;\n    var g = ctx.createGain();\n    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2, t + 0.02);\n    g.gain.setValueAtTime(0.2, end - 0.04); g.gain.exponentialRampToValueAtTime(0.0001, end);\n    [-11, 11].forEach(function (c) {\n      var o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f * 2; o.detune.value = c;\n      o.connect(g); o.start(t); o.stop(end + 0.02);\n    });\n    g.connect(bassF);\n  }\n\n  /* chop: every bar, shuffle which slice of the break plays on each step */\n  function makeChop() {\n    var m = [0];\n    for (var i = 1; i \u003c 16; i++) {\n      var r = Math.random();\n      m[i] = r \u003c 0.4 ? i : r \u003c 0.58 ? m[i - 1] : (Math.random() * 16) | 0;\n    }\n    return m;\n  }\n\n  function playStep(s, t) {\n    var b = s >> 4, i = s & 15, bar = PATS[pat][b];\n    if (i === 0) chopMap = chop ? makeChop() : null;\n    var j = chopMap ? chopMap[i] : i, glyph = '.', k = false;\n    if (chop && b === 3 && i >= 12) {\n      // snare roll into the next four\n      var v = 0.35 + (i - 12) * 0.18;\n      snare(t, v); snare(t + STEP / 2, v + 0.08);\n      glyph = '#';\n    } else {\n      var kc = bar.k[j], sc = bar.s[j], rc = bar.r ? bar.r[j] : '.', hc = bar.h ? bar.h[j] : '.';\n      if (kc === 'x') { kick(t, 0.95); k = true; glyph = 'o'; }\n      if (sc === 'X') { snare(t, 0.95); glyph = 'X'; }\n      else if (sc === 'x') { snare(t, 0.38); if (glyph === '.') glyph = 'x'; }\n      if (rc === 'x') ride(t, 0.9); else if (rc === 'c') ride(t, 1, true);\n      if (hc === 'x') hat(t, j % 2 ? 0.55 : 1); else if (hc === 'o') hat(t, 1, true);\n      if (glyph === '.' && (rc !== '.' || hc !== '.')) glyph = '-';\n    }\n    if (bassMode \u003c 2 && BASS[s]) bassNote(t, BASS[s][1], BASS[s][2] * STEP);\n    queue.push({ s: s, t: t, g: glyph, k: k });\n  }\n\n  function sched() {\n    var ahead = document.hidden ? 1.5 : 0.12;\n    while (nextT \u003c ctx.currentTime + ahead) {\n      playStep(step, nextT);\n      nextT += STEP;\n      step = (step + 1) % 64;\n    }\n  }\n\n  /* the horn. three blasts, slightly out of tune with itself */\n  function horn() {\n    var t = ctx.currentTime + 0.02;\n    var sh = ctx.createWaveShaper(), bp = ctx.createBiquadFilter(), g = ctx.createGain();\n    sh.curve = drive(3); bp.type = 'bandpass'; bp.frequency.value = 1400; bp.Q.value = 0.7;\n    g.gain.value = 0;\n    sh.connect(bp); bp.connect(g); g.connect(master);\n    [[0, 0.11], [0.15, 0.11], [0.3, 0.62]].forEach(function (h) {\n      var st = t + h[0], en = st + h[1];\n      g.gain.setValueAtTime(0, st); g.gain.linearRampToValueAtTime(0.22, st + 0.012);\n      g.gain.setValueAtTime(0.22, en - 0.03); g.gain.linearRampToValueAtTime(0, en);\n      [0, 9, -7, 1203].forEach(function (c) {\n        var o = ctx.createOscillator(); o.type = 'sawtooth'; o.detune.value = c;\n        o.frequency.setValueAtTime(560, st); o.frequency.exponentialRampToValueAtTime(466, st + 0.05);\n        o.connect(sh); o.start(st); o.stop(en + 0.02);\n      });\n    });\n    return t + 1;\n  }\n\n  /* the rewind: a wobbly, falling whoosh, like the record being dragged back */\n  function rewindFx(t) {\n    var dur = 1.15, n = 300, fc = new Float32Array(n), pc = new Float32Array(n);\n    for (var i = 0; i \u003c n; i++) {\n      var x = i / (n - 1), w = 1 + 0.55 * Math.sin(2 * Math.PI * (6 * x + 9 * x * x));\n      fc[i] = 300 + 2600 * Math.pow(1 - x, 1.6) * w;\n      pc[i] = 40 + 260 * Math.pow(1 - x, 1.4) * w;\n    }\n    var s = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), o = ctx.createOscillator(), og = ctx.createGain(), g = ctx.createGain();\n    s.buffer = noise; s.loop = true;\n    bp.type = 'bandpass'; bp.Q.value = 2.5; bp.frequency.setValueCurveAtTime(fc, t, dur);\n    o.type = 'sawtooth'; o.frequency.setValueCurveAtTime(pc, t, dur); og.gain.value = 0.35;\n    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.9, t + 0.03);\n    g.gain.setValueAtTime(0.9, t + dur * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);\n    s.connect(bp); o.connect(og); og.connect(bp); bp.connect(g); g.connect(master);\n    s.start(t); s.stop(t + dur + 0.05); o.start(t); o.stop(t + dur + 0.05);\n  }\n\n  function wake() {\n    boot();\n    clearTimeout(sleepT);\n    if (ctx.state === 'suspended') ctx.resume();\n    out.gain.cancelScheduledValues(ctx.currentTime);\n    out.gain.setValueAtTime(1, ctx.currentTime);\n  }\n  function snooze(after) {\n    clearTimeout(sleepT);\n    sleepT = setTimeout(function () { if (!playing && ctx) ctx.suspend(); }, after);\n  }\n\n  function play() {\n    wake();\n    if (playing) return;\n    playing = true;\n    var now = ctx.currentTime;\n    [[drums, 0.8], [reeseBus, 1], [subBus, 1]].forEach(function (p) { p[0].gain.cancelScheduledValues(now); p[0].gain.setValueAtTime(p[1], now); });\n    step = 0; bars = 0; queue = []; rewindUntil = 0; nextT = now + 0.08;\n    cells.forEach(function (c) { c.textContent = '.'; c.className = ''; });\n    sched();\n    timer = setInterval(sched, 25);\n    say('ヽ(⌐■_■)ノ♪ you\\'re tuned to kes fm 170.0. big up all the junglists');\n    tell('playing');\n    ui(); loop();\n  }\n  function stop() {\n    if (!ctx || !playing) return;\n    playing = false;\n    clearInterval(timer);\n    out.gain.setTargetAtTime(0, ctx.currentTime, 0.02);\n    queue = []; quietAt = ctx.currentTime + 0.6;\n    say('(˘ω˘) off air. thanks for listening x');\n    tell('stopped');\n    ui(); snooze(700);\n  }\n  function pullUp() {\n    if (!playing) { say('(・・ ) nothing to pull up yet. press play first'); return; }\n    var t = ctx.currentTime + 0.01, back = t + STEP * 16;\n    [[drums, 0.8], [reeseBus, 1], [subBus, 1]].forEach(function (p) {\n      p[0].gain.cancelScheduledValues(t);\n      p[0].gain.setTargetAtTime(0, t, 0.015);\n      p[0].gain.setValueAtTime(p[1], back - 0.005);\n    });\n    rewindFx(t);\n    queue = queue.filter(function (q) { return q.t \u003c t; });\n    step = 0; nextT = back; rewindUntil = back;\n    say('◀◀ pull up! from the top ┌(・。・)┘♪');\n  }\n\n  function ui() {\n    playKey.setAttribute('aria-pressed', playing ? 'true' : 'false');\n    airEl.textContent = playing ? '● on air' : '● off air';\n    airEl.classList.toggle('live', playing);\n    if (!document.hidden) document.title = playing ? '♪ kes fm 170.0 ♡' : homeTitle;\n  }\n\n  function pad(n) { return ('00' + n).slice(-3); }\n  function loop() {\n    cancelAnimationFrame(raf);\n    raf = requestAnimationFrame(draw);\n  }\n  function draw() {\n    var now = ctx.currentTime;\n    while (queue.length && queue[0].t \u003c= now) {\n      var q = queue.shift(), c = cells[q.s & 15];\n      if (lastCell) lastCell.className = '';\n      c.textContent = q.g; c.className = 'now'; lastCell = c;\n      if (now >= rewindUntil) { rot = (rot + 1) % 4; reels.forEach(function (r) { r.textContent = spin[rot]; }); }\n      if (q.k) { cones.forEach(function (e) { e.classList.add('on'); }); coneOff = now + 0.08; }\n      if ((q.s & 15) === 0) {\n        bars++; barEl.textContent = pad(bars % 1000);\n        if (bars > 1 && bars % 8 === 1) { say(FACES[lineN % FACES.length] + ' ' + LINES[lineN % LINES.length]); lineN++; }\n      }\n    }\n    if (now \u003c rewindUntil) { rot = (rot + 3) % 4; reels.forEach(function (r) { r.textContent = spin[rot]; }); }\n    i \u003clink rel=\"icon\" href=\"/favicon.ico\" sizes=\"any\">\n\u003cmeta property=\"og:type\" content=\"website\">\n\u003cmeta property=\"og:title\" content=\"kes inkersole\">\n\u003cmeta property=\"og:description\" content=\"kes inkersole — freelance creative strategist & internet equalities researcher, based in london.\">\n\u003cmeta property=\"og:image\" content=\"https://kesia-coral.vercel.app/square.png\">\n\u003cmeta property=\"og:url\" content=\"https://kesia-coral.vercel.app\">\n\u003cmeta name=\"twitter:card\" content=\"summary_large_image\">\n\u003cmeta name=\"twitter:title\" content=\"kes inkersole\">\n\u003cmeta name=\"twitter:description\" content=\"kes inkersole — freelance creative strategist & internet equalities researcher, based in london.\">\n\u003cmeta name=\"twitter:image\" content=\"https://kesia-coral.vercel.app/square.png\">\n\u003cstyle>\n/* the cute colours from before, plus the rave ones: black, warning yellow, acid green, chrome */\n:root {\n  --paper: #fffaf4;\n  --ink: #241b2b;\n  --night: #0e0b10;\n  --pink: #c92f6b;\n  --rose: #f0508a;\n  --blue: #3434d0;\n  --plum: #8a3cc0;\n  --butter: #ffe36b;\n  --yellow: #ffd60a;\n  --acid: #b8ff1f;\n  --gold: #e3a500;\n  --cream-butter: #fff5c4;\n  --cream-pink: #ffe8f0;\n  --gut: 3vw;\n  --mono: ui-monospace, Menlo, Monaco, Consolas, \"Liberation Mono\", \"Courier New\", monospace;\n  --loud: Impact, Haettenschweiler, \"Arial Narrow Bold\", \"Arial Black\", sans-serif;\n  --hazard: repeating-linear-gradient(-45deg, var(--night) 0 10px, var(--yellow) 10px 20px);\n  --chrome: linear-gradient(180deg, #fff 0%, #e8edf3 26%, #97a2b0 46%, #2c333c 50%, #6f7a88 57%, #d9e0e8 76%, #fff 100%);\n}\nhtml { background: var(--paper); }\nbody {\n  margin: 0;\n  padding: 0 var(--gut) 40px;\n  color: var(--ink);\n  font: 19px/1.45 Times, \"Times New Roman\", serif;\n  overflow-wrap: break-word;\n}\n::selection { background: var(--acid); color: var(--night); }\n\na { color: var(--blue); text-underline-offset: 2px; ose); }\n\n/* the keys never make the deck wider than the boombox */\n.keys { display: grid; gap: 12px; margin-top: 18px; width: 0; min-width: 100%; }\n.keys .row { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; }\n.keys .lab { width: 4.6em; font: 12px/1 var(--mono); color: #a99fb8; }\n.key {\n  padding: 9px 11px 8px;\n  font: bold 13px/1 var(--mono);\n  color: var(--night);\n  background: linear-gradient(#ffffff, #e4e9ee 45%, #c3cbd4 55%, #eef1f4);\n  border: 2px solid #000;\n  border-radius: 6px;\n  box-shadow: 0 4px 0 #000;\n  cursor: pointer;\n}\n.key:hover { background: var(--butter); }\n.key:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; }\n.key[aria-pressed=\"true\"] { background: var(--yellow); }\n.key.play, .key.stop { padding: 11px 18px 10px; font-size: 16px; }\n.key.play { background: var(--acid); }\n.key.play[aria-pressed=\"true\"] { transform: translateY(3px); box-shadow: 0 1px 0 #000; }\n.key.stop { background: var(--rose); color: #fff; }\n.key:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }\n.sliders label { display: inline-flex; align-items: center; gap: 7px; margin-right: 12px; font: 13px var(--mono); color: #d9d2e6; }\n.sliders input { width: 110px; accent-color: var(--acid); }\n\n.lcd { padding: 12px 14px 8px; background: #070a06; border: 2px solid #2b2f2a; border-radius: 10px; color: var(--acid); font: 14px/1.5 var(--mono); }\n.lcd p { margin: 0 0 7px; }\n.lcd b { color: #fff; font-weight: normal; }\n.onair { color: #4d5249; }\nhtml.on-air .onair { color: var(--rose); }\n@media (prefers-reduced-motion: no-preference) { html.on-air .onair { animation: onair 0.706s steps(1) infinite; } }\n@keyframes onair { 50% { opacity: 0.35; } }\n.dance { float: right; color: var(--rose); }\n.shout { min-height: 3em; color: var(--yellow); }\n.trk { margin: 12px 0 0; padding: 10px 14px; background: #070a06; border: 2px solid #2b2f2a; border-radius: 10px; color: var(--acid); font: 14px/1.35 var(--mono); }\n.trk .hd { color: #8d9488; }\n.trk i { font-style: normal; color: #3f4b38; }\n.trk .now { display: inline-block; min-width: 100%; background: var(--acid); color: var(--night); }\n.trk .now i { color: #42620a; }\n@media (prefers-reduced-motion: no-preference) { .fm.pulling .boombox { animation: wobble 0.12s linear infinite; } }\n@keyframes wobble { 50% { transform: translateX(-2px) rotate(-0.4deg); } }\n.trk-note { margin: 8px 0 0; font-size: 15px; color: #bdb4cc; }\n\n/* the flyer for this website */\n.flyer { position: relative; margin: 8px 8px 0 0; padding: 20px 20px 18px; background: var(--yellow); color: var(--night); transform: rotate(1.8deg); box-shadow: 8px 10px 0 rgba(0, 0, 0, 0.55); font: 15px/1.35 Arial, Helvetica, sans-serif; }\n.flyer p { margin: 0 0 10px; }\n.flyer .presents { font: bold 12px/1.2 Arial, Helvetica, sans-serif; letter-spacing: 0.22em; text-transform: uppercase; }\n.flyer .big { margin: 4px 0 12px; font: 62px/0.86 var(--loud); text-transform: uppercase; }\n.flyer .big .chrome { -webkit-text-stroke: 0.03em var(--night); filter: drop-shadow(0.05em 0.05em 0 var(--rose)); }\n.flyer .sub { font: italic 17px/1.3 Times, serif; }\n.flyer ul { margin: 0 0 12px; padding: 0; list-style: none; border-top: 3px solid var(--night); }\n.flyer li, .flyer li:hover { margin: 0; padding: 5px 0; list-style: none; border-bottom: 1px solid rgba(14, 11, 16, 0.35); }\n.flyer li b { margin-right: 0.35em; font: 16px/1 var(--loud); font-weight: normal; letter-spacing: 0.03em; text-transform: uppercase; }\n.flyer a, .flyer a:visited { color: var(--night); text-decoration-color: var(--pink); text-decoration-thickness: 2px; }\n.flyer .small { margin: 0; font: 11px/1.45 Arial, Helvetica, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; }\n\n/* acid house smiley, but blushing */\n.smiley { position: absolute; width: 64px; height: 64px; border: 3px solid var(--night); border-radius: 50%; background: radial-gradient(circle at 22% 64%, var(--rose) 0 5px, transparent 6px), radial-gradient(circle at 78% 64%, var(--rose) 0 5px, transparent 6px), var(--yellow); }\n.smiley::before { content: \"\"; position: absolute; left: 19px; top: 17px; width: 6px; height: 12px; border-radius: 50%; background: var(--night); box-shadow: 18px 0 0 var(--night); }\n.smiley::after { content: \"\"; position: absolute; left: 12px; right: 12px; top: 14px; bottom: 11px; border: 4px solid transparent; border-bottom-color: var(--night); border-radius: 50%; }\n.flyer .smiley { right: -16px; top: -24px; transform: rotate(14deg); }\n\n/* ---------- the rest of the page ---------- */\n.lists { columns: 4 15em; column-gap: 3vw; margin: 0 0 40px; font-size: 18px; }\n.lists > div { break-inside: avoid; margin-bottom: 30px; }\n\n/* photos, wheatpasted with whatever tape was in the bag */\n.photos { position: relative; display: flex; gap: 18px; align-items: flex-start; margin: 0 0 48px; padding-top: 12px; }\nfigure { position: relative; flex: 1.333 1 0; margin: 0; min-width: 0; }\nfigure.tall { flex-grow: 0.75; }\nfigure img { display: block; width: 100%; height: auto; border-radius: 3px; }\nfigure:nth-of-type(3n+1) img { background: var(--cream-pink); }\nfigure:nth-of-type(3n+2) img { background: var(--cream-butter); }\nfigure:nth-of-type(3n) img { background: #e8e6ff; }\nfigure::before { content: \"\"; position: absolute; z-index: 1; top: -10px; left: 50%; width: 78px; height: 20px; margin-left: -39px; background: var(--hazard); transform: rotate(-4deg); opacity: 0.94; }\nfigure:nth-of-type(even)::before { background: radial-gradient(circle, rgba(255, 255, 255, 0.8) 2px, transparent 2.6px) 0 0 / 9px 9px, rgba(240, 80, 138, 0.8); transform: rotate(5deg); }\n.photos figure:nth-of-type(1) { transform: rotate(-1.4deg); }\n.photos figure:nth-of-type(2) { transform: rotate(0.9deg); }\n.photos figure:nth-of-type(3) { transform: rotate(-0.6deg); }\n.photos figure:nth-of-type(4) { transform: rotate(1.3deg); }\n.photos figure:nth-of-type(5) { transform: rotate(-1deg); }\nfigcaption { font-size: 15px; margin-top: 6px; }\n.photos .smiley { z-index: 2; right: 30%; top: -16px; transform: rotate(-12deg) scale(0.8); }\n\n.bus { display: flex; gap: 3vw; align-items: center; margin-bottom: 48px; }\n.bus ul { columns: 2 17em; column-gap: 3vw; font-size: 18px; }\n.bus li { break-inside: avoid; }\n.bus-art { position: relative; flex: none; font-size: 14px; }\n.bus-art .art { font-size: inherit; }\n/* marker on the bus window */\n.tag { position: absolute; left: 37%; top: 14%; font: italic bold 2.7em/1 Times, serif; color: rgba(20, 16, 24, 0.82); letter-spacing: -0.05em; white-space: nowrap; transform: rotate(-9deg) skewX(-16deg) scaleY(1.3); pointer-events: none; }\n.tag::after { content: \"\"; position: absolute; left: 2%; right: 0; bottom: -0.12em; height: 0.06em; border-radius: 50%; background: currentColor; }\n.tag small { font-size: 0.45em; color: var(--rose); letter-spacing: 0; }\n\n.end { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1.3fr) minmax(0, 1fr); gap: 32px 3vw; align-items: start; margin-bottom: 40px; }\n.end p { margin-top: 0; max-width: 34em; }\n.end .art { margin: 4px 0 12px; }\n.end .note { font: 15px/1.45 var(--mono); }\n.respect { padding: 28px 20px 8px; background: var(--hazard) top / 100% 10px no-repeat, var(--cream-butter); }\n.respect p { font-size: 18px; }\n.stencil { position: relative; display: inline-block; font: 900 26px/1 \"Arial Black\", \"Arial Bold\", Arial, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: var(--night); text-shadow: 0 0 3px rgba(14, 11, 16, 0.35); }\n.stencil::after { content: \"\"; position: absolute; left: -2px; right: -2px; top: 46%; height: 3px; background: var(--cream-butter); }\n\n/* the footer cable keeps going to the edge of the window, however wide */\nfooter { display: flex; align-items: flex-end; align-items: last baseline; }\nfooter p { margin: 0 0 0 0.5em; white-space: nowrap; }\n.wire { flex: 1; overflow: hidden; color: var(--blue); }\n.kiss { font: inherit; color: var(--pink); background: none; border: 0; padding: 0; cursor: pointer; }\n\n@media (max-width: 1180px) {\n  .fm-body { grid-template-columns: max-content minmax(0, 1fr); }\n  .flyer { grid-column: 1 / -1; max-width: 26em; }\n}\n@media (max-width: 1000px) {\n  .top { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }\n  .end { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }\n  .hello { grid-column: 1 / -1; }\n  .end .note { grid-column: 1 / -1; }\n  .photos { flex-wrap: wrap; row-gap: 26px; }\n  figure { flex-basis: 30%; }\n  .bus { flex-direction: column; align-items: flex-start; }\n}\n@media (max-width: 780px) {\n  .fm-body { grid-template-columns: minmax(0, 1fr); }\n  .boombox { font-size: min(14px, calc((100vw - 34px) / 34)); }\n}\n@media (max-width: 640px) {\n  :root { --gut: 16px; }\n  body { font-size: 18px; padding-bottom: 32px; }\n  .banner.wide { display: none; }\n  .banner.phone { display: block; font-size: min(15px, 3.3vw); }\n  .top, .end { grid-template-columns: minmax(0, 1fr); }\n  .slap { margin: 4px 6px 0; }\n  .fm-sub { font-size: 17px; }\n  .keys .lab { width: 100%; }\n  .flyer { margin-right: 10px; }\n  .flyer .big { font-size: 50px; }\n  .photos { display: grid; grid-template-columns: 1fr 1fr; gap: 26px 14px; }\n  .photos figure:first-of-type { grid-column: 1 / -1; }\n  .photos .smiley { right: 8px; }\n  .bus-art { font-size: min(14px, 3.2vw); }\n  footer { flex-wrap: wrap; }\n  footer .art { font-size: min(14px, 3.1vw); }\n  .wire { display: none; }\n  footer p { margin: 12px 0 0; flex-basis: 100%; white-space: normal; }\n}\n\u003c/style>\n\u003c/head>\n\u003cbody id=\"top\">\n\n\u003c!-- hello, you're reading the source :) big up.\n     the drawings are plain ascii in \u003cpre> tags, made on a grid and coloured with spans.\n     the jungle machine at the bottom is all web audio: every drum and bass sound is synthesised, nothing is sampled. -->\n\n\u003cdiv class=\"ticker\">\n  \u003cdiv class=\"track >\n      \u003cli>\u003ca href=\"https://podcasts.apple.com/gb/podcast/molly-dickson-on-dao-activism-and-fighting-for/id1449302502?i=1000578164761\">molly dickson on dao activism\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"https://podcasts.apple.com/gb/podcast/dame-on-the-need-for-education-accessibility/id1449302502?i=1000559829008\">dame on education, accessibility and inclusivity in web3\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"https://podcasts.apple.com/gb/podcast/nadia-piet-on-creative-ai-and-protopian-futures/id1449302502?i=1000559822732\">nadia piet on creative ai and protopian futures\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"https://podcasts.apple.com/gb/podcast/cyn-bahati-on-her-journey-into-web3-with-her-family/id1449302502?i=1000559818509\">cyn bahati on her journey into web3 with her family\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"https://podcasts.apple.com/gb/podcast/latash%C3%A1-on-the-potential-of-web3-for-music-artists/id1449302502?i=1000552812458\">latasha on the potential of web3 for music artists\u003c/a>\u003c/li>\n    \u003c/ul>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"end\">\n  \u003cdiv id=\"bio\">\n    \u003ch2>\u003cb>bio\u003c/b> in the third person, for event programmes etc\u003c/h2>\n    \u003cp>Kes Inkersole is a freelance creative strategist and internet equalities researcher based in London. Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.\u003c/p>\n    \u003ch2>\u003cb>cv / portfolio\u003c/b> email me\u003c/h2>\n    \u003cpre class=\"art\" aria-hidden=\"true\">\u003cspan class=\"pc\">.------------------------.\u003c/span>\n\u003cspan class=\"pc\">|`-._                _.-'|\u003c/span>\n\u003cspan class=\"pc\">|    `-._        _.-'    |\u003c/span>\n\u003cspan class=\"pc\">|        `-.\u003c/span>\u003cspan class=\"heart\">&lt;3\u003c/span>\u003cspan class=\"pc\">.-'        |\u003c/span>\n\u003cspan class=\"pc\">|                        |\u003c/span>\n\u003cspan class=\"pc\">'------------------------'\u003c/span>\u003c/pre>\n    \u003cp>\u003ca href=\"mailto:inkersolekesia@gmail.com\">inkersolekesia@gmail.com\u003c/a>\u003c/p>\n  \u003c/div>\n\n  \u003cdiv class=\"respect\" id=\"respect\">\n    \u003ch2>\u003cspan class=\"stencil\">respect due\u003c/span> (the liner notes)\u003c/h2>\n    \u003cp>this page borrows its loudness from jungle, rave and graffiti, so it should say where they come from. jungle came up in london in the early 90s out of Black British sound system culture — reggae and dancehall sound systems, hardcore raves, and pirate stations broadcasting off tower blocks before legal radio caught up. the graf look belongs to writers who did it for real, on walls and trains.\u003c/p>\n    \u003cp>the amen break was played by Gregory C. Coleman of The Winstons, on “Amen, Brother” (1969). it's one of the most sampled recordings ever, and neither he nor the band's leader, Richard L. Spencer, were paid royalties for it. who gets credited and paid when culture gets copied and remixed online is an internet equalities question too.\u003c/p>\n    \u003cp>so kes fm doesn't sample anything: every sound is synthesised in your browser, and the break is a re-drumming. this page won't put on a voice or call anything “urban”. lorem ipsum dolor sit amet, further reading to come.\u003c/p>\n  \u003c/div>\n\n  \u003cp class=\"note\">last updated 1 october 2026. it's in \u003ca href=\"http://contemporary-home-computing.org/prof-dr-style/\">prof. dr. style\u003c/a> so i can keep it up to date. the tape stops scrolling if your computer's set to reduce motion, and kes fm only plays when you press play.\u003c/p>\n\u003c/div>\n\n\u003cfooter>\n  \u003cpre class=\"art\" aria-hidden=\"true\"> \u003cspan class=\"hp\">.---------------.\u003c/span>\n \u003cspan class=\"hp\">| \u003c/span>\u003cspan -------------\u003c/span>\n  \u003cp>thanks for stopping by, kes \u003cbutton class=\"kiss\" type=\"button\" title=\"more?\">x\u003c/button> \u003ca href=\"#top\">⟲ pull up to the top\u003c/a>\u003c/p>\n\u003c/footer>\n\n\u003cscript>\n  // kisses, and the mc (that's the console)\n  var kiss = document.querySelector(\".kiss\");\n  kiss.onclick = function () {\n    kiss.textContent = kiss.textContent.length \u003c 9 ? kiss.textContent + \"x\" : \"x\";\n  };\n  console.log(\"hello ♡ you found the console, you're the mc now\");\n  console.log(\"big up everyone reading the source\");\n  console.log(\"no cookies, no tracking, promise\");\n  console.log(\"it's all just html, view source and take whatever's useful\");\n\u003c/script>\n\n\u003cscript>\n/* ---------------------------------------------------------------\n   kes fm: a jungle machine made of web audio\n   - nothing autoplays. sound only starts from the play button,\n     and stop (or the esc key) closes the whole audio context.\n   - no samples: kick, snare, ride, crash, sub, reese, siren and\n     sparkles are all oscillators + noise, made on the spot.\n   --------------------------------------------------------------- */\n(function () {\n  \"use strict\";\n  var AC = window.AudioContext || window.webkitAudioContext;\n  var $ = function (id) { return document.getElementById(id); };\n  var all = function (sel) { return [].slice.call(document.querySelectorAll(sel)); };\n  var fm = $(\"kesfm\");\n  var btnPlay = $(\"fm-play\"), btnStop = $(\"fm-stop\"), btnRew = $(\"fm-rewind\"), btnChop = $(\"fm-chop\"),\n      btnBass = $(\"fm-bass\"), btnSpark = $(\"fm-spark\"), btnSiren = $(\"fm-siren\"), btnMc = $(\"fm-mc\"),\n      inBpm = $(\"fm-bpm\"), inVol = $(\"fm-vol\"), outBpm = $(\"fm-bpm-out\"),\n      lcdPat = $(\"lcd-pat\"), lcdBass = $(\"lcd-bass\"), lcdSpark = $(\"lcd-spark\"), lcdFreq = $(\"lcd-freq\"),\n      lcdBar = $(\"lcd-bar\"), shout = $(\"lcd-shout\"), dance = $(\"lcd-dance\"), tracker = $(\"fm-tracker\");\n  var patBtns = all(\"[data-pat]\"), cones = all(\".cone\"), reels = all(\".reel\"), vus = all(\".vu\"), freqs = all(\".freqtxt\");\n\n  /* ---------- patterns: 4 bars of 16th notes ---------- */\n  function parse(str, map) {\n    return str.replace(/\\|/g, \"\").split(\"\").map(function (c) { return map[c] === undefined ? 0 : map[c]; });\n  }\n  var KM = { x: 1 }, SM = { X: 1, x: 0.42, r: \"r\" }, RM = { x: 0.8, h: 0.45, c: \"c\" };\n  function pat(name, k, s, r, bass) { return { name: name, k: parse(k, KM), s: parse(s, SM), r: parse(r, RM), bass: bass }; }\n  // bass lines: [step, length in steps, midi note, slide?]  (G minor, G1 = 31)\n  var LINE = [[0, 10, 31], [10, 4, 34], [14, 2, 36, 1], [16, 12, 31], [28, 4, 29], [32, 10, 39, 1], [42, 4, 38], [46, 2, 36], [48, 8, 38], [56, 4, 36], [60, 4, 34, 1]];\n  var DREAD = [[0, 22, 31], [22, 2, 34, 1], [24, 8, 29], [32, 22, 34], [54, 2, 36, 1], [56, 8, 29]];\n  var P = {\n    // after the amen break's four bars, re-drummed (X = backbeat, x = ghost note)\n    amen: pat(\"amen-ish\",\n      \"x.x.......xx....|x.x.......xx....|x.x.......x.....|..xx......x.....\",\n      \"....X..x.x..X..x|....X..x.x..X..x|....X..x.x....X.|.x..X..x.x....X.\",\n      \"x.x.x.x.x.x.x.x.|x.x.x.x.x.x.x.x.|x.x.x.x.x.x.x.x.|x.x.x.x.x.c.x.x.\", LINE),\n    roller: pat(\"roller\",\n      \"x.........x.....|x.........x.....|x.........x.....|x.......x.x.....\",\n      \"....X..x.x..X..x|....X..x.x..X...|....X..x.x..X..x|....X..x.x..X.rr\",\n      \"xhx.xhx.xhx.xhx.|xhx.xhx.xhx.xhx.|xhx.xhx.xhx.xhx.|xhx.xhx.xhx.x.x.\", LINE),\n    half: pat(\"half-time\",\n      \"x.........x.....|..........x.....|x.........x.....|x.....x...x.....\",\n      \"........X.......|........X.....x.|........X.......|........X...x.rr\",\n      \"x...x...x...x...|x...x...x...x...|x...x...x...x...|x...x...x.x.x.x.\", DREAD)\n  };\n  // chop: rebuild the break from random slices of itself, like cutting up a sample\n  function chopUp() {\n    var src = P.amen, out = { name: \"chopped\", k: [], s: [], r: [], bass: LINE }, i = 0;\n    while (i \u003c 64) {\n      var len = [2, 4, 4, 4, 8][Math.random() * 5 | 0];\n      if (i % 16 + len > 16) len = 16 - i % 16;\n      var from = (Math.random() * (64 - len) / 2 | 0) * 2;\n      for (var j = 0; j \u003c len; j++) {\n        out.k[i + j] = src.k[from + j];\n        out.s[i + j] = src.s[from + j];\n        out.r[i + j] = src.r[from + j] === \"c\" ? 0.8 : src.r[from + j];\n      }\n      i += len;\n    }\n    out.k[0] = 1; out.k[32] = 1;\n    if (Math.random() \u003c 0.6) { out.s[28] = 1; out.s[29] = 0.42; out.s[30] = 1; out.s[31] = \"r\"; }\n    if (Math.random() \u003c 0.8) { out.s[60] = 1; out.s[61] = 0.42; out.s[62] = \"r\"; out.s[63] = \"r\"; out.k[62] = out.k[63] = 0; }\n    return out;\n  }\n  P.chop = chopUp();\n\n  /* ---------- state ---------- */\n  var ctx = null, n = null, timer = 0, raf = 0, spinT = 0, rewindT = 0;\n  var playing = false, rewinding = false, step = 0, nextTime = 0, bpm = 170, vol = 0.55;\n  var cur = \"amen\", pending = null, bassMode = 2, spark = false, crashNext = false;\n  var queue = [], level = 0, danceFrame = 0, shoutIdx = 0;\n  var BASS = [\"off\", \"sub\", \"sub + reese\"], REEL = [\"-\", \"\\\\\", \"|\", \"/\"], DANCE = [\"┏(˙o˙)┛\", \"┗(˙o˙)┓\"];\n  var SHOUTS = [\n    \"big up all the junglists\",\n    \"big up everyone reading the source\",\n    \"big up my students at LCF + CCI, hi! ( ˙▿˙ )/\",\n    \"big up Gregory C. Coleman, who played the amen break (see the liner notes)\",\n    \"big up the pirates, the sound systems and the writers\",\n    \"big up anyone on the night bus right now\",\n    \"requests: inkersolekesia@gmail.com\",\n    \"text in: ctrl + u\",\n    \"you're locked to kes fm, one html file, london-ish\"\n  ];\n\n  function say(t) { shout.textContent = t; }\n  function stepDur() { return 60 / bpm / 4; }\n  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }\n  function curve(k) {\n    var c = new Float32Array(1024);\n    for (var i = 0; i \u003c 1024; i++) { var x = i / 512 - 1; c[i] = Math.tanh(k * x) / Math.tanh(k); }\n    return c;\n  }\n\n  /* ---------- the audio graph, built fresh on every play ---------- */\n  function build() {\n    ctx = new AC();\n    n = {};\n    n.out = ctx.createGain(); n.out.gain.value = vol * 0.75;\n    var comp = ctx.createDynamicsCompressor();\n    comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.16;\n    n.master = ctx.createGain(); n.master.gain.value = 0.9;\n    n.master.connect(comp); comp.connect(n.out); n.out.connect(ctx.destination);\n    // drums: a little grit and a sampler-ish top end\n    n.drums = ctx.createGain(); n.drums.gain.value = 0.85;\n    var sat = ctx.createWaveShaper(); sat.curve = curve(1.8);\n    var lp = ctx.createBiquadFilter(); lp.type = \"lowpass\"; lp.frequency.value = 11000;\n    var hp = ctx.createBiquadFilter(); hp.type = \"highpass\"; hp.frequency.value = 35;\n    n.drums.connect(sat); sat.connect(lp); lp.connect(hp); hp.connect(n.master);\n    n.bass = ctx.createGain(); n.bass.connect(n.master);\n    // fx bus with a dub echo, for the siren and sparkles\n    n.fx = ctx.createGain(); n.fx.connect(n.master);\n    n.delay = ctx.createDelay(1.5); n.delay.delayTime.value = 0.75 * 60 / bpm;\n    var fb = ctx.createGain(); fb.gain.value = 0.4;\n    var dlp = ctx.createBiquadFilter(); dlp.type = \"lowpass\"; dlp.frequency.value = 2600;\n    var wet = ctx.createGain(); wet.gain.value = 0.55;\n    n.fx.connect(n.delay); n.delay.connect(dlp); dlp.connect(fb); fb.connect(n.delay); dlp.connect(wet); wet.connect(n.master);\n    // two seconds of white noise for snares, hats and the rewind\n    n.noise = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);\n    var d = n.noise.getChannelData(0);\n    for (var i = 0; i \u003c d.length; i++) d[i] = Math.random() * 2 - 1;\n    // sub bass: a sine, slightly overdriven so small speakers get a hint of it\n    n.sub = ctx.createOscillator(); n.sub.type = \"sine\"; n.sub.frequency.value = 49;\n    var subSh = ctx.createWaveShaper(); subSh.curve = curve(1.5);\n    n.subG = ctx.createGain(); n.subG.gain.value = 0;\n    n.sub.connect(subSh); subSh.connect(n.subG); n.subG.connect(n.bass);\n    // reese: two detuned saws through a slowly moving lowpass\n    n.r1 = ctx.createOscillator(); n.r1.type = \"sawtooth\"; n.r1.detune.value = -14; n.r1.frequency.value = 98;\n    n.r2 = ctx.createOscillator(); n.r2.type = \"sawtooth\"; n.r2.detune.value = 14; n.r2.frequency.value = 98;\n    var rf = ctx.createBiquadFilter(); rf.type = \"lowpass\"; rf.frequency.value = 520; rf.Q.value = 5;\n    var lfo = ctx.createOscillator(); lfo.frequency.value = 0.19;\n    var lfoG = ctx.createGain(); lfoG.gain.value = 330;\n    lfo.connect(lfoG); lfoG.connect(rf.frequency);\n    var rsh = ctx.createWaveShaper(); rsh.curve = curve(2.5);\n    n.rG = ctx.createGain(); n.rG.gain.value = 0;\n    n.r1.connect(rf); n.r2.connect(rf); rf.connect(rsh); rsh.connect(n.rG); n.rG.connect(n.bass);\n    [n.sub, n.r1, n.r2, lfo].forEach(function (o) { o.start(); });\n  }\n\n  /* ---------- voices ---------- */\n  function env(t, peak, attack, decay) {\n    var g = ctx.createGain();\n    g.gain.setValueAtTime(0.0001, t);\n    g.gain.exponentialRampToValueAtTime(peak, t + attack);\n    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);\n    return g;\n  }\n  function noise(t, v, type, f, q, dec, dest) {\n    var s = ctx.createBufferSource(); s.buffer = n.noise;\n    var fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.value = f; if (q) fl.Q.value = q;\n    var g = env(t, v, 0.001, dec);\n    s.connect(fl); fl.connect(g); g.connect(dest || n.drums);\n    s.start(t, Math.random() * 0.4); s.stop(t + dec + 0.05);\n  }\n  function tone(t, type, f0, f1, glide, v, dec, dest) {\n    var o = ctx.createOscillator(); o.type = type;\n    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + glide);\n    var g = env(t, v, 0.002, dec);\n    o.connect(g); g.connect(dest || n.drums);\n    o.start(t); o.stop(t + dec + 0.05);\n  }\n  function kick(t, v) {\n    tone(t, \"sine\", 165, 48, 0.07, 0.95 * v, 0.26);\n    noise(t, 0.2 * v, \"highpass\", 3000, 0, 0.012);\n  }\n  function snare(t, v) {\n    tone(t, \"triangle\", 275, 195, 0.05, 0.5 * v, 0.09);\n    tone(t, \"sine\", 420, 330, 0.04, 0.2 * v, 0.06);\n    noise(t, 0.62 * v, \"bandpass\", 3600, 0.6, 0.12 + 0.07 * v);\n    noise(t, 0.3 * v, \"highpass\", 7000, 0, 0.07);\n  }\n  var RATIOS = [2, 3, 4.16, 5.43, 6.79, 8.21];\n  function metal(t, v, dec, hpf) {\n    var bp = ctx.createBiquadFilter(); bp.type = \"bandpass\"; bp.frequency.value = 10000; bp.Q.value = 0.7;\n    var hp = ctx.createBiquadFilter(); hp.type = \"highpass\"; hp.frequency.value = hpf;\n    var g = env(t, v, 0.001, dec);\n    bp.connect(hp); hp.connect(g); g.connect(n.drums);\n    RATIOS.forEach(function (r) {\n      var o = ctx.createOscillator(); o.type = \"square\"; o.frequency.value = 47 * r;\n      o.connect(bp); o.start(t); o.stop(t + dec + 0.05);\n    });\n  }\n  function ride(t, v) { metal(t, 0.13 * v, v > 0.6 ? 0.22 : 0.06, 6500); }\n  function crash(t) { metal(t, 0.09, 1.2, 4500); noise(t, 0.15, \"highpass\", 5500, 0, 1.3); }\n  function bassNote(t, m, len, slide) {\n    var f = mtof(m), dur = len * stepDur(), tc = slide ? 0.045 : 0.003;\n    n.sub.frequency.setTargetAtTime(f, t, tc);\n    n.r1.frequency.setTargetAtTime(f * 2, t, tc);\n    n.r2.frequency.setTargetAtTime(f * 2, t, tc);\n    n.subG.gain.setTargetAtTime(bassMode > 0 ? 0.5 : 0, t, 0.005);\n    n.subG.gain.setTargetAtTime(0, t + dur - 0.03, 0.02);\n    n.rG.gain.setTargetAtTime(bassMode > 1 ? 0.15 : 0, t, 0.01);\n    n.rG.gain.setTargetAtTime(0, t + dur - 0.03, 0.03);\n  }\n  var SPARK = [79, 82, 84, 86, 89, 91, 94];\n  function plink(t) {\n    var f = mtof(SPARK[Math.random() * SPARK.length | 0]);\n    tone(t, \"sine\", f, f, 0.01, 0.06, 0.45, n.fx);\n    tone(t, \"sine\", f * 2, f * 2, 0.01, 0.015, 0.2, n.fx);\n  }\n  function padChord(t, notes, dur) {\n    var f = ctx.createBiquadFilter(); f.type = \"lowpass\"; f.frequency.value = 1400;\n    var g = ctx.createGain();\n    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.045, t + 0.6);\n    g.gain.setValueAtTime(0.045, t + dur - 0.5); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.5);\n    f.connect(g); g.connect(n.master);\n    notes.forEach(function (m) {\n      [-7, 7].forEach(function (dt) {\n        var o = ctx.createOscillator(); o.type = \"triangle\"; o.frequency.value = mtof(m); o.detune.value = dt;\n        o.connect(f); o.start(t); o.stop(t + dur + 0.6);\n      });\n    });\n  }\n\n  /* ---------- sequencer ---------- */\n  function hum() { return 0.86 + Math.random() * 0.18; }\n  function playStep(i, t) {\n    var p = P[cur], k = p.k[i], s = p.s[i], r = p.r[i];\n    if (k) kick(t, k * hum());\n    if (s === \"r\") { snare(t, 0.55); snare(t + stepDur() / 2, 0.7); }\n    else if (s) snare(t, s * hum());\n    if (crashNext && i === 0) { crash(t); crashNext = false; }\n    else if (r === \"c\") crash(t);\n    else if (r) ride(t, r * hum());\n    p.bass.forEach(function (b) { if (b[0] === i) bassNote(t, b[2], b[1], b[3]); });\n    if (spark) {\n      if (i % 2 === 0 && Math.random() \u003c 0.28) plink(t);\n      if (i % 32 === 0) padChord(t, i === 0 ? [55, 58, 62, 65] : [51, 55, 58, 62], 32 * stepDur());\n    }\n    queue.push({ t: t, i: i, kick: !!k, snare: !!s });\n  }\n  function schedule() {\n    if (!ctx) return;\n    var ahead = document.hidden ? 1.2 : 0.12;\n    while (nextTime \u003c ctx.currentTime + ahead) {\n      if (step === 0 && cur === \"chop\" && !pending) P.chop = chopUp();\n      if (step % 16 === 0 && pending) { cur = pending; pending = null; showPattern(); }\n      playStep(step, nextTime + (step % 2 ? 0.035 * stepDur() : 0));\n      nextTime += stepDur();\n      step = (step + 1) % 64;\n    }\n  }\n\n  /* ---------- what you see ---------- */\n  var NN = [\"C-\", \"C#\", \"D-\", \"D#\", \"E-\", \"F-\", \"F#\", \"G-\", \"G#\", \"A-\", \"A#\", \"B-\"];\n  function nn(m) { return NN[m % 12] + (Math.floor(m / 12) - 1); }\n  function c3(x) { return x === \"---\" ? \"\u003ci>---\u003c/i>\" : x; }\n  function renderTracker(at) {\n    var p = P[cur], rows = [];\n    for (var d = -4; d \u003c= 4; d++) {\n      var i = (at + d + 64) % 64, b = \"---\";\n      p.bass.forEach(function (x) { if (x[0] === i) b = nn(x[2]); });\n      var k = p.k[i] ? \"BD-\" : \"---\";\n      var s = p.s[i] === \"r\" ? \"SN*\" : p.s[i] >= 0.9 ? \"SN-\" : p.s[i] ? \"sn-\" : \"---\";\n      var r = p.r[i] === \"c\" ? \"CR-\" : p.r[i] >= 0.7 ? \"RD-\" : p.r[i] ? \"hh-\" : \"---\";\n      var line = \" \" + (i \u003c 10 ? \"0\" : \"\") + i + \" | \" + c3(k) + \" \" + c3(s) + \" \" + c3(r) + \" | \" + c3(b) + \" \";\n      rows.push(d === 0 ? '\u003cspan class=\"now\">' + line + \"\u003c/span>\" : line);\n    }\n    tracker.innerHTML = rows.join(\"\\n\");\n  }\n  function setAll(list, txt) { list.forEach(function (el) { el.textContent = txt; }); }\n  function vu(x) {\n    var on = Math.max(0, Math.min(16, Math.round(x * 16)));\n    setAll(vus, new Array(on + 1).join(\"=\") + new Array(17 - on).join(\".\"));\n  }\n  function apply(e) {\n    renderTracker(e.i);\n    setAll(reels, REEL[e.i % 4]);\n    setAll(cones, e.kick ? \"@\" : e.snare ? \"0\" : \"O\");\n    level = Math.max(level, e.kick ? 1 : e.snare ? 0.85 : 0.4);\n    if (e.i % 4 === 0) { danceFrame ^= 1; dance.textContent = DANCE[danceFrame]; }\n    lcdBar.textContent = (e.i >> 4) + 1;\n  }\n  function draw() {\n    if (!ctx) return;\n    while (queue.length && queue[0].t \u003c= ctx.currentTime) apply(queue.shift());\n    level *= 0.92;\n    vu(level);\n    raf = requestAnimationFrame(draw);\n  }\n  function showPattern() {\n    var name = pending || cur;\n    lcdPat.textContent = P[name].name + (pending ? \" (next bar)\" : \"\");\n    patBtns.forEach(function (b) { b.setAttribute(\"aria-pressed\", String(b.getAttribute(\"data-pat\") === name)); });\n  }\n  function resetVisuals() {\n    setAll(reels, \"-\"); setAll(cones, \"O\"); vu(0);\n    dance.textContent = \"(-_-) zz\"; lcdBar.textContent = \"1\";\n    renderTracker(0);\n  }\n\n  /* ---------- transport ---------- */\n  function start() {\n    if (!AC) { say(\"sorry, this browser can't do web audio (._.)\"); return; }\n    if (playing) return;\n    build();\n    if (ctx.state === \"suspended\") ctx.resume();\n    if (pending) { cur = pending; pending = null; showPattern(); }\n    playing = true; step = 0; crashNext = true; queue = [];\n    nextTime = ctx.currentTime + 0.1;\n    timer = setInterval(schedule, 25);\n    schedule();\n    raf = requestAnimationFrame(draw);\n    document.documentElement.classList.add(\"on-air\");\n    btnPlay.setAttribute(\"aria-pressed\", \"true\");\n    say(\"you're locked to kes fm \" + bpm.toFixed(1) + \" ♪ big up all the junglists\");\n  }\n  function stop() {\n    if (!playing) return;\n    playing = false; rewinding = false;\n    clearInterval(timer); clearInterval(spinT); clearTimeout(rewindT); cancelAnimationFrame(raf);\n    var c = ctx, out = n.out;\n    ctx = null; n = null; queue = [];\n    try { out.gain.setTargetAtTime(0, c.currentTime, 0.015); } catch (e) {}\n    setTimeout(function () { try { c.close(); } catch (e) {} }, 150);\n    document.documentElement.classList.remove(\"on-air\");\n    fm.classList.remove(\"pulling\");\n    btnPlay.setAttribute(\"aria-pressed\", \"false\");\n    resetVisuals();\n    say(\"stopped. press play to go again ( ˘ ³˘)\");\n  }\n  // pull up! the record gets spun back and the tune starts again from the top\n  function rewind() {\n    if (!playing) { say(\"press play first ▶ then pull it up\"); return; }\n    if (rewinding) return;\n    rewinding = true;\n    var t = ctx.currentTime + 0.01, dur = 0.95;\n    [n.subG.gain, n.rG.gain].forEach(function (g) { g.cancelScheduledValues(t); g.setTargetAtTime(0, t, 0.03); });\n    var o = ctx.createOscillator(); o.type = \"sawtooth\";\n    var bp = ctx.createBiquadFilter(); bp.type = \"bandpass\"; bp.Q.value = 1.4;\n    var g = ctx.createGain();\n    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.03);\n    g.gain.setValueAtTime(0.16, t + dur - 0.15); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);\n    o.frequency.setValueAtTime(180, t); bp.frequency.setValueAtTime(400, t);\n    [[0.1, 700], [0.18, 260], [0.3, 1100], [0.38, 380], [0.52, 1500], [0.6, 520], [0.75, 1900], [dur, 90]].forEach(function (p) {\n      o.frequency.exponentialRampToValueAtTime(p[1], t + p[0]);\n      bp.frequency.exponentialRampToValueAtTime(p[1] * 2.2, t + p[0]);\n    });\n    var ns = ctx.createBufferSource(); ns.buffer = n.noise;\n    var ng = ctx.createGain(); ng.gain.value = 0.5;\n    o.connect(bp); ns.connect(ng); ng.connect(bp); bp.connect(g); g.connect(n.master);\n    o.start(t); o.stop(t + dur + 0.05); ns.start(t); ns.stop(t + dur + 0.05);\n    step = 0; nextTime = t + dur + 0.22; crashNext = true; queue = [];\n    fm.classList.add(\"pulling\");\n    say(\"⟲ pull up! rewind ... come again ⟲\");\n    var spin = 0;\n    spinT = setInterval(function () { spin = (spin + 1) % 4; setAll(reels, REEL[3 - spin]); }, 35);\n    rewindT = setTimeout(function () { clearInterval(spinT); rewinding = false; fm.classList.remove(\"pulling\"); }, (dur + 0.2) * 1000);\n  }\n  function siren() {\n    if (!playing) { say(\"press play first ▶ then the siren\"); return; }\n    var t = ctx.currentTime + 0.01, dur = 1.7;\n    var o = ctx.createOscillator(); o.type = \"square\";\n    o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(880, t + dur);\n    var lfo = ctx.createOscillator(); lfo.type = \"triangle\";\n    lfo.frequency.setValueAtTime(4, t); lfo.frequency.linearRampToValueAtTime(11, t + dur);\n    var lg = ctx.createGain(); lg.gain.value = 160; lfo.connect(lg); lg.connect(o.frequency);\n    var f = ctx.createBiquadFilter(); f.type = \"lowpass\"; f.frequency.value = 2200;\n    var g = ctx.createGain();\n    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.055, t + 0.04);\n    g.gain.setValueAtTime(0.055, t + dur - 0.2); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);\n    o.connect(f); f.connect(g); g.connect(n.fx);\n    o.start(t); lfo.start(t); o.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05);\n    say(\"siren! a dub siren, straight out of sound system culture\");\n  }\n  function choose(name) {\n    if (playing && name !== cur) pending = name;\n    else { cur = name; pending = null; }\n    showPattern();\n    if (!playing) renderTracker(0);\n    say(playing ? \"pattern \" + P[name].name + \" comes in on the next bar\" : \"pattern: \" + P[name].name + \" (press play)\");\n  }\n\n  btnPlay.addEventListener(\"click\", start);\n  btnStop.addEventListener(\"click\", stop);\n  btnRew.addEventListener(\"click\", rewind);\n  btnSiren.addEventListener(\"click\", siren);\n  btnMc.addEventListener(\"click\", function () { say(SHOUTS[shoutIdx++ % SHOUTS.length]); });\n  btnChop.addEventListener(\"click\", function () {\n    P.chop = chopUp();\n    if (cur === \"chop\" && !pending) { if (!playing) renderTracker(0); say(\"✂ chopped up a fresh break\"); showPattern(); }\n    else { choose(\"chop\"); say(\"✂ chopped up a fresh break\" + (playing ? \", in on the next bar\" : \"\")); }\n  });\n  patBtns.forEach(function (b) { b.addEventListener(\"click\", function () { choose(b.getAttribute(\"data-pat\")); }); });\n  btnBass.addEventListener(\"click\", function () {\n    bassMode = (bassMode + 2) % 3;\n    btnBass.textContent = \"bass: \" + BASS[bassMode];\n    lcdBass.textContent = BASS[bassMode];\n  });\n  btnSpark.addEventListener(\"click\", function () {\n    spark = !spark;\n    btnSpark.setAttribute(\"aria-pressed\", String(spark));\n    lcdSpark.textContent = spark ? \"on ✧\" : \"off\";\n  });\n  inBpm.addEventListener(\"input\", function () {\n    bpm = +inBpm.value;\n    outBpm.textContent = bpm;\n    lcdFreq.textContent = bpm.toFixed(1);\n    setAll(freqs, bpm.toFixed(1));\n    if (n) n.delay.delayTime.setTargetAtTime(0.75 * 60 / bpm, ctx.currentTime, 0.05);\n  });\n  inVol.addEventListener(\"input\", function () {\n    vol = inVol.value / 100;\n    if (n) n.out.gain.setTargetAtTime(vol * 0.75, ctx.currentTime, 0.03);\n  });\n  document.addEventListener(\"keydown\", function (e) { if (e.key === \"Escape\") stop(); });\n  window.addEventListener(\"pagehide\", stop);\n  resetVisuals();\n})();\n\u003c/script>\n\u003cscript>(function(){\ndocument.addEventListener('click',function(e){\n  var a=e.target.closest&&e.target.closest('a[href^=\"#\"]');\n  if(!a||e.defaultPrevented)return;\n  var id=decodeURIComponent(a.getAttribute('href').slice(1)),t=id&&document.getElementById(id);\n  if(id&&!t)return;\n  e.preventDefault();\n  t?t.scrollIntoView({block:'start'}):scrollTo(0,0);\n});\naddEventListener('keydown',function(e){\n  if(e.metaKey||e.ctrlKey||e.altKey)return;\n  if(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]'))return;\n  if(['ArrowLeft','ArrowRight','m'].indexOf(e.key)>-1)parent.postMessage({variantKey:e.key},'*');\n});\n})();\u003c/script>\u003c/body>\n\u003c/html>\n"}, {"label": "10", "note": "Cute pink ASCII name with graf drips, hazard-tape pirate ident, stickers, and a black chrome dubplate jungle machine (amen chops, reese, rewind) with liner notes.", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en-GB\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>kes inkersole\u003c/title>\n\u003cmeta name=\"description\" content=\"kes inkersole — freelance creative strategist & internet equalities researcher, based in london.\">\n\u003cmeta name=\"author\" content=\"Kes Inkersole\">\n\u003cmeta name=\"keywords\" content=\"Kesia Inkersole, Kes Inkersole, creative strategist, internet equalities, researcher, London, UAL\">\n\u003cmeta name=\"theme-color\" content=\"#fff8f0\">\n\u003clink rel=\"icon\" href=\"/favicon.ico\" sizes=\"any\">\n\u003cmeta property=\"og:type\" content=\"website\">\n\u003cmeta property=\"og:title\" content=\"kes inkersole\">\n\u003cmeta property=\"og:description\" content=\"kes inkersole — freelance creative strategist & internet equalities researcher, based in london.\">\n\u003cmeta property=\"og:image\" content=\"https://kesia-coral.vercel.app/square.png\">\n\u003cmeta property=\"og:url\" content=\"https://kesia-coral.vercel.app\">\n\u003cmeta name=\"twitter:card\" content=\"summary_large_image\">\n\u003cmeta name=\"twitter:title\" content=\"kes inkersole\">\n\u003cmeta name=\"twitter:description\" content=\"kes inkersole — freelance creative strategist & internet equalities researcher, based in london.\">\n\u003cmeta name=\"twitter:image\" content=\"https://kesia-coral.vercel.app/square.png\">\n\u003cstyle>\n/* the soft stuff: warm paper, plum ink, pink, periwinkle, gold, one leaf.\n   the 'ard stuff: black, hazard yellow, acid green, chrome. they share the page. */\n:root {\n  --paper: #fff8f0;\n  --ink: #33224a;\n  --pink: #ff5c9d;\n  --pink-text: #cf2f72;\n  --blue: #5a68f0;\n  --gold: #e8a400;\n  --leaf: #4f9a5c;\n  --blush: #ffe3ee;\n  --sky: #e6e8ff;\n  --butter: #fff4b8;\n  --lilac: #ad9de3;\n  --black: #141116;\n  --hazard: #ffd60a;\n  --acid: #b8ff2e;\n  --acid-ink: #3f7d00;\n  --stripes: repeating-linear-gradient(-45deg, var(--black) 0 12px, var(--hazard) 12px 24px);\n  --chrome: linear-gradient(180deg, #ffffff 0%, #d4d5de 36%, #6a6c7a 50%, #eceef4 58%, #9b9daa 80%, #ffffff 100%);\n  --mono: ui-monospace, Menlo, Consolas, \"DejaVu Sans Mono\", \"Courier New\", monospace;\n  --loud: Impact, \"Arial Black\", \"Arial Narrow\", sans-serif;\n  --fat: \"Arial Black\", Impact, Arial, sans-serif;\n}\nhtml { background: var(--paper); color: var(--ink); }\nbody { margin: 0; padding: 0 2.5rem 1rem; font: 18px/1.5 \"Times New Roman\", Times, serif; overflow-x: hidden; }\n::selection { background: var(--acid); color: var(--black); }\n\na { color: #2f43d0; text-underline-offset: .15em; }\na:visited { color: #8a35b8; }\na:hover { background: var(--blush); text-decoration-style: wavy; text-decoration-color: var(--pink); }\na:focus-visible, button:focus-visible, input:focus-visible { outline: 2px dashed var(--pink); outline-offset: 2px; }\nmark { color: inherit; background: linear-gradient(transparent 55%, var(--blush) 55%); }\nmark.sky { background: linear-gradient(transparent 55%, var(--sky) 55%); }\nmark.acid { background: linear-gradient(transparent 55%, var(--acid) 55%); }\n\npre, .ascii { font: 14px/1.15 var(--mono); margin: 0; }\npre b, .ascii b { font-weight: normal; }\n.p { color: var(--pink); } .b { color: var(--blue); } .y { color: var(--gold); }\n.g { color: var(--leaf); } .l { color: var(--lilac); } .k { color: var(--ink); }\n.s, .t { color: var(--gold); animation: twinkle 2.4s ease-in-out infinite; } .t { color: var(--blue); animation-delay: -1.2s; }\n@keyframes twinkle { 50% { opacity: .3; } }\n\nh2 { font: 16px/1.3 var(--mono); color: var(--pink-text); margin: 0 0 .8em; }\nul { margin: 0 0 1.8em; padding-left: 1.5em; }\nli { margin-bottom: .35em; }\nli::marker { color: var(--pink); }\np, li { max-width: 34em; }\np { margin: 0 0 1em; }\n\n/* pirate ident on warning tape */\n.tape { margin: 0 -2.5rem; padding: 7px 0; background: var(--stripes); overflow: hidden; }\n.tape p { max-width: none; margin: 0; display: flex; width: max-content; background: var(--black); color: var(--acid); font: 13px/2.1 var(--mono); white-space: pre; animation: ticker 70s linear infinite; }\n.tape b { font-weight: normal; color: var(--pink); }\n@keyframes ticker { to { transform: translateX(-50%); } }\n\n/* the name: bubble letters, thrown up with a hard shadow, still dripping */\nh1 { margin: 1.4rem 0 2rem; color: var(--pink); }\n.name { display: flex; flex-wrap: wrap; column-gap: 3ch; row-gap: .4em; font-size: min(34px, (100vw - 5rem) / 54); text-shadow: .09em .09em 0 var(--black); }\n.name > span { white-space: pre; }\n.name .d { color: var(--pink); }\n.name .t, .name .s { text-shadow: none; }\n@media (max-width: 1000px) { .name { font-size: min(26px, (100vw - 5rem) / 34); } }\n\n/* flyer strip */\n.flyer { max-width: none; display: flex; flex-wrap: wrap; align-items: center; gap: .55rem .7rem; margin: 0 0 3rem; font: 21px/1 var(--loud); text-transform: uppercase; letter-spacing: .02em; }\n.flyer b { font-weight: normal; padding: .28em .45em .22em; background: var(--black); color: var(--hazard); }\n.flyer b:nth-of-type(2) { background: var(--hazard); color: var(--black); transform: rotate(-2deg); }\n.flyer b:nth-of-type(3) { background: var(--acid); color: var(--black); transform: rotate(1.5deg); }\n.flyer b:nth-of-type(4) { background: var(--pink); color: #fff; transform: rotate(-1deg); }\n.flyer i { font: italic 20px/1.2 \"Times New Roman\", Times, serif; text-transform: none; color: var(--pink-text); }\n.flyer span { font: 15px/1.2 var(--mono); text-transform: none; color: var(--pink); letter-spacing: 0; }\n\n.big { font-size: 1.55em; line-height: 1.3; max-width: 20em; }\nbutton { font: 13px var(--mono); color: var(--pink-text); background: var(--blush); border: 1px solid var(--pink); border-radius: 1em; padding: .1em .7em; cursor: pointer; vertical-align: .1em; }\nbutton:hover { background: var(--pink); color: #fff; }\n\n.row { display: grid; align-items: start; grid-template-columns: repeat(auto-fit, minmax(min(100%, 19rem), 1fr)); gap: 2.5rem 3.5rem; margin: 0 0 3.5rem; }\nimg { max-width: 100%; height: auto; display: block; background: var(--blush); }\nfigure { margin: 0; }\nfigcaption { font: 13px/1.4 var(--mono); margin-top: .5em; }\nfigcaption::before { content: \"^ \"; color: var(--pink); }\n\n/* sticker slaps */\n.slap { position: relative; }\n.hello { position: absolute; left: .9rem; bottom: -1.8rem; width: 9.6rem; background: #fff; border-radius: .7rem; overflow: hidden; text-align: center; transform: rotate(-6deg); box-shadow: 1px 3px 0 rgba(20, 17, 22, .28); }\n.hello b { display: block; background: var(--pink); color: #fff; font: 23px/1 var(--fat); letter-spacing: .05em; padding: .45rem 0 .1rem; }\n.hello small { display: block; background: var(--pink); color: #fff; font: bold 10px/1 Arial, sans-serif; letter-spacing: .14em; text-transform: uppercase; padding: .2rem 0 .45rem; }\n.hello .tag { display: inline-block; margin: .35rem 0 .55rem; }\n.tag { font: italic 900 2.5rem/1 var(--fat); letter-spacing: -.07em; color: var(--black); transform: rotate(-7deg) skewX(-14deg); text-shadow: 0 0 1px currentColor, .03em .02em 0 currentColor; white-space: nowrap; }\n.tag sup { font-size: .45em; color: var(--pink); vertical-align: 1.1em; letter-spacing: 0; }\n.smiley { position: absolute; top: -1.3rem; right: .9rem; width: 4.6rem; height: 4.6rem; border-radius: 50%; border: 2px solid var(--black); transform: rotate(14deg); box-shadow: 2px 3px 0 rgba(20, 17, 22, .25);\n  background:\n    radial-gradient(ellipse 5px 9px at 36% 36%, var(--black) 92%, transparent 100%),\n    radial-gradient(ellipse 5px 9px at 64% 36%, var(--black) 92%, transparent 100%),\n    radial-gradient(circle 7px at 22% 60%, rgba(255, 92, 157, .55) 90%, transparent 100%),\n    radial-gradient(circle 7px at 78% 60%, rgba(255, 92, 157, .55) 90%, transparent 100%),\n    var(--hazard); }\n.smiley::after { content: \"\"; position: absolute; left: 25%; right: 25%; top: 50%; height: 22%; border: 3px solid var(--black); border-top: 0; border-radius: 0 0 50% 50% / 0 0 100% 100%; }\n\n.note { position: relative; background: var(--butter); padding: 1.3rem 1.4rem .2rem; border-radius: 3px; transform: rotate(-.6deg); }\n.note h2 { color: var(--ink); }\n.note::before, .note::after { content: \"\"; position: absolute; top: -.6rem; width: 5.2rem; height: 1.25rem; background: var(--stripes); opacity: .93; }\n.note::before { left: -.5rem; transform: rotate(-24deg); }\n.note::after { right: .3rem; transform: rotate(20deg); }\n\n.lately  { list-style-type: \"✧  \"; }\n.fun     { list-style-type: \"♡  \"; }\n.funds   { list-style-type: \"£  \"; }\n.writing { list-style-type: \"✎  \"; }\n.pods    { list-style-type: \"♪  \"; }\n.bits    { list-style-type: \"✿  \"; }\n\n/* KES FM: the jungle machine */\n.fm { position: relative; margin: 0 -2.5rem 4rem; padding: 0 2.5rem 2.6rem; background: var(--black); color: #f4efff; }\n.fm::before { content: \"\"; display: block; height: 14px; margin: 0 -2.5rem 2rem; background: var(--stripes); }\n.fm a, .fm a:visited { color: var(--acid); }\n.fm a:hover { background: none; }\n.fm-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: .6rem 2.5rem; margin-bottom: 1.8rem; }\n.fm-head h2 { margin: 0; color: var(--lilac); }\n.fm-head p { margin: 0; font-size: 17px; max-width: 40em; }\n.chrome { display: block; font: 4.2rem/.95 var(--loud); letter-spacing: .02em; background: var(--chrome); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(3px 3px 0 var(--pink)); }\n\n.rig { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2rem; align-items: center; }\n.stack { font-size: 12px; color: var(--lilac); transition: transform .08s; }\n.stack .cone { color: var(--pink); }\n.stack.thump { transform: scale(1.025); }\n.stack.thump .cone { color: var(--acid); }\n\n.deck { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr); gap: 1.6rem 2rem; align-items: center; padding: 1.5rem; border: 4px solid transparent; border-radius: 20px;\n  background: linear-gradient(160deg, #2a2530, #18151b) padding-box, var(--chrome) border-box; }\n\n/* a dubplate on a deck: one copy, cut for this website */\n.plate { position: relative; width: 100%; aspect-ratio: 1; border-radius: 50%; box-shadow: 0 0 0 3px #000, 0 7px 0 3px #000; }\n.disc { position: absolute; inset: 0; border-radius: 50%; background: repeating-radial-gradient(circle, rgba(0, 0, 0, .22) 0 1px, transparent 1px 3px), radial-gradient(circle, #d9dae2, #a9abb8 70%, #e8e9ee); }\n.plate::before { content: \"\"; position: absolute; inset: 0; border-radius: 50%; z-index: 2; pointer-events: none; background: conic-gradient(from 20deg, rgba(255,255,255,.55), transparent 12%, rgba(0,0,0,.18) 25%, transparent 38%, rgba(255,255,255,.6) 50%, transparent 62%, rgba(0,0,0,.18) 75%, transparent 88%, rgba(255,255,255,.55)); }\n.plate::after { content: \"\"; position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; margin: -4.5px; border-radius: 50%; background: var(--black); z-index: 3; }\n.label { position: absolute; inset: 29%; border-radius: 50%; background: var(--pink); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font: 10px/1.2 var(--mono); }\n.label b { font: 15px/1 var(--loud); letter-spacing: .05em; color: var(--black); }\n.label i { font-style: normal; color: var(--butter); }\n.label span { margin-top: .9em; }\n.arm { position: absolute; top: -4%; right: -3%; width: 6px; height: 48%; border-radius: 3px; background: var(--chrome); transform-origin: 50% 6%; transform: rotate(18deg); transition: transform .6s ease; z-index: 4; box-shadow: 1px 1px 0 #000; }\n.arm::after { content: \"\"; position: absolute; bottom: -6px; left: -5px; width: 16px; height: 18px; border-radius: 3px; background: var(--pink); border: 2px solid #000; }\n.live .disc { animation: spin 1.8s linear infinite; } /* 33 and a third rpm */\n.live .arm { transform: rotate(31deg); }\n@keyframes spin { to { transform: rotate(360deg); } }\n\n.lcd { background: #0e130b; border: 2px solid #000; border-radius: 10px; padding: .8rem 1rem .9rem; color: var(--acid); font: 14px/1.4 var(--mono); text-shadow: 0 0 6px rgba(184, 255, 46, .45); margin-bottom: 1.2rem; }\n.lcd p { max-width: none; margin: 0; }\n.lcd-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .3rem 1rem; }\n.onair { color: #4a4250; text-shadow: none; }\n.live .onair { color: #ff3b6b; text-shadow: 0 0 8px #ff3b6b; }\n.freq { font: 30px/1 var(--loud); letter-spacing: .04em; }\n.freq small { font: 13px var(--mono); }\n.dancer { font-size: 18px; color: var(--pink); text-shadow: 0 0 6px rgba(255, 92, 157, .5); min-height: 1.5em; margin-top: .3rem !important; }\n.shout { min-height: 2.8em; color: #e8ffd0; }\n.slices { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 3px; list-style: none; padding: 0; margin: .6rem 0 0; }\n.slices li { max-width: none; margin: 0; padding: 2px 0; text-align: center; font-size: 11px; border-radius: 3px; background: rgba(184, 255, 46, .07); color: rgba(184, 255, 46, .5); text-shadow: none; }\n.slices li.beat { background: rgba(184, 255, 46, .16); }\n.slices li.fx { color: var(--pink); }\n.slices li.on { background: var(--acid); color: var(--black); }\n\n.grp { display: flex; flex-wrap: wrap; align-items: center; gap: .55rem; margin: 0 0 .9rem; }\n.lbl { width: 4.6em; font: 11px var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--lilac); }\n.fm button { font: 14px/1 var(--mono); color: var(--ink); background: var(--sky); border: 2px solid #000; border-radius: 999px; padding: .55em .9em; margin: 0; vertical-align: baseline; box-shadow: 0 3px 0 var(--lilac); }\n.fm button:hover { background: var(--blush); color: var(--ink); }\n.fm button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--lilac); }\n.fm button[aria-pressed=\"true\"] { background: var(--acid); }\n.fm button:focus-visible, .fm input:focus-visible { outline-color: var(--acid); }\n.fm .go { font-size: 19px; padding: .55em 1.3em; background: var(--butter); }\n.fm .halt { font-size: 19px; padding: .55em 1.3em; background: var(--pink); color: #fff; }\n.fm .halt:hover { background: #fff; color: var(--pink-text); }\n.sliders label { display: inline-flex; align-items: center; gap: .5rem; font: 13px var(--mono); color: var(--lilac); }\n.sliders input { width: 8.5rem; accent-color: var(--pink); }\n.sliders output { color: var(--acid); min-width: 3ch; }\n\n/* liner notes, on a tape inlay */\n.liner { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: 1.6rem 2rem; margin-top: 2.6rem; }\n.jcard { background: var(--paper) repeating-linear-gradient(transparent 0 21px, rgba(90, 104, 240, .2) 21px 22px); background-origin: content-box; color: var(--ink); padding: 22px 1.4rem 1px; border-top: 10px solid var(--pink); font: 15px/22px \"Courier New\", Courier, monospace; }\n.jcard:nth-child(2) { border-top-color: var(--acid); }\n.jcard h3 { font: bold 15px/22px \"Courier New\", Courier, monospace; margin: 0; text-transform: uppercase; letter-spacing: .08em; }\n.jcard p { margin: 0 0 22px; max-width: none; }\n.jcard a, .jcard a:visited { color: #2f43d0; }\n.nosound .keys button:not(.go):not(.halt) { opacity: .5; }\n\n.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); gap: 1.5rem; margin: 0 0 3.5rem; }\n.strip figure:nth-child(2) { margin-top: 2.5rem; }\n/* photocopied onto coloured paper, like a flyer */\n.copy { display: block; background: var(--pink); }\n.copy img { filter: grayscale(1) contrast(1.35) brightness(1.1); mix-blend-mode: multiply; background: transparent; }\n.strip figure:nth-child(2) .copy { background: var(--acid); }\n.strip figure:nth-child(3) .copy { background: var(--hazard); }\n\n.bus { position: relative; display: inline-block; font-size: min(14px, (100vw - 2rem) / 21.5); color: var(--pink); margin: 0 0 1.2rem; transition: transform 1.4s ease-in-out; }\n.bus:hover { transform: translateX(3rem); } /* off it goes */\n.bus .tag { position: absolute; left: 11ch; top: .9em; font-size: 2.3em; color: rgba(20, 17, 22, .82); }\n\n.net { display: flex; align-items: flex-start; color: var(--blue); margin: 1rem 0 2.5rem; }\n.wire { flex: 1; position: relative; overflow: hidden; color: var(--pink); }\n.wire i { position: absolute; left: 0; font-style: normal; background: var(--paper); padding: 0 .5ch; animation: send 9s ease-in-out infinite alternate; }\n@keyframes send { to { left: calc(100% - 3ch); } }\n\n.stencil { font: 2.6rem/1.05 var(--fat); text-transform: uppercase; letter-spacing: .03em; margin: 0 0 1.4rem;\n  background: linear-gradient(var(--ink) 47%, transparent 47% 55%, var(--ink) 55%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 2px rgba(51, 34, 74, .4)); }\n.cut { position: relative; border: 2px dashed #f4a6c6; background: #fff; padding: 1.2rem 1.4rem .4rem; margin: 0 0 1.2rem; }\n.cut::before { content: \"8\u003c\"; position: absolute; top: -.75em; left: 1rem; padding: 0 .3em; font: 15px var(--mono); color: var(--pink); background: var(--paper); }\n\n.caution { margin: 3rem -2.5rem 0; padding: 1.6rem 0; overflow: hidden; }\n.caution p { max-width: none; margin: 0 -5%; width: 110%; transform: rotate(-1.6deg); background: var(--hazard); color: var(--black); border-block: 3px solid var(--black); font: 19px/1.6 var(--loud); letter-spacing: .12em; white-space: nowrap; overflow: hidden; }\n\nfooter { margin-top: 1rem; }\n.garden { overflow: hidden; margin: 0 -2.5rem; padding: 0 1rem; }\n/* the bunny wakes up when you come near the garden */\n.garden s, .garden u { text-decoration: none; }\n.garden u, .garden:hover s { display: none; }\n.garden:hover u { display: inline; }\n.bye { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 1rem 3rem; padding-top: 1.2rem; }\n.bye p { font-size: 15px; }\n.bye .thanks { font-size: 1.6em; color: var(--pink-text); font-style: italic; }\n.small-print { max-width: none; font: 12px/1.6 var(--mono); text-transform: uppercase; letter-spacing: .08em; color: #7a6a8c; border-top: 1px dashed var(--lilac); padding-top: .8rem; }\n\n.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-spa ta-bass=\"off\" aria-pressed=\"false\">no bass\u003c/button>\n          \u003c/div>\n          \u003cdiv class=\"grp\" role=\"group\" aria-label=\"effects\">\n            \u003cspan class=\"lbl\">do it\u003c/span>\n            \u003cbutton id=\"chop\">✂ chop\u003c/button>\n            \u003cbutton id=\"pullup\">↺ pull up\u003c/button>\n            \u003cbutton id=\"horn\">air horn\u003c/button>\n          \u003c/div>\n          \u003cdiv class=\"grp sliders\">\n            \u003clabel>tempo \u003cinput type=\"range\" id=\"tempo\" min=\"160\" max=\"175\" step=\"1\" value=\"170\"> \u003coutput id=\"tempo-out\" for=\"tempo\">170\u003c/output>\u003c/label>\n            \u003clabel>volume \u003cinput type=\"range\" id=\"vol\" min=\"0\" max=\"100\" value=\"45\">\u003c/label>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n\u003cpre class=\"stack\" aria-hidden=\"true\">.------------------.\n|  ______________  |\n| |______________| |\n|  ______________  |\n| |______________| |\n'------------------'\n.------------------.\n|    .--------.    |\n|  .'  .----.  '.  |\n| |   \u003cb class=cone>( (^^) )\u003c/b>   | |\n|  '.  '----'  .'  |\n|    '--------'    |\n'------------------'\n.------------------.\n|    .--------.    |\n|  .'  .----.  '.  |\n| |   \u003cb class=cone>( (&lt;3) )\u003c/b>   | |\n|  '.  '----'  .'  |\n|    '--------'    |\n'------------------'\u003c/pre>\n  \u003c/div>\n  \u003cp class=\"vh\" id=\"fm-status\" aria-live=\"polite\">\u003c/p>\n  \u003cnoscript>\u003cp>the jungle machine needs javascript. everything else on the page works without it.\u003c/p>\u003c/noscript>\n\n  \u003cdiv class=\"liner\">\n    \u003csection class=\"jcard\">\n      \u003ch3>liner notes: how it works\u003c/h3>\n      \u003cp>the drums are synthesised into one two-bar break, an impression of the amen rather than a sample of it, then cut into 32 slices. the numbers in the little window are the slices. each pattern plays them back in a different order, which is roughly how jungle got made: take a break, chop it up on a sampler or a tracker, rearrange it, speed it up. move the tempo and the break gets pitched up or down with it, like it would on a sampler.\u003c/p>\n      \u003cp>the reese is two detuned saw waves rubbing against each other, named after kevin saunderson's \"just want another chance\", which he released as reese. the sub is a sine wave with a bit of grit so it still comes through laptop speakers. escape stops everything.\u003c/p>\n    \u003c/section>\n    \u003csection class=\"jcard\">\n      \u003ch3>respect due\u003c/h3>\n      \u003cp>the amen break is four bars of gregory c. coleman drumming on the winstons' \"amen, brother\" (1969). it's one of the most sampled recordings ever made. coleman never got paid for it, and he died homeless in 2006. who gets credited and paid when culture gets copied and passed around is an internet equalities question as much as a music one.\u003c/p>\n      \u003cp>jungle came out of london in the early 90s, out of black british sound system culture (reggae, dub and dancehall), breakbeat hardcore raves and pirate radio. graf runs alongside it: goldie was a graffiti writer before he made \"timeless\". this page borrows the look and some of the language. the culture belongs to the people who built it, so go and listen to them instead of my little machine: kool fm, the ragga twins, congo natty (rebel mc), shy fx, dj rap, kemistry &amp; storm.\u003c/p>\n    \u003c/section>\n  \u003c/div>\n\u003c/section>\n\n\u003cdiv class=\"row\">\n  \u003csection>\n    \u003ch2>projects (for fun)\u003c/h2>\n    \u003cul class=\"fun\">\n      \u003cli>\u003ca href=\"https://latent-space.vercel.app/\">latent space\u003c/a> (lorem ipsum dolor sit amet, consectetur adipiscing elit)\u003c/li>\n      \u003cli>\u003ca href=\"https://protecht.vercel.app/\">pro(tech)t\u003c/a> (sed do eiusmod tempor incididunt ut labore)\u003c/li>\n    \u003c/ul>\n\n    \u003ch2>projects (for funds)\u003c/h
