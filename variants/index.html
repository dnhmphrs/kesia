variantKey:e.key},'*');\n});\nif(location.hash.length>1){var t=document.getElementById(decodeURIComponent(location.hash.slice(1)));t&&t.scrollIntoView();}\n})();\u003c/script>\u003c/body>\n\u003c/html>\n"}}, {"label": "06", "note": "mondrian · Mondrian 1930 grid, thick black lines: pink plane top-right, blue low-left, yellow corner; heart sign above hello and KES FM; writing in three ruled columns.", "pages": {"index.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en-GB\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cmeta name=\"color-scheme\" content=\"light\">\n\u003ctitle>kes inkersole\u003c/title>\n\u003cmeta name=\"description\" content=\"kes inkersole (kesia on paper), creative strategist &amp; internet equalities researcher, based in london.\">\n\u003cstyle>\n/* the page is one composition, after mondrian's composition with red, blue and yellow (1930).\n   black lines (the page ground showing through the gaps), white rectangles that hold one thing each,\n   and a few flat planes: kes's hot pink stands in for his red, her electric blue is the blue, plus one yellow.\n   three type sizes: 13 mono, 16 sans, 40 sans. */\n:root {\n  --line: 10px;\n  --pad: 32px;\n  --ink: #000;\n  --paper: #fff;\n  --chalk: #f2f0ea;  /* the off-white */\n  --blue: #2034ff;   /* links, and the blue planes */\n  --pink: #ff2d92;   /* every hover, and the \"red\" plane */\n  --yellow: #ffd200;\n  --sans: \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n  --mono: ui-monospace, Menlo, Consolas, \"DejaVu Sans Mono\", \"Liberation Mono\", \"Courier New\", monospace;\n  --speaker: calc(292.5px + 2 * var(--pad)); /* KES FM's speaker at 13px, plus padding: a line that runs down the page */\n}\nhtml { background: var(--ink); color: var(--ink); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\nbody { margin: 0; display: flex; flex-direction: column; gap: var(--line); background: var(--ink); font: 16px/24px var(--sans); }\nmain, footer { display: flex; flex-direction: column; gap: var(--line); }\nh1, h2, h3, p, ul, dl, dd, figure, pre { margin: 0; }\nh2, h3 { font-size: inherit; font-weight: inherit; }\n::selection { background: var(--pink); color: var(--ink); }\n\na { color: var(--blue); text-decoration-thickness: 1px; text-underline-offset: .2em; }\na:hover { background: var(--pink); color: var(--ink); text-decoration: none; }\na:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }\n\n/* the three sizes */\n.label, .meta { font: 400 13px/24px var(--mono); }\n.voice { font: 400 40px/48px var(--sans); letter-spacing: -.015em; }\n.heart { color: var(--pink); }\n.sym { padding-left: .25em; }\n\n/* ---------- the composition: rectangles in grids, black showing through the gaps ---------- */\n.band { display: grid; gap: var(--line); }\n.col { display: flex; flex-direction: column; gap: var(--line); min-width: 0; }\n.cell { background: var(--paper); padding: var(--pad); min-width: 0; }\n.plane { min-height: var(--line); }\n.plane.red { background: var(--pink); }\n.plane.blue { background: var(--blue); }\n.plane.yellow { background: var(--yellow); }\n.plane.black { background: var(--ink); }\n.plane.chalk { background: var(--chalk); }\n\n/* first view: name across the top, the big pink plane down the right,\n   hello and KES FM underneath, blue low on the left, yellow low on the right */\n.top { grid-template-columns: minmax(0, 36fr) minmax(0, 79fr) minmax(0, 26fr); grid-template-areas: \"name name side\" \"left fm side\"; }\n.name { grid-area: name; container-type: inline-size; }\n.left { grid-area: left; }\n.fm { grid-area: fm; }\n.side { grid-area: side; }\n.left .blue { flex: 1 0 64px; }\n.top .red { flex: 1 0 160px; }\n.top .yellow { flex: 0 0 112px; }\n\n/* ---------- the heart name: every lit dot is a little \u003c3 ---------- */\n.sign pre { font-family: var(--mono); font-weight: 700; line-height: 1.22; white-space: pre; color: var(--yellow); }\n.sign .big { font-size: min(16px, calc(100cqw / 99)); }\n.sign .small { display: none; font-size: min(16px, calc(100cqw / 22.8)); }\n.sign b { color: var(--ink); }\n.sign b.h { color: var(--pink); animation: blink 1.6s steps(1) infinite; }\n@keyframes blink { 50% { color: var(--blue); } }\n@container (max-width: 680px) { .sign .big { display: none; } .sign .small { display: block; } }\n.caption { margin-top: 16px; }\n.caption b { font-weight: inherit; color: var(--pink); }\n\n.hello p { margin-top: 24px; max-width: 34em; }\n.writing { text-wrap: pretty; }\n\n/* ---------- KES FM: speaker | deck, the deck split again into display and keys ---------- */\n.fm { container-type: inline-size; display: grid; grid-template-columns: var(--speaker) minmax(0, 1fr); grid-template-rows: auto auto 1fr; column-gap: var(--line); background: var(--ink); min-width: 0; }\n.fm > * { background: var(--paper); min-width: 0; }\n.art { font: 13px/1.15 var(--mono); white-space: pre; color: var(--ink); }\n.fm .stack { grid-column: 1; grid-row: 1; font-size: min(13px, calc((100cqw - 2 * var(--pad)) / 22.6)); padding: var(--pad) 0 0 max(var(--pad), calc((100% - 22.3em) / 2)); }\n.stack .c, .stack .b, .stack .i { color: var(--ink); }\n.stack .p, .stack .y { color: var(--pink); }\n.stack .g { color: var(--blue); }\n.tower.lit .p, .tower.lit .y { color: var(--blue); }\n.stack .sound.thump { animation: thump .35s steps(1); }\n@keyframes thump { 0% { color: var(--pink); } }\n#fm-h { grid-column: 1; grid-row: 2; font: 400 13px/24px var(--mono); padding: 24px var(--pad) 0; }\n.ident { grid-column: 1; grid-row: 3; padding: 8px var(--pad) var(--pad); }\n.deck { grid-column: 2; grid-row: 1 / -1; display: flex; flex-direction: column; background: var(--ink); }\n.lcd { background: var(--paper); padding: var(--pad); margin-bottom: var(--line); font: 13px/24px var(--mono); }\n.lcd-top { display: flex; flex-wrap: wrap; justify-content: space-between; column-gap: 12px; }\n.status { color: var(--ink); }\nbody.on-air .status { color: var(--pink); }\n.ticker { overflow: hidden; white-space: nowrap; margin: 12px 0; }\n.ticker > div { display: inline-block; }\n.ticker span { padding-right: .5em; }\n.tracker { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); text-align: center; margin-bottom: 12px; }\n.tracker .rest { opacity: .35; }\n.tracker .rev { color: var(--pink); }\n.tracker .up { color: var(--blue); }\n.tracker .roll { text-decoration: underline; }\n.tracker .on { background: var(--yellow); color: var(--ink); }\n.lcd-info { display: flex; flex-wrap: wrap; column-gap: 12px; }\n.lcd-info .rev { color: var(--pink); }\n.lcd-info .up { color: var(--blue); }\n.keys { background: var(--paper); padding: var(--pad) var(--pad) 0; display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; }\n.keys > div { display: flex; flex-wrap: wrap; align-items: center; row-gap: 8px; }\n.keys .lbl { font: 13px/24px var(--mono); margin-right: .6em; }\n.keys button { font: 13px/22px var(--mono); color: var(--ink); background: var(--paper); border: 2px solid var(--ink); border-radius: 0; margin: 0; padding: 0 8px; cursor: pointer; }\n.keys > div > button + button { margin-left: -2px; }\n.keys button:hover { background: var(--pink); color: var(--ink); }\n.keys button[aria-pressed=\"true\"] { background: var(--ink); color: var(--paper); }\n.keys .go[aria-pressed=\"true\"] { background: var(--pink); color: var(--ink); }\n.vol { font: 13px/24px var(--mono); display: flex; align-items: center; gap: .5em; }\n.vol input { width: 96px; margin: 0; accent-color: var(--ink); }\n.textin { background: var(--paper); padding: 16px var(--pad) var(--pad); flex: 1 0 auto; font: 13px/24px var(--mono); overflow-wrap: anywhere; }\n.floatstop { position: fixed; right: 16px; bottom: 16px; z-index: 5; font: 13px/24px var(--mono); background: var(--ink); color: var(--paper); border: 0; border-radius: 0; padding: 8px 16px; cursor: pointer; }\n.floatstop:hover { background: var(--pink); color: var(--ink); }\n.floatstop[hidden] { display: none; }\n@keyframes run { to { translate: -50% 0; } }\n@media (prefers-reduced-motion: no-preference) { body.on-air .ticker > div { animation: run 70s linear infinite; } }\n\n/* ---------- the card, the three projects, more projects ---------- */\n.work { grid-template-columns: minmax(0, 36fr) minmax(0, 79fr) minmax(0, 26fr); grid-template-areas: \"card proj side\"; }\n.card { grid-area: card; display: flex; flex-direction: column; }\n.card .who { font-weight: 700; margin-top: 24px; }\n.card dl { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 12px; align-items: baseline; margin-top: 24px; }\n.card dt { font: 13px/24px var(--mono); }\n.card dd { overflow-wrap: anywhere; }\n.card .avail { margin-top: auto; padding-top: 32px; }\n.card .avail b { font-weight: inherit; color: var(--pink); }\n\n.projects { grid-area: proj; }\n.project { display: grid; grid-template-columns: var(--speaker) minmax(0, 1fr); gap: var(--line); flex: 1 0 auto; }\n.project.flip { grid-template-columns: minmax(0, 1fr) var(--speaker); }\n.project.flip .text { grid-column: 2; grid-row: 1; }\n.project.flip .photo { grid-column: 1; grid-row: 1; }\n.project h3 { margin-top: 8px; }\n.project .body { margin-top: 16px; text-wrap: pretty; }\n.photo { position: relative; min-height: 200px; background: var(--chalk); overflow: hidden; }\n.photo img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); }\n.project:hover .photo img { filter: none; }\n\n.work .chalk { flex: 1 0 0; }\n.work .black { flex: 0 0 88px; }\n\n/* ---------- everything else, as starred links ---------- */\n.links { grid-template-columns: minmax(0, 10fr) minmax(0, 56fr) minmax(0, 75fr); }\n.list h2 { margin-bottom: 12px; }\n.stars { list-style: \"☆ \"; padding: 0; }\n.stars li::marker { color: var(--ink); }\n.stars li:hover { list-style-type: \"★ \"; }\n.stars li:hover::marker { color: var(--pink); }\n.stars .meta { white-space: nowrap; }\n\n/* ---------- the end, and the garden along the bottom edge ---------- */\n.close { grid-template-columns: minmax(0, 36fr) minmax(0, 79fr) minmax(0, 26fr); grid-template-areas: \"thanks note mail\"; }\n.thanks { grid-area: thanks; }\n.note { grid-area: note; }\n.note p { max-width: 72ch; }\n.mail { grid-area: mail; overflow-wrap: anywhere; }\n.garden-wrap { container-type: inline-size; padding-block: 24px; }\n.garden { overflow: hidden; white-space: pre; font: 400 min(16px, calc(100cqw / 114))/1.2 var(--mono); color: var(--ink); }\n.garden b { font-weight: inherit; }\n.garden .rose { color: var(--pink); }\n.garden .peri { color: var(--blue); }\n.garden .lilac, .garden .stem { color: var(--ink); }\n\n/* ---------- medium screens: the same pieces, fewer columns ---------- */\n@media (max-width: 1259px) and (min-width: 760px) {\n  :root { --line: 8px; --pad: 24px; }\n  .top { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); grid-template-areas: \"name name\" \"left side\" \"fm fm\"; }\n  .left .blue { flex-basis: 48px; }\n  .top .red { flex-basis: 96px; }\n  .top .yellow { flex-basis: 56px; }\n  .work { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: \"proj proj\" \"card side\"; }\n  .links { grid-template-columns: 40px minmax(0, 1fr) minmax(0, 1fr); }\n  .close { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: \"thanks mail\" \"note note\"; }\n}\n\n/* ---------- phone: one stack of rectangles, colour kept as bands ---------- */\n@media (max-width: 759px) {\n  :root { --line: 6px; --pad: 20px; }\n  .band { grid-template-columns: minmax(0, 1fr); grid-template-areas: none; }\n  .band > * { grid-area: auto; }\n  .top > .col { display: contents; }\n  .top .name { order: 1; }\n  .top .red { order: 2; height: 56px; }\n  .top .hello { order: 3; }\n  .top .blue { order: 4; height: 24px; }\n  .top .fm { order: 5; }\n  .top .writing { order: 6; } n  --ink: #000;\n  --paper: #fff;\n  --blue: #2034ff;\n  --pink: #ff2d92;\n  --yellow: #ffd200;\n  --sans: \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n  --mono: ui-monospace, Menlo, Consolas, \"DejaVu Sans Mono\", \"Liberation Mono\", \"Courier New\", monospace;\n}\nhtml { background: var(--ink); color: var(--ink); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\nbody { margin: 0; min-height: 100vh; display: flex; flex-direction: column; gap: var(--line); background: var(--ink); font: 16px/24px var(--sans); }\nh1, h2, p, figure, pre { margin: 0; }\nh2 { font-size: inherit; }\n::selection { background: var(--pink); color: var(--ink); }\n\na { color: var(--blue); text-decoration-thickness: 1px; text-underline-offset: .2em; }\na:hover { background: var(--pink); color: var(--ink); text-decoration: none; }\na:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }\n\n.label { font: 400 13px/24px var(--mono); }\n.voice { font: 400 40px/48px var(--sans); letter-spacing: -.015em; }\n.heart { color: var(--pink); }\n\n/* ---------- rectangles in grids, black showing through the gaps ---------- */\n.band { display: grid; gap: var(--line); }\n.col { display: flex; flex-direction: column; gap: var(--line); min-width: 0; }\n.cell { background: var(--paper); padding: var(--pad); min-width: 0; }\n.plane.blue { background: var(--blue); }\n.plane.yellow { background: var(--yellow); }\n\n/* ---------- the top: home, the little computer, the title, how it works, one blue plane ---------- */\n.head { grid-template-columns: minmax(0, 30fr) minmax(0, 56fr) minmax(0, 34fr) minmax(0, 21fr); grid-template-areas: \"c1 intro how blue\"; }\n.head > .col { grid-area: c1; }\n.intro { grid-area: intro; }\n.how { grid-area: how; }\n.head .blue { grid-area: blue; }\n.pc-cell { flex: 1 0 auto; }\n.art { font: 13px/1.15 var(--mono); white-space: pre; color: var(--ink); }\n.art b { font: inherit; color: var(--pink); }\n.intro p { margin-top: 24px; max-width: 34em; text-wrap: pretty; }\n.how p + p { margin-top: 12px; }\n\n/* ---------- the pieces: newest first, poured down columns, a black line between each ---------- */\n.pieces { columns: 3; column-gap: var(--line); column-rule: var(--line) solid var(--ink); background: var(--paper); margin-top: calc(-1 * var(--line)); }\n.piece { break-inside: avoid; border-top: var(--line) solid var(--ink); padding: var(--pad); background: var(--paper); }\n.piece-title { font-weight: 700; }\n.piece-body { margin-top: 12px; max-width: 34em; text-wrap: pretty; }\n.piece-body p + p { margin-top: 24px; }\n\n/* ---------- the end, with the garden along the bottom edge ---------- */\n.end { grid-template-columns: minmax(0, 30fr) minmax(0, 56fr) minmax(0, 34fr) minmax(0, 21fr); grid-template-areas: \"note note note yellow\" \"garden garden garden garden\"; }\n.end .note { grid-area: note; }\n.end .yellow { grid-area: yellow; }\n.garden-wrap { grid-area: garden; container-type: inline-size; padding-block: 24px; }\n.garden { overflow: hidden; white-space: pre; font: 400 min(16px, calc(100cqw / 114))/1.2 var(--mono); color: var(--ink); }\n.garden b { font-weight: inherit; }\n.garden .rose { color: var(--pink); }\n.garden .peri { color: var(--blue); }\n.garden .lilac, .garden .stem { color: var(--ink); }\n\n@media (max-width: 1259px) and (min-width: 760px) {\n  :root { --line: 8px; --pad: 24px; }\n  .head { grid-template-columns: minmax(0, 30fr) minmax(0, 56fr) minmax(0, 12fr); grid-template-areas: \"c1 intro blue\" \"c1 how blue\"; }\n  .pieces { columns: 2; }\n  .end { grid-template-columns: minmax(0, 86fr) minmax(0, 12fr); grid-template-areas: \"note yellow\" \"garden garden\"; }\n}\n@media (max-width: 759px) {\n  :root { --line: 6px; --pad: 20px; }\n  .band { grid-template-columns: minmax(0, 1fr); grid-template-areas: none; }\n  .band > *, .band .cell, .band .plane { grid-area: auto; }\n  .head > .col { display: contents; }\n  .head .home { order: 1; }\n  .head .intro { order: 2; }\n  .head .how { orde ttom); content sits in clean blocks cut out of it. every block edge lands on a character\n   cell: widths and gaps are counted in ch, heights in rows. greys, plus blue links and a hot pink highlight. */\n:root {\n  --ink: #000;\n  --paper: #fff;\n  --field: #b8b8b8;  /* the field: always quieter than the text */\n  --soft: #6b6b6b;   /* labels */\n  --blue: #0a33ff;   /* links */\n  --hot: #ff2e93;    /* hover highlight, and the hearts */\n  --mono: ui-monospace, Menlo, Consolas, \"DejaVu Sans Mono\", \"Liberation Mono\", \"Courier New\", monospace;\n  --r: 18px;         /* one row */\n}\n* { box-sizing: border-box; }\nhtml { overflow-x: clip; background: var(--paper); color: var(--ink); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\nbody { margin: 0; position: relative; overflow-x: clip; font: 13px/18px var(--mono); background: var(--paper); }\nh1, h2, p, ul, dl, dd, figure, pre { margin: 0; padding: 0; font: inherit; }\nh1, h2 { font-weight: 700; }\nul { list-style: none; }\na { color: var(--blue); text-decoration-thickness: 1px; text-underline-offset: 3px; overflow-wrap: anywhere; }\na:hover { background: var(--hot); color: var(--ink); }\na:focus-visible, button:focus-visible { outline: none; background: var(--blue); color: var(--paper); }\n::selection { background: var(--hot); color: var(--ink); }\n.soft { color: var(--soft); }\n.heart { color: var(--hot); }\n\n/* ---------- the field ---------- */\n.field { position: absolute; inset: 0; z-index: 0; overflow: hidden; contain: strict; white-space: pre; color: var(--field);\n  pointer-events: none; user-select: none; -webkit-user-select: none; }\n\n/* ---------- the grid: 40ch columns, 5ch gutters, 2-row gaps. 1, 2, 3 or 4 columns ---------- */\n.page, main { display: grid; grid-template-columns: minmax(0, 1fr); row-gap: calc(2 * var(--r)); align-items: start; }\n.page { position: relative; z-index: 1; width: calc(100% - 4ch); width: round(down, 100% - 4ch, 1ch); margin-left: 2ch; padding-top: calc(2 * var(--r)); }\nmain { grid-column: 1 / -1; grid-auto-flow: row dense; }\n.blk { background: var(--paper); padding: var(--r) 2ch; }\n@media (min-width: 720px) {\n  .page { --n: 2; width: calc(var(--n) * 45ch - 5ch); margin-left: max(2ch, round(down, (100% - var(--n) * 45ch + 5ch) / 2, 1ch)); }\n  .page, main { grid-template-columns: repeat(var(--n), 40ch); column-gap: 5ch; }\n}\n@media (min-width: 1080px) { .page { --n: 3; } }\n@media (min-width: 1420px) { .page { --n: 4; } }\n\n/* ---------- the sign: kes inkersole in \u003c3s ---------- */\n.sign { grid-column: 1 / -1; padding: var(--r) 1ch; container-type: inline-size; }\n.sign pre { color: var(--field); }\n.sign s { text-decoration: none; color: var(--soft); }\n.sign b { color: var(--ink); }\n.sign b.h { color: var(--hot); animation: blink 1.6s steps(1) infinite; }\nbody.on-air .sign b.h { animation-duration: .706s; } /* on air, the little heart blinks on the beat */\n@keyframes blink { 50% { color: var(--blue); } }\n.sign .big { display: none; }\n.sign .small { font-size: min(13px, 100cqw / 25.9); }\n@media (min-width: 720px) and (max-width: 1079px) { .sign { justify-self: start; width: 45ch; } }\n@media (min-width: 1080px) {\n  .sign .small { display: none; }\n  .sign .big { display: block; font-size: calc(13px * 128 / 169); line-height: calc(7 * var(--r) / 11); }\n}\n@media (min-width: 1420px) { .sign { padding-inline: 3ch; } .sign .big { font-size: 13px; line-height: var(--r); } }\n\n/* ---------- hello ---------- */\n.hi p:not(.soft) { margin-top: var(--r); }\n\n/* ---------- KES FM: speaker on the left, readout beside it, keys underneath ---------- */\n.fm { display: grid; grid-template-columns: 37ch 3ch minmax(0, 1fr); grid-template-rows: auto auto auto 1fr auto auto; }\n@media (min-width: 720px) { .fm { grid-column: span 2; } }\n.speaker { grid-area: 1 / 1 / 5 / 2; }\n#fm-h { grid-area: 1 / 3; }\n.ident { grid-area: 2 / 3; margin-top: var(--r); }\n.deck { display: contents; }\n.lcd { grid-area: 3 / 3; margin-top: var(--r); }\n.keys { grid-area: 5 / 1 / 6 / -1; margin-top: var(--r); }\n.textin { grid-area: 6 / 1 / 7 / -1; margin-top: var(--r); }\n.stack .c, .stack .i { color: var(--ink); }\n.stack .p, .stack .y { color: var(--hot); }\n.stack .g, .stack .b { color: var(--blue); }\n.stack .sound.thump { animation: thump .3s steps(1); }\n@keyframes thump { 0% { color: var(--hot); } }\n\n.lcd-top { display: flex; flex-wrap: wrap; justify-content: space-between; column-gap: 2ch; }\nbody.on-air .status { background: var(--hot); }\n.ticker { overflow: hidden; white-space: nowrap; color: var(--soft); }\n.ticker > div { display: inline-block; }\n.ticker span { padding-right: 1ch; }\n.tracker { display: grid; grid-template-columns: repeat(8, minmax(0, 5ch)); }\n.tracker span { justify-self: start; }\n.tracker .rest { color: var(--field); }\n.tracker .rev { color: var(--hot); }\n.tracker .up { color: var(--blue); }\n.tracker .roll { text-decoration: underline; }\n.tracker .on { background: var(--hot); color: var(--ink); }\n.lcd-info { display: flex; flex-wrap: wrap; column-gap: 2ch; color: var(--soft); }\n.lcd-info .rev { color: var(--hot); }\n.lcd-info .up { color: var(--blue); }\n@keyframes run { to { translate: -50% 0; } }\n@media (prefers-reduced-motion: no-preference) {\n  .ticker > div { animation: run 70s linear infinite paused; }\n  body.on-air .ticker > div { animation-play-state: running; }\n}\n\n/* bracketed text buttons */\n.keys { display: flex; flex-wrap: wrap; column-gap: 3ch; }\n.keys > div, .vol { display: flex; flex-wrap: wrap; column-gap: 1ch; }\n.keys .lbl, .vol { color: var(--soft); }\n.keys button, .floatstop { font: inherit; height: var(--r); color: var(--ink); background: none; border: 0; border-radius: 0; margin: 0; padding: 0; cursor: pointer; }\n.keys button::before, .floatstop::before { content: \"[\"; color: var(--soft); }\n.keys button::after, .floatstop::after { content: \"]\"; color: var(--soft); }\n.keys .go { font-weight: 700; }\n.keys button[aria-pressed=\"true\"] { background: var(--ink); color: var(--paper); }\n.keys button[aria-pressed=\"true\"]::before, .keys button[aria-pressed=\"true\"]::after { color: inherit; }\n.keys button:hover, .floatstop:hover { background: var(--hot); color: var(--ink); }\n.keys button:focus-visible::before, .keys button:focus-visible::after, .keys button:hover::before, .keys button:hover::after { color: inherit; }\n.vol { position: relative; }\n.vol .bar { color: var(--ink); }\n.vol input { position: absolute; left: 4ch; top: 0; width: 12ch; height: var(--r); margin: 0; opacity: 0; cursor: pointer; }\n.vol:hover .bar { background: var(--hot); }\n.vol:focus-within .bar { background: var(--blue); color: var(--paper); }\n.floatstop { position: fixed; right: 2ch; bottom: var(--r); z-index: 5; background: var(--paper); padding: 0 1ch; }\n.floatstop[hidden] { display: none; }\n\n@media (max-width: 719px) {\n  .fm { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; }\n  .speaker, #fm-h, .ident, .lcd, .keys, .textin { grid-area: auto; }\n  #fm-h { margin-top: var(--r); }\n}\n\n/* ---------- the card ---------- */\n.card dl { margin-top: var(--r); }\n.card dt { display: inline; color: var(--soft); }\n.card dd { display: inline; }\n.bunny { margin-top: var(--r); width: fit-content; }\n.bunny .p { color: var(--hot); }\n.bunny:hover { animation: hop .5s steps(1); }\n@keyframes hop { 30%, 70% { transform: translateY(calc(-1 * var(--r))); } }\n.card .mail { margin-top: var(--r); }\n\n/* ---------- three projects; the pictures are characters too ---------- */\n.meta span + span::before { content: \" · \"; }\n.pic { margin-top: var(--r); height: calc(10 * var(--r)); line-height: 12px; overflow: hidden; color: var(--ink); }\n.proj h2 { margin-top: var(--r); }\n\n/* ---------- everything else, starred ---------- */\n.list h2 span { color: var(--hot); font-weight: 400; }\n.list ul { margin-top: var(--r); }\n.list li { position: relative; padding-left: 2ch; }\n.list li::before { content: \"☆\"; position: absolute; left: 0; }\n.list li:hover::before { content: \"★\"; color: var(--hot); }\n\n/* ---------- the end ---------- */\n.note p + p { margin-top: var(--r); }\n@media (min-width: 720px) { .note { grid-column: 1 / -1; } }\n@media (min-width: 1080px) { .note { grid-column: 2 / span 2; } }\n.garden-box { position: relative; z-index: 1; margin-top: calc(2 * var(--r)); padding-top: var(--r); background: var(--paper); overflow: hidden; }\n.garden { line-height: 15px; }\n.garden b { font-weight: inherit; }\n.garden .rose { color: var(--hot); }\n.garden .lilac, .garden .peri { color: var(--blue); }\n\n@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cpre class=\"field tower\" id=\"field\" aria-hidden=\"true\">\u003c/pre>\n\n\u003cdiv class=\"page\">\n\n\u003cheader class=\"blk sign\" role=\"img\" aria-label=\"kes inkersole, spelled out in tiny \u003c3 hearts on a dot-matrix screen\">\n\u003cpre class=\"big\">\u003cs> .---------------------------------------------------------------------------------------------------------------------------------------------------------------------. \u003c/s>\n\u003cs> |\u003c/s> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .\u003cs> | \u003c/s>\n\u003cs> |\u003c/s> . .\u003cb>&lt;3\u003c/b> . . . . . . . . . . . . . . . . . . . . .\u003cb>&lt;3\u003c/b> . . . . . . . .\u003cb>&lt;3\u003c/b> . . . . . . . . . . . . . . . . . . . . . . . . . . . . .\u003cb>&lt;3&lt;3\u003c/b> . . . . . . . . . . . . . . . . .\u003cs> | \u003c/s>\n\u003cs> |\u003c/s> . .\u003cb>&lt;3\u003c/b> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .\u003cb>&lt;3\u003c/b> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .\u003cb>&lt;3\u003c/b> . . . . . . . . .\u003cb class=\"h\ eaque ipsa quae ab illo inventore veritatis et quasi architecto beatae vitae dicta sunt explicabo.\u003c/p>\n    \u003cp>Nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit aut fugit, sed quia consequuntur magni dolores eos qui ratione voluptatem sequi nesciunt.\u003c/p>\n    \u003cp>Neque porro quisquam est, qui dolorem ipsum quia dolor sit amet, consectetur, adipisci velit.\u003c/p>\n  \u003c/div>\n\u003c/article>\n\n\u003carticle class=\"blk piece\" id=\"piece-008\">\n  \u003cp class=\"meta soft\">\u003cspan class=\"no\">008\u003c/span> \u003ctime datetime=\"2026-09-14\">14 september 2026\u003c/time>\u003c/p>\n  \u003ch2>ut enim ad minima\u003c/h2>\n  \u003cdiv class=\"text\">\n    \u003cp>Ut enim ad minima veniam, quis nostrum exercitationem ullam corporis suscipit laboriosam. Nisi ut aliquid ex ea commodi consequatur?\u003c/p>\n  \u003c/div>\n\u003c/article>\n\n\u003carticle class=\"blk piece\" id=\"piece-007\">\n  \u003cp class=\"meta soft\">\u003cspan class=\"no\">007\u003c/span> \u003ctime datetime=\"2026-09-02\">2 september 2026\u003c/time>\u003c/p>\n  \u003ch2>quis autem vel eum\u003c/h2>\n  \u003cdiv class=\"text\">\n    \u003cp>Quis autem vel eum iure reprehenderit qui in ea voluptate velit esse quam nihil molestiae consequatur, vel illum qui dolorem eum fugiat quo voluptas nulla pariatur. At vero eos et accusamus et iusto odio dignissimos ducimus qui blanditiis praesentium voluptatum deleniti atque corrupti quos dolores et quas molestias excepturi sint.\u003c/p>\n  \u003c/div>\n\u003c/article>\n\n\u003carticle class=\"blk piece\" id=\"piece-006\">\n  \u003cp class=\"meta soft\">\u003cspan class=\"no\">006\u003c/span> \u003ctime datetime=\"2026-08-26\">26 august 2026\u003c/time>\u003c/p>\n  \u003ch2>at vero eos\u003c/h2>\n  \u003cdiv class=\"text\">\n    \u003cp>at vero eos\u003cbr>et accusamus\u003cbr>et iusto odio\u003cbr>dignissimos ducimus\u003c/p>\n  \u003c/div>\n\u003c/article>\n\n\u003carticle class=\"blk piece\" id=\"piece-005\">\n  \u003cp class=\"meta soft\">\u003cspan class=\"no\">005\u003c/span> \u003ctime datetime=\"2026-08-11\">11 august 2026\u003c/time>\u003c/p>\n  \u003ch2>nam libero\u003c/h2>\n  \u003cdiv class=\"text\">\n    \u003cp>Nam libero tempore, cum soluta nobis est eligendi optio cumque nihil impedit.\u003c/p>\n  \u003c/div>\n\u003c/article>\n\n\u003carticle class=\"blk piece\" id=\"piece-004\">\n  \u003cp class=\"meta soft\">\u003cspan class=\"no\">004\u003c/span> \u003ctime datetime=\"2026-07-30\">30 july 2026\u003c/time>\u003c/p>\n  \u003ch2>temporibus autem\u003c/h2>\n  \u003cdiv class=\"text\">\n    \u003cp>Temporibus autem quibusdam et aut officiis debitis aut rerum necessitatibus saepe eveniet ut et voluptates repudiandae sint et molestiae non recusandae.\u003c/p>\n    \u003cp>Itaque earum rerum hic tenetur a sapiente delectus, ut aut reiciendis voluptatibus maiores alias consequatur aut perferendis doloribus asperiores repellat.\u003c/p>\n  \u003c/div>\n\u003c/article>\n\n\u003carticle class=\"blk piece\" id=\"piece-003\">\n  \u003cp class=\"meta soft\">\u003cspan class=\"no\">003\u003c/span> \u003ctime datetime=\"2026-07-12\">12 july 2026\u003c/time>\u003c/p>\n  \u003ch2>itaque earum rerum\u003c/h2>\n  \u003cdiv class=\"text\">\n    \u003cp>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.\u003c/p>\n    \u003cp>Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.\u003c/p>\n    \u003cp>Sed ut perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium. Nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit aut fugit.\u003c/p>\n    \u003cp>Neque porro quisquam est.\u003c/p>\n  \u003c/div>\n\u00 g.selectNodeContents(F); CELL = rg.getBoundingClientRect().width / (2 * P) || CELL;\n  function hash(a, b) { var h = Math.imul(a, 374761393) + Math.imul(b, 668265263) | 0; h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; }\n  function build() {\n    var out = [];\n    for (var r = 0; r \u003c rows; r++) {\n      var t = r / (rows - 1 || 1), d = t \u003c .1 ? 0 : Math.min(.97, Math.pow((t - .1) / .85, 1.6)), s = \"\", c = 0, slip = 0;\n      while (c \u003c cols) {\n        var a = hash(r, 3 * c), u = hash(r, 3 * c + 1), k = hash(r, 3 * c + 2), n = 2 + (a * a * 26 | 0);\n        for (; n-- && c \u003c cols; c++) {\n          var x = c - off;\n          s += u \u003c d ? (k \u003c .12 ? N[k * 1e4 % N.length | 0] : k \u003c .25 ? M[((x + (k * 1e3 | 0)) % P + P) % P] : N[hash(c, r + 9e3) * N.length | 0])\n                     : M[((x + slip) % P + P) % P];\n        }\n        if (u \u003c d && k > .8) slip += 1 + (k * 1e3 | 0) % 7;   // a dropped byte or two: the columns slide\n      }\n      out.push(s);\n    }\n    return out.join(\"\\n\");\n  }\n  function fit() {\n    var c = Math.ceil(document.documentElement.clientWidth / CELL) + 1, r = Math.ceil(document.body.offsetHeight / R),\n        o = Math.round(page.getBoundingClientRect().left / CELL);\n    if (c === cols && r === rows && o === off) return;\n    cols = c; rows = r; off = o;\n    F.textContent = build();\n  }\n  fit();\n  if (window.ResizeObserver) new ResizeObserver(fit).observe(document.body); else addEventListener(\"resize\", fit);\n})();\n\u003c/script>\n\u003cscript>(function(){\nvar PAGES=[\"index.html\", \"writing.html\"];\ndocument.addEventListener('click',function(e){\n  var a=e.target.closest&&e.target.closest('a[href]');\n  if(!a||e.defaultPrevented)return;\n  var h=a.getAttribute('href'),m=h.replace(/^\\.\\//,'').split('#'),p=m[0],id=m[1]||'';\n  if(p===''&&h.charAt(0)==='#'){\n    var t=id&&document.getElementById(decodeURIComponent(id));\n    if(id&&!t)retu ---------------------------------------------------- */\n:root {\n  --r: 18px;\n  --ink: #000;\n  --paper: #fff;\n  --soft: #666;      /* labels and small print */\n  --field: #c4c4c4;  /* the field: quieter than anything you read */\n  --dots: #a6a6a6;   /* the dots behind the name */\n  --blue: #0038ff;   /* links */\n  --pink: #ff3399;   /* the highlight under your mouse, and on air */\n  --mono: ui-monospace, Menlo, Monaco, Consolas, \"Liberation Mono\", \"Courier New\", monospace;\n  color-scheme: light;\n}\nhtml { background: var(--paper); color: var(--ink); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\nbody { margin: 0; position: relative; min-height: 100vh; overflow-x: clip; font: 13px/18px var(--mono); }\nh1, h2, h3, p, ul, dl, dd, figure, pre { margin: 0; }\nh2, h3 { font: inherit; font-weight: 700; }\npre { font: inherit; white-space: pre; }\nul { padding: 0; list-style: none; }\n::selection { background: var(--pink); color: var(--ink); }\n\na { color: var(--blue); text-decoration-thickness: 1px; text-underline-offset: 3px; }\na:visited { color: var(--blue); }\na:hover, a:focus-visible { background: var(--pink); color: var(--ink); text-decoration: none; outline: none; }\n.m { color: var(--soft); }\n.big2 { font-size: 26px; line-height: calc(var(--r) * 2); font-weight: 400; }\n\n/* ---------- the field (drawn by the script at the bottom) ---------- */\n.field { position: absolute; inset: 0; z-index: 0; overflow: hidden; color: var(--field); pointer-events: none; user-select: none; -webkit-user-select: none; }\n\n/* ---------- the frame: every width and gap is whole cells ---------- */\n.page { position: relative; z-index: 1; container: page / inline-size; padding: calc(var(--r) * 2) 0 calc(var(--r) * 4); }\n.frame { --fl: 2ch; margin-left: var(--fl); width: calc(100cqw - 4ch); width: round(down, 100cqw - 4ch, 1ch); }\n.blk { padding: var(--r) 2ch; }\n.band { margin-top: calc(var(--r) * 4); }\n.cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: calc(var(--r) * 2) 4ch; align-items: start; }\n\n/* ---------- the name, in \u003c3s ---------- */\n.sign { width: fit-content; max-width: 100%; box-sizing: border-box; overflow: hidden; }\n.sign pre { color: var(--dots); }\n.sign b { font-weight: inherit; color: var(--ink); }\n.sign b.h { color: var(--blue); animation: blink 1.6s steps(1) infinite; }\n@keyframes blink { 50% { color: var(--pink); } }\n.sign .big { display: none; }\n\n/* ---------- hello, the radio and the card ---------- */\n.top { margin-top: calc(var(--r) * 2); display: grid; grid-template-columns: minmax(0, 1fr); row-gap: calc(var(--r) * 2); align-items: start; }\n.cola { display: grid; row-gap: calc(var(--r) * 2); }\n.hello .welcome { margin: var(--r) 0; }\n\n.card .name { margin-bottom: var(--r); }\n.card .name .m { font-weight: 400; }\n.card dt { color: var(--soft); }\n.card dd + dt { margin-top: var(--r); }\n.bunny { margin-top: calc(var(--r) * 2); width: fit-content; }\n.bunny:hover { animation: hop .5s; }\n@keyframes hop { 40% { transform: translateY(-4px); } }\n.contact { margin-top: var(--r); }\n\n/* ---------- KES FM, skinned in characters ---------- */\n.fm { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--r) 3ch; align-items: start; }\n.fm-face { overflow: hidden; }\nbody:not(.on-air) .stack .w { visibility: hidden; }      /* the sound waves only come out on air */\nbody.on-air .stack .p { color: var(--pink); }\nbody.on-air .stack .w { color: var(--blue); }\n.sound.thump { animation: thump .2s ease-out; }\n@keyframes thump { from { transform: translateY(-3px); } }\n.ident { margin-top: var(--r); }\n.deck { margin-top: var(--r); }\n.lcd-top { display: flex; flex-wrap: wrap; justify-content: space-between; column-gap: 2ch; }\n.status { padding: 0 1ch; margin-right: -1ch; }\nbody.on-air .status { background: var(--pink); }\n.ticker { overflow: hidden; white-space: nowrap; color: var(--soft); }\n.ticker > div { display: inline-block; }\n.ticker span { padding-right: 1ch; }\n@keyframes run { to { translate: -50% 0; } }\n@media (prefers-reduced-motion: no-preference) { body.on-air .ticker > div { animation: run 70s linear infinite; } }\n.tracker { display: grid; grid-template-columns: repeat(8, 3ch); justify-items: start; }\n.tracker .rest { opacity: .35; }\n.tracker .rev { color: var(--pink); }\n.tracker .up { color: var(--blue); }\n.tracker .roll { text-decoration: underline; }\n.tracker .on { background: var(--pink); color: var(--ink); }\n.lcd-info { display: flex; flex-wrap: wrap; column-gap: 2ch; color: var(--soft); }\n.lcd-info .rev { color: var(--pink); }\n.lcd-info .up { color: var(--blue); }\n\n.keys { margin-top: var(--r); }\n.keys > div, .keys > label { display: block; padding-left: 6ch; text-indent: -6ch; }\n.keys .lbl { display: inline-block; width: 6ch; text-indent: 0; color: var(--soft); }\n.keys button { font: inherit; line-height: var(--r); color: var(--ink); background: none; border: 0; border-radius: 0; padding: 0; margin: 0 1ch 0 0; cursor: pointer; text-indent: 0; vertical-align: top; }\n.keys button::before { content: \"[\"; }\n.keys button::after { content: \"]\"; }\n.keys button[aria-pressed=\"true\"] { background: var(--ink); color: var(--paper); }\n.keys .go[aria-pressed=\"true\"] { background: var(--pink); color: var(--ink); }\n.keys button:hover, .keys button:focus-visible { background: var(--pink); color: var(--ink); outline: none; }\n.vol { position: relative; color: var(--soft); }\n.vol input { position: absolute; left: 6ch; top: 0; width: 19ch; height: var(--r); margin: 0; padding: 0; opacity: 0; cursor: pointer; }\n.volbar { margin-left: 2ch; color: var(--ink); }\n.vol:focus-within .volbar, .vol:hover .volbar { background: var(--pink); }\n.textin { margin-top: var(--r); }\n.floatstop { position: fixed; right: 2ch; bottom: var(--r); z-index: 5; font: inherit; line-height: var(--r); background: var(--pink); color: var(--ink); border: 0; border-radius: 0; padding: 0 1ch; cursor: pointer; }\n.floatstop::before { content: \"[\"; }\n.floatstop::after { content: \"]\"; }\n.floatstop[hidden] { display: none; }\n\n/* ---------- three projects ---------- */\n.label { width: fit-content; padding: 0 2ch; }\n.projects .cols { margin-top: var(--r); }\n.what { padding-left: 4ch; }\n.what .n { display: inline-block; width: 4ch; margin-left: -4ch; color: var(--soft); }\n.what h3 { display: inline; }\n.pic { margin-top: var(--r); }\n.pic pre { overflow: hidden; color: var(--ink); }\n.note { margin-top: var(--r); }\n\n/* ---------- everything else, as starred links ---------- */\n.stars + h2 { margin-top: var(--r); }\n.stars li { padding-left: 2ch; text-indent: -2ch; }\n.stars li::before { content: \"\\2606\"; display: inline-block; width: 2ch; text-indent: 0; }\n.stars li:hover::before { content: \"\\2605\"; color: var(--pink); }\n\n/* ---------- the end ---------- */\n.bye { width: fit-content; }\n.garden-bed { position: relative; z-index: 1; padding-top: var(--r); overflow: hidden; }\n.garden { overflow: hidden; }\n\n/* ---------- a wider screen: two columns of 48 cells ---------- */\n@container page (min-width: 104ch) {\n  .frame { --fl: round(down, (100cqw - 100ch) / 2, 1ch); width: 100ch; }\n  .top { grid-template-columns: 48ch 48ch; column-gap: 4ch; grid-template-areas: \"a c\" \"f f\"; }\n  .cola { grid-area: a; } .fm { grid-area: f; } .card { grid-area: c; }\n  .fm { grid-template-columns: 37ch minmax(0, 1fr); }\n  .tracker { grid-template-columns: repeat(16, 3ch); }\n  .cols { grid-template-columns: 48ch 48ch; }\n  .foot .bye { grid-column: 2; }\n}\n/* ---------- a big screen: 44 | 92 | 32, then three columns of 56 ---------- */\n@container page (min-width: 180ch) {\n  .frame { --fl: round(down, (100cqw - 176ch) / 2, 1ch); width: 176ch; }\n  .sign { width: auto; padding-left: 6ch; padding-right: 6ch; }\n  .sign .big { display: block; }\n  .sign .small { display: none; }\n  .top { grid-template-columns: 44ch 92ch 32ch; grid-template-areas: \"a f c\"; }\n  .cols { grid-template-columns: 56ch 56ch 56ch; }\n  .foot .bye { grid-column: 3; }\n}\n@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cpre class=\"field\" id=\"field\" aria-hidden=\"true\">\u003c/pre>\n\n\u003cdiv class=\"page\">\n\u003cdiv class=\"frame\">\n\n\u003cheader class=\"sign blk\" role=\"img\" aria-label=\"kes inkersole, spelled out in tiny \u003c3 hearts on a dot-matrix screen\">\n\u003cpre class=\"big\">. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .\n. .\u003cb>&lt;3\u003c/b> . . . . . . . . . . . . . . . . . . . . .\u003cb>&lt;3\u003c/b> . . . . . . . .\u003cb>&lt;3\u003c/b> . . . . . . . . . . . . . . . . . . . . . . . . . . . . .\u003cb>&lt;3&lt;3\u003c/b> . . . . . . . . . . . . . . . . .\n. .\u003cb>&lt;3\u003c/b> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .\u003cb>&lt;3\u003c/b> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .\u003cb>&lt;3\u003c/b> . . . . . . . . .\u003cb class=\"h\">&lt;3&lt;3\u003c/b> .\u003cb class=\"h\">&lt;3&lt;3\u003c/b> . . .\n. .\u003cb>&lt;3\u003c/b> . .\u003cb>&lt;3\u003c/b> . . .\u003cb>&lt;3&lt;3&lt;3\u003c/b> . . .\u003cb>&lt;3&lt;3&lt;3&lt;3\u003c/b> . . . .\u003cb>&lt;3&lt;3\u003c/b> . .\u003cb>&lt;3\u003c/b> .\u003cb>&lt;3&lt;3\u003c/b> . .\u003cb>&lt;3\u003c/b> . .\u003cb>&lt;3\u003c/b> . . .\u003cb>&lt;3&lt;3&lt;3\u003c/b> . .\u003cb>&lt;3\u003c/b> .\u003cb>&lt;3&lt;3\u003c/b> . . .\u003cb>&lt;3&lt;3&lt;3&lt;3\u003c/b> . .\u003cb>&lt;3&lt;3&lt;3\u003c/b> . . .\u003cb>&lt;3\u003c/b> . . .\u003cb>&lt;3&lt;3&lt;3\u003c/b> . .\u003cb class=\"h\">&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3\u003c/b> . .\n. .\u003cb>&lt;3\u003c/b> .\u003cb>&lt;3\u003c/b> . . .\u003cb>&lt;3\u003c/b> . . .\u003cb>&lt;3\u003c/b> .\u003cb>&lt;3\u003c/b> . . . . . . . . .\u003cb>&lt;3\u003c/b> . .\u003cb>&lt;3&lt;3\u003c/b> . .\u0 dth / 200 || cw;\n    rh = parseFloat(getComputedStyle(F).lineHeight) || rh;\n    F.textContent = \"\";\n    pics.forEach(function (draw) { draw(); });\n    var box = F.getBoundingClientRect(), nc = Math.ceil(box.width / cw), nr = Math.ceil(box.height / rh);\n    if (nc !== cols || nr !== rows) {\n      cols = nc; rows = nr; noise = [];\n      for (var r = 0; r \u003c rows; r++) noise.push(noiseRow(r));\n    }\n    holes = [];\n    [].forEach.call(d.querySelectorAll(\".blk\"), function (el) {\n      var b = el.getBoundingClientRect();\n      if (!b.width || !b.height) return;\n      var c0 = Math.max(0, Math.floor((b.left - box.left) / cw + .05)), c1 = Math.min(cols, Math.ceil((b.right - box.left) / cw - .05));\n      var r0 = Math.max(0, Math.floor((b.top - box.top) / rh + .05)), r1 = Math.min(rows, Math.ceil((b.bottom - box.top) / rh - .05));\n      for (var r = r0; r \u003c r1; r++) (holes[r] = holes[r] || []).push([c0, c1]);\n    });\n    paint();\n  }\n  function later() { if (!queued) queued = requestAnimationFrame(build); }\n\n  // the project pictures, drawn in characters on the same grid\n  [].forEach.call(d.querySelectorAll(\".pic[data-src]\"), function (fig) {\n    var pre = fig.querySelector(\"pre\"), photo = null, img = new Image();\n    function draw() {\n      var w = Math.max(8, Math.floor(pre.getBoundingClientRect().width / cw + .02)), h = Math.max(4, Math.round(w * cw / 1.5 / rh));\n      var lum = null, out = [], i, x, y, s;\n      if (photo) try {\n        var cv = d.createElement(\"canvas\"), g = cv.getContext(\"2d\");\n        cv.width = w; cv.height = h; g.drawImage(photo, 0, 0, w, h);\n        var px = g.getImageData(0, 0, w, h).data, lo = 1, hi = 0;\n        lum = [];\n        for (i = 0; i \u003c w * h; i++) {\n          var v = (px[i * 4] * .3 + px[i * 4 + 1] * .59 + px[i * 4 + 2] * .11) / 255;\n          lum.push(v); if (v \u003c lo) lo = v; if (v > hi) hi = v;\n        }\n        for (i = 0; i \u003c lum.length; i++) lum[i] = (lum[i] - lo) / (hi - lo || 1);\n      } catch (err) { lum = null; }\n      for (y = 0; y \u003c h; y++) {\n        s = \"\";\n        for (x = 0; x \u003c w; x++) {\n          var L = lum ? lum[y * w + x] : 1 - .42 * Math.pow((x / w + y / h) / 2, 1.4);   // no photo yet: a soft dithered ramp\n          s += RAMP.charAt(Math.round((1 - L) * (RAMP.length - 1)));\n        }\n        out.push(s);\n      }\n      if (!lum) {\n        var tag = \" placeholder photo \", m = Math.floor(h / 2), at = Math.max(0, Math.floor((w - tag.length) / 2));\n        out[m] = (out[m].slice(0, at) + tag + out[m].slice(at + tag.length)).slice(0, w);\n      }\n      pre.textContent = out.join(\"\\n\");\n    }\n    pics.push(draw);\n    img.crossOrigin = \"anonymous\";\n    img.onload = function () { photo = img; later(); };\n    img.src = fig.getAttribute(\"data-src\");\n  });\n\n  // KES FM's volume, as a row of characters over the real slider\n  var vol = d.getElementById(\"vol\"), bar = d.querySelector(\".volbar\");\n  function volbar() {\n    var n = 16, on = Math.round(+vol.value * n);\n    bar.textContent = \"[\" + new Array(on + 1).join(\"=\") + \"o\" + new Array(n - on + 1).join(\"-\") + \"]\";\n  }\n  if (vol && bar) { vol.addEventListener(\"input\", volbar); volbar(); }\n\n  // on air, the pattern slips one cell on every beat (KES FM only beats when motion is allowed)\n  var face = d.querySelector(\".stack.sound\");\n  if (face && window.MutationObserver) new MutationObserver(function () {\n    if (/\\bthump\\b/.test(face.className) && /\\bon-air\\b/.test(d.body.className)) { shift++; paint(); }\n  }).observe(face, { attributes: true, attributeFilter: [\"class\"] });\n\n  build();\n  addEventListener(\"resize\", later);\n  addEventListener(\"load\", later);\n  if (window.ResizeObserver) {\n    var ro = new ResizeObserver(later);\n    ro.observe(d.body);\n    [].forEach.call(d.querySelectorAll(\".blk\"), function (el) { ro.observe(el); });\n  }\n})();\n\u003c/script>\n\u003cscript>(function(){\nvar PAGES=[\"index.html\", \"writing.html\"];\ndocument.addEventListener('click',function(e){\n  var a=e.target.closest&&e.target.closest('a[href]');\n  if(!a||e.defaultPrevented)return;\n  var h=a.getAttribute('href'),m=h.replace(/^\\.\\//,'').split('#'),p=m[0],id=m[1]||'';\n  if(p===''&&h.charAt(0)==='#'){\n    var t=id&&document.getElementById(decodeURIComponent(id));\n    if(id&&!t)return;\n    e.preventDefault();t?t.scrollIntoView({block:'start'}):scrollTo(0,0);return;\n  }\n  if(PAGES.indexOf(p)>-1||p==='/'||p==='.'){\n    e.preventDefault();parent.postMessage({variantPage:PAGES.indexOf(p)>-1?p:'index.html',hash:id},'*');\n  }\n});\naddEventListener('keydown',function(e){\n  if(e.metaKey||e.ctrlKey||e.altKey)return;\n  if(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]'))return;\n  if(['ArrowLeft','ArrowRight','m'].indexOf(e.key)>-1)parent.postMessage({variantKey:e.key},'*');\n});\nif(location.hash.length>1){var t=document.getElementById(decodeURIComponent(location.hash.slice(1)));t&&t.scrollIntoView();}\n})();\u003c/script>\u003c/body>\n\u003c/html>\n"}}, {"label": "09", "note": "ascii field · One grey character field from repeating pattern at the top to noise at the bottom, content in clean cut-out blocks; KES FM makes it shimmer.", "pages": {"index.html": "\u003c!doctype html>\n\u003chtml lang=\"en-GB\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cmeta name=\"color-scheme\" content=\"light\">\n\u003ctitle>kes inkersole\u003c/title>\n\u003cmeta name=\"description\" content=\"kes inkersole (kesia on paper): freelance creative strategist and internet equalities researcher, based in london.\">\n\u003cstyle>\n/* kes inkersole, the all-ascii version.\n   the page is a character field: one long data dump that opens as a repeating pattern\n   and breaks down into noise the further down you go. everything you read sits in an\n   opening cut out of it, exactly on its grid.\n   one cell: 1ch wide, one row (--r, 16px) tall. every gap is a whole number of cells.\n   one font: system monospace, 13px. double size (26px on two rows) for saying hello.\n   colour: black, white, greys. blue for links, hot pink under your mouse. */\n:root {\n  --ink: #000;\n  --paper: #fff;\n  --blue: #0038ff;\n  --pink: #ff2d87;\n  --grey: #6f6f6f;   /* labels */\n  --dust: #c4c4c4;   /* the field */\n  --mono: ui-monospace, Menlo, Consolas, \"DejaVu Sans Mono\", \"Liberation Mono\", \"Courier New\", monospace;\n  --r: 16px;\n  --pad: 3;          /* field columns left of the content, set by the field script */\n  --inner: 999;      /* columns the content may use, set by the field script */\n}\n* { box-sizing: border-box; }\nhtml { background: var(--paper); color: var(--ink); font: 13px/16px var(--mono); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\nbody { margin: 0; position: relative; min-height: 100vh; overflow-x: clip; overflow-wrap: anywhere; }\nh1, h2, h3, p, ul, dl, dd, pre { margin: 0; padding: 0; font: inherit; }\np + p { margin-top: var(--r); }\n::selection { background: var(--pink); color: var(--ink); }\n\na { color: var(--blue); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }\na:visited { text-decoration-style: dotted; }\na:hover { background: var(--pink); color: var(--ink); text-decoration: none; }\na:focus-visible, button:focus-visible { outline: 0; background: var(--blue); color: var(--paper); text-decoration: none; }\n.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }\n\n/* ---------- the field ---------- */\n#field { position: absolute; inset: 0; overflow: hidden; color: var(--dust); pointer-events: none; -webkit-user-select: none; user-select: none; }\n#field pre { white-space: pre; }\n\n/* ---------- the openings ---------- */\n.page { position: relative; padding: calc(2 * var(--r)) 0 calc(3 * var(--r)) calc(var(--pad) * 1ch); }\n.o { padding: var(--r) 2ch; max-width: min(100%, calc(var(--inner) * 1ch)); }\n.slot { width: fit-content; padding: 0 1ch; font-weight: 700; }\n.lbl, .soft { color: var(--grey); }\n.double { font-size: 26px; line-height: 32px; }\n.heart { color: var(--pink); }\n.sec { margin-top: calc(4 * var(--r)); }\n.sec > .slot { margin-bottom: var(--r); }\n.tri { display: grid; grid-template-columns: repeat(auto-fill, min(57ch, 100%)); gap: calc(2 * var(--r)) 3ch; align-items: start;\n  max-width: calc(var(--inner) * 1ch + 1px); }\n.col { display: flex; flex-direction: column; gap: calc(2 * var(--r)); }\n.col > .o { max-width: none; }\n\n/* ---------- her name and greeting ---------- */\n.name { width: fit-content; padding: var(--r) 0; }\n.sign pre { color: var(--dust); font-weight: 700; line-height: 1.2308; font-size: min(13px, calc((100vw - 48px) / 101.8)); }\n.sign s { text-decoration: none; color: var(--ink); font-weight: 400; }\n.sign b { color: var(--ink); }\n.sign b.h { color: var(--pink); }\n.sign .small { display: none; }\n.hello { display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--r) 6ch; padding: var(--r) 2ch 0; }\n.hello .lede { width: 64ch; max-width: 100%; margin: 0; }\n\n/* ---------- practice, the radio, the card ---------- */\n.hero { display: flex; flex-wrap: wrap; align-items: flex-start; gap: calc(2 * var(--r)) 3ch; margin-top: calc(2 * var(--r)); }\n.stack { display: flex; flex-direction: column; gap: var(--r); width: 39ch; max-width: min(100%, calc(var(--inner) * 1ch)); }\n.stack > .o { max-width: none; }\n.card { width: 38ch; }\n.card .double { margin-top: 0; }\n.card dl { display: grid; grid-template-columns: 10ch minmax(0, 1fr); margin-top: var(--r); }\n.card dt { color: var(--grey); }\n.card .bunny { margin-top: calc(2 * var(--r)); width: fit-content; }\n.bunny .p { color: var(--pink); }\n.bunny .g { color: var(--ink); }\n.card .info { margin-top: var(--r); }\n\n/* KES FM: the speaker is its face, the deck is plain type and [bracketed] keys */\n.fm { width: fit-content; display: grid; grid-template-columns: min-content 50ch; column-gap: 3ch; align-items: start;\n  grid-template-areas: \"h h\" \"face deck\" \"ident ident\"; }\n#fm-h { grid-area: h; font-weight: 700; margin-bottom: var(--r); }\n.speaker { grid-area: face; color: var(--ink); width: fit-content; }\n.ident { grid-area: ident; margin-top: var(--r); }\n.deck { grid-area: deck; }\n.speaker .c, .speaker .b, .speaker .i { color: var(--ink); }\n.speaker .p, .speaker .y { color: var(--pink); }\n.speaker .g { color: var(--blue); }\n.speaker.lit .p { color: var(--blue); }\n.speaker .sound.thump { animation: thump .3s steps(1); }\n@keyframes thump { 0% { color: var(--pink); } }\n\n.lcd-top { display: flex; flex-wrap: wrap; justify-content: space-between; column-gap: 2ch; }\nbody.on-air .status { color: var(--pink); }\n.ticker { overflow: hidden; white-space: nowrap; }\n.ticker > div { display: inline-block; }\n.ticker span { padding-right: 1ch; }\n@keyframes run { to { translate: -50% 0; } }\n@media (prefers-reduced-motion: no-preference) { .ticker > div { animation: run 70s linear infinite; } }\n.tracker { display: grid; grid-template-columns: repeat(16, 3ch); }\n.tracker span { justify-self: start; }\n.tracker .rest { color: var(--dust); }\n.tracker .roll { text-decoration: underline; text-underline-offset: 3px; }\n.tracker .on { background: var(--pink); color: var(--ink); }\n.deck .rev { color: var(--pink); }\n.deck .up { color: var(--blue); }\n.tracker .on.rev, .tracker .on.up { color: var(--ink); }\n.lcd-info { display: flex; flex-direction: column; min-height: calc(4 * var(--r)); color: var(--grey); }\n\nbutton { font: inherit; height: var(--r); margin: 0; padding: 0; border: 0; border-radius: 0; background: none; color: var(--ink); cursor: pointer; }\nbutton::before { content: \"[\"; }\nbutton::after { content: \"]\"; }\nbutton:hover, button[aria-pressed=\"true\"]:hover { background: var(--pink); color: var(--ink); }\n.keys { margin-top: var(--r); }\n.keys > div { display: flex; flex-wrap: wrap; column-gap: 1ch; padding-left: 7ch; }\n.keys .lbl { width: 6ch; margin-left: -7ch; }\n.keys button[aria-pressed=\"true\"] { background: var(--ink); color: var(--paper); }\n.keys .go, .keys .stop { font-weight: 700; }\n.keys .go { color: var(--blue); }\n.keys .go[aria-pressed=\"true\"] { background: var(--pink); color: var(--ink); }\n.vol { display: grid; grid-template-columns: 7ch max-content; justify-content: start; }\n.vol input, .vol .track { grid-area: 1 / 2; }\n.vol input { width: 19ch; height: var(--r); margin: 0; opacity: 0; cursor: pointer; }\n.vol input:hover + .track { color: var(--pink); }\n.vol input:focus-visible + .track { background: var(--blue); color: var(--paper); }\n.textin { margin-top: var(--r); }\n.floatstop { position: fixed; right: 2ch; bottom: var(--r); z-index: 5; padding: 0 1ch; background: var(--paper); font-weight: 700; }\n.floatstop:hover { background: var(--pink); }\n.floatstop[hidden] { display: none; }\n\n/* ---------- three projects, each with its photo drawn in characters ---------- */\n.slice .pic { display: block; color: var(--ink); text-decoration: none; }\n.slice .pic:hover { background: none; }\n.slice .pic:hover .ascii { color: var(--pink); }\n.slice .pic:focus-visible { background: none; }\n.slice .pic:focus-visible .ascii { background: var(--blue); color: var(--paper); }\n.ascii { height: calc(16 * var(--r)); overflow: hidden; white-space: pre; }\n.slice .meta { display: flex; justify-content: space-between; column-gap: 2ch; margin-top: var(--r); }\n.slice h3 { font-weight: 700; }\n.slice h3 + p { margin-top: var(--r); }\n\n/* ---------- everything else, as starred links ---------- */\n.stars { list-style: none; }\n.stars li { padding-left: 2ch; text-indent: -2ch; }\n.stars li::before { content: \"☆ \"; color: var(--grey); }\n.stars li:hover::before { content: \"★ \"; color: var(--pink); }\n\n/* ---------- the end ---------- */\n.foot .say { grid-column: -2 / -1; }\n.foot .double + p { margin-top: var(--r); }\n.garden-o { margin-top: calc(4 * var(--r)); margin-left: calc(var(--pad) * -1ch); max-width: none; padding: var(--r) 0 0; overflow: hidden; }\n.garden b { font-weight: inherit; }\n.garden .rose { color: var(--pink); }\n.garden .peri { color: var(--blue); }\n.garden .lilac, .garden .stem { color: var(--ink); }\n\n@media (prefers-reduced-motion: no-preference) { .sign b.h { animation: blink 1.6s steps(1) infinite; } }\n@keyframes blink { 50% { color: var(--blue); } }\n\n/* ---------- smaller screens: the same openings, restacked ---------- */\n@media (max-width: 1099px) {\n  .hero .card { order: 1; }\n  .hero .fm { order: 2; }\n}\n@media (max-width: 699px) {\n  .sign .big { display: none; }\n  .sign .small { display: block; font-size: min(13px, calc((100vw - 32px) / 25.9)); }\n  .hello { padding: var(--r) 1ch 0; }\n  .stack, .card, .fm { width: 100%; }\n  .fm { grid-template-columns: minmax(0, 1fr); grid-template-areas: \"h\" \"face\" \"deck\" \"ident\"; }\n  .deck { margin-top: var(--r); }\n  .tracker { grid-template-columns: repeat(8, 3ch); }\n  .ascii { height: calc(12 * var(--r)); }\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv id=\"field\" aria-hidden=\"true\">\u003c/div>\n\n\u003cdiv class=\"page\">\n\n\u003ch1 class=\"vh\">Kes Inkersole\u003c/h1>\n\n\u003c!-- her name, spelled out in tiny \u003c3 hearts, and hello -->\n\u003cdiv class=\"o name\">\n\u003cdiv class=\"sign\" aria-hidden=\"true\">\n\u003cpre class=\"big\">\u003cs> .---------------------------------------------------------------------------------------------------------------------------------------------------------------------. \u003c/s>\n\u003cs> |\u003c/s> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .\u003cs> | \u003c/s>\n\u003cs> |\u003c/s> . .\u003cb>&lt;3\u003c/b> . . . . . . . . . . . . . . ; -webkit-user-select: none; user-select: none; }\n#field pre { white-space: pre; }\n\n.page { position: relative; padding: calc(2 * var(--r)) 0 calc(3 * var(--r)) calc(var(--pad) * 1ch); }\n.o { padding: var(--r) 2ch; max-width: min(100%, calc(var(--inner) * 1ch)); }\n.slot { width: fit-content; padding: 0 1ch; }\n.lbl { color: var(--grey); }\n.double { font-size: 26px; line-height: 32px; }\n.heart { color: var(--pink); }\n\n/* ---------- the top: the love-heart computer, and its cable of \u003c3s running off the edge of the page ---------- */\n.top { margin-top: calc(2 * var(--r)); }\n.whead { display: flex; flex-wrap: wrap; align-items: flex-end; gap: calc(2 * var(--r)) 3ch; }\n.pc-o { padding: var(--r) 1ch 0 0; width: fit-content; }\n.pc { color: var(--ink); }\n.pc b, .cable b { color: var(--pink); font-weight: inherit; }\n.wt { width: 57ch; margin-bottom: calc(2 * var(--r)); }\n.wt .double + p { margin-top: var(--r); }\n.how { width: 57ch; margin-bottom: calc(2 * var(--r)); }\n.cable { display: flex; padding: 0; max-width: none; color: var(--ink); }\n.wire { flex: 1; overflow: hidden; }\n.wire span { display: inline-block; margin-left: -30ch; animation: send 6s linear infinite paused; }\n.top:hover .wire span { animation-play-state: running; }\n@keyframes send { to { transform: translateX(30ch); } }\n\n/* ---------- the pieces: one opening each, newest first ---------- */\n.pieces { display: grid; grid-template-columns: repeat(auto-fill, min(57ch, 100%)); gap: calc(2 * var(--r)) 3ch; align-items: start;\n  max-width: calc(var(--inner) * 1ch + 1px); margin-top: calc(3 * var(--r)); }\n.piece .meta { display: flex; justify-content: space-between; column-gap: 2ch; }\n.piece h2 { font-weight: 700; margin-bottom: var(--r); }\n\n/* ---------- the end ---------- */\n.foot { display: grid; grid-template-columns: repeat(auto-fill, min(57ch, 100%)); gap: calc(2 * var(--r)) 3ch; align-items: start;\n  max-width: calc(var(--inner) * 1ch + 1px); margin-top: calc(4 * var(--r)); }\n.foot .say { grid-column: -2 / -1; }\n.foot .double + p { margin-top: var(--r); }\n.garden-o { margin-top: calc(4 * var(--r)); margin-left: calc(var(--pad) * -1ch); max-width: none; padding: var(--r) 0 0; overflow: hidden; }\n.garden b { font-weight: inherit; }\n.garden .rose { color: var(--pink); }\n.garden .peri { color: var(--blue); }\n.garden .lilac, .garden .stem { color: var(--ink); }\n\n@media (max-width: 699px) {\n  .wt, .how { width: 100%; margin-bottom: 0; }\n  .whead { align-items: flex-start; }\n  .pc-o { order: 3; }\n}\n@media (prefers-reduced-motion: reduce) { .wire span { animation: none; } }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv id=\"field\" aria-hidden=\"true\">\u003c/div>\n\n\u003cdiv class=\"page\">\n\n\u003cp class=\"o slot\">\u003ca href=\"index.html\">← kes inkersole\u003c/a>\u003c/p>\n\n\u003cheader class=\"top\">\n\u003cdiv class=\"whead\">\n\u003cdiv class=\"o pc-o\">\n\u003cpre class=\"pc\" role=\"img\" aria-label=\"ascii drawing of a little computer with a heart on its screen, its cable running off the edge of the page\">\n  ______________________\n |  __________________  |\n | |                  | |\n | |   \u003cb>&lt;3&lt;3\u003c/b>    \u003cb>&lt;3&lt;3\u003c/b>   | |\n | | \u003cb>&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3\u003c/b> | |\n | | \u003cb>&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3\u003c/b> | |\n | |   \u003cb>&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3\u003c/b>   | |\n | |     \u003cb>&lt;3&lt;3&lt;3&lt;3\u003c/b>     | |\n | |       \u003cb>&lt;3&lt;3\u003c/b>       | |\n | |        \u003cb>&lt;3\u003c/b>        | |\n | |__________________| |\n |                      |\n |  \u003cb>o\u003c/b>          ______   |\n |______________________|\\\n   |__________________|   \\\u003c/pre>\n\u003c/div>\n\u003cdiv class=\"o wt\">\n\u003ch1 class=\"double\">chainmail \u003cspan class=\"heart\">♡\u003c/span>\u003c/h1>\n\u003cp>my own writing. short pieces, the kind i write in my notes app, sent here by email and collected over t >&lt;3\u003c/b>____________________________\u003cb>&lt;3\u003c/b>____________________________\u003cb>&lt;3\u003c/b>____________________________\u003cb>&lt;3\u003c/b>____________________________\u003cb>&lt;3\u003c/b>____________________________\u003cb>&lt;3\u003c/b>____________________________\u003cb>&lt;3\u003c/b>____________________________\u003cb>&lt;3\u003c/b>____________________________\u003cb>&lt;3\u003c/b>_______________\u003c/span>\u003c/span>\u003c/pre>\n\u003c/header>\n\n\u003cmain class=\"pieces\" id=\"pieces\">\n\u003c!-- new pieces go at the top. one email = one \u003carticle class=\"o piece\">, always in this shape:\n\u003carticle class=\"o piece\" id=\"piece-NNN\">\n\u003cp class=\"meta lbl\">\u003cspan>no. NNN\u003c/span>\u003ctime datetime=\"YYYY-MM-DD\">D mon YYYY\u003c/time>\u003c/p>\n\u003ch2>the email subject\u003c/h2>\n\u003cdiv class=\"text\">\u003cp>the email body, one \u003cp> per paragraph\u003c/p>\u003c/div>\n\u003c/article>\nthe dates and words below are placeholders. -->\n\n\u003carticle class=\"o piece\" id=\"piece-011\">\n\u003cp class=\"meta lbl\">\u003cspan>no. 011\u003c/span>\u003ctime datetime=\"2026-10-18\">18 oct 2026\u003c/time>\u003c/p>\n\u003ch2>lorem ipsum\u003c/h2>\n\u003cdiv class=\"text\">\u003cp>lorem ipsum dolor sit amet.\u003c/p>\u003c/div>\n\u003c/article>\n\n\u003carticle class=\"o piece\" id=\"piece-010\">\n\u003cp class=\"meta lbl\">\u003cspan>no. 010\u003c/span>\u003ctime datetime=\"2026-10-14\">14 oct 2026\u003c/time>\u003c/p>\n\u003ch2>consectetur adipiscing elit\u003c/h2>\n\u003cdiv class=\"text\">\n\u003cp>sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur.\u003c/p>\n\u003cp>excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum. sed ut perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium.\u003c/p>\n\u003cp>totam rem aperiam, eaque ipsa quae ab illo inventore veritatis et quasi architecto beatae vitae dicta sunt explicabo.\u003c/p>\n\u003c/div>\n\u003c/article>\n\n\u003carticle class=\"o piece\" id=\"piece-009\">\n\u003cp class=\"meta lbl\">\u003cspan>no. 009\u003c/span>\u003ctime datetime=\"2026-10-09\">9 oct 2026\u003c/time>\u003c/p>\n\u003ch2>(no subject)\u003c/h2>\n\u003cdiv class=\"text\">\u003cp>nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit aut fugit.\u003c/p>\u003c/div>\n\u003c/article>\n\n\u003carticle class=\"o piece\" id=\"piece-008\">\n\u003cp class=\"meta lbl\">\u003cspan>no. 008\u003c/span>\u003ctime datetime=\"2026-10-06\">6 oct 2026\u003c/time>\u003c/p>\n\u003ch2>sed quia consequuntur\u003c/h2>\n\u003cdiv class=\"text\">\u003cp>magni dolores eos qui ratione voluptatem sequi nesciunt. neque porro quisquam est, qui dolorem ipsum quia dolor sit amet, consectetur, adipisci velit, sed quia non numquam eius modi tempora incidunt ut labore et dolore magnam aliquam quaerat voluptatem.\u003c/p>\u003c/div>\n\u003c/article>\n\n\u003carticle class=\"o piece\" id=\"piece-007\">\n\u003cp class=\"meta lbl\">\u003cspan>no. 007\u003c/span>\u003ctime datetime=\"2026-10-02\">2 oct 2026\u003c/time>\u003c/p>\n\u003ch2>ut enim ad minima\u003c/h2>\n\u003cdiv class=\"text\">\u003cp>quis autem vel eum\u003cbr>iure reprehenderit\u003cbr>qui in ea voluptate\u003cbr>velit esse quam nihil\u003cbr>molestiae consequatur\u003c/p>\u003c/div>\n\u003c/article>\n\n\u003carticle class=\"o piece\" id=\"piece-006\">\n\u003cp class=\"meta lbl\">\u003cspan>no. 006\u003c/span>\u003ctime datetime=\"2026-09-27\">27 sep 2026\u003c/time>\u003c/p>\n\u003ch2>at vero eos et accusamus\u003c/h2>\n\u003cdiv class=\"text\">\n\u003cp>et iusto odio dignissimos ducimus qui blanditiis praesentium voluptatum deleniti atque corrupti quos dolores et quas molestias excepturi sint occaeca l>\n\u003chtml lang=\"en-GB\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cmeta name=\"color-scheme\" content=\"light\">\n\u003ctitle>kes inkersole\u003c/title>\n\u003cmeta name=\"description\" content=\"kes inkersole (kesia on paper): freelance creative strategist &amp; internet equalities researcher, based in london.\">\n\u003cstyle>\n/* the whole page is one field of characters: KES FM's break, dumped as bytes (see the script at the bottom).\n   everything you read sits in a hole cut out of it. one cell = one character (1ch) by one row (18px),\n   and every block, gap and margin is a whole number of cells. no lines, no boxes: the field makes the edges. */\n:root {\n  --ink: #000;\n  --paper: #fff;\n  --blue: #1f3dff;\n  --pink: #ff2d95;\n  --field: #c3c3c3;   /* the field: always quieter than the words */\n  --dim: #6b6b6b;     /* labels and small print */\n  --lh: 18px;         /* one row */\n  --m: 4ch;           /* page margin */\n  --g: 4ch;           /* gutter */\n  --mono: ui-monospace, Menlo, Consolas, \"DejaVu Sans Mono\", \"Liberation Mono\", \"Courier New\", monospace;\n}\n*, *::before, *::after { box-sizing: border-box; }\nhtml { background: var(--paper); color: var(--ink); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\nbody { margin: 0; font: 13px/18px var(--mono); overflow-wrap: break-word; }\nh1, h2, h3, p, ul, dl, dd, pre { margin: 0; }\nh1, h2, h3 { font-size: inherit; font-weight: inherit; }\nul { padding: 0; list-style: none; }\na { color: var(--blue); text-decoration-thickness: 1px; text-underline-offset: 3px; }\na:hover, a:focus-visible { background: var(--pink); color: var(--ink); }\n:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }\n::selection { background: var(--pink); color: var(--ink); }\n.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }\n\n/* ---------- the field ---------- */\n.page { position: relative; overflow: clip; padding-top: calc(2 * var(--lh)); }\n.field { position: absolute; inset: 0; overflow: hidden; font: inherit; color: var(--field); white-space: pre; pointer-events: none; user-select: none; -webkit-user-select: none; }\n.page > :not(.field) { position: relative; }\n\n/* ---------- the holes: a grid of whole characters ---------- */\n.row { --n: 3; display: grid; grid-template-columns: repeat(var(--n), var(--c)); gap: calc(2 * var(--lh)) var(--g);\n  align-items: start; justify-items: start; padding: 0 var(--m); margin-top: calc(4 * var(--lh)); }\n.field + .row, .near { margin-top: calc(2 * var(--lh)); }\n.page > .field + .row { margin-top: 0; }\n@media (max-width: 1179px) { .row { --n: 2; } }\n@media (max-width: 699px) { :root { --m: 2ch; } .row { --n: 1; } }\n.row { --c: min(60ch, calc((100% - (var(--n) - 1) * var(--g)) / var(--n))); }\n@supports (width: round(down, 10px, 1ch)) {\n  .row { --c: min(60ch, round(down, calc((100% - (var(--n) - 1) * var(--g)) / var(--n)), 1ch)); }\n}\n.intro { grid-auto-flow: row dense; }\n.s2 { grid-column: span 2; }\n.s3 { grid-column: 1 / -1; }\n@media (max-width: 699px) { .s2 { grid-column: auto; } }\n.blk { width: fit-content; max-width: 100%; padding: var(--lh) 2ch; }\n.fill { width: 100%; }\n.blk > * + * { margin-top: var(--lh); }\n\n/* ---------- words ---------- */\n.label, .meta { color: var(--dim); }\n.heart { color: var(--pink); font-style: normal; }\nh1 { font-size: 26px; line-height: calc(2 * var(--lh)); }\n.title { font-weight: bold; }\n.art { font: inherit; white-space: pre; }\n.art b { font-weight: inherit; }\n\n/* ---------- the name, in tiny \u003c3s ---------- */\n.sign { container-type: inline-size; }\n.sign pre { font-size: min(13px, calc(100cqw / 100.1)); line-height: 1.3847; color: var(--field); margin-left: -1ch; width: fit-content; }\n.sign b { color: var(--ink); }\n.sign b.h { color: var(--pink); }\n.sign .small { display: none; }\n@media (min-width: 1400px) {\n  .signblk { width: fit-content; }\n  .sign { container-type: normal; }\n  .sign pre { font-size: 13px; }\n}\n@media (max-width: 699px) {\n  .sign .big { display: none; }\n  .sign .small { display: block; font-size: min(13px, calc(100cqw / 23.5)); }\n}\n\n/* ---------- KES FM ---------- */\n.fm h2 { color: var(--ink); font-weight: bold; }\n.c1 > * + *, .deck > * + * { margin-top: var(--lh); }\n.speaker { width: fit-content; }\n.speaker .g { color: var(--dim); }\n.tower.lit .cone { background: var(--pink); }\n.sound.thump { animation: thump .35s ease-out; }\n@keyframes thump { from { color: var(--pink); } }\n.lcd-top { display: flex; flex-wrap: wrap; justify-content: space-between; column-gap: 2ch; }\n.status { padding: 0 1ch; margin-right: -1ch; }\nbody.on-air .status { background: var(--pink); }\n.ticker { overflow: hidden; white-space: nowrap; color: var(--dim); }\n.ticker > div { display: inline-block; }\n.ticker span { padding-right: 1ch; }\n.tracker { display: grid; grid-template-columns: repeat(16, minmax(0, 3ch)); text-align: center; margin: var(--lh) 0; }\n.tracker .rest { opacity: .35; }\n.tracker .rev { color: var(--pink); }\n.tracker .up { color: var(--blue); }\n.tracker .roll { text-decoration: underline; text-underline-offset: 3px; }\n.tracker .on { background: var(--ink); color: var(--paper); }\n.lcd-info { display: flex; flex-wrap: wrap; column-gap: 2ch; color: var(--dim); }\n.lcd-info .rev { color: var(--pink); }\n.lcd-info .up { color: var(--blue); }\n.keys > div { display: flex; flex-wrap: wrap; column-gap: 1ch; padding-left: 7ch; }\n.keys .lbl { display: inline-block; width: 7ch; margin-left: -7ch; color: var(--dim); }\n.keys button, .floatstop { font: inherit; line-height: var(--lh); margin: 0; padding: 0; border: 0; border-radius: 0;\n  background: none; color: var(--ink); cursor: pointer; }\n.keys button::before, .floatstop::before { content: \"[\"; content: \"[\" / \"\"; }\n.keys button::after, .floatstop::after { content: \"]\"; content: \"]\" / \"\"; }\n.keys button[aria-pressed=\"true\"] { background: var(--ink); color: var(--paper); }\n.keys .go, .keys .stop, .floatstop { font-weight: bold; }\n.keys .go[aria-pressed=\"true\"] { background: var(--pink); color: var(--ink); }\n.keys button:hover, .floatstop:hover { background: var(--pink); color: var(--ink); }\n.keys button:active { translate: 0 1px; }\n.vol { display: block; position: relative; padding-left: 7ch; }\n.vol input { position: absolute; top: 0; left: 7ch; width: 22ch; height: var(--lh); margin: 0; opacity: 0; cursor: pointer; }\n.vol:focus-within .volbar, .vol:hover .volbar { background: var(--pink); }\n.floatstop { position: fixed; right: 2ch; bottom: var(--lh); z-index: 5; padding: var(--lh) 2ch; background: var(--paper); }\n.floatstop[hidden] { display: none; }\n@keyframes run { to { translate: -50% 0; } }\n@media (min-width: 900px) {\n  .fm { display: grid; grid-template-columns: 38ch minmax(0, 1fr); grid-template-areas: \"c1 ident\" \"c1 deck\";\n    column-gap: var(--g); row-gap: var(--lh); align-items: start; }\n  .fm > * + * { margin-top: 0; }\n  .fm .c1 { grid-area: c1; }\n  .fm .ident { grid-area: ident; }\n  .fm .deck { grid-area: deck; }\n}\n\n/* ---------- the card ---------- */\n.card dl { display: grid; grid-template-columns: 9ch minmax(0, 1fr); }\n.card dt { color: var(--dim); }\n.bunny { width: fit-content; }\n.bunny .p { color: var(--pink); }\n@media (min-width: 700px) {\n  .card { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: var(--g); row-gap: var(--lh); align-items: end; }\n  .card > * + * { margin-top: 0; }\n  .card h2 { grid-column: 1 / -1; }\n}\n\n/* ---------- three projects: each photo printed through the break ---------- */\n.pic { display: block; height: calc(15 * var(--lh)); overflow: hidden; text-decoration: none; }\n.pic:hover, .pic:focus-visible { background: none; }\n.pic pre { height: 100%; font-weight: bold; white-space: pre-wrap; word-break: break-all; color: transparent;\n  background: #9a9a9a center / cover no-repeat; -webkit-background-clip: text; background-clip: text;\n  filter: grayscale(1) contrast(1.2); user-select: none; -webkit-user-select: none; }\n.pic pre:empty { -webkit-background-clip: border-box; background-clip: border-box; }\n.project:hover .pic pre { filter: none; }\n\n/* ---------- everything else, starred ---------- */\n.stars li { position: relative; padding-left: 2ch; }\n.stars li::before { content: \"*\"; content: \"*\" / \"\"; position: absolute; left: 0; color: var(--dim); }\n.stars li:hover::before { color: var(--pink); }\n.blk > .gap { margin-top: calc(2 * var(--lh)); }\n\n/* ---------- the end ---------- */\n.gardenblk { width: 100%; padding: var(--lh) 0 0; margin-top: calc(4 * var(--lh)); overflow: hidden; }\n.garden .rose, .garden .lilac { color: var(--pink); }\n.garden .peri { color: var(--blue); }\n\n@media (prefers-reduced-motion: no-preference) {\n  .sign b.h { animation: blink 1.6s steps(1) infinite; }\n  .ticker > div { animation: run 70s linear infinite; }\n  .bunny:hover { animation: hop .5s; }\n}\n@keyframes blink { 50% { color: var(--field); } }\n@keyframes hop { 40% { transform: translateY(-8px); } }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"page\">\n\u003cpre class=\"field\" id=\"field\" aria-hidden=\"true\">\u003c/pre>\n\n\u003cheader class=\"row\">\n  \u003cdiv class=\"blk s3 fill signblk\">\n    \u003cp class=\"label\">welcome to kes' little corner of the internet\u003c/p>\n    \u003c!-- the name: every lit dot is a little \u003c3 -->\n    \u003cdiv class=\"sign\" role=\"img\" aria-label=\"kes inkersole, spelled out in tiny \u003c3 hearts on a dot-matrix sign\">\n\u003cpre class=\"big\"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .\n . .\u003cb>&lt;3\u003c/b> . . . . . . . . . . . . . . . . . . . . .\u003cb>&lt;3\u003c/b> . . . . . . . .\u003cb
