i++) put(x + i, yy, s.t.charAt(i), (s.c === \"a\" ? \"a\" : s.c) + rc, lo);\n          x += s.t.length;\n        });\n        if (l.segs.length && x \u003c r.x + r.w) put(x, yy, \" \", \"c\" + rc);\n        yy++;\n      });\n    });\n\n    var html = [];\n    for (var y2 = 0; y2 \u003c R; y2++) {\n      var row = \"\", x2 = 0;\n      while (x2 \u003c C) {\n        var k0 = cl[y2][x2], l0 = lk[y2][x2], run = \"\";\n        while (x2 \u003c C && cl[y2][x2] === k0 && lk[y2][x2] === l0) { run += ch[y2][x2]; x2++; }\n        run = run.replace(/&/g, \"&amp;\").replace(/\u003c/g, \"&lt;\").replace(/>/g, \"&gt;\");\n        if (l0) row += '\u003ca class=\"' + k0 + '\" href=\"' + hrefs[l0].replace(/&/g, \"&amp;\").replace(/\"/g, \"&quot;\") + '\" data-k=\"' + l0 + '\" tabindex=\"-1\">' + run + \"\u003c/a>\";\n        else row += '\u003cspan class=\"' + k0 + '\">' + run + \"\u003c/span>\";\n      }\n      html.push(row);\n    }\n    // a link that wraps onto two lines is two runs pointing at the same object, so they share data-k\n    grid.innerHTML = html.join(\"\\n\");\n    field.style.height = (R * lh) + \"px\";\n    cells.forEach(function (r) { if (r.fm && fm) { fm.style.left = (r.fm.x * cw) + \"px\"; fm.style.top = (r.fm.y * lh) + \"px\"; fm.hidden = false; } });\n  }\n\n  /* ---- reading ---- */\n  function reveal(id) {\n    rv.textContent = id == null ? \"\" : \".r\" + id + \".c,.r\" + id + \".m{color:var(--read)}.r\" + id + \".h{color:#000}.r\" + id + \".t{color:var(--quiet)}.r\" + id + \".ig{color:#777}\";\n  }\n  var last = null;\n  grid.addEventListener(\"mousemove\", function (e) {\n    var b = grid.getBoundingClientRect(), x = Math.floor((e.clientX - b.left) / cw), y = Math.floor((e.clientY - b.top) / lh), hit = null;\n    cells.forEach(function (r) { if (r.k && x >= r.x && x \u003c r.x + r.w && y >= r.y && y \u003c r.y + r.h) hit = r.id; });\n    if (hit !== last) { last = hit; reveal(hit); }\n  });\n  grid.addEventListener(\"mouseleave\", function () { last = nu : #f3f1ec;      /* off-white: the empty planes, and the radio's screen */\n  --blue: #0a33ff;     /* links, and the blue planes */\n  --hot: #ff2e93;      /* hover, hearts, and the \"red\" plane */\n  --yellow: #ffd100;\n  --sans: \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n  --mono: ui-monospace, Menlo, Consolas, \"DejaVu Sans Mono\", \"Liberation Mono\", \"Courier New\", monospace;\n  --line: 12px;\n  --pad: 32px;\n  /* five columns, shared by every band so the verticals line up all the way down */\n  --cols: minmax(0, 96fr) minmax(0, 300fr) minmax(0, 632fr) minmax(0, 64fr) minmax(0, 300fr);\n}\n* { box-sizing: border-box; }\nhtml { background: var(--ink); color: var(--ink); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\nbody { margin: 0; min-height: 100vh; display: flex; flex-direction: column; gap: var(--line); background: var(--ink); font: 16px/24px var(--sans); }\nh1, h2, p, ul, dl, dd, figure, pre { margin: 0; }\nh2 { font-size: inherit; font-weight: 700; }\na { color: var(--blue); text-decoration-thickness: 1px; text-underline-offset: 3px; overflow-wrap: anywhere; }\na:hover { background: var(--hot); color: var(--ink); }\n:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }\n::selection { background: var(--hot); color: var(--ink); }\n\n.label, .meta, .soft { font: 13px/24px var(--mono); }\n.big { font: 400 40px/44px var(--sans); letter-spacing: -.02em; }\n.heart { color: var(--hot); }\n\n/* ---------- the grid ---------- */\nmain { display: flex; flex-direction: column; gap: var(--line); }\n.grid { display: grid; grid-template-columns: var(--cols); gap: var(--line); }\n.cell { background: var(--paper); padding: var(--pad); min-width: 0; }\n.plane { min-width: 0; min-height: var(--line); }\n.p-pink { background: var(--hot); }\n.p-blue { background: var(--blue); }\n.p-yellow { background: var(--yellow); }\n.p-off { background: var(--off); }\n\n/* the first view: name, pink, hello, KES FM, card, and the bottom row of blue / writing / off-white / yellow */\n.top {\n  grid-template-areas:\n    \"sign  sign  sign  pink pink\"\n    \"hello hello fm    card card\"\n    \"blue  write fm    off  yel\";\n  grid-template-rows: auto 1fr auto;\n}\n@media (min-width: 1200px) { .top { min-height: 100vh; } }\n.top > .p-pink { grid-area: pink; }\n.top > .p-blue { grid-area: blue; }\n.top > .p-off { grid-area: off; }\n.top > .p-yellow { grid-area: yel; }\n\n/* ---------- the name: kes inkersole in tiny \u003c3s, on a dot field ---------- */\n.sign { grid-area: sign; container-type: inline-size; }\n.sign pre { font-family: var(--mono); font-size: min(19px, calc(100cqw / 101.9)); line-height: 1.22; color: var(--ink); width: fit-content; }\n.sign s { text-decoration: none; color: transparent; }   /* the rectangle is the frame now */\n.sign b { color: var(--hot); font-weight: 700; }\n.sign b.h { color: var(--blue); animation: blink 1.6s steps(1) infinite; }\nbody.on-air .sign b.h { animation-duration: .706s; }   /* on air, the little heart blinks on the beat */\n.sign .small { display: none; }\n@keyframes blink { 50% { color: var(--hot); } }\n\n/* ---------- hello ---------- */\n.hello { grid-area: hello; display: flex; flex-direction: column; }\n.about { margin-top: auto; padding-top: 24px; max-width: 34em; }\n.about p + p { margin-top: 24px; }\n.write { grid-area: write; }\n\n/* ---------- KES FM: the speaker stack is its face ---------- */\n.fm { grid-area: fm; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto 1fr auto;\n  grid-template-areas: \"spk h\" \"spk id\" \"deck deck\"; column-gap: var(--pad); }\n.speaker { grid-area: spk; container-type: inline-size; }\n#fm-h { grid-area: h; }\n.ident { grid-area: id; max-width: 34em; }\n.stack { font: min(13px, calc(100cqw / 22.4))/15px var(--mono); white-space: pre; color: var(--ink); }\n.stack .c, .stack .i { color: var(--ink); }\n.stack .p, .stack .y { color: var(--hot); }\n.stack .g, .stack .b { color: var(--blue); }\n.stack .sound.thump { animation: thump .3s steps(1); }\n@keyframes thump { 0% { color: var(--hot); } }\n\n.deck { grid-area: deck; margin-top: var(--pad); container-type: inline-size; }\n.lcd { font: 13px/24px var(--mono); background: var(--off); padding: 12px 16px; }\n.lcd-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 24px; }\n.status { padding: 0 4px; margin-right: -4px; }\nbody.on-air .status { background: var(--hot); }\n.ticker { overflow: hidden; white-space: nowrap; }\n.ticker > div { display: inline-block; }\n.ticker span { padding-right: .5em; }\n.tracker { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); text-align: center; }\n.tracker .rest { opacity: .35; }\n.tracker .rev { color: var(--hot); }\n.tracker .up { color: var(--blue); }\n.tracker .roll { text-decoration: underline; }\n.tracker .on { background: var(--hot); color: var(--ink); }\n.lcd-info { display: flex; flex-wrap: wrap; gap: 0 24px; }\n.lcd-info .rev { color: var(--hot); }\n.lcd-info .up { color: var(--blue); }\n/* the keys are small rectangles too: white, yellow when pressed, pink under the pointer */\n.keys { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; margin-top: 24px; }\n.keys > div { display: flex; flex-wrap: wrap; align-items: center; }\n.keys .lbl { font: 13px/24px var(--mono); margin-right: 8px; }\n.keys button { position: relative; font: 13px/24px var(--mono); color: var(--ink); background: var(--paper); border: 2px solid var(--ink); border-radius: 0; margin: 0 -2px 0 0; padding: 0 8px; cursor: pointer; }\n.keys button:hover { background: var(--hot); color: var(--ink); z-index: 1; }\n.keys button:active { translate: 0 1px; }\n.keys button[aria-pressed=\"true\"] { background: var(--yellow); }\n.keys .go { background: var(--ink); color: var(--paper); padding: 0 12px; }\n.keys .go[aria-pressed=\"true\"], .keys .go:hover { background: var(--hot); color: var(--ink); }\n.keys .stop { padding: 0 12px; }\n.vol r(--mono); }\n\n.list h2 { font: 13px/24px var(--mono); margin-bottom: 12px; }\n.list h2 span { color: var(--hot); }\n.list ul { list-style: none; padding: 0 0 0 24px; max-width: 42em; }\n.list li { position: relative; }\n.list li::before { content: \"☆\"; position: absolute; left: -24px; }\n.list li:hover::before { content: \"★\"; color: var(--hot); }\n\n/* ---------- the end: blue, the low-wifi note, and the garden along the bottom edge ---------- */\n.foot { grid-template-areas: \"bl bl note note note\" \"gd gd gd gd gd\"; }\n.foot > .p-blue { grid-area: bl; }\n.note { grid-area: note; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 24px var(--pad); }\n.colo { flex: 0 1 56ch; font: 13px/24px var(--mono); }\n.garden-box { grid-area: gd; container-type: inline-size; overflow: hidden; padding-bottom: 0; }\n.garden { overflow: hidden; white-space: pre; font: max(11px, calc(100cqw / 114))/1.15 var(--mono); color: var(--ink); }\n.garden b { font-weight: inherit; }\n.garden .rose { color: var(--hot); }\n.garden .lilac, .garden .peri { color: var(--blue); }\n.garden .stem { color: var(--ink); }\n\n/* ---------- narrower: four columns ---------- */\n@media (max-width: 1199px) {\n  :root { --line: 10px; --pad: 28px; --cols: 72px minmax(0, 1fr) minmax(0, 1fr) 72px; }\n  .top {\n    grid-template-areas:\n      \"sign  sign  sign  pink\"\n      \"hello hello card  card\"\n      \"fm    fm    fm    fm\"\n      \"blue  write write yel\";\n    grid-template-rows: none;\n  }\n  .top > .p-off { display: none; }\n  .lower {\n    grid-template-areas:\n      \"p1  p1  p2  p2\"\n      \"p3  p3  mp  mp\"\n      \"p3  p3  irl irl\"\n      \"wr  wr  pod pod\";\n  }\n  .foot { grid-template-areas: \"bl note note note\" \"gd gd gd gd\"; }\n}\n\n/* ---------- phones: a stack of rectangles, the colour kept as bands ---------- */\n@media (max-width: 699px) {\n  :root { --line: 6px; --pad: 24px; --cols: 48px minmax(0, 1fr); }\n  .top {\n    grid-te  class=\"stem\">|/     |/   |   \\|    \u003c/b>\u003cb class=\"rose\">(_)     \u003c/b>\u003cb class=\"stem\">|/     |   \\|   \u003c/b>\u003cb class=\"rose\">(_)\u003c/b>\n   \u003cb class=\"stem\">\\|      |    |    |    \\|     \\|      |    |      |      \\|     \\|    |    |      \\|      |    |    |   \\|     \\|      |    |    |      \\|     \\|    |    |     |     \\|      |    |    |\u003c/b>\u003c/pre>\n  \u003c/div>\n\u003c/footer>\n\n\u003cscript>(function(){\nvar PAGES=[\"index.html\", \"writing.html\"];\ndocument.addEventListener('click',function(e){\n  var a=e.target.closest&&e.target.closest('a[href]');\n  if(!a||e.defaultPrevented)return;\n  var h=a.getAttribute('href'),m=h.replace(/^\\.\\//,'').split('#'),p=m[0],id=m[1]||'';\n  if(p===''&&h.charAt(0)==='#'){\n    var t=id&&document.getElementById(decodeURIComponent(id));\n    if(id&&!t)return;\n    e.preventDefault();t?t.scrollIntoView({block:'start'}):scrollTo(0,0);return;\n  }\n  if(PAGES.indexOf(p)>-1||p==='/'||p==='.'){\n    e.preventDefault();parent.postMessage({variantPage:PAGES.indexOf(p)>-1?p:'index.html',hash:id},'*');\n  }\n});\naddEventListener('keydown',function(e){\n  if(e.metaKey||e.ctrlKey||e.altKey)return;\n  if(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]'))return;\n  if(['ArrowLeft','ArrowRight','m'].indexOf(e.key)>-1)parent.postMessage({variantKey:e.key},'*');\n});\nif(location.hash.length>1){var t=document.getElementById(decodeURIComponent(location.hash.slice(1)));t&&t.scrollIntoView();}\n})();\u003c/script>\u003c/body>\n\u003c/html>\n"}}, {"label": "03", "note": "mondrian · Mondrian of thick black lines: heart-letter name, tall pink plane, blue under KES FM's speaker; chainmail pieces in staggered white rectangles with blue and yellow.", "pages": {"index.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en-GB\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>kes inkersole\u003c/title>\n\u003cmeta name=\"description\" content=\"kes inkersole (kesia on paper): freelance creative strategist &amp; internet equalities researcher, based in london.\">\n\u003cstyle>\n/* ---------------------------------------------------------------\n   kes inkersole. one html file, system fonts, no trackers.\n   the page is a composition: black lines, white rectangles,\n   and a few flat planes of colour.\n   - one line weight, --line. it is the black showing through the gaps.\n   - one padding, --pad, inside every rectangle.\n   - three type sizes: 13px mono, 16px sans, 28px sans.\n   - colour: white ground, black ink, blue links, pink under your mouse.\n     the planes are pink (standing in for mondrian's red), yellow, blue, black.\n   --------------------------------------------------------------- */\n:root {\n  --line: 12px;\n  --pad: 32px;\n  --ink: #000;\n  --paper: #fff;\n  --blue: #0038ff;   /* links, and the blue planes */\n  --pink: #ff3399;   /* the highlight under your mouse, and the red of the composition */\n  --yellow: #ffd21f;\n  --grey: #e9e7e2;   /* only behind photos while they load */\n  --sans: \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n  --mono: ui-monospace, Menlo, Monaco, Consolas, \"Liberation Mono\", \"Courier New\", monospace;\n  --cols: minmax(0, 320fr) minmax(0, 330fr) minmax(0, 460fr) minmax(0, 294fr);\n  color-scheme: light;\n}\nhtml { background: var(--ink); color: var(--ink); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\nbody { margin: 0; background: var(--ink); font: 16px/24px var(--sans); overflow-wrap: break-word; }\np, h1, h2, h3, ul, dl, dd, figure, pre { margin: 0; }\n::selection { background: var(--pink); color: var(--ink); }\n\na { color: var(--blue); text-decoration-thickness: 1px; text-underline-offset: 3px; }\na:visited { color: var(--blue); }\na:hover, a:focus-visible { background: var(--pink); color: var(--ink); text-decoration: none; outline: none; }\n\n.m, .title { font: 400 13px/24px var(--mono); }\n.sym, .heart, .pk { color: var(--pink); font-style: normal; }\n.big-type { font: 700 28px/32px var(--sans); letter-spacing: -.015em; }\n\n/* ---------- the composition ---------- */\n.page { display: grid; gap: var(--line); }\n.band { display: grid; gap: var(--line); grid-template-columns: var(--cols); }\n.band > *, .pile > *, .fm > *, .projects > *, .more > * { min-width: 0; }\n.pile { display: flex; flex-direction: column; gap: var(--line); }\n.cell { background: var(--paper); padding: var(--pad); }\n.plane { min-height: var(--line); }\n.pink { background: var(--pink); }\n.blue { background: var(--blue); }\n.yellow { background: var(--yellow); }\n\n/* ---------- band one: name, hello, KES FM, and the colour on the right ---------- */\n.top { grid-template-areas: \"name name name side\" \"left fm fm side\"; }\n.sign { grid-area: name; background: var(--paper); container-type: inline-size; }\n.side { grid-area: side; }\n.side .pink { flex: 1; }\n.side .yellow { flex: 0 0 96px; }\n.left { grid-area: left; }\n.left .hello { flex: 1; }\n\n/* the name, in \u003c3s */\n.sign pre { margin: var(--pad); width: fit-content; font-family: var(--mono); font-weight: 700; line-height: 1.15; color: var(--ink);\n  font-size: min(16px, calc((100cqw - 2 * var(--pad)) / 95)); }\n.sign b { font-weight: inherit; color: var(--ink); }\n.sign b.h { color: var(--pink); }\n@keyframes blink { 50% { color: var(--blue); } }\n@media (prefers-reduced-motion: no-preference) { body.on-air .sign b.h { animation: blink 1.6s steps(1) infinite; } }   /* the heart beats while the radio is on */\n.sign .small { display: none; }\n@container (max-width: 699px) {\n  .sign .big { display: none; }\n  .sign .small { display: block; font-size: min(16px, calc((100cqw - 2 * var(--pad)) / 21)); }\n}\n\n.hello h1 { margin-bottom: 16px; }\n.hello .welcome { margin-bottom: 24px; }\n.hello p { max-width: 34em; }\n.chain p { max-width: 34em; }\n\n/* ---------- KES FM: speaker, a blue plane under it, and the desk ---------- */\n.fm { grid-area: fm; display: grid; gap: var(--line);\n  grid-template-columns: minmax(0, 330fr) minmax(0, 460fr);\n  grid-template-rows: auto 1fr;\n  grid-template-areas: \"face desk\" \"plane desk\"; }\n.fm-face { grid-area: face; background: var(--paper); container-type: inline-size; }\n.fm-plane { grid-area: plane; min-height: 48px; }\n.fm-desk { grid-area: desk; }\n\npre.stack { margin: var(--pad); font-family: var(--mono); font-size: min(13px, calc((100cqw - 2 * var(--pad)) / 23.5)); line-height: 1.15; color: var(--ink); white-space: pre; }\n.stack .c, .stack .i { color: var(--ink); }\n.stack .y { color: var(--ink); font-weight: 700; }\n.stack .p { color: var(--pink); }\n.stack .g, .stack .b { color: var(--blue); }\nbody:not(.on-air) .stack .w { visibility: hidden; }      /* the sound waves only come out on air */\n.sound.thump { animation: thump .2s ease-out; }\n@keyframes thump { from { transform: translateY(-2px); } }\n\n#fm-h { font: 700 16px/24px var(--sans); margin-bottom: 8px; }\n.ident { max-width: 36em; }\n.deck { margin-top: var(--pad); }\n/* the display is a black plane: it runs from line to line */\n.lcd { margin: 0 calc(var(--pad) * -1); padding: 16px var(--pad); background: var(--ink); color: var(--paper); font: 13px/24px var(--mono); }\n.lcd-top { display: flex; flex-wrap: wrap; justify-content: space-between; column-gap: 2ch; }\n.status { padding: 0 .5ch; color: var(--yellow); }\nbody.on-air .status { background: var(--pink); color: var(--ink); }\n.ticker { overflow: hidden; white-space: nowrap; }\n.ticker > div { display: inline-block; }\n.ticker span { padding-right: .5em; }\n@keyframes run { to { translate: -50% 0; } }\n@media (prefers-reduced-motion: no-preference) { body.on-air .ticker > div { animation: run 70s linear infinite; } }\n.tracker { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); text-align: center; }\n.tracker .rest { opacity: .4; }\n.tracker .rev { color: var(--pink); }\n.tracker .up { color: var(--yellow); }\n.tracker .roll { text-decoration: underline; }\n.tracker .on { background: var(--pink); color: var(--ink); }\n.lcd-info { display: flex; flex-wrap: wrap; column-gap: 2ch; color: #bdbdbd; }\n.lcd-info .rev { color: var(--pink); }\n.lcd-info .up { color: var(--yellow); }\n\n.keys { margin-top: var(--pad); font: 13px/24px var(--mono); }\n.keys > div, .keys > label { display: block; padding-left: 6ch; text-indent: -6ch; }\n.keys > div:not([role]) { text-indent: 0; }\n.keys > div:first-child { padding-left: 0; margin-bottom: 8px; }\n.keys .lbl { display: inline-block; width: 6ch; text-indent: 0; }\n.keys button { font: 13px/24px var(--mono); color: var(--ink); background: none; border: 0; border-radius: 0; padding: 0; margin: 0 1ch 0 0; cursor: pointer; text-indent: 0; }\n.keys button::before { content: \"[\"; }\n.keys button::after { content: \"]\"; }\n.keys .go, .keys .stop { font: 700 16px/24px var(--mono); }\n.keys button[aria-pressed=\"true\"] { background: var(--ink); color: var(--paper); }\n.keys .go[aria-pressed=\"true\"] { background: var(--pink); color: var(--ink); }\n.keys button:hover, .keys button:focus-visible { background: var(--pink); color: var(--ink); outline: none; }\n.vol input { width: 120px; margin: 0; vertical-align: middle; accent-color: var(--ink); }\n.textin { margin-top: var(--pad); font: 13px/24px var(--mono); }\n.floatstop { position: fixed; right: 24px; bottom: 24px; z-index: 5; font: 700 13px/24px var(--mono); background: var(--pink); color: var(--ink);\n  border: 0; border-radius: 0; padding: 12px 20px; cursor: pointer; box-shadow: 0 0 0 var(--line) var(--ink); }\n.floatstop:hover, .floatstop:focus-visible { background: var(--yellow); outline: none; }\n.floatstop[hidden] { display: none; }\n\n/* ---------- band two: the card and three projects ---------- */\n.work { grid-template-areas: \"card pr pr pr\"; }\n.card { grid-area: card; }\n.card .name { font: 700 16px/24px var(--sans); margin-bottom: 24px; }\n.card .name .m { font-weight: 400; }\n.card dt { font: 13px/24px var(--mono); }\n.card dl > div + div { margin-top: 16px; }\n.card .contact { margin-top: 24px; }\n\n.projects { grid-area: pr; display: grid; gap: var(--line);\n  grid-template-columns: minmax(0, 330fr) minmax(0, 460fr) minmax(0, 294fr);\n  grid-template-rows: auto 1fr;\n  grid-template-areas: \"ph ph ph\" \"p1 p2 p3\"; }\n.ph { grid-area: ph; }\n#p1 { grid-area: p1; } #p2 { grid-area: p2; } #p3 { grid-area: p3; }\n.proj { display: flex; flex-direction: column; background: var(--paper); }\n.proj .pic { order: -1; border-bottom: var(--line) solid var(--ink); }\n.proj .pic img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: cover; background: var(--grey); filter: grayscale(1); }\n.proj .what { padding: var(--pad) var(--pad) 0; }\n.proj .what .n { margin-right: 1ch; }\n.proj h3 { display: inline; font: 700 16px/24px var(--sans); }\n.proj .what p { margin-top: 8px; }\n.proj .note { flex: 1; padding: 16px var(--pad) var(--pad); }\n.proj .note p { max-width: 34em; }\n\n/* ---------- band three: everything else, the low-wifi note, goodbye ---------- */\n.links { grid-template-areas: \"more more more foot\"; }\n.more { grid-area: more; display: grid; gap: var(--line);\n  grid-template-columns: minmax(0, 290fr) minmax(0, 400fr) minmax(0, 420fr); }\n.more .cell { flex: 1 0 auto; }\n.more .cell:first-child:not(:only-child) { flex: 0 0 auto; }\n.more .title { margin-bottom: 16px; }\n.stars { list-style: \"☆  \"; padding-left: 24px; }\n.stars li + li { margin-top: 4px; }\n.stars li::marker { color: var(--ink); }\n.stars li:hover { list-style-type: \"★  \"; }\n.stars li:hover::marker { color: var(--pink); }\n.foot { grid-area: foot; }\n.foot .blue { flex: 1 0 96px; }\n\n/* ---------- the garden, a long thin rectangle along the bottom ---------- */\n.garden-bed { background: var(--paper); container-type: inline-size; }\n.garden { margin: var(--pad); font-family: var(--mono); font-size: max(11px, calc((100cqw - 2 * var(--pad)) / 113.6)); line-height: 1.2; white-space: pre; overflow: hidden; color: var(--ink); }\n.garden b { font-weight: normal; }\n.garden .rose { color: var(--pink); }\n.garden .lilac, .garden .peri { color: var(--blue); }\n.garden .stem { color: var(--ink); }\n\n/* ---------- a smaller screen: the composition folds into two columns ---------- */\n@media (max-width: 1199px) {\n  :root { --line: 10px; --pad: 24px; }\n  .top { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); grid-template-areas: \"name name\" \"left side\" \"fm fm\"; }\n  .side .yellow { flex-basis: 72px; }\n  .fm { grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); }\n  .work { grid-template-columns: minmax(0, 1fr); grid-template-areas: \"card\" \"pr\"; }\n  .card dl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: var(--pad); }\n  .card dl > div + div { margin-top: 0; }\n  .projects { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: auto; grid-template-areas: \"ph ph\" \"p1 p2\" \"p3 p3\"; }\n  #p3 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto 1fr; grid-template-areas: \"pic what\" \"pic note\"; }\n  #p3 .pic { grid-area: pic; border-bottom: 0; border-right: var(--line) solid var(--ink); }\n  #p3 .pic img { height: 100%; }\n  #p3 .what { grid-area: what; } #p3 .note { grid-area: note; }\n  .links { grid-template-columns: minmax(0, 1fr); grid-template-areas: \"more\" \"foot\"; }\n  .more { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }\n  .more > .pile:nth-child(3) { grid-column: 1 / -1; }\n  .foot { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr); }\n}\n/* ---------- a phone: one column of rectangles, the colour kept as bands ---------- */\n@media (max-width: 699px) {\n  :root { --line: 6px; --pad: 20px; }\n  .top { grid-template-columns: minmax(0, 1fr); grid-template-areas: \"name\" \"side\" \"left\" \"fm\"; }\n "chainmail: short pieces of writing by kes inkersole, sent in by email.\">\n\u003cstyle>\n/* ---------------------------------------------------------------\n   chainmail. the same composition rules as the home page, calmer:\n   one line weight (--line), one padding (--pad), three type sizes,\n   white rectangles for the pieces, two planes of colour. no scripts.\n   --------------------------------------------------------------- */\n:root {\n  --line: 12px;\n  --pad: 32px;\n  --ink: #000;\n  --paper: #fff;\n  --blue: #0038ff;\n  --pink: #ff3399;\n  --yellow: #ffd21f;\n  --sans: \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n  --mono: ui-monospace, Menlo, Monaco, Consolas, \"Liberation Mono\", \"Courier New\", monospace;\n  color-scheme: light;\n}\nhtml { background: var(--ink); color: var(--ink); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\nbody { margin: 0; background: var(--ink); font: 16px/24px var(--sans); overflow-wrap: break-word; }\np, h1, h2, pre { margin: 0; }\n::selection { background: var(--pink); color: var(--ink); }\n\na { color: var(--blue); text-decoration-thickness: 1px; text-underline-offset: 3px; }\na:visited { color: var(--blue); }\na:hover, a:focus-visible { background: var(--pink); color: var(--ink); text-decoration: none; outline: none; }\n\n.m { font: 400 13px/24px var(--mono); }\n.heart, .pk { color: var(--pink); font-style: normal; }\n.big-type { font: 700 28px/32px var(--sans); letter-spacing: -.015em; }\n\n/* ---------- the composition ---------- */\n.page { display: grid; gap: var(--line); }\n.band { display: grid; gap: var(--line); }\n.band > * { min-width: 0; }\n.cell { background: var(--paper); padding: var(--pad); }\n.blue { background: var(--blue); }\n.yellow { background: var(--yellow); }\n\n/* ---------- the top: home, a blue plane, the intro, the little computer ---------- */\n.head { grid-template-columns: minmax(0, 300fr) minmax(0, 800fr) minmax(0, 316fr);\n  grid-template-rows: auto 1fr;\n  grid-template-areas: \"home intro pc\" \"plane intro pc\"; }\n.home { grid-area: home; }\n.head .blue { grid-area: plane; min-height: 48px; }\n.intro { grid-area: intro; }\n.intro h1 { margin-bottom: 16px; }\n.intro p { max-width: 34em; }\n.intro p + p { margin-top: 24px; }\n.pcbox { grid-area: pc; }\n.pc { font: 13px/1.1 var(--mono); color: var(--ink); }\n.pc b { font: inherit; color: var(--pink); }\n\n/* ---------- the pieces: white rectangles, two to a row, newest first ----------\n   the widths step through 7/5, 4/8, 8/4 twelfths, so the vertical line moves\n   from row to row. a piece left on its own fills its row. */\n.pieces { display: flex; flex-wrap: wrap; gap: var(--line); }\n.piece { --w: 7; flex: 1 1 calc((100% - var(--line)) * var(--w) / 12 - 1px); min-width: 0; box-sizing: border-box; background: var(--paper); padding: var(--pad); }\n.piece:nth-child(6n+2) { --w: 5; }\n.piece:nth-child(6n+3) { --w: 4; }\n.piece:nth-child(6n+4) { --w: 8; }\n.piece:nth-child(6n+5) { --w: 8; }\n.piece:nth-child(6n+6) { --w: 4; }\n.piece .meta { font: 13px/24px var(--mono); }\n.piece h2 { font: 700 16px/24px var(--sans); margin-bottom: 16px; }\n.piece .text p { max-width: 34em; }\n.piece .text p + p { margin-top: 24px; }\n\n/* ---------- the end ---------- */\n.foot { grid-template-columns: minmax(0, 560fr) minmax(0, 600fr) minmax(0, 256fr); }\n.foot .yellow { min-height: 48px; }\n\n.garden-bed { background: var(--paper); container-type: inline-size; }\n.garden { margin: var(--pad); font-family: var(--mono); font-size: max(11px, calc((100cqw - 2 * var(--pad)) / 113.6)); line-height: 1.2; white-space: pre; overflow: hidden; color: var(--ink); }\n.garden b { font-weight: normal; }\n.garden .rose { color: var(--pink); }\n.garden .lilac, .garden .peri { color: var(--blue); }\n.garden .stem { color: var(--ink); }\n\n@media (max-width: 1199px) {\n  :root { --line: 10px; --pad: 24px; }\n  .head { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); grid-template-rows: auto auto; grid-template-area  |/  \u003c/b>\u003cb class=\"lilac\">(_)   \u003c/b>\u003cb class=\"stem\">|       |/    \\|    |   \u003c/b>\u003cb class=\"rose\">(_)   \u003c/b>\u003cb class=\"stem\">|/     |/     |   \\|   \u003c/b>\u003cb class=\"peri\">(_)      \u003c/b>\u003cb class=\"stem\">|/     |/   |   \\|    \u003c/b>\u003cb class=\"rose\">(_)     \u003c/b>\u003cb class=\"stem\">|/     |   \\|   \u003c/b>\u003cb class=\"rose\">(_)\u003c/b>\n   \u003cb class=\"stem\">\\|      |    |    |    \\|     \\|      |    |      |      \\|     \\|    |    |      \\|      |    |    |   \\|     \\|      |    |    |      \\|     \\|    |    |     |     \\|      |    |    |\u003c/b>\u003c/pre>\n\u003c/div>\n\n\u003c/div>\n\u003cscript>(function(){\nvar PAGES=[\"index.html\", \"writing.html\"];\ndocument.addEventListener('click',function(e){\n  var a=e.target.closest&&e.target.closest('a[href]');\n  if(!a||e.defaultPrevented)return;\n  var h=a.getAttribute('href'),m=h.replace(/^\\.\\//,'').split('#'),p=m[0],id=m[1]||'';\n  if(p===''&&h.charAt(0)==='#'){\n    var t=id&&document.getElementById(decodeURIComponent(id));\n    if(id&&!t)return;\n    e.preventDefault();t?t.scrollIntoView({block:'start'}):scrollTo(0,0);return;\n  }\n  if(PAGES.indexOf(p)>-1||p==='/'||p==='.'){\n    e.preventDefault();parent.postMessage({variantPage:PAGES.indexOf(p)>-1?p:'index.html',hash:id},'*');\n  }\n});\naddEventListener('keydown',function(e){\n  if(e.metaKey||e.ctrlKey||e.altKey)return;\n  if(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]'))return;\n  if(['ArrowLeft','ArrowRight','m'].indexOf(e.key)>-1)parent.postMessage({variantKey:e.key},'*');\n});\nif(location.hash.length>1){var t=document.getElementById(decodeURIComponent(location.hash.slice(1)));t&&t.scrollIntoView();}\n})();\u003c/script>\u003c/body>\n\u003c/html>\n"}}, {"label": "04", "note": "mondrian · Mondrian of thick black lines: heart-letter name over hello, KES FM and CV card, pink/blue/yellow planes; chainmail is a calm three-column ruled field.", "pages": {"index.html": "\u003c!doctype html>\n\u003chtml lang=\"en-GB\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cmeta name=\"color-scheme\" content=\"light\">\n\u003ctitle>kes inkersole\u003c/title>\n\u003cmeta name=\"description\" content=\"kes inkersole (kesia on paper): freelance creative strategist and internet equalities researcher, based in london.\">\n\u003cstyle>\n/* kes inkersole, after mondrian.\n   the page is one composition. the canvas is black and every rectangle sits on it, so the lines are the\n   gaps between them: one weight (--L), running to the edges of the window.\n   most rectangles are white and hold one thing each. a few are flat planes of colour and hold nothing:\n   kes's hot pink stands in for mondrian's red (it is also the highlight under your mouse),\n   her electric blue is the blue (it is also every link), plus one yellow and one small black.\n   three type sizes: 13px mono for labels and drawings, 16px sans for reading, 40px sans for saying hello. */\n:root {\n  --ink: #000;\n  --white: #fff;\n  --off: #f2f0eb;\n  --blue: #0038ff;\n  --pink: #ff2d87;\n  --yellow: #ffd200;\n  --L: 12px;\n  --pad: 32px;\n  --u: 24px;\n  /* five tracks shared by every band, so the long verticals line up down the page */\n  --cols: minmax(0, 300fr) minmax(0, 308fr) minmax(0, 424fr) minmax(0, 172fr) minmax(0, 188fr);\n  --sans: \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n  --mono: ui-monospace, Menlo, Consolas, \"DejaVu Sans Mono\", \"Liberation Mono\", \"Courier New\", monospace;\n}\nhtml { background: var(--white); color: var(--ink); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\nbody { margin: 0; font: 16px/24px var(--sans); overflow-x: hidden; overflow-wrap: break-word; }\nh1, h2, h3, p, ul, dl, dd, pre { margin: 0; }\nh1, h2, h3 { font: inherit; }\n::selection { background: var(--pink); color: var(--ink); }\n\na { color: var(--blue); text-decoration-thickness: 1px; text-underline-offset: .2em; }\na:visited { text-decoration-style: dotted; }\na:hover { background: var(--pink); color: var(--ink); text-decoration: none; }\na:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }\n.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }\n\n/* the three sizes */\n.lbl, .soft, #fm-h, .card dt { font: 13px/24px var(--mono); }\n.display { font: 400 40px/44px var(--sans); letter-spacing: -.02em; }\n.heart, .sym { color: var(--pink); font-style: normal; }\npre { font: 13px/15px var(--mono); white-space: pre; }\npre b, pre i { font: inherit; }\n\n/* ---------- the composition ---------- */\n.canvas { background: var(--ink); display: flex; flex-direction: column; gap: var(--L); }\n.band { display: grid; grid-template-columns: var(--cols); gap: var(--L); }\n.stack { display: flex; flex-direction: column; gap: var(--L); min-width: 0; }\n.r { background: var(--white); padding: var(--pad); min-width: 0; }\n.r > * + * { margin-top: var(--u); }\n.r > .lbl + * { margin-top: 8px; }\n.grow { flex: 1 1 auto; }\n.pl-pink { background: var(--pink); }\n.pl-blue { background: var(--blue); }\n.pl-yellow { background: var(--yellow); }\n.pl-black { background: var(--ink); }\n.pl-off { background: var(--off); }\n/* a small split at the foot of a right-hand column: it falls on the same line as tracks four and five */\n.split { display: grid; grid-template-columns: minmax(0, 172fr) minmax(0, 188fr); gap: var(--L); flex: none; }\n\n/* band one: the first view. name across the top, pink at the top right,\n   then hello / KES FM / the card, with blue at the foot of the left and a little yellow in the bottom corner */\n.b1 { grid-template-areas: \"name name name pk pk\" \"g f f c c\"; grid-template-rows: auto 1fr; }\n.name { grid-area: name; } .pk1 { grid-area: pk; }\n.s-g { grid-area: g; } .s-f { grid-area: f; } .s-c { grid-area: c; }\n.s-g .pl-blue { flex: none; height: 120px; }\n.s-c .split { height: 48px; }\n\n/* band two: three projects */\n.b2 { grid-template-areas: \"p1 p1 p2 p3 p3\"; }\n.p1 { grid-area: p1; } .p2s { grid-area: p2; } .p3 { grid-area: p3; }\n.p2s .pl-blue { flex: 1 1 auto; min-height: 64px; }\n\n/* band three: everything else */\n.b3 { grid-template-areas: \"a b b c c\"; }\n.s-a { grid-area: a; } .s-b { grid-area: b; } .s-r { grid-area: c; }\n.s-r .split { height: 72px; }\n\n/* band four: goodbye, with pink at the bottom left */\n.b4 { grid-template-areas: \"pk bye bye hi hi\"; }\n.pk4 { grid-area: pk; } .bye { grid-area: bye; } .hi { grid-area: hi; }\n\n/* ---------- the name, in tiny \u003c3s, inked black with a pink heart ---------- */\n.name { container-type: inline-size; display: flex; align-items: center; }\n.name > pre { margin: 0; font-weight: 700; line-height: 1.2; }\n.name .big { font-size: min(16px, calc(100cqw / 95.5)); }\n.name .small { display: none; font-size: min(20px, calc(100cqw / 20.9)); }\n.name b { color: var(--ink); }\n.name b.h { color: var(--pink); animation: blink 1.6s steps(1) infinite; }\n@keyframes blink { 50% { color: var(--blue); } }\n\n/* ---------- the card ---------- */\n.card dl { display: grid; grid-template-columns: 9ch minmax(0, 1fr); column-gap: 12px; row-gap: 8px; }\n.card dt { padding-top: 0; }\n\n/* ---------- KES FM: the speaker is its face, the deck is plain type and square keys ---------- */\n.r-fm { container-type: inline-size; }\n.fm { display: grid; grid-template-columns: min-content minmax(0, 1fr); column-gap: var(--pad); align-items: start;\n  grid-template-areas: \"h deck\" \"face deck\" \"ident deck\"; grid-template-rows: auto auto 1fr; }\n#fm-h { grid-area: h; font-weight: 700; }\n.speaker { grid-area: face; margin-top: var(--u); color: var(--ink); width: fit-content; }\n.ident { grid-area: ident; margin-top: var(--u); }\n.deck { grid-area: deck; font: 13px/24px var(--mono); }\n.speaker .c, .speaker .b, .speaker .i { color: var(--ink); }\n.speaker .p { color: var(--pink); }\n.speaker .g { color: var(--blue); }\n.speaker .y { background: var(--yellow); color: var(--ink); }\n.speaker.lit .p { color: var(--blue); }\n.speaker .sound.thump { animation: thump .3s steps(1); }\n@keyframes thump { 0% { color: var(--pink); } }\n\n.lcd-top { display: flex; flex-wrap: wrap; justify-content: space-between; column-gap: var(--u); font-weight: 700; }\nbody.on-air .status { color: var(--pink); }\n.ticker { overflow: hidden; white-space: nowrap; background: var(--off); margin-top: 4px; }\n.ticker > div { display: inline-block; }\n.ticker span { padding-right: .5em; }\n@keyframes run { to { translate: -50% 0; } }\n@media (prefers-reduced-motion: no-preference) { .ticker > div { animation: run 70s linear infinite; } }\n.tracker { display: grid; grid-template-columns: repeat(16, auto); justify-content: space-between; margin-top: 4px; }\n.tracker span { padding: 0 2px; margin: 0 -2px; }\n.tracker .rest { opacity: .35; }\n.tracker .roll { text-decoration: underline; text-underline-offset: .2em; }\n.tracker .on { background: var(--yellow); color: var(--ink); }\n.deck .rev { color: var(--pink); }\n.deck .up { color: var(--blue); }\n.tracker .on.rev, .tracker .on.up { color: var(--ink); }\n.lcd-info { display: flex; flex-direction: column; margin-top: 4px; }\n\n.keys { margin-top: var(--u); }\n.keys > div { display: flex; flex-wrap: wrap; align-items: center; padding-left: 7ch; }\n.keys > div + div { margin-top: 8px; }\n.keys .lbl { width: 7ch; margin-left: -7ch; }\n.keys button { box-sizing: border-box; height: 32px; margin: 0; padding: 0 1.2ch; font: 13px/28px var(--mono); color: var(--ink); background: var(--white);\n  border: 2px solid var(--ink); border-radius: 0; cursor: pointer; }\n.keys > div > button + button { margin-left: -2px; }\n.keys button:hover, .keys button[aria-pressed=\"true\"]:hover { background: var(--pink); color: var(--ink); }\n.keys button:active { translate: 0 1px; }\n.keys button[aria-pressed=\"true\"] { background: var(--ink); color: var(--white); }\n.keys .go, .keys .stop { font-weight: 700; }\n.keys .go[aria-pressed=\"true\"] { background: var(--pink); color: var(--ink); }\n.vol { display: grid; grid-template-columns: 7ch auto; justify-content: start; align-items: center; margin-top: var(--u); }\n.vol input { width: 10em; margin: 0; accent-color: var(--ink); }\n.textin { margin-top: var(--u); }\n.floatstop { position: fixed; right: var(--u); bottom: var(--u); z-index: 5; box-sizing: border-box; height: 32px; padding: 0 1.2ch;\n  font: 700 13px/28px var(--mono); color: var(--ink); background: var(--pink); border: 2px solid var(--ink); border-radius: 0; cursor: pointer; }\n.floatstop:hover { background: var(--white); }\n.floatstop[hidden] { display: none; }\n\n/* when KES FM's rectangle gets narrow, the deck drops under the speaker */\n@container (max-width: 679px) {\n  .fm { grid-template-areas: \"h h\" \"face ident\" \"deck deck\"; grid-template-rows: auto; }\n  .deck { margin-top: calc(1.5 * var(--u)); }\n}\n@container (max-width: 539px) {\n  .fm { grid-template-columns: minmax(0, 1fr); grid-template-areas: \"h\" \"face\" \"ident\" \"deck\"; }\n}\n\n/* ---------- projects ---------- */\n.slice .pic { display: block; }\n.slice .pic img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: cover; background: var(--off); filter: grayscale(1); }\n.slice .pic:hover { background: var(--pink); }\n.slice .pic:hover img { mix-blend-mode: multiply; }\n.slice .cap > * + * { margin-top: 8px; }\n.slice .meta { display: flex; justify-content: space-between; column-gap: var(--u); }\n\n/* ---------- link lists ---------- */\n.list ul { padding-left: 1.6em; list-style: \"☆  \"; }\n.list li + li { margin-top: 4px; }\n.list li:hover { list-style-type: \"★  \"; }\n.list li:hover::marker { color: var(--pink); }\n\n/* ---------- the end ---------- */\n.gardenr { padding: var(--pad) 0 0; overflow: hidden; }\n.garden { padding-left: 8px; }\n.garden .rose { color: var(--pink); }\n.garden .peri { color: var(--blue); }\n.garden .lilac, .garden .stem { color: var(--ink); }\n\n/* ---------- narrower: two columns ---------- */\n@media (max-width: 1279px) {\n  :root { --cols: minmax(0, 5fr) minmax(0, 7fr); }\n  .b1 { grid-template-areas: \"name pk\" \"f f\" \"g c\"; grid-template-rows: auto; }\n  .name .big { display: none; }\n  .name .small { display: block; }\n  .b2 { grid-template-areas: \"p1 p1\" \"p2 p3\"; }\n  .p1 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: var(--pad); align-items: start; }\n  .p1 > .cap { margin-top: 0; }\n  .b3 { grid-template-areas: \"a b\" \"c b\"; }\n  .b4 { grid-template-areas: \"pk bye\" \"pk hi\"; }\n}\n\n/* ---------- phone: one stack of rectangles, a few planes kept as bands ---------- */\n@media (max-width: 819px) {\n  :root { --L: 6px; --pad: 24px; }\n  .band { display: flex; flex-direction: column; gap: var(--L); }\n  .p1 { display: block; }\n  .p1 > .cap { margin-top: var(--u); }\n  .pk1, .pk4 { height: 40px; }\n  .s-g .pl-blue, .s-r .split { display: none; }\n  .s-c .split { height: 40px; }\n  .p2s .pl-blue { flex: none; height: 40px; min-height: 0; }\n  .display { font-size: 32px; line-height: 40px; }\n}\n@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003ch1 class=\"vh\">Kes Inkersole\u003c/h1>\n\n\u003cdiv class=\"canvas\">\n\n\u003c!-- band one: the first view -->\n\u003cdiv class=\"band b1\">\n\n\u003c!-- the name, spelled out in tiny \u003c3 hearts (index 5, variant 03), its frame and dots left to the grid -->\n\u003cdiv class=\"r name\" aria-hidden=\"true\">\n\u003cpre class=\"big\">\u003cb>&lt;3\u003c/b>                                          \u003cb>&lt;3\u003c/b>                \u003cb>&lt;3\u003c/b>                                                          \u003cb>&lt;3&lt;3\u003c/b>\n\u003cb>&lt;3\u003c/b> and others stop short. no scripts. */\n:root {\n  --ink: #000;\n  --white: #fff;\n  --off: #f2f0eb;\n  --blue: #0038ff;\n  --pink: #ff2d87;\n  --yellow: #ffd200;\n  --L: 12px;\n  --pad: 32px;\n  --u: 24px;\n  --cols: repeat(6, minmax(0, 1fr));\n  --sans: \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n  --mono: ui-monospace, Menlo, Consolas, \"DejaVu Sans Mono\", \"Liberation Mono\", \"Courier New\", monospace;\n}\nhtml { background: var(--white); color: var(--ink); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\nbody { margin: 0; font: 16px/24px var(--sans); overflow-x: hidden; overflow-wrap: break-word; }\nh1, h2, h3, p, pre { margin: 0; }\nh1, h2, h3 { font: inherit; }\n::selection { background: var(--pink); color: var(--ink); }\n\na { color: var(--blue); text-decoration-thickness: 1px; text-underline-offset: .2em; }\na:visited { text-decoration-style: dotted; }\na:hover { background: var(--pink); color: var(--ink); text-decoration: none; }\na:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }\n\n.lbl { font: 13px/24px var(--mono); }\n.display { font: 400 40px/44px var(--sans); letter-spacing: -.02em; }\n.heart { color: var(--pink); font-style: normal; }\npre { font: 13px/15px var(--mono); white-space: pre; }\npre b, pre i, pre em { font: inherit; }\n\n/* ---------- the composition ---------- */\n.canvas { background: var(--ink); display: flex; flex-direction: column; gap: var(--L); }\n.band { display: grid; grid-template-columns: var(--cols); gap: var(--L); }\n.r { background: var(--white); padding: var(--pad); min-width: 0; }\n.r > * + * { margin-top: var(--u); }\n.r > .lbl + * { margin-top: 8px; }\n.pl-blue { background: var(--blue); }\n.pl-yellow { background: var(--yellow); }\n\n/* the top: title on the left half; how it works, the little computer and a blue plane on the right */\n.w1 { grid-template-areas: \"t t t h h h\" \"t t t pc pc b\"; }\n.wt { grid-area: t; } .how { grid-area: h; } .pcr { grid-area: pc; } .wb { grid-area: b; }\n.pcr { display: grid; place-items: center; }\n.pc { color: var(--ink); }\n.pc b { color: var(--pink); }\n\n/* the pieces: one white field, ruled into columns by the same black line, newest at the top left */\n.pieces { background: var(--white); columns: 3; column-gap: var(--L); column-rule: var(--L) solid var(--ink); margin-top: calc(-1 * var(--L)); }\n.piece { break-inside: avoid; padding: var(--pad); border-top: var(--L) solid var(--ink); }\n.piece .meta { display: flex; justify-content: space-between; column-gap: var(--u); }\n.piece h2 { font-weight: 700; margin-top: 8px; }\n.piece .text { max-width: 36em; margin-top: 8px; }\n.piece .text p + p { margin-top: var(--u); }\n\n/* the end: yellow at the bottom left, a thank you, the low-wifi note */\n.w3 { grid-template-areas: \"y b b b n n\"; }\n.wy { grid-area: y; } .wbye { grid-area: b; } .wnote { grid-area: n; }\n\n.gardenr { padding: var(--pad) 0 0; overflow: hidden; }\n.garden { padding-left: 8px; }\n.garden .rose { color: var(--pink); }\n.garden .peri { color: var(--blue); }\n.garden .lilac, .garden .stem { color: var(--ink); }\n\n@media (max-width: 1099px) {\n  .w1 { grid-template-areas: \"t t t h h h\" \"b b pc pc pc pc\"; }\n  .pieces { columns: 2; }\n  .w3 { grid-template-areas: \"y y b b b b\" \"y y n n n n\"; }\n}\n@media (max-width: 699px) {\n  :root { --L: 6px; --pad: 24px; }\n  .band { display: flex; flex-direction: column; gap: var(--L); }\n  .wb, .wy { height: 40px; }\n  .pieces { columns: 1; }\n  .display { font-size: 32px; line-height: 40px; }\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv class=\"canvas\">\n\n\u003cheader class=\"band w1\">\n\u003cdiv class=\"r wt\">\n\u003cp class=\"lbl\">\u003ca href=\"index.html\">← kes inkersole\u003c/a>\u003c/p>\n\u003ch1 class=\"display\">chainmail \u003cspan class=\"heart\">♡\u003c/span>\u003c/h1>\n\u003cp>my own writing. short pieces, the kind i write in my notes app, sent here by email and collected over time into a kind of text moodboard.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"r how\">\n\u003cp class=\"lbl\">by email\u003c/p>\n\u003cp>each piece arrives as an email to (address tbc). the subject line becomes its title and the newest one lands at the top.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"r pcr\">\n\u003cpre class=\"pc\" role=\"img\" aria-label=\"ascii drawing of a little computer with a heart on its screen\">\n  ______________________\n |  __________________  |\n | |                  | |\n | |   \u003cb>&lt;3&lt;3\u003c/b>    \u003cb>&lt;3&lt;3\u003c/b>   | |\n | | \u003cb>&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3\u003c/b> | |\n | | \u003cb>&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3\u003c/b> | |\n | |   \u003cb>&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3\u003c/b>   | |\n | |     \u003cb>&lt;3&lt;3&lt;3&lt;3\u003c/b>     | |\n | |       \u003cb>&lt;3&lt;3\u003c/b>       | |\n | |        \u003cb>&lt;3\u003c/b>        | |\n | |__________________| |\n |                      |\n |  \u003cb>o\u003c/b>          ______   |\n |______________________|\\\n   |__________________|   \\\u003c/pre>\n\u003c/div>\n\u003cdiv class=\"pl-blue wb\" aria-hidden=\"true\">\u003c/div>\n\u003c/header>\n\n\u003cmain class=\"pieces\" id=\"pieces\">\n\u003c!-- new pieces go at the top. one email = one \u003carticle class=\"piece\">, always in this shape:\n\u003carticle class=\"piece\" id=\"piece-NNN\">\n\u003cp class=\"meta lbl\">\u003cspan>no. NNN\u003c/span>\u003ctime datetime=\"YYYY-MM-DD\">D mon YYYY\u003c/time>\u003c/p>\n\u003ch2>the email subject\u003c/h2>\n\u003cdiv class=\"text\">\u003cp>the email body, one \u003cp> per paragraph\u003c/p>\u003c/div>\n\u003c/article>\nthe dates and words below are placeholders. -->\n\n\u003carticle class=\"piece\" id=\"piece-011\">\n\u003cp class=\"meta lbl\">\u003cspan>no. 011\u003c/span>\u003ctime datetime=\"2026-10-18\">18 oct 2026\u003c/time>\u003c/p>\n\u003ch2>lorem ipsum\u003c/h2>\n\u003cdiv class=\"text\">\u003cp>lorem ipsum dolor sit amet.\u003c/p>\u003c/div>\n\u003c/article>\n\n\u003carticle class=\"piece\" id=\"piece-010\">\n\u003cp class=\"meta lbl\">\u003cspan>no. 010\u003c/span>\u003ctime datetime=\"2026-10-14\">14 oct 2026\u003c/time>\u003c/p>\n\u003ch2>consectetur adipiscing elit\u003c/h2>\n\u003cdiv class=\"text\">\n\u003cp>sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur.\u003c/p>\n\u003cp>excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum. sed ut perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium.\u003c/p>\n\u003cp>totam rem aperiam, eaque ipsa quae ab illo inventore veritatis et quasi architecto beatae vitae dicta sunt explicabo.\u003c/p>\n\u003c/div>\n\u003c/article>\n\n\u003carticle class=\"piece\" id=\"piece-009\">\n\u003cp class=\"meta lbl\">\u003cspan>no. 009\u003c/span>\u003ctime datetime=\"2026-10-09\">9 oct 2026\u003c/time>\u003c/p>\n\u003ch2>(no subject)\u003c/h2>\n\u003cdiv class=\"text\">\u003cp>nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit aut fugit.\u003c/p>\u003c/div>\n\u003c/article>\n\n\u003carticle class=\"piece\" id=\"piece-008\">\n\u003cp class=\"meta lbl\">\u003cspan>no. 008\u003c/span>\u003ctime datetime=\"2026-10-06\">6 oct 2026\u003c/time>\u003c/p>\n\u003ch2>sed quia consequuntur\u003c/h2>\n\u003cdiv class=\"text\">\u003cp>magni dolores eos qui ratione voluptatem sequi nesciunt. neque porro quisquam est, qui dolorem ipsum quia dolor sit amet, consectetur, adipisci velit, sed quia non numquam eius modi tempora incidunt ut labore et dolore magnam aliquam quaerat voluptatem.\u003c/p>\u003c/div>\n\u003c/article>\n\n\u003carticle class=\"piece\" id=\"piece-007\">\n\u003cp class=\"meta lbl\">\u003cspan>no. 007\u003c/span>\u003ctime datetime=\"2026-10-02\">2 oct 2026\u003c/time &amp; internet equalities researcher, based in london.\">\n\u003cstyle>\n/* the page is the painting. a black ground shows through the gaps of one grid as the lines;\n   the rectangles are white, a few are flat planes of colour. kes' hot pink stands in for\n   mondrian's red on purpose: it is already her heart and her hover, so the hover is a tiny pink plane.\n   three type sizes: 13 mono (labels), 16 sans (reading), 40 times italic (hello). */\n:root {\n  --ink: #111;\n  --paper: #fff;\n  --off: #f3f1ec;\n  --blue: #1f3dff;\n  --pink: #ff2d95;\n  --yellow: #ffd500;\n  --line: 10px;\n  --pad: 36px;\n  --cols: minmax(0, 26fr) minmax(0, 37fr) minmax(0, 25fr) minmax(0, 12fr);\n  --sans: \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n  --mono: ui-monospace, Menlo, Consolas, \"DejaVu Sans Mono\", \"Liberation Mono\", \"Courier New\", monospace;\n  --serif: \"Times New Roman\", Times, serif;\n}\n*, *::before, *::after { box-sizing: border-box; }\nhtml { background: var(--paper); color: var(--ink); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\nbody { margin: 0; font: 16px/24px var(--sans); overflow-wrap: break-word; }\nh1, h2, h3, p, ul, dl, dd, pre { margin: 0; }\nh2, h3 { font-size: inherit; font-weight: inherit; }\nul { padding: 0; list-style: none; }\na { color: var(--blue); text-decoration-thickness: 1px; text-underline-offset: 3px; }\na:hover, a:focus-visible { background: var(--pink); color: var(--ink); }\na:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }\n::selection { background: var(--pink); color: var(--ink); }\n\n.label, .meta { font: 13px/24px var(--mono); }\n.sym, .heart { color: var(--pink); font-style: normal; }\nh1 { font: italic 400 40px/48px var(--serif); }\n.title { font-weight: bold; }\n.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }\n.art { font: 13px/16px var(--mono); white-space: pre; color: var(--ink); }\n.art b { font-weight: inherit; }\n\n/* ---------- the composition ---------- */\n.canvas, .canvas > main, .canvas > footer { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--line); }\n.canvas { background: var(--ink); }\n.band { display: grid; gap: var(--line); grid-template-columns: var(--cols); }\n.cell { background: var(--paper); padding: var(--pad); min-width: 0; }\n.flow > * + * { margin-top: 16px; }\n.stack { display: flex; flex-direction: column; gap: var(--line); min-width: 0; }\n.plane { min-width: 0; }\n.blue { background: var(--blue); }\n.pink { background: var(--pink); }\n.yellow { background: var(--yellow); }\n.paper { background: var(--off); }\n\n/* the first view: name across the top, KES FM beside the hello, a column of colour on the right edge */\n.hero { grid-template-areas: \"name name chain side\" \"left fm fm side\"; grid-template-rows: auto 1fr; min-height: min(100vh, 1000px); }\n.name { grid-area: name; display: flex; flex-direction: column; justify-content: space-between; gap: 24px; }\n.chain { grid-area: chain; }\n.left { grid-area: left; }\n.left .hello { flex: none; }\n.left .blue { flex: 1 1 auto; min-height: 48px; }\n.side { grid-area: side; }\n.side .pink { flex: 5 1 0; }\n.side .paper { flex: 4 1 0; }\n.side .yellow { flex: 0 0 96px; }\n\n/* the name: kes inkersole in tiny \u003c3s, letters in black, the heart in pink */\n.sign { container-type: inline-size; }\n.sign pre { font: bold min(16px, calc(100cqw / 95))/1.2 var(--mono); white-space: pre; color: var(--ink); }\n.sign b { font-weight: inherit; }\n.sign b.h { color: var(--pink); animation: blink 1.6s steps(1) infinite; }\n@keyframes blink { 50% { color: var(--ink); } }\n.sign .small { display: none; }\n\n/* ---------- KES FM: two rectangles on the grid's own columns. the display is the black plane ---------- */\n.fm { grid-area: fm; display: grid; grid-template-columns: minmax(0, 37fr) minmax(0, 25fr); grid-template-columns: subgrid; gap: var(--line); min-width: 0; }\n.fm .c1 { grid-column: 2; grid-row: 1; container-type: inline-size; display: flex; flex-direction: column; gap: 16px; }\n.fm .c1 .ident { margin-top: auto; }\n.fm .deck { grid-column: 1; grid-row: 1; background: var(--paper); display: flex; flex-direction: column; min-width: 0; }\n.speaker { width: fit-content; margin-left: -.5ch; font-size: min(13px, calc(100cqw / 22.6)); line-height: 1.24; }\n.speaker .p { color: var(--pink); }\n.speaker .g { color: var(--blue); }\n.tower.lit .cone { background: var(--pink); color: var(--ink); }\n.sound.thump { animation: thump .35s ease-out; }\n@keyframes thump { from { color: var(--pink); } }\n.lcd { background: var(--ink); color: var(--paper); padding: 24px var(--pad); font: 13px/24px var(--mono); }\n.lcd-top { display: flex; flex-wrap: wrap; justify-content: space-between; column-gap: 24px; }\n.status { padding: 0 6px; margin-right: -6px; }\nbody.on-air .status { background: var(--pink); color: var(--ink); }\n.ticker { overflow: hidden; white-space: nowrap; margin: 8px 0; }\n.ticker > div { display: inline-block; }\n.ticker span { padding-right: .5em; }\n.tracker { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); text-align: center; margin-bottom: 8px; }\n.tracker .rest { opacity: .35; }\n.tracker .rev { color: var(--pink); }\n.tracker .up { color: var(--yellow); }\n.tracker .roll { text-decoration: underline; text-underline-offset: 3px; }\n.tracker .on { background: var(--paper); color: var(--ink); }\n.lcd-info { display: flex; flex-wrap: wrap; column-gap: 24px; color: rgba(255, 255, 255, .72); }\n.lcd-info .rev { color: var(--pink); }\n.lcd-info .up { color: var(--yellow); }\n.keys { padding: var(--pad) var(--pad) 0; display: flex; flex-direction: column; align-items: flex-start; row-gap: 12px; font: 13px/24px var(--mono); }\n.keys > div { display: flex; flex-wrap: wrap; align-items: center; row-gap: 8px; padding-left: 48px; }\n.keys .lbl { width: 48px; margin-left: -48px; }\n.keys button { font: 13px/1 var(--mono); height: 28px; padding: 0 8px; margin: 0; border: 2px solid var(--ink); border-radius: 0;\n  background: var(--paper); color: var(--ink); cursor: pointer; }\n.keys > div > button + button { margin-left: -2px; }\n.keys button[aria-pressed=\"true\"] { background: var(--ink); color: var(--paper); }\n.keys button:hover { background: var(--pink); color: var(--ink); }\n.keys button:active { translate: 0 1px; }\n.keys .go, .keys .stop { height: 40px; padding: 0 16px; font-weight: bold; }\n.keys .go[aria-pressed=\"true\"] { background: var(--pink); color: var(--ink); }\n.vol { display: grid; grid-template-columns: 48px auto; align-items: center; }\n.vol input { width: 144px; margin: 0; accent-color: var(--ink); }\n.textin { padding: 24px var(--pad) var(--pad); margin-top: auto; font: 13px/24px var(--mono); }\n.floatstop { position: fixed; right: 16px; bottom: 16px; z-index: 5; height: 40px; padding: 0 16px;\n  font: bold 13px/40px var(--mono); background: var(--ink); color: var(--paper); border: 0; border-radius: 0; cursor: pointer; }\n.floatstop:hover { background: var(--pink); color: var(--ink); }\n.floatstop[hidden] { display: none; }\n@keyframes run { to { translate: -50% 0; } }\n\n/* ---------- the card and three projects ---------- */\n.b2 { grid-template-areas: \"cv pj pj pj\"; }\n.card { grid-area: cv; }\n.card dl { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px 12px; }\n.card dt { font: 13px/24px var(--mono); }\n.projects { grid-area: pj; position: relative; display: grid; gap: var(--line); grid-template-columns: minmax(0, 40fr) minmax(0, 33fr) minmax(0, 27fr); min-width: 0; }\n.pic { display: block; height: 240px; background: var(--off); }\n.pic img { display: block; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); }\n.project:hover .pic img { filter: none; }\n\n/* ---------- everything else, with stars ---------- */\n.b3 { grid-template-areas: \"l1 l2 l3 l3\"; }\n.l1 { grid-area: l1; } .l2 { grid-area: l2; } .l3 { grid-area: l3; }\n.flow > .gap { margin-top: 40px; }\n.stars li { position: relative; padding-left: 24px; }\n.stars li + li { margin-top: 4px; }\n.stars li::before { content: \"☆\"; content: \"☆\" / \"\"; position: absolute; left: 0; top: 0; font: 13px/24px var(--mono); }\n.stars li:hover::before { content: \"★\"; content: \"★\" / \"\"; color: var(--pink); }\n\n/* ---------- the end: the note, and the garden along the bottom edge ---------- */\n.b4 { grid-template-areas: \"note note empty blue\"; }\n.note { grid-area: note; }\n.note p:not(.label) { max-width: 38em; }\n.b4 .paper { grid-area: empty; }\n.b4 .blue { grid-area: blue; }\n.bed { padding: 32px 0 0 var(--pad); overflow: hidden; }\n.garden .rose, .garden .lilac { color: var(--pink); }\n.garden .peri { color: var(--blue); }\n\n@media (prefers-reduced-motion: no-preference) {\n  .ticker > div { animation: run 70s linear infinite; }\n}\n@media (prefers-reduced-motion: reduce) { .sign b.h { animation: none; } }\n\n/* ---------- narrower: three columns, KES FM stacks ---------- */\n@media (max-width: 1099px) {\n  :root { --line: 8px; --pad: 32px; --cols: minmax(0, 40fr) minmax(0, 52fr) minmax(0, 8fr); }\n  .hero { grid-template-areas: \"name name side\" \"left fm side\" \"chain fm side\"; grid-template-rows: auto 1fr auto; min-height: 0; }\n  .fm { grid-template-columns: minmax(0, 1fr); }\n  .fm .c1 { grid-column: 1; grid-row: 1; }\n  .fm .deck { grid-column: 1; grid-row: 2; }\n  .b2 { grid-template-areas: \"cv pj pj\"; }\n  .projects { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n  .projects .project:first-of-type { grid-column: 1 / -1; }\n  .b3 { grid-template-areas: \"l1 l2 l2\" \"l3 l3 l3\"; }\n  .b4 { grid-template-areas: \"note note blue\"; }\n  .b4 .paper { display: none; }\n}\n/* ---------- phone: one stack of rectangles, colour kept as bands ---------- */\n@media (max-width: 699px) {\n  :root { --line: 6px; --pad: 24px; --cols: minmax(0, 1fr); }\n  .hero { grid-template-areas: \"name\" \"left\" \"fm\" \"chain\" \"side\"; grid-template-rows: none; }\n  .left .blue { flex: 0 0 32px; min-height: 0; }\n  .side .pink { flex: 0 0 48px; }\n  .side .paper { display: none; }\n  .side .yellow { flex: 0 0 24px; }\n  .sign .big { display: none; }\n  .sign .small { display: block; font-size: min(14px, calc(100cqw / 21)); }\n  .b2 { grid-template-areas: \"cv\" \"pj\"; }\n  .projects { grid-template-columns: minmax(0, 1fr); }\n  .projects .project:first-of-type { grid-column: auto; }\n  .pic { height: 200px; }\n  .b3 { grid-template-areas: \"l1\" \"l2\" \"l3\"; }\n  .b4 { grid-template-areas: \"note\" \"blue\"; }\n  .b4 .blue { min-height: 32px; }\n  .bed { padding-top: 24px; }\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv class=\"canvas\">\n\u003cmain>\n\n\u003cdiv class=\"band hero\">\n\n  \u003cheader class=\"cell name\">\n    \u003cp class=\"label\">welcome to kes' little corner of the internet\u003c/p>\n    \u003c!-- the name: every dot is a little \u003c3 -->\n    \u003cdiv class=\"sign\" role=\"img\" aria-label=\"kes inkersole, spelled out in tiny \u003c3 hearts\">\n\u003cpre class=\"big\" aria-hidden=\"true\">\u003cb>&lt;3\u003c/b>                                          \u003cb>&lt;3\u003c/b>                \u003cb>&lt;3\u003c/b>                                                          \u003cb>&lt;3&lt;3\u003c/b>\n\u003cb>&lt;3\u003c/b>                                                            \u003cb>&lt;3\u003c/b>                                                            \u003cb>&lt;3\u003c/b>                  \u003cb class=\"h\">&lt;3&lt;3\u003c/b>  \u003cb class=\"h\">&lt;3&lt;3\u003c/b>\n\u003cb>&lt;3\u003c/b>    \u003cb>&lt;3\u003c/b>      \u003cb>&lt;3&lt;3&lt;3\u003c/b>      \u003cb>&lt;3&lt;3&lt;3&lt;3\u003c/b>        \u003cb>&lt;3&lt;3\u003c/b>    \u003cb>&lt;3\u003c/b>  \u003cb>&lt;3&lt;3\u003c/b>    \u003cb>&lt;3\u003c/b>    \u003cb>&lt;3\u003c/b>      \u003cb>&lt;3&lt;3&lt;3\u003c/b>    \u003cb>&lt;3\u003c/b>  \u003cb>&lt;3&lt;3\u .aside { font: 13px/0 var(--mono); font-style: normal; vertical-align: 1.2em; white-space: nowrap; }\n.art { font: 13px/16px var(--mono); white-space: pre; color: var(--ink); }\n.art b { font-weight: inherit; }\n\n/* ---------- the composition ---------- */\n.canvas, .canvas > footer { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--line); }\n.canvas { background: var(--ink); }\n.band { display: grid; gap: var(--line); grid-template-columns: var(--cols); }\n.cell { background: var(--paper); padding: var(--pad); min-width: 0; }\n.blue { background: var(--blue); }\n.yellow { background: var(--yellow); }\n\n/* the top: back home, the little computer, the title; blue on the right edge */\n.top { grid-template-areas: \"back title title blue\"; }\n.back { grid-area: back; display: flex; flex-direction: column; gap: 24px; }\n.pc { width: fit-content; margin-left: -1ch; }\n.pc b { color: var(--pink); }\n.title { grid-area: title; display: flex; flex-direction: column; gap: 16px; }\n.title p { max-width: 36em; }\n.title .addr { margin-top: auto; padding-top: 24px; }\n.top .blue { grid-area: blue; }\n\n/* ---------- the pieces: one \u003carticle> per email, newest first, three to a row ---------- */\n.pieces { display: grid; gap: var(--line); grid-template-columns: var(--cols); }\n.piece { background: var(--paper); padding: var(--pad); min-width: 0; }\n.piece .subject { margin-top: 8px; font-weight: bold; }\n.piece .text { margin-top: 16px; max-width: 36em; }\n.piece .text p + p { margin-top: 16px; }\n@media (min-width: 1100px) {\n  .piece:nth-child(3n) { grid-column: span 2; }\n  .piece:nth-child(3n+1):last-child { grid-column: 1 / -1; }\n  .piece:nth-child(3n+2):last-child { grid-column: 2 / -1; }\n}\n\n/* ---------- the end ---------- */\n.end { grid-template-areas: \"yellow note note note\"; }\n.end .yellow { grid-area: yellow; }\n.note { grid-area: note; }\n.note > * + * { margin-top: 16px; }\n.note p { max-width: 38em; }\n.bed { padding: 32px 0 0 var(--pad); overflow: hidden; }\n.garden .rose, .garden .lilac { color: var(--pink); }\n.garden .peri { color: var(--blue); }\n\n/* ---------- narrower: two columns of pieces ---------- */\n@media (max-width: 1099px) {\n  :root { --line: 8px; --pad: 32px; --cols: minmax(0, 40fr) minmax(0, 52fr) minmax(0, 8fr); }\n  .top { grid-template-areas: \"back title blue\"; }\n  .piece:nth-child(2n) { grid-column: span 2; }\n  .piece:nth-child(2n+1):last-child { grid-column: 1 / -1; }\n  .end { grid-template-areas: \"yellow note note\"; }\n}\n/* ---------- phone: one stack ---------- */\n@media (max-width: 699px) {\n  :root { --line: 6px; --pad: 24px; --cols: minmax(0, 1fr); }\n  .top { grid-template-areas: \"back\" \"title\" \"blue\"; }\n  .top .blue { min-height: 32px; }\n  .piece:nth-child(n) { grid-column: auto; }\n  .end { grid-template-areas: \"yellow\" \"note\"; }\n  .end .yellow { min-height: 24px; }\n  .bed { padding-top: 24px; }\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv class=\"canvas\">\n\n\u003cheader class=\"band top\">\n  \u003cdiv class=\"cell back\">\n    \u003cp class=\"label\">\u003ca href=\"index.html\">← kes' little corner of the internet\u003c/a>\u003c/p>\n    \u003cpre class=\"art pc\" role=\"img\" aria-label=\"ascii drawing of a little computer with a heart on its screen\">\n  ______________________\n |  __________________  |\n | |                  | |\n | |   \u003cb>&lt;3&lt;3\u003c/b>    \u003cb>&lt;3&lt;3\u003c/b>   | |\n | | \u003cb>&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3\u003c/b> | |\n | | \u003cb>&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3\u003c/b> | |\n | |   \u003cb>&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3\u003c/b>   | |\n | |     \u003cb>&lt;3&lt;3&lt;3&lt;3\u003c/b>     | |\n | |       \u003cb>&lt;3&lt;3\u003c/b>       | |\n | |        \u003cb>&lt;3\u003c/b>        | |\n | |__________________| |\n |                      |\n |  \u003cb>o\u003c/b>          ______   |\n |______________________|\n   |__________________|\u003c/pre>\n  \u003c/div>\n  \u003cdiv class=\"cell title\">\n    \u003ch1>chainmail \u003csmall class=\"aside\">(working title)\u003c/small>\u003c/h1>\n    \u003cp>a space for my own writing: short pieces, mostly from my notes app, sent here by email and collected over time into a kind of text moodboard.\u003c/p>\n    \u003cp class=\"addr label\">pieces arrive by email: (address tbc)\u003cbr>newest first\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"blue\" aria-hidden=\"true\">\u003c/div>\n\u003c/header>\n\n\u003cmain class=\"pieces\" id=\"pieces\">\n\u003c!--\n  chainmail: every email becomes one \u003carticle class=\"piece\">, newest first, at the top of #pieces.\n  subject line -> h2.subject, date sent -> time[datetime], body -> one \u003cp> per paragraph in .text.\n  the grid places them by itself, three to a row; a short last row stretches to fill.\n  the dates and words below are placeholders.\n\n  \u003carticle class=\"piece\" id=\"piece-YYYY-MM-DD-slug\">\n    \u003cp class=\"date label\">\u003ctime datetime=\"YYYY-MM-DD\">DD mon YYYY\u003c/time>\u003c/p>\n    \u003ch2 class=\"subject\">the email subject\u003c/h2>\n    \u003cdiv class=\"text\">\u003cp>the email body\u003c/p>\u003c/div>\n  \u003c/article>\n-->\n\n\u003carticle class=\"piece\" id=\"piece-2026-10-14-lorem-ipsum\">\n  \u003cp class=\"date label\">\u003ctime datetime=\"2026-10-14\">14 oct 2026\u003c/time>\u003c/p>\n  \u003ch2 class=\"subject\">lorem ipsum\u003c/h2>\n  \u003cdiv class=\"text\">\u003cp>lorem ipsum dolor sit amet, consectetur adipiscing elit.\u003c/p>\u003c/div>\n\u003c/article>\n\n\u003carticle class=\"piece\" id=\"piece-2026-10-09-consectetur\">\n  \u003cp class=\"date label\">\u003ctime datetime=\"2026-10-09\">09 oct 2026\u003c/time>\u003c/p>\n  \u003ch2 class=\"subject\">consectetur adipiscing elit\u003c/h2>\n  \u003cdiv class=\"text\">\u003cp>sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur.\u003c/p>\u003c/div>\n\u003c/article>\n\n\u003carticle class=\"piece\" id=\"piece-2026-10-02-sed-do-eiusmod\">\n  \u003cp class=\"date label\">\u003ctime datetime=\"2026-10-02\">02 oct 2026\u003c/time>\u003c/p>\n  \u003ch2 class=\"subject\">sed do eiusmod\u003c/h2>\n  \u003cdiv class=\"text\">\n    \u003cp>excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum. sed ut perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium.\u003c/p>\n    \u003cp>totam rem aperiam, eaque ipsa quae ab illo inventore veritatis et quasi architecto beatae vitae dicta sunt explicabo. nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit aut fugit.\u003c/p>\n    \u003cp>sed quia consequuntur magni dolores eos qui ratione voluptatem sequi nesciunt.\u003c/p>\n  \u003c/div>\n\u003c/article>\n\n\u003carticle class=\"piece\" id=\"piece-2026-09-27-tempor\">\n  \u003cp class=\"date label\">\u003ctime datetime=\"2026-09-27\">27 sep 2026\u003c/time>\u003c/p>\n  \u003ch2 class=\"subject\">tempor incididunt\u003c/h2>\n  \u003cdiv class=\"text\">\u003cp>neque porro quisquam est, qui dolorem ipsum quia dolor sit amet, consectetur, adipisci velit.\u003c/p>\u003c/div>\n\u003c/article>\n\n\u003carticle class=\"piece\" id=\"piece-2026-09-21-ut-labore\">\n  \u003cp class=\"date label\">\u003ctime datetime=\"2026-09-21\">21 sep 2026\u003c/time>\u003c/p>\n  \u003ch2 class=\"subject\">ut labore et dolore\u003c/h2>\n  \u003cdiv class=\"text\">\u003cp>lorem ipsum\u003cbr>dolor sit amet\u003cbr>consectetur adipiscing\u003cbr>sed do eiusmod tempor\u003cbr>ut labore et dolore magna aliqua\u003c/p>\u003c/div>\n\u003c/article>\n\n\u003carticle class=\"piece\" id=\"piece-2026-09-15-magna-aliqua\">\n  \u003cp class=\"date label\">\u003ctime datetime=\"2026-09-15\">15 sep 2026\u003c/time>\u003c/p>\n  \u003ch2 class=\"subject\">magna aliqua\u003c/h2>\n  \u003cdiv class=\"text\">\u003cp>ut enim ad minim veniam.\u003c/p>\u003c/div>\n\u003c/article>\n\n\u003carticle class=\"piece\" id=\"piece-2026-09-08-ut-enim\">\n  \u003cp class=\"date label\">\u003ctime datetime=\"2026-09-08\">08 sep 2026\u003c/time>\u003c/p>\n  \u003ch2 class=\"subject\">ut enim ad minim veniam\u003c/h2>\n  \u003cdiv class=\"text\">\n    \u003cp>quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur.\u003c/p>\n    \u003cp>at vero eos et accusamus et iusto odio dignissimos ducimus qui blanditiis praesentium voluptatum deleniti atque corrupti quos dolores et quas molestias excepturi sint occaecati cupiditate non provident.\u003c/p>\n  \u003c/div>\n\u003c/article>\n\n\u003carticle class=\"piece\" id=\"piece-2026-08-30-quis-nostrud\">\n  \u003cp class=\"date label\">\u003ctime datetime=\"2026-08-30\">30 aug 2026\u003c/time>\u003c/p>\n  \u003ch2 class=\"subject\">quis nostrud\u003c/h2>\n  \u003cdiv class=\"text\">\u003cp>similique sunt in culpa qui officia deserunt mollitia animi, id est laborum et dolorum fuga. et harum quidem rerum facilis est et expedita distinctio.\u003c/p>\u003c/div>\n\u003c/article>\n\n\u003carticle class=\"piece\" id=\"piece-2026-08-24-exercitation\">\n  \u003cp class=\"date label\">\u003ctime datetime=\"2026-08-24\">24 aug 2026\u003c/time>\u003c/p>\n  \u003ch2 class=\"subject\">exercitation ullamco?\u003c/h2>\n  \u003cdiv class=\"text\">\u003cp>nam libero tempore, cum soluta nobis est eligendi optio?\u003c/p>\u003c/div>\n\u003c/article>\n\n\u003carticle class=\"piece\" id=\"piece-2026-08-17-duis-aute\">\n  \u003cp class=\"date label\">\u003ctime datetime=\"2026-08-17\">17 aug 2026\u003c/time>\u003c/p>\n  \u003ch2 class=\"subject\">duis aute irure dolor\u003c/h2>\n  \u003cdiv class=\"text\">\n    \u003cp>temporibus autem quibusdam et aut officiis debitis aut rerum necessitatibus saepe eveniet ut et voluptates repudiandae sint et molestiae non recusandae. itaque earum rerum hic tenetur a sapiente delectus.\u003c/p>\n    \u003cp>ut aut reiciendis voluptatibus maiores alias consequatur aut perferendis doloribus asperiores repellat. lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt.\u003c/p>\n    \u003cp>ut labore et dolore magna aliqua. quis ipsum suspendisse ultrices gravida. risus commodo viverra maecenas accumsan lacus vel facilisis.\u003c/p>\n    \u003cp>lorem ipsum.\u003c/p>\n  \u003c/div>\n\u003c/article>\n\n\u003c/main>\n\n\u003cfooter>\n  \u003cdiv class=\"band end\">\n    \u003cdiv class=\"yellow\" aria-hidden=\"true\">\u003c/div>\n    \u003cdiv class=\"cell note\">\n      \u003cp class=\"label\">about this site\u003c/p>\n      \u003cp>mostly plain html: system fonts, no cookies, no tracking and no scripts on this page. then i planted some flowers. it's easy for me to update and it loads fine on bad wifi.\u003c/p>\n      \u003cp>\u003ca href=\"index.html\">← back to kes' little corner of the internet\u003c/a>\u003c/p>\n      \u003cp>thanks for stopping by \u003cspan class=\"heart\">♡\u003c/span>\u003c/p>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"cell bed\">\n  \u003cpre class=\"art garden\" aria-hidden=\"true\">    \u003cb class=\"rose\">_                             \u003c/b>\u003cb class=\"lilac\">_                          \u003c/b>\u003cb class=\"rose\">_                        \u003c/b>\u003cb class=\"peri\">_                            \u003c/b>\u003cb class=\"rose\">_                        \u003c/b>\u003cb class=\"lilac\">_                             \u003c/b>\u003cb class=\"peri\">_\u003c/b>\n  \u003cb class=\"rose\">_(_)_         @               \u003c/b>\u003cb class=\"lilac\">_(_)_         \u003c/b>\u003cb class=\"peri\">@            \u003c/b>\u003cb class=\"rose\">_(_)_              @     \u003c/b>\u003cb class=\"peri\">_(_)_         \u003c/b>\u003cb c
