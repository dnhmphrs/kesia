ntent=\"summary_large_image\">\n\u003cmeta name=\"twitter:title\" content=\"kes inkersole\">\n\u003cmeta name=\"twitter:description\" content=\"kes inkersole — freelance creative strategist & internet equalities researcher, based in london.\">\n\u003cmeta name=\"twitter:image\" content=\"https://kesia-coral.vercel.app/square.png\">\n\u003cstyle>\n/* colours are all css names except the highlighter. strawberry milk + biro. */\n:root {\n  --paper: lavenderblush;\n  --ink: midnightblue;\n  --berry: mediumvioletred;\n  --pink: hotpink;\n  --blue: cornflowerblue;\n  --butter: #fff3a0;\n  --fabric: #f5cfe0;\n  --gut: clamp(16px, 3.5vw, 52px);\n  --mono: ui-monospace, Menlo, \"DejaVu Sans Mono\", Consolas, \"Courier New\", monospace;\n}\nhtml { background: var(--paper); color: var(--ink); }\nbody { max-width: 1920px; margin: 0 auto; padding: 28px var(--gut) 0; font: 19px/1.45 \"Times New Roman\", Times, serif; }\na { color: var(--ink); text-decoration-color: var(--pink); text-decoration-thickness: 2px; text-underline-offset: 3px; }\na:visited { color: #5a3d8f; text-decoration-color: var(--blue); }\na:hover { background: var(--butter); color: var(--berry); text-decoration-style: wavy; }\n::selection { background: var(--pink); color: white; }\n\nh1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }\nh2 { font-size: 1em; color: var(--berry); margin: 0 0 .35em; }\n.next { margin-top: 1.4em; }\np { margin: 0 0 .8em; }\nul { margin: 0; padding-left: 1.5em; list-style: \"☆  \"; }\nli { margin: 0 0 .3em; break-inside: avoid; }\nli::marker { color: var(--pink); }\n\npre { font-family: var(--mono); font-size-adjust: ch-width .602; margin: 0; }\nb { font-weight: inherit; }\nmark { background: var(--butter); color: inherit; padding: 0 .15em; }\n.h { color: var(--pink); }  .b { color: var(--blue); }  .k { color: var(--berry); }  .i { color: var(--ink); }  .g { color: plum; }\n\n/* cross stitch: one x per square of aida, and the holes are drawn by css so the art stays readable in view-source */\n.stitch { --cols: 112; --cap: 28px; font-size: min(var(--cap), calc((100vw - 2 * var(--gut)) / (var(--cols) + 1) / .602)); line-height: .6; padding: .9em .5ch; color: var(--berry); background: var(--thread, none), radial-gradient(circle, var(--fabric) .07em, transparent .1em) 0 0 / 1ch .6em; overflow: hidden; margin-bottom: 28px; }\n.phone { display: none; }\n\n/* rows: things sit side by side, three across, then two, then one on a phone */\n.row { display: flex; flex-wrap: wrap; gap: 28px 48px; margin-bottom: 40px; }\n.row > * { flex: 1 1 15em; min-width: 0; }\n.cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }\n\n.hello { flex: 2 1 15em; font-size: 1.12em; max-width: 36em; }\n.note { flex: 1 1 14em; max-width: 19em; align-self: start; margin-left: auto; background: var(--butter); padding: 16px 22px 14px; transform: rotate(-1.2deg); box-shadow: 3px 4px 0 var(--fabric); }\nbutton { font: 15px var(--mono); color: var(--berry); background: none; border: 0; padding: 0; cursor: pointer; }\nbutton:hover { background: var(--butter); }\n\n/* a cable with little hearts going along it */\n.cable { display: flex; flex-wrap: wrap; font: 16px/1.2 var(--mono); color: var(--blue); white-space: pre; margin: 8px 0 40px; }\n.wire { flex: 1; position: relative; overflow: hidden; }\n.wire i { position: absolute; left: -3ch; font-style: normal; color: var(--pink); background: var(--paper); animation: packet 9s linear infinite; }\n.wire i + i { animation-delay: -4.5s; }\n@keyframes packet { to { left: 100%; } }\n.cable b { margin-left: auto; padding-left: 2ch; }\n\n.wrote { list-style: \"✎  \"; }\n.pods { list-style: \"♪  \"; columns: 2 18em; column-gap: 48px; }\n.wrote li::marker, .pods li::marker { color: var(--blue); }\n\n/* photos, stitched on. they stay photo-sized and get scattered across the width */\n.photos { justify-content: space-around; align-items: flex-start; }\n.photos > figure { flex: 0 0 auto; box-sizing: border-box; width: clamp(150px, 23vw, 400px); margin: 0; padding: 12px 12px 14px; background: white; outline: 2px dashed var(--pink); outline-offset: -7px; box-shadow: 0 2px 6px rgba(25, 25, 112, .12); transform: rotate(-1deg); }\n.photos > figure:nth-child(2) { margin-top: 48px; transform: rotate(1.4deg); outline-color: var(--blue); }\n.photos > figure:nth-child(3) { margin-top: 14px; transform: rotate(-.3deg); }\nfigure img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; background: var(--fabric); }\nfigcaption { font-size: 15px; margin-top: 6px; }\n\n/* it's leaving without you */\n.row > .stop { flex: 0 0 auto; align-self: end; margin-left: auto; overflow: hidden; }\n.bus { font-size: 14px; line-height: 1.2; color: var(--pink); transition: transform 1s ease-out; }\n@media (hover: hover) and (prefers-reduced-motion: no-preference) { .stop:hover .bus { transform: translateX(110%); transition: transform 2.5s ease-in; } }\n\n.about section { container-type: inline-size; }\n.books { font-size: min(14px, 100cqw / 34 / .602); line-height: 1; color: var(--blue); margin: 10px 0 18px; }\n\nfooter { display: flex; flex-wrap: wrap; align-items: end; gap: 20px 40px; margin-bottom: 28px; }\nfooter p { max-width: 34em; }\nfooter .stitch { --cap: 22px; margin: 0 0 0 auto; color: var(--blue); }\nsmall { font-size: 15px; }\n/* the hem: hearts and sparkles, pink and blue in turn */\n@supports (background-clip: text) or (-webkit-background-clip: text) {\n  .hem { --thread: repeating-linear-gradient(90deg, var(--pink) 0 4ch, var(--blue) 0 8ch); color: transparent; -webkit-background-clip: text, border-box; background-clip: text, border-box; }\n}\n\n@media (min-width: 701px) and (max-width: 1080px) {\n  .cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n  .cols > :last-child:nth-child(odd) { grid-column: 1 / -1; columns: 2; column-gap: 48px; }\n  .cols > :last-child:nth-child(odd) h2 { column-span: all; }\n}\n@media (max-width: 700px) {\n  .cols { evice-width, initial-scale=1.0\">\n\u003ctitle>kes inkersole\u003c/title>\n\u003cmeta name=\"description\" content=\"Kesia Inkersole — freelance creative strategist & internet equalities researcher, based in london.\">\n\u003cmeta name=\"author\" content=\"Kes Inkersole\">\n\u003cmeta name=\"keywords\" content=\"Kesia Inkersole, Kes Inkersole, creative strategist, internet equalities, researcher, London, UAL\">\n\u003clink rel=\"icon\" href=\"/favicon.ico\" sizes=\"any\">\n\u003cmeta property=\"og:type\" content=\"website\">\n\u003cmeta property=\"og:title\" content=\"kes inkersole\">\n\u003cmeta property=\"og:description\" content=\"kes inkersole — freelance creative strategist & internet equalities researcher, based in london.\">\n\u003cmeta property=\"og:image\" content=\"https://kesia-coral.vercel.app/square.png\">\n\u003cmeta property=\"og:url\" content=\"https://kesia-coral.vercel.app\">\n\u003cmeta name=\"twitter:card\" content=\"summary_large_image\">\n\u003cmeta name=\"twitter:title\" content=\"kes inkersole\">\n\u003cmeta name=\"twitter:description\" content=\"kes inkersole — freelance creative strategist & internet equalities researcher, based in london.\">\n\u003cmeta name=\"twitter:image\" content=\"https://kesia-coral.vercel.app/square.png\">\n\u003cstyle>\n/* colours: plum ink on warm paper, strawberry for hearts, periwinkle links */\n:root {\n  --paper: #fffaf4;\n  --ink: #3d2645;\n  --rose: #e0578a;\n  --blush: #ffe4ec;\n  --butter: #fff0a3;\n  --peri: #4a55d0;\n  --lilac: #9a5cc6;\n  --sage: #6f9a68;\n  --mono: ui-monospace, Menlo, Monaco, Consolas, \"Courier New\", monospace;\n  --pad: clamp(16px, 3vw, 48px);\n}\nhtml { background: var(--paper); color: var(--ink); }\nbody { margin: 0; padding: 18px var(--pad) 0; font: 18px/1.45 \"Times New Roman\", Times, serif; overflow-x: hidden; }\na { color: var(--peri); text-underline-offset: .18em; text-decoration-thickness: 1px; }\na:visited { color: var(--lilac); }\na:hover { background: var(--blush); text-decoration-style: wavy; }\n::selection { background: var(--butter); color: var(--ink); }\nmark { background: linear-gradient(transparent 50%, var(--butter) 50%); color: inherit; }\nmark.pink { background: linear-gradient(transparent 50%, var(--blush) 50%); }\nimg { max-width: 100%; height: auto; display: block; background: var(--blush); }\n\nh1, h2 { font-weight: normal; font-style: italic; line-height: 1.15; }\nh1 { font-size: 2.3em; margin: 0 0 .4em; }\nh2 { font-size: 1.3em; margin: 0 0 .45em; width: fit-content; background: linear-gradient(transparent 55%, var(--butter) 55%); }\n.heart { color: var(--rose); font-style: normal; }\n.kao { white-space: nowrap; font-style: normal; }\nul { padding-left: 1.5em; margin: 0 0 1.2em; }\nli { margin-bottom: .3em; }\nli::marker { color: var(--rose); }\n.new { list-style-type: \"✧  \"; }\n.fun { list-style-type: \"✿  \"; }\n.funds { list-style-type: \"☆  \"; }\n.writing { list-style-type: \"✎  \"; }\n.pods { list-style-type: \"♪  \"; }\n.uni { list-style-type: \"✦  \"; }\n\n/* side by side on big screens, one column on phones */\n.row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px 52px; margin: 0 0 8px; }\n@media (min-width: 760px) { .row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }\n@media (min-width: 1150px) {\n  .row { grid-template-columns: repeat(3, minmax(0, 1fr)); }\n  .intro { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr); }\n}\n.row > * { min-width: 0; }\n\n/* the little tinted note cards, \"stitched\" */\n.note { background: var(--blush); border-radius: 16px; padding: 20px 24px 8px; outline: 1.5px dashed var(--rose); outline-offset: -8px; align-self: start; }\n.note h2 { background: none; }\n.bio { background: #f1ebfa; outline-color: var(--lilac); }\n\n/* ascii lives in pre; the classes are just colours */\npre { font: 13px/1.2 var(--mono); margin: 0; color: var(--ink); }\npre b { font-weight: inherit; }\n.rose, b.heart { color: var(--rose); }\n.lilac, .wire { color: var(--lilac); }\n.peri { color: var(--peri); }\n.stem { color: var(--sage); }\n.spark { color: var(--lilac); }\n\n/* the sign: kes inkersole in tiny \u003c3s. font size is worked out from the width so it always fits */\n.sign { container-type: inline-size; margin: 0 0 26px; }\n.sign pre { color: #f8cbd9; line-height: 1.22; font-size: min(19px, calc(100cqw / 101.9)); font-weight: bold; width: fit-content;\n  background: linear-gradient(var(--blush), var(--blush)) 1.5ch .5lh / calc(100% - 3ch) calc(100% - 1lh) no-repeat; }\n.sign s { text-decoration: none; color: var(--ink); font-weight: normal; }\n.sign b { color: var(--rose); }\n.sign b.h { color: var(--lilac); animation: blink 1.6s steps(1) infinite; }\n.sign .small { display: none; }\n@media (max-width: 640px) {\n  .sign .big { display: none; }\n  .sign .small { display: block; font-size: min(16px, calc(100cqw / 25.9)); }\n}\n@keyframes blink { 50% { color: var(--rose); } }\n\n/* two computers in love. hover = they get shy */\n.pc-spot { container-type: inline-size; align-self: center; }\n.pcs { margin: 0; font-size: min(17px, calc(100cqw / 24.8)); }\n.pcs i { font-style: normal; }\n.pcs .shy, .pcs:hover .calm { display: none; }\n.pcs:hover .shy { display: inline; }\n.pcs .heart { display: inline-block; }\n.pcs:hover .heart { animation: beat .7s ease-in-out infinite; }\n@keyframes beat { 50% { transform: scale(1.35); } }\n\n/* cables between sections. they just run off the edge on small screens */\n.cable { overflow: hidden; margin: 30px 0 34px; white-space: pre; font-size: 15px; font-weight: bold; position: relative; }\n/* a little packet of love going down the wire */\n.cable .go { position: absolute; top: 0; background: var(--paper); animation: send 22s linear infinite; }\n.cable:nth-of-type(2) .go { animation-duration: 31s; animation-direction: reverse; }\n@keyframes send { from { left: -2ch; } to { left: 100%; } }\n\n/* talks + photos */\n.talks { list-style: none; padding: 0; display: grid; grid-templ imessage / slack / linkedin -->\n\u003cmeta property=\"og:type\" content=\"website\">\n\u003cmeta property=\"og:title\" content=\"kes inkersole\">\n\u003cmeta property=\"og:description\" content=\"kes inkersole — freelance creative strategist & internet equalities researcher, based in london.\">\n\u003cmeta property=\"og:image\" content=\"https://kesia-coral.vercel.app/square.png\">\n\u003cmeta property=\"og:url\" content=\"https://kesia-coral.vercel.app\">\n\u003cmeta name=\"twitter:card\" content=\"summary_large_image\">\n\u003cmeta name=\"twitter:title\" content=\"kes inkersole\">\n\u003cmeta name=\"twitter:description\" content=\"kes inkersole — freelance creative strategist & internet equalities researcher, based in london.\">\n\u003cmeta name=\"twitter:image\" content=\"https://kesia-coral.vercel.app/square.png\">\n\n\u003cstyle>\n/* kes's colours. change one here and it changes everywhere */\n:root {\n\t--paper: #fff5f2;  /* page */\n\t--ink: #2e1f3a;    /* text, a very dark plum */\n\t--pink: #df3a7b;\n\t--blush: #ffd7e6;\n\t--blue: #3a4bdc;   /* links */\n\t--sky: #6c7ef0;    /* blue bits in the drawings */\n\t--mist: #dde3ff;\n\t--lilac: #8b40bd;  /* links you've already clicked */\n\t--leaf: #379659;\n\t--butter: #fff2ad;\n\t--gold: #cf970b;\n\t--mono: ui-monospace, Menlo, Consolas, \"Courier New\", monospace;\n\t--edge: clamp(16px, 4vw, 56px); /* space at the sides of the page */\n}\n\nhtml { background: radial-gradient(#f7d9e2 1px, transparent 1.5px) 0 0 / 22px 22px, var(--paper); color: var(--ink); -webkit-text-size-adjust: 100%; } /* faint dots, like cross-stitch fabric */\nbody { margin: 0; padding: 28px var(--edge) 0; font: 17px/1.5 Times, \"Times New Roman\", serif; }\n::selection { background: #ffc4dc; }\n\na { color: var(--blue); text-underline-offset: 2px; }\na:visited { color: var(--lilac); }\na:hover { color: var(--pink); background: var(--blush); }\n\nh1 { font-size: 2em; margin: .3em 0 .4em; }\n/* headings get a highlighter stripe (a fat underline pulled up behind the letters, so it follows the text when it wraps) */\nh2 { font-size: 1.2em; margin: 0 0 .5em; text-decoration: underline var(--hl, var(--butter)); text-decoration-thickness: .5em; text-underline-offset: -.3em; text-decoration-skip-ink: none; }\np { margin: 0 0 1em; max-width: 36em; }\n\nul { padding-left: 1.3em; margin: 0 0 1em; }\nli { list-style-type: \"☆  \"; margin-bottom: .15em; }\nli:hover { list-style-type: \"★  \"; }\nli::marker { color: var(--pink); }\n\ndt { font-weight: bold; margin-top: 1em; }\ndd { margin: .15em 0 0; }\n\nfigure { display: inline-block; margin: .7em .5em .3em 0; vertical-align: top; }\nfigure img { display: block; max-width: 100%; height: auto; background: var(--mist); border: 5px solid #fff; box-shadow: 0 1px 4px #2e1f3a26; }\nfigure:nth-of-type(even) img { rotate: 1.5deg; }\nfigure:nth-of-type(odd) img { rotate: -1deg; }\nfigcaption { font: 12px/1.3 var(--mono); margin-top: .4em; width: 0; min-width: 100%; } /* wraps at the photo's width */\n\n/* rows of side-by-side bits that fall into one column on a phone */\n.row { display: flex; flex-wrap: wrap; gap: 36px clamp(28px, 4vw, 64px); margin: 0 0 40px; }\n.row > * { flex: 1 1 18em; max-width: 36em; min-width: 0; container-type: inline-size; } /* so drawings can size themselves to their column (cqw) */\n\n/* the ascii drawings. pure ascii in a monospace font so everything lines up */\n.art { font: 14px/1.15 var(--mono); margin: 0; color: var(--sky); }\n.p { color: var(--pink); }\n.b { color: var(--sky); }\n.g { color: var(--leaf); }\n.y { color: var(--gold); }\n.i { color: var(--ink); }\n\n.name { font-size: min(17px, 100cqw / 32); } /* shrinks to fit its column */\n.doodles { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 24px 48px; margin-top: 36px; }\n.doodles .art { font-size: 15px; }\n.bus { margin-bottom: 12px; font-size: min(14px, 100cqw / 23); }\n\n/* the cables + garden run right to the edge of the screen, and get cut off there */\n.cable, .garden { overflow: hidden; margin: 8px calc(-1 * var(--edge)) 44px; padding: 0 var(--edge); }\n.cable.flip { display: flex; justify-content: flex-end; } /* this one comes in from the left */\n.cable.flip pre { flex: none; }\n.garden { margin-bottom: 0; padding: 0; }\n\n/* little jokes */\n.mac .h, .ding { visibility: hidden; }\n.mac .h { display: none; }\n.mac:hover .a { display: none; }\n.mac:hover .h { display: inline; visibility: visible; }\n.bus:hover .ding { visibility: visible; }\n\n.new { background: var(--butter); padding: 14px 18px 4px; align-self: flex-start; --hl: #fff; }\ndetails { background: var(--blush); padding: 12px 16px; align-self: flex-start; }\nsummary { cursor: pointer; color: var(--pink); }\ndetails p { margin: .8em 0 0; }\n\nfooter { padding: 4px 0 40px; }\n\n/* in a narrow column (phones, small tablets) the name drops its heart so the letters can be bigger */\n@container (max-width: 480px) {\n\t.name { font-size: min(17px, 100cqw / 21); }\n\t.name .end { display: none; }\n}\n@media (max-width: 600px) {\n\t.doodles { gap: 20px; }\n\t.doodles .art { font-size: 12px; }\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv class=\"row\">\n\t\u003cdiv>\n\t\t\u003cpre class=\"art name\" aria-hidden=\"true\">\u003cspan class=p>&lt;3\u003c/span>\n\u003cspan class=p>&lt;3\u003c/span>\n\u003cspan class=p>&lt;3    &lt;3      &lt;3&lt;3&lt;3      &lt;3&lt;3&lt;3&lt;3\u003c/span>\u003cspan class=end>    \u003cspan class=y>&lt;3&lt;3  &lt;3&lt;3\u003c/span>\u003c/span>\n\u003cspan class=p>&lt;3  &lt;3      &lt;3      &lt;3  &lt;3        \u003c/span>\u003cspan class=end>  \u003cspan class=y>&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3&lt;3\u003c/span>\u003c/span>\n\u003cspan class=p>&lt;3&lt;3        &lt;3&lt;3&lt;3&lt;3&lt;3    &lt;3&lt;3&lt;3  \u003c/span>\u003cspan class=end>    \u003cspan class=y>&lt;3&lt;3&lt;3&lt;3&lt;3\u003c/span>\u003c/span>\n\u003cspan class=p>&lt;3  &lt;3      &lt;3                  &lt;3\u003c/span>\u003cspan class=end>      \u003cspan class=y>&lt;3&lt;3&lt;3\u003c/span>\u003c/span>\n\u003cspan class=p>&lt;3    &lt;3      &lt;3&lt;3&lt;3    &lt;3&lt;3&lt;3&lt;3  \u003c/span>\u003cspan class=end>        \u003cspan class=y>&lt;3\u003c/span>\u003c/span>\u003c/pre>\n\t\t\u003ch1>hi, i'm kes \u003cspan class=p>♡\u003c/span>\u003c/h1>\n\n\t\t\u003cp>kesia inkersole if you're being formal. i'm a freelance creative strategist and internet equalities researcher, based in london, and i'm available for work: \u003ca href=\"mailto:inkersolekesia@gmail.com\">inkersolekesia@gmail.com\u003c/a>\u003c/p>\n\n\t\t\u003cp>my practice focuses on understanding and critiquing the impacts of emerging technologies on people, culture, and the planet. i'm particularly interested in working collectively to rethink the narratives and behaviours surrounding technologies, prioritising collaborative research as a process for testing, imagining and prototyping more equitable, alternative futures.\u003c/p>\n\n\t\t\u003cp>i'm an associate lecturer at UAL (LCF + CCI), and i've worked with Neu Futur, DAZED, co&#8288;—&#8288;matter, MØRNING, WeTransfer, Protein, Midnight Agency, Softer and Selfridges, among others.\u003c/p>\n\t\u003c/div>\n\n\t\u003cdiv>\n\t\t\u003c!-- kes: newest at the top. the lorem ipsum lines are placeholders, swap them for real things -->\n\t\t\u003cdiv class=\"new\">\n\t\t\t\u003ch2>new-ish \u003cspan class=p>✶\u003c/span>\u003c/h2>\n\t\t\t\u003cul>\n\t\t\t\t\u003cli>lorem ipsum dolor sit amet, consectetur adipiscing elit\u003c/li>\n\t\t\t\t\u003cli>sed do eiusmod tempor incididunt ut labore et dolore\u003c/li>\n\t\t\t\t\u003cli>ut enim ad minim veniam, quis nostrud exercitation\u003c/li>\n\t\t\t\u003c/ul>\n\t\t\u003c/div>\n\n\t\t\u003cdiv class=\"doodles\">\n\t\t\t\u003cpre class=\"art net\" aria-hidden=\"true\">   \u003cspan class=p>o\u003c/span>\u003cspan class=b>-----------\u003c/span>\u003cspan class=p>o\u003c/span>\n  \u003cspan class=b>/ \\         / \\\u003c/span>\n \u003cspan class=b>/   \\       /   \ est&&e.target.closest('input,textarea,select,[contenteditable]'))return;\n  if(['ArrowLeft','ArrowRight','m'].indexOf(e.key)>-1)parent.postMessage({variantKey:e.key},'*');\n});\n})();\u003c/script>\u003c/body>\n\u003c/html>\n"}, {"label": "07", "note": "", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en-GB\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cmeta name=\"color-scheme\" content=\"light\">\n\u003ctitle>kes inkersole\u003c/title>\n\u003cmeta name=\"description\" content=\"Kesia Inkersole — freelance creative strategist &amp; internet equalities researcher, based in london.\">\n\u003cmeta name=\"author\" content=\"Kes Inkersole\">\n\u003cmeta name=\"keywords\" content=\"Kesia Inkersole, Kes Inkersole, creative strategist, internet equalities, researcher, London, UAL\">\n\u003clink rel=\"icon\" href=\"/favicon.ico\" sizes=\"any\">\n\u003c!-- link preview card (iMessage, WhatsApp, Slack, LinkedIn, X) -->\n\u003cmeta property=\"og:type\" content=\"website\">\n\u003cmeta property=\"og:title\" content=\"kes inkersole\">\n\u003cmeta property=\"og:description\" content=\"kes inkersole — freelance creative strategist &amp; internet equalities researcher, based in london.\">\n\u003cmeta property=\"og:image\" content=\"https://kesia-coral.vercel.app/square.png\">\n\u003cmeta property=\"og:url\" content=\"https://kesia-coral.vercel.app\">\n\u003cmeta name=\"twitter:card\" content=\"summary_large_image\">\n\u003cmeta name=\"twitter:title\" content=\"kes inkersole\">\n\u003cmeta name=\"twitter:description\" content=\"kes inkersole — freelance creative strategist &amp; internet equalities researcher, based in london.\">\n\u003cmeta name=\"twitter:image\" content=\"https://kesia-coral.vercel.app/square.png\">\n\u003cstyle>\n/* thread colours */\n:root {\n  --paper: #fdf8ef;  /* the page, like unbleached cotton */\n  --ink:   #3b2440;  /* plum, not black */\n  --pink:  #e8508e;\n  --blue:  #4a5be0;\n  --lilac: #8e57c9;  /* visited links */\n  --butter:#ffe58a;  /* highlighter */\n  --blush: #fde8ef;\n  --aida:  #f6ecda;  /* the cross-stitch cloth */\n  --holes: #e7d7bc;\n}\nhtml { background: var(--paper); }\nbody {\n  margin: 0;\n  padding: 20px clamp(16px, 3vw, 48px) 0;\n  color: var(--ink);\n  font: 18px/1.45 \"Times New Roman\", Times, serif;\n}\n::selection { background: var(--pink); color: #fff; }\n\na { color: var(--blue); text-underline-offset: .15em; }\na:visited { color: var(--lilac); }\na:hover { color: var(--pink); text-decoration-style: wavy; }\n\nmark { background: var(--butter); color: inherit; padding: 0 .15em; border-radius: .2em; }\n\nh2 { font-size: 1.15em; font-weight: normal; margin: 1.4em 0 .4em; }\nh2 span { color: var(--pink); }\n\nul { padding-left: 1.4em; list-style: \"☆  \"; }\nli { margin: .25em 0; }\nli::marker { color: var(--pink); }\nli:hover { list-style: \"★  \"; }\n\n/* everything stitched: X on cloth, one character = one stitch */\n.aida {\n  margin: 0;\n  overflow: hidden;\n  background: var(--aida);\n  color: var(--holes);\n  font: 16px/.72 ui-monospace, Menlo, Consolas, \"DejaVu Sans Mono\", \"Courier New\", monospace;\n}\n.aida b { font-weight: normal; color: var(--pink); }\n.aida .b { color: var(--blue); }\n.aida .y { color: #eea92a; }\n.aida .g { color: #4aa877; }\n.aida:hover .h { animation: blink 1s steps(1) infinite; }  /* the little screen's heart blinks like a cursor */\n@keyframes blink { 50% { color: var(--aida); } }\n.wide { display: none; }\n.narrow { font-size: min(16px, calc((100vw - 32px) / 41 / .6)); }  /* 41 stitches always fit a phone */\n.small { display: inline-block; max-width: 100%; margin-top: .4em; font-size: min(16px, 100cqi / 41 / .6); }  /* ...and always fit their column */\n.chain { font-size: 13px; margin-top: 1.2em; }\n\nh1 { position: absolute; left: -9999px; }  /* the stitched name is the heading you see */\n\n/* one column on a phone, two on a tablet, three (or four) on a big screen */\n.top { display: grid; gap: 0 2.5em; }\n.top p:last-child { margin-bottom: 0; }\n.lists { column-gap: 2.5em; column-rule: 2px dashed #f2b3cb; }\n.lists section { break-inside: avoid; container-type: inline-size; }\n.lists h2:first-child, .top h2:first-child { margin-top: .6em; }\np { max-width: 38em; }\n\n/* a sewn-on patch */\n.patch { align-self: start; background: var(--blush); padding: .3em 1.2em .6em; margin: 1em 0; border-radius: 6px; outline: 2px dashed #f2a3c2; outline-offset: -7px; }\n\n/* running stitch */\nhr { border: 0; height: 1em; margin: 1.6em 0; overflow: hidden; }\nhr::before {\n  content: \"--  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --  --\";\n  display: block; white-space: pre;\n  font: 16px/1 ui-monospace, Menlo, Consolas, \"DejaVu Sans Mono\", monospace; color: var(--pink);\n}\n\n/* photos: two to a row on small screens, one row right across on big ones */\n.photos { display: flex; flex-wrap: wrap; gap: 1.5em 2em; align-items: flex-start; }\n.photos figure { margin: 0; flex: 1 1 40%; }\n.photos img { display: block; width: 100%; height: auto; background: var(--blush); }\n.photos figcaption { font-size: 15px; margin-top: .4em; }\n\n/* cut along the dotted line */\n.cut { position: relative; border: 2px dashed var(--pink); padding: .6em 1em; margin-top: 1.2em; }\n.cut::before { content: \"✂\\FE0E\"; position: absolute; top: -.8em; left: .8em; padding: 0 .25em; background: var(--paper); color: var(--pink); font-size: 1.1em; }\n.kao { color: var(--pink); white-space: nowrap; }\nbutton { font: 15px \"Times New Roman\", Times, serif; color: var(--ink); background: var(--blush); border: 1px solid var(--pink); border-radius: 1em; padding: .1 s researcher, based in london.\">\n\u003cmeta name=\"author\" content=\"Kes Inkersole\">\n\u003cmeta name=\"keywords\" content=\"Kesia Inkersole, Kes Inkersole, creative strategist, internet equalities, researcher, London, UAL\">\n\u003cmeta name=\"color-scheme\" content=\"light\">\n\u003clink rel=\"icon\" href=\"/favicon.ico\" sizes=\"any\">\n\u003cmeta property=\"og:type\" content=\"website\">\n\u003cmeta property=\"og:title\" content=\"kes inkersole\">\n\u003cmeta property=\"og:description\" content=\"kes inkersole — freelance creative strategist &amp; internet equalities researcher, based in london.\">\n\u003cmeta property=\"og:image\" content=\"https://kesia-coral.vercel.app/square.png\">\n\u003cmeta property=\"og:url\" content=\"https://kesia-coral.vercel.app\">\n\u003cmeta name=\"twitter:card\" content=\"summary_large_image\">\n\u003cmeta name=\"twitter:title\" content=\"kes inkersole\">\n\u003cmeta name=\"twitter:description\" content=\"kes inkersole — freelance creative strategist &amp; internet equalities researcher, based in london.\">\n\u003cmeta name=\"twitter:image\" content=\"https://kesia-coral.vercel.app/square.png\">\n\u003cstyle>\n/* kes: the whole palette lives here. strawberry, periwinkle, butter, a bit of leaf */\n:root {\n  --paper: #fff8f3;\n  --ink: #2e1f33;\n  --pink: #e4427f;\n  --pink-ink: #b8235a;\n  --blue: #3a4bd1;\n  --plum: #8a3fa8;\n  --leaf: #3d9a5c;\n  --butter: #fff3b8;\n  --blush: #ffe3ec;\n  --sky: #e6eaff;\n  --mono: ui-monospace, Menlo, Consolas, \"DejaVu Sans Mono\", \"Courier New\", monospace;\n}\nbody {\n  margin: 0;\n  padding: 2.5rem clamp(1rem, 4vw, 4rem) 0;\n  background: var(--paper);\n  color: var(--ink);\n  font: 1.125rem/1.45 \"Times New Roman\", Times, serif;\n}\n::selection { background: var(--blush); color: var(--pink-ink); }\na { color: var(--blue); text-decoration-thickness: 1px; text-underline-offset: .15em; }\na:visited { color: var(--plum); }\na:hover { background: var(--blush); color: var(--pink-ink); }\nmark { background: var(--butter); color: inherit; padding: 0 .15em; }\nh1 { font-size: 3rem; font-weight: normal; margin: 0 0 1rem; }\nh1 span { color: var(--pink); display: inline-block; transition: transform .3s; }\nh1:hover span { transform: scale(1.25) rotate(-12deg); }\nh2 { font: 1rem/1.3 var(--mono); color: var(--pink-ink); margin: 0 0 .6rem; }\nul { margin: 0; padding-left: 1.4em; list-style: \"☆ \"; }\nli::marker { color: var(--pink); }\nli:hover { list-style-type: \"★ \"; }\nli + li { margin-top: .3em; }\n\n/* ascii: b = pink, i = leaf, em = periwinkle */\npre { font: 15px/1.1 var(--mono); margin: 0; color: var(--blue); }\npre b, pre i, pre em { font: inherit; }\npre b { color: var(--pink); }\npre i { color: var(--leaf); }\npre em { color: var(--blue); }\n\n/* top: hello, new-ish, and the little computer whose cable runs off the page */\nheader {\n  display: grid;\n  grid-template-columns: auto minmax(0, 31rem) minmax(14rem, 1fr);\n  grid-template-areas: \"pc hello new\" \"cable cable cable\";\n  column-gap: 4rem;\n  align-items: end;\n}\n.hello { grid-area: hello; padding-bottom: 1rem; max-width: 34rem; }\n.hello p { margin: 0 0 .6em; }\n.new { grid-area: new; justify-self: end; max-width: 28rem; background: var(--butter); padding: 1rem 1.5rem 1.25rem; margin-bottom: 2rem; transform: rotate(-.7deg); }\n.pc { grid-area: pc; }\n.cable { grid-area: cable; display: flex; }\n.wire { flex: 1; overflow: hidden; padding-bottom: 3px; }\n.wire span { display: inline-block; margin-left: -30ch; animation: send 6s linear infinite paused; }\nheader:hover .wire span { animation-play-state: running; }\n@keyframes send { to { transform: translateX(30ch); } }\n\n/* the lists sit side by side and wrap when the window gets narrow */\n.row { display: flex; flex-wrap: wrap; gap: 2rem 3rem; margin: 3rem 0; }\n.row > section { flex: 1 1 17rem; max-width: 42rem; }\n.row > .wide { flex-grow: 1.6; }\n.row p { margin: 0 0 .7em; }\n\n.photos { margin: 0; }\n.photos div { display: flex ternet equalities researcher, based in london.\">\n\u003cmeta name=\"twitter:image\" content=\"https://kesia-coral.vercel.app/square.png\">\n\u003cstyle>\n/* warm paper, plum ink, pink, periwinkle, a bit of gold and one leaf */\n:root {\n  --paper: #fff8f0;\n  --ink: #33224a;\n  --pink: #ff5c9d;\n  --pink-text: #cf2f72;\n  --blue: #5a68f0;\n  --gold: #e8a400;\n  --leaf: #4f9a5c;\n  --blush: #ffe3ee;\n  --sky: #e6e8ff;\n  --butter: #fff4b8;\n  --lilac: #ad9de3;\n  --mono: ui-monospace, Menlo, Consolas, \"DejaVu Sans Mono\", \"Courier New\", monospace;\n}\nhtml { background: var(--paper); color: var(--ink); }\nbody { margin: 0; padding: 0 2.5rem 1rem; font: 18px/1.5 \"Times New Roman\", Times, serif; }\n::selection { background: var(--pink); color: #fff; }\n\na { color: #2f43d0; text-underline-offset: .15em; }\na:visited { color: #8a35b8; }\na:hover { background: var(--blush); text-decoration-style: wavy; text-decoration-color: var(--pink); }\na:focus-visible, button:focus-visible { outline: 2px dashed var(--pink); outline-offset: 2px; }\nmark { color: inherit; background: linear-gradient(transparent 55%, var(--blush) 55%); }\nmark.sky { background: linear-gradient(transparent 55%, var(--sky) 55%); }\n\npre, .ascii { font: 14px/1.15 var(--mono); margin: 0; }\npre b, .ascii b { font-weight: normal; }\n.p { color: var(--pink); } .b { color: var(--blue); } .y { color: var(--gold); }\n.g { color: var(--leaf); } .l { color: var(--lilac); } .k { color: var(--ink); }\n.s, .t { color: var(--gold); animation: twinkle 2.4s ease-in-out infinite; } .t { color: var(--blue); animation-delay: -1.2s; }\n\nh2 { font: 16px/1.3 var(--mono); color: var(--pink-text); margin: 0 0 .8em; }\nul { margin: 0 0 1.8em; padding-left: 1.5em; }\nli { margin-bottom: .35em; }\nli::marker { color: var(--pink); }\np, li { max-width: 34em; }\np { margin: 0 0 1em; }\n\n/* bulbs */\n.lights { color: var(--lilac); overflow: hidden; margin: 0 -2.5rem; padding: 0 1rem; }\n.lights i { font-style: normal; color: var(--pink); animation: twinkle 2.4s ease-in-out infinite; }\n.lights i:nth-of-type(3n+2) { color: var(--blue); animation-delay: -.8s; }\n.lights i:nth-of-type(3n) { color: var(--gold); animation-delay: -1.6s; }\n@keyframes twinkle { 50% { opacity: .3; } }\n\n/* the name fills the width on one line, or two lines (kesia / inkersole) when the screen is narrower */\nh1 { margin: .8rem 0 2.5rem; color: var(--pink); }\n.name { display: flex; flex-wrap: wrap; column-gap: 3ch; font-size: min(34px, (100vw - 5rem) / 54); }\n.name > span { white-space: pre; }\n@media (max-width: 1000px) { .name { font-size: min(26px, (100vw - 5rem) / 34); } }\n.big { font-size: 1.55em; line-height: 1.3; max-width: 20em; }\nbutton { font: 13px var(--mono); color: var(--pink-text); background: var(--blush); border: 1px solid var(--pink); border-radius: 1em; padding: .1em .7em; cursor: pointer; vertical-align: .1em; }\nbutton:hover { background: var(--pink); color: #fff; }\n\n.row { display: grid; align-items: start; grid-template-columns: repeat(auto-fit, minmax(min(100%, 19rem), 1fr)); gap: 2.5rem 3.5rem; margin: 0 0 3rem; }\nimg { max-width: 100%; height: auto; display: block; background: var(--blush); }\nfigure { margin: 0; }\nfigcaption { font: 13px/1.4 var(--mono); margin-top: .5em; }\nfigcaption::before { content: \"^ \"; color: var(--pink); }\n\n.note { background: var(--butter); padding: 1.2rem 1.4rem .2rem; border-radius: 3px; transform: rotate(-.6deg); }\n.note h2 { color: var(--ink); }\n\n.lately  { list-style-type: \"✧  \"; }\n.fun     { list-style-type: \"♡  \"; }\n.funds   { list-style-type: \"£  \"; }\n.writing { list-style-type: \"✎  \"; }\n.pods    { list-style-type: \"♪  \"; }\n.bits    { list-style-type: \"✿  \"; }\n\n.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); gap: 1.5rem; margin: 0 0 3.5rem; }\n.strip figure:nth-child(2) { margin-top: 2.5rem; }\n\n.bus { display: inline-block; font-size: min(14px, (100vw - 2rem) / 21.5); const urls = V.map(v => URL.createObjectURL(new Blob([v.html], { type: "text/html" })));
const nav = document.getElementById("nav"), frame = document.getElementById("frame");
const note = document.getElementById("note"), open = document.getElementById("open");
const phone = document.getElementById("phone");
let cur = -1;
V.forEach((v, i) => {
  const b = document.createElement("button");
  b.textContent = v.label;
  b.onclick = () => show(i);
  nav.appendChild(b);
});
function show(i) {
  i = (i + V.length) % V.length;
  if (i === cur) return;
  cur = i;
  frame.src = urls[i];
  open.href = urls[i];
  note.textContent = V[i].note;
  note.title = V[i].note;
  [...nav.children].forEach((b, j) => b.setAttribute("aria-current", j === i));
  nav.children[i].scrollIntoView({ block: "nearest", inline: "nearest" });
  history.replaceState(null, "", "#" + V[i].label);
}
function setPhone(on) {
  document.body.classList.toggle("phone", on);
  phone.setAttribute("aria-pressed", on);
}
document.getElementById("prev").onclick = () => show(cur - 1);
document.getElementById("next").onclick = () => show(cur + 1);
phone.onclick = () => setPhone(!document.body.classList.contains("phone"));
addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "ArrowRight") show(cur + 1);
  else if (e.key === "ArrowLeft") show(cur - 1);
  else if (e.key === "m") phone.click();
});
const start = V.findIndex(v => "#" + v.label === location.hash);
show(start > -1 ? start : 1);
// keys pressed inside the preview arrive from the frame's shim
addEventListener("message", e => {
  if (e.source === frame.contentWindow && e.data && e.data.variantKey)
    dispatchEvent(new KeyboardEvent("keydown", { key: e.data.variantKey }));
});
</script>
