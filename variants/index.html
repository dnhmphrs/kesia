==== */\n\n   :root {\n    --paper: #e9e7e0;\n    --ink: #0a0a0a;\n    --red: #ff2d16;\n    --blue: #1f35ff;\n    --green: #00b341;\n    --yellow: #ffe11a;\n    --pink: #ff52c0;\n  \n    /* font mashup — all system, no webfonts. clashing on purpose. */\n    --sans:  Helvetica, Arial, sans-serif;\n    --serif: Georgia, \"Times New Roman\", Times, serif;\n    --mono:  \"Courier New\", \"Lucida Console\", Monaco, monospace;\n    --cond:  \"Arial Narrow\", \"Helvetica Neue Condensed\", \"Liberation Sans Narrow\", sans-serif;\n    --grotbig: Impact, Haettenschweiler, \"Franklin Gothic Bold\", \"Arial Black\", sans-serif;\n  }\n  \n  * { box-sizing: border-box; }\n  html { -webkit-text-size-adjust: 100%; background: var(--ink);}\n  ::selection { background: var(--yellow); color: var(--ink); }\n  \n  body {\n    background: var(--paper); \n    color: var(--ink);\n    font-family: var(--sans);\n    font-size: 16px;\n    line-height: 1.35;\n    margin: 0;\n    padding: 0;\n  }\n  \n  /* NO wrapper width, NO side margins — full bleed */\n  .wrap { width: 100%; }\n  \n  /* masthead spans full width, color block, name oversized & cramped */\n  .masthead {\n    background: var(--ink);\n    color: var(--paper);\n    padding: 14px 18px 22px;\n    border-bottom: 6px solid var(--red);\n  }\n  h1 {\n    font-size: clamp(48px, 13vw, 120px);\n    font-weight: 700;\n    letter-spacing: -0.05em;\n    line-height: 0.82;\n    margin: 0;\n    margin-top: 8px;\n    text-transform: uppercase;\n  }\n  /* the two words fight: heavy clean grotesque vs. lowercase serif italic */\n  h1 .a {\n    font-family: \"Helvetica Neue\", \"Arial Black\", Helvetica, Arial, sans-serif;\n    font-weight: 800;\n    letter-spacing: -0.04em;\n  }\n  h1 .b {\n    font-family: var(--serif);\n    font-style: italic;\n    font-weight: 400;\n    text-transform: lowercase;\n    letter-spacing: -0.03em;\n    color: var(--pink);\n    margin-left: 0.06em;\n  }\n  .masthead .role {\n    font-family: var(--mono);\n    font-size: clamp(14px, 2vw, 20px);\n    margin: 16px 0 0;\n    font-weight: 400;\n    color: var(--yellow);\n    text-transform: lowercase;\n    letter-spacing: 0.02em;\n  }\n  .masthead .meta {\n    font-family: var(--mono);\n    margin: 16px 0 0;\n    font-size: 14px;\n    display: flex;\n    gap: 0;\n    flex-wrap: wrap;\n  }\n  .masthead .meta span,\n  .masthead .meta a {\n    padding: 4px 10px;\n    border: 2px solid var(--paper);\n    margin: 0 -2px -2px 0;            /* collapse borders, overlap */\n    text-decoration: none;\n    color: var(--paper);\n  }\n  .masthead .meta a { background: var(--green); color: #fff; }\n  .masthead .meta a:hover { background: var(--yellow); color: var(--ink); }\n  .masthead .avail { background: var(--blue); color: var(--ink); }\n  \n  /* every row is full width, label sits in a colored gutter cell */\n  .row {\n    display: grid;\n    grid-template-columns: clamp(120px, 18vw, 260px) 1fr;\n    border-bottom: 3px solid var(--ink);\n  }\n  .label {\n    font-family: var(--grotbig);\n    font-size: clamp(16px, 2vw, 26px);\n    font-weight: 400;\n    text-transform: uppercase;\n    letter-spacing: 0.01em;\n    padding: 16px 14px;\n    border-right: 3px solid var(--ink);\n    align-self: stretch;\n  }\n  .content { padding: 16px 18px; min-width: 0; }\n  \n  /* rotate the color of each label gutter — anti-design \"wrongness\" */\n  .row:nth-of-type(1) .label { background: var(--yellow); }\n  .row:nth-of-type(2) .label { background: none; }\n  .row:nth-of-type(3) .label { background: var(--pink); }\n  .row:nth-of-type(4) .label { background: var(--green); color: var(--ink); }\n  .row:nth-of-type(5) .label { background: var(--blue); color: #fff; }\n  .row:nth-of-type(6) .label { background: var(--red); color: #fff; }\n  .row:nth-of-type(7) .label { background: var(--ink); color: var(--paper); }\n  .row:nth-of-type(8) .label { background: var(--yellow); }\n  .row:nth-of-type(9) .label { background: none; }\n  \n  .content p { font-family: v const urls = V.map(v => URL.createObjectURL(new Blob([v.html], { type: "text/html" })));
const nav = document.getElementById("nav"), frame = document.getElementById("frame");
const note = document.getElementById("note"), open = document.getElementById("open");
const phone = document.getElementById("phone");
let cur = -1;
V.forEach((v, i) => {
  const b = document.createElement("button");
  b.textContent = v.label;
  b.onclick = () => show(i);
  nav.appendChild(b);
});
function show(i) {
  i = (i + V.length) % V.length;
  if (i === cur) return;
  cur = i;
  frame.src = urls[i];
  open.href = urls[i];
  note.textContent = V[i].note;
  note.title = V[i].note;
  [...nav.children].forEach((b, j) => b.setAttribute("aria-current", j === i));
  nav.children[i].scrollIntoView({ block: "nearest", inline: "nearest" });
  history.replaceState(null, "", "#" + V[i].label);
}
function setPhone(on) {
  document.body.classList.toggle("phone", on);
  phone.setAttribute("aria-pressed", on);
}
document.getElementById("prev").onclick = () => show(cur - 1);
document.getElementById("next").onclick = () => show(cur + 1);
phone.onclick = () => setPhone(!document.body.classList.contains("phone"));
addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "ArrowRight") show(cur + 1);
  else if (e.key === "ArrowLeft") show(cur - 1);
  else if (e.key === "m") phone.click();
});
const start = V.findIndex(v => "#" + v.label === location.hash);
show(start > -1 ? start : 1);
// keys pressed inside the preview arrive from the frame's shim
addEventListener("message", e => {
  if (e.source === frame.contentWindow && e.data && e.data.variantKey)
    dispatchEvent(new KeyboardEvent("keydown", { key: e.data.variantKey }));
});
</script>
