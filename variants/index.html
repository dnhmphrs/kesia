": "White three-column handout: pink heart-sign name, KES FM speaker deck, bordered CV card, three grey slices, star-link lists, garden; writing: heart-computer, three-column email notes.", "pages": {"index.html": "\u003c!doctype html>\n\u003chtml lang=\"en-GB\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>kes inkersole\u003c/title>\n\u003cmeta name=\"description\" content=\"kes inkersole (kesia on paper): freelance creative strategist and internet equalities researcher, london.\">\n\u003cstyle>\n/* one page, set like a handout.\n   white paper, black ink, electric-blue links, hot pink when you touch something, and the pink of the heart sign.\n   one unit: 12px. the line is 24px (2 units) and every gap is a multiple of 12.\n   one grid: three equal columns with a 48px gutter, on everything.\n   three sizes: 13px mono for labels, 16px sans for reading, 40px times italic for hello and goodbye. */\n:root {\n  --ink: #000;\n  --paper: #fff;\n  --blue: #1f36ff;   /* links */\n  --pink: #ff2d95;   /* the hearts, and the highlight under your mouse */\n  --blush: #ffe3f0;  /* the sign's board */\n  --dot: #ffbcdb;    /* the sign's unlit dots */\n  --sans: \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n  --mono: ui-monospace, Menlo, Consolas, \"DejaVu Sans Mono\", \"Liberation Mono\", \"Courier New\", monospace;\n  --serif: \"Times New Roman\", Times, serif;\n  --gut: 48px;   /* page margin */\n  --gap: 48px;   /* column gutter */\n  --sec: 96px;   /* between sections */\n}\nhtml { background: var(--paper); color: var(--ink); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\nbody { margin: 0; padding: var(--gut) var(--gut) 0; font: 16px/24px var(--sans); }\n::selection { background: var(--pink); color: var(--ink); }\na { color: var(--blue); text-decoration-thickness: 1px; text-underline-offset: .18em; }\na:visited { text-decoration-style: dotted; }\na:hover { background: var(--pink); color: var(--ink); text-decoration: none; }\na:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }\np, h1, h2, h3, ul, dl, dd, figure { margin: 0; }\nh1, h2, h3 { font: inherit; }\n.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }\n\n/* the three sizes */\n.label { font: 13px/24px var(--mono); }\n.big-i { font: italic 40px/48px var(--serif); }\n.heart { color: var(--pink); font-style: normal; }\n\n/* the grid */\n.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: var(--gap); }\n.ruled { margin-top: var(--sec); border-top: 1px solid var(--ink); padding-top: 12px; }\n\n/* ascii is drawn, not typeset: its own leading, never wraps */\npre { margin: 0; font-family: var(--mono); white-space: pre; }\npre b { font-weight: inherit; }\n\n/* ---------- the sign: kes inkersole in tiny \u003c3s (i5-03, recoloured) ---------- */\n.sign { container-type: inline-size; }\n.sign pre { color: var(--dot); line-height: 1.22; font-size: min(19px, calc(100cqw / 101.9)); font-weight: bold; width: fit-content;\n  background: linear-gradient(var(--blush), var(--blush)) 1.5ch .5lh / calc(100% - 3ch) calc(100% - 1lh) no-repeat; }\n.sign s { text-decoration: none; color: var(--ink); font-weight: normal; }\n.sign b { color: var(--pink); }\n.sign b.h { color: var(--blue); animation: blink 1.6s steps(1) infinite; }\n@keyframes blink { 50% { color: var(--pink); } }\n.sign .small { display: none; }\n\n/* ---------- the top: hello, the card, the radio ---------- */\n.top { margin-top: 72px; grid-template-areas: \"hello hello card\" \"fm fm card\"; row-gap: 72px; align-items: start; }\n.hello { grid-area: hello; }\n.hello .big-i { margin-bottom: 24px; }\n.about { columns: 2; column-gap: var(--gap); }\n.about p + p { margin-top: 12px; }\n\n/* the card: bio, portfolio, cv on one card (the i7-02 poster idea, in this page's ink) */\n.card { grid-area: card; border: 1px solid var(--ink); padding: 23px; }\n.card .label { margin-bottom: 12px; }\n.card dl { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; }\n.card dt { font: 13px/24px var(--mono); }\n.art { font: 13px/1.15 var(--mono); }\n.bunny { margin-top: 24px; width: fit-content; }\n.bunny .p { color: var(--pink); }\n.bunny:hover { animation: hop .5s; }\n@keyframes hop { 40% { transform: translateY(-12px); } }\n\n/* ---------- KES FM: the speakers are its face ---------- */\n.fm { grid-area: fm; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: var(--gap);\n  grid-template-areas: \"face deck\" \"head deck\" \"ident deck\"; grid-template-rows: auto auto 1fr; align-items: start; }\n.stack { grid-area: face; margin-bottom: 24px; }\n#fm-h { grid-area: head; font: 13px/24px var(--mono); }\n.ident { grid-area: ident; }\n.deck { grid-area: deck; font: 13px/24px var(--mono); }\n.stack .p, .stack .y { color: var(--pink); }\n.stack .g { color: var(--blue); }\n.tower.lit .y { color: var(--blue); }\n.stack .sound.thump { animation: thump .2s steps(1); }\n@keyframes thump { from, to { color: var(--pink); } }\n.lcd { border: 1px solid var(--ink); padding: 11px 12px; }\n.lcd-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 24px; }\nbody.on-air .status { color: var(--pink); }\n.ticker { overflow: hidden; white-space: nowrap; border-block: 1px solid var(--ink); margin: 11px 0; }\n.ticker > div { display: inline-block; }\n.ticker span { padding-right: .5em; }\n.tracker { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); text-align: center; }\n.tracker .rest { opacity: .35; }\n.tracker .rev, .lcd-info .rev { color: var(--pink); }\n.tracker .up, .lcd-info .up { color: var(--blue); }\n.tracker .roll { text-decoration: underline; }\n.tracker .on { background: var(--pink); color: var(--ink); }\n.lcd-info { display: flex; flex-wrap: wrap; gap: 0 24px; margin-top: 12px; }\n.keys { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; margin-top: 12px; }\n.keys > div { display: flex; flex-wrap: wrap; align-items: center; row-gap: 12px; }\n.keys .lbl { margin-right: 12px; }\n.keys button, .floatstop { font: 13px/22px var(--mono); color: var(--ink); background: var(--paper); border: 1px solid var(--ink); border-radius: 0; margin: 0; padding: 0 9px; cursor: pointer; }\n.keys > div > button + button { margin-left: -1px; }\n.keys button[aria-pressed=\"true\"] { background: var(--ink); color: var(--paper); }\n.keys button:hover, .floatstop:hover { background: var(--pink); color: var(--ink); }\n.keys button:active { translate: 0 1px; }\n.vol { display: flex; align-items: center; gap: 12px; }\n.vol input { width: 96px; margin: 0; accent-color: var(--ink); }\n.textin { margin-top: 12px; }\n.floatstop { position: fixed; right: 24px; bottom: 24px; z-index: 5; background: var(--ink); color: var(--paper); padding: 12px; }\n.floatstop[hidden] { display: none; }\n@keyframes run { to { translate: -50% 0; } }\n@media (prefers-reduced-motion: no-preference) { .ticker > div { animation: run 70s linear infinite; } }\n\n/* ---------- three projects, as slices 00 to 02 ---------- */\n.slice .meta { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 12px; }\n.slice img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: cover; background: #f2f2f2; filter: grayscale(1); margin-bottom: 12px; }\n\n/* ---------- everything else: titles with symbols, star bullets ---------- */\n.links h3 { margin-bottom: 12px; }\n.links .col > .group + .group { margin-top: 48px; }\n.stars { padding: 0; list-style: \"☆  \"; }\n.stars li + li { margin-top: 12px; }\n.stars li:hover { list-style-type: \"★  \"; }\n.stars li:hover::marker { color: var(--pink); }\n.src { font: 13px/24px var(--mono); }\n\n/* ---------- the end: small print, goodbye, a garden ---------- */\n.garden { margin-top: 72px; overflow: hidden; container-type: inline-size; }\n.garden pre { font-size: max(12px, min(16px, calc(100cqw / 113.6))); line-height: 1.2; }\n.garden .rose { color: var(--pink); }\n.garden .lilac, .garden .peri { color: var(--blue); }\n\n/* ---------- smaller windows ---------- */\n@media (max-width: 1099px) {\n  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n  .top { grid-template-areas: \"hello card\" \"fm fm\"; }\n  .about { columns: 1; }\n  .projects.grid, .links.grid, .end.grid { row-gap: 48px; }\n}\n@media (max-width: 720px) {\n  :root { --gut: 24px; --sec: 72px; }\n  .grid, .fm { grid-template-columns: minmax(0, 1fr); }\n  .top { grid-template-areas: \"hello\" \"fm\" \"card\"; row-gap: 48px; }\n  .fm { grid-template-areas: \"face\" \"head\" \"ident\" \"deck\"; }\n  .deck { margin-top: 24px; }\n}\n@media (max-width: 640px) {\n  .sign .big { display: none; }\n  .sign .small { display: block; font-size: min(16px, calc(100cqw / 25.9)); }\n}\n@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003ch1 class=\"vh\">kes inkersole\u003c/h1>\n\n\u003c!-- the sign: every lit dot is a little \u003c3 -->\n\u003cheader class=\"sign\" role=\"img\" aria-label=\"kes inkersole, spelled out in tiny \u003c3 hearts on a pink dot-matrix sign\">\n\u003cpre class=\"big\" aria-hidden=\"true\">\u003cs> .---------------------------------------------------------------------------------------------------------------------------------------------------------------------. \u003c/s>\n\u003cs> |\u003c/s> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .\u003cs> | \u003c/s>\n\u003cs> |\u003c/s> . .\u003cb>&lt;3\u003c/b> . . . . . . . . . . . . . . . . . . . . .\u003cb>&lt;3\u003c/b> . . . . . . . .\u003cb>&lt;3\u003c/b> . . . . . . . . . . . . . . . . . . . . . . . . . . . . .\u003cb>&lt;3&lt;3\u003c/b> . . . . . . . . . . . . 3-for-music-artists/id1449302502?i=1000552812458\">latasha on the potential of web3 for music artists\u003c/a>\u003c/li>\n    \u003c/ul>\n  \u003c/div>\n\u003c/section>\n\n\u003c/main>\n\n\u003cfooter>\n  \u003cdiv class=\"end grid ruled\">\n    \u003cp class=\"label\">this page is still mostly plain html (it started out in \u003ca href=\"http://contemporary-home-computing.org/prof-dr-style/\">olia lialina's prof. dr. style\u003c/a>, then i planted some flowers), so it's easy for me to update and it loads fine on bad wifi.\u003c/p>\n    \u003cp class=\"label\">system fonts, no cookies, no tracking. the photos are placeholders for now. the only thing that makes a sound is KES FM, and only when you press on air.\u003c/p>\n    \u003cp class=\"bye big-i\">thanks for stopping by \u003cspan class=\"heart\">♡\u003c/span>\u003c/p>\n  \u003c/div>\n  \u003c!-- a little garden, so the page has somewhere soft to end -->\n  \u003cdiv class=\"garden\">\n\u003cpre aria-hidden=\"true\">    \u003cb class=\"rose\">_                             \u003c/b>\u003cb class=\"lilac\">_                          \u003c/b>\u003cb class=\"rose\">_                        \u003c/b>\u003cb class=\"peri\">_                            \u003c/b>\u003cb class=\"rose\">_                        \u003c/b>\u003cb class=\"lilac\">_                             \u003c/b>\u003cb class=\"peri\">_\u003c/b>\n  \u003cb class=\"rose\">_(_)_         @               \u003c/b>\u003cb class=\"lilac\">_(_)_         \u003c/b>\u003cb class=\"peri\">@            \u003c/b>\u003cb class=\"rose\">_(_)_              @     \u003c/b>\u003cb class=\"peri\">_(_)_         \u003c/b>\u003cb class=\"rose\">@              _(_)_    \u003c/b>\u003cb class=\"lilac\">@               _(_)_         \u003c/b>\u003cb class=\"peri\">@               _(_)_    \u003c/b>\u003cb class=\"rose\">@\u003c/b>\n \u003cb class=\"rose\">(_)@(_)        \u003c/b>\u003cb class=\"stem\">|/  \u003c/b>\u003cb class=\"peri\">vVv        \u003c/b>\u003cb class=\"lilac\">(_)@(_)        \u003c/b>\u003cb class=\"stem\">|/    \u003c/b>\u003cb class=\"rose\">vVv   (_)@(_)             \u003c/b>\u003cb class=\"stem\">|/   \u003c/b>\u003cb class=\"peri\">(_)@(_)  \u003c/b>\u003cb class=\"lilac\">vVv   \u003c/b>\u003cb class=\"stem\">|/            \u003c/b>\u003cb class=\"rose\">(_)@(_)   \u003c/b>\u003cb class=\"stem\">|/  \u003c/b>\u003cb class=\"rose\">vVv        \u003c/b>\u003cb class=\"lilac\">(_)@(_)        \u003c/b>\u003cb class=\"stem\">|/  \u003c/b>\u003cb class=\"lilac\">vVv        \u003c/b>\u003cb class=\"peri\">(_)@(_)   \u003c/b>\u003cb class=\"stem\">|/  \u003c/b>\u003cb class=\"lilac\">vVv\u003c/b>\n   \u003cb class=\"rose\">(_)    \u003c/b>\u003cb class=\"lilac\">vVv  \u003c/b>\u003cb class=\"stem\">\\|   \u003c/b>\u003cb class=\"peri\">(_)    \u003c/b>\u003cb class=\"lilac\">*     (_)    \u003c/b>\u003cb class=\"rose\">vVv  \u003c/b>\u003cb class=\"stem\">\\|     \u003c/b>\u003cb class=\"rose\">(_)     (_)     \u003c/b>\u003cb class=\"peri\">*   \u003c/b>\u003cb class=\"lilac\">vVv  \u003c/b>\u003cb class=\"stem\">\\|      \u003c/b>\u003cb class=\"peri\">(_)    \u003c/b>\u003cb class=\"lilac\">(_)  \u003c/b>\u003cb class=\"stem\">\\|   \u003c/b>\u003cb class=\"rose\">vVv   \u003c/b>\u003cb class=\"lilac\">*     \u003c/b>\u003cb class=\"rose\">(_)    \u003c/b>\u003cb class=\"stem\">\\|   \u003c/b>\u003cb class=\"rose\">(_)  \u003c/b>\u003cb class=\"peri\">vVv     \u003c/b>\u003cb class=\"lilac\">(_)     \u003c/b>\u003cb class=\"rose\">*   \u003c/b>\u003cb class=\"stem\">\\|   \u003c/b>\u003cb class=\"lilac\">(_)   \u003c/b>\u003cb class=\"rose\">vVv    \u003c/b>\u003cb class=\"peri\">(_)    \u003c/b>\u003cb class=\"stem\">\\|   \u003c/b>\u003cb class=\"lilac\">(_)  \u003c/b>\u003cb class=\"rose\">vVv\u003c/b>\n    \u003cb class=\"stem\">|/    \u003c/b>\u003cb class=\"lilac\">(_)   \u003c/b>\u003cb class=\"stem\">|   \\|     |/     |/    \u003c/b>\u003cb class=\"rose\">(_)   \u003c/b>\u003cb class=\"stem\">|     \\| sole, sent in by email and collected here over time.\">\n\u003cstyle>\n/* same paper, same ink, same grid as the home page.\n   one unit: 12px, the line is 24px. three columns, 48px gutter. three sizes: 13 mono, 16 sans, 40 times italic. */\n:root {\n  --ink: #000;\n  --paper: #fff;\n  --blue: #1f36ff;\n  --pink: #ff2d95;\n  --sans: \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n  --mono: ui-monospace, Menlo, Consolas, \"DejaVu Sans Mono\", \"Liberation Mono\", \"Courier New\", monospace;\n  --serif: \"Times New Roman\", Times, serif;\n  --gut: 48px;\n  --gap: 48px;\n  --sec: 96px;\n}\nhtml { background: var(--paper); color: var(--ink); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\nbody { margin: 0; padding: var(--gut) var(--gut) 0; font: 16px/24px var(--sans); }\n::selection { background: var(--pink); color: var(--ink); }\na { color: var(--blue); text-decoration-thickness: 1px; text-underline-offset: .18em; }\na:visited { text-decoration-style: dotted; }\na:hover { background: var(--pink); color: var(--ink); text-decoration: none; }\na:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }\np, h1, h2 { margin: 0; }\nh1, h2 { font: inherit; }\n\n.label { font: 13px/24px var(--mono); }\n.big-i { font: italic 40px/48px var(--serif); }\n.heart { color: var(--pink); font-style: normal; }\n.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: var(--gap); }\n.ruled { margin-top: var(--sec); border-top: 1px solid var(--ink); padding-top: 12px; }\n\npre { margin: 0; font-family: var(--mono); white-space: pre; }\npre b { font-weight: inherit; }\n\n/* ---------- the top: a little computer, its cable full of \u003c3s (i5-08, recoloured) ---------- */\n.back { margin-bottom: 48px; }\n.mast { grid-template-areas: \"pc title title\" \"cable cable cable\"; align-items: end; }\n.mast .title { grid-area: title; padding-bottom: 12px; }\n.mast .title .big-i { margin-bottom: 12px; }\n.mast .title .label { margin-top: 12px; const urls = V.map(v => Object.fromEntries(Object.entries(v.pages).map(([n, h]) => [n, URL.createObjectURL(new Blob([h], { type: "text/html" }))])));
const nav = document.getElementById("nav"), frame = document.getElementById("frame"), pagesEl = document.getElementById("pages");
const note = document.getElementById("note"), open = document.getElementById("open"), phone = document.getElementById("phone");
let cur = -1, page = "index.html";
V.forEach((v, i) => { const b = document.createElement("button"); b.textContent = v.label; b.onclick = () => show(i); nav.appendChild(b); });
function label(n) { return n.replace(/\.html$/, "").replace(/^index$/, "home"); }
function show(i, p, hash) {
  i = (i + V.length) % V.length;
  p = p && urls[i][p] ? p : "index.html";
  if (i === cur && p === page && !hash) return;
  cur = i; page = p;
  frame.src = urls[i][p] + (hash ? "#" + hash : "");
  open.href = urls[i][p];
  note.textContent = note.title = V[i].note;
  [...nav.children].forEach((b, j) => b.setAttribute("aria-current", j === i));
  nav.children[i].scrollIntoView({ block: "nearest", inline: "nearest" });
  const names = Object.keys(V[i].pages);
  pagesEl.innerHTML = "";
  pagesEl.hidden = names.length < 2;
  names.forEach(n => { const b = document.createElement("button"); b.textContent = label(n); b.setAttribute("aria-current", n === p); b.onclick = () => show(cur, n); pagesEl.appendChild(b); });
  history.replaceState(null, "", "#" + V[i].label + (p === "index.html" ? "" : "/" + label(p)));
}
function setPhone(on) { document.body.classList.toggle("phone", on); phone.setAttribute("aria-pressed", on); }
document.getElementById("prev").onclick = () => show(cur - 1);
document.getElementById("next").onclick = () => show(cur + 1);
phone.onclick = () => setPhone(!document.body.classList.contains("phone"));
addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "ArrowRight") show(cur + 1);
  else if (e.key === "ArrowLeft") show(cur - 1);
  else if (e.key === "m") phone.click();
});
addEventListener("message", e => {
  if (e.source !== frame.contentWindow || !e.data) return;
  if (e.data.variantKey) dispatchEvent(new KeyboardEvent("keydown", { key: e.data.variantKey }));
  if (e.data.variantPage) show(cur, e.data.variantPage, e.data.hash);
});
const [h0, h1] = location.hash.slice(1).split("/");
const start = V.findIndex(v => v.label === h0);
show(start > -1 ? start : 0, h1 ? h1 + ".html" : null);
