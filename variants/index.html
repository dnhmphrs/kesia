Bus.gain.value = .5; cuteBus.connect(comp);\n    var send = ac.createGain(); send.gain.value = .5; cuteBus.connect(send); send.connect(echoIn);\n    // one bass voice that stays on: a sine sub, plus two detuned saws for the reese\n    var o1 = ac.createOscillator(), o2 = ac.createOscillator(), sub = ac.createOscillator(), lfo = ac.createOscillator();\n    var saw = ac.createGain(), subG = ac.createGain(), grit = ac.createWaveShaper(), lpf = ac.createBiquadFilter(), lfoG = ac.createGain(), env = ac.createGain();\n    o1.type = o2.type = \"sawtooth\"; o1.detune.value = -13; o2.detune.value = 13; sub.type = \"sine\";\n    lpf.type = \"lowpass\"; lpf.frequency.value = 480; lpf.Q.value = 4; lfo.frequency.value = .23; lfoG.gain.value = 300;\n    lfo.connect(lfoG); lfoG.connect(lpf.frequency);\n    grit.curve = shaper(2.5);\n    o1.connect(saw); o2.connect(saw); saw.connect(lpf); lpf.connect(env);\n    sub.connect(grit); grit.connect(subG); subG.connect(env);\n    env.gain.value = 0; env.connect(bassBus);\n    [o1, o2, sub, lfo].forEach(function (o) { o.start(); });\n    B = { o1: o1, o2: o2, sub: sub, saw: saw, subG: subG, env: env };\n    bassMix();\n  }\n  function bassMix() {\n    if (!B) return;\n    var t = ac.currentTime, r = bassMode === \"reese\";\n    B.saw.gain.setTargetAtTime(r ? .28 : 0, t, .05);\n    B.subG.gain.setTargetAtTime(r ? .5 : .85, t, .05);\n    if (bassMode === \"off\") B.env.gain.setTargetAtTime(0, t, .03);\n  }\n\n  function slice(tok, t, d, v) {\n    var s = ac.createBufferSource(), g = ac.createGain();\n    s.buffer = tok.rev ? revBuf : breakBuf;\n    s.playbackRate.value = RATE * (tok.up ? 1.26 : 1);\n    var off = tok.rev ? revBuf.duration - (tok.s + 1) * OSTEP : tok.s * OSTEP;\n    g.gain.value = 0;\n    g.gain.setValueAtTime(0, t);\n    g.gain.linearRampToValueAtTime(v, t + (tok.rev ? .01 : .0015));\n    g.gain.setValueAtTime(v, t + d - .004);\n    g.gain.linearRampToValueAtTime(0, t + d + .002);\n    s.connect(g); g.connect(drums);\n    s. rops it again from the top\n  function pullUp() {\n    if (!onAir || !ac) return;\n    clearInterval(timer);\n    var t = ac.currentTime + .01;\n    hush(t);\n    var s = ac.createBufferSource(), g = ac.createGain(), pos = ((shown + 1) % 32) * OSTEP;\n    s.buffer = revBuf; s.loop = true;\n    s.playbackRate.setValueAtTime(RATE, t);\n    s.playbackRate.linearRampToValueAtTime(RATE * 3, t + .4);\n    s.playbackRate.exponentialRampToValueAtTime(.2, t + 1.05);\n    g.gain.value = 0; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.8, t + .02);\n    g.gain.setValueAtTime(.8, t + .75); g.gain.linearRampToValueAtTime(0, t + 1.05);\n    s.connect(g); g.connect(drums);\n    s.start(t, Math.max(0, revBuf.duration - pos)); s.stop(t + 1.1);\n    live.push({ s: s, end: t + 1.1 });\n    say(\"⟲ pull up! from the top…\");\n    if (!happy) look(\"@\");\n    step = 0; nextT = t + 1.15;\n    timer = setInterval(tick, 25);\n    setTimeout(function () { if (onAir) { say(\"● on air ♪\"); if (!happy) look(); } }, 1150);\n  }\n  // a dub siren, sound system style\n  function siren() {\n    if (!ac) build();\n    if (ac.resume) ac.resume();\n    var t = ac.currentTime + .02, o = ac.createOscillator(), l = ac.createOscillator(), lg = ac.createGain(), g = ac.createGain(), f = ac.createBiquadFilter();\n    o.type = \"square\"; o.frequency.setValueAtTime(380, t); o.frequency.exponentialRampToValueAtTime(820, t + 1.2);\n    l.type = \"square\"; l.frequency.setValueAtTime(4, t); l.frequency.linearRampToValueAtTime(10, t + 1.4);\n    lg.gain.value = 90; l.connect(lg); lg.connect(o.frequency);\n    f.type = \"lowpass\"; f.frequency.value = 1800;\n    g.gain.value = 0; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.09, t + .03);\n    g.gain.setValueAtTime(.09, t + 1.25); g.gain.linearRampToValueAtTime(0, t + 1.5);\n    o.connect(f); f.connect(g); g.connect(comp); g.connect(echoIn);\n    o.start(t); l.start(t); o.stop(t + 1.55); l.stop(t + 1.55);\n    live.push({ s: o, end: t + 1.55 }, { s: l, end: t + 1.55 });\n  }\n\n  $(\"#go\").onclick = go;\n  $(\"#stop\").onclick = stop;\n  floatStop.onclick = stop;\n  $(\"#pullup\").onclick = pullUp;\n  $(\"#siren\").onclick = siren;\n  $(\"#chop\").onclick = function () { chop(); pattern = \"chop\"; ui(); };\n  $(\"#cute\").onclick = function () { cute = !cute; ui(); };\n  $(\"#vol\").oninput = function () { if (ac) master.gain.setTargetAtTime(vol(), ac.currentTime, .03); };\n  document.querySelectorAll(\"[data-break]\").forEach(function (b) { b.onclick = function () { pattern = b.dataset.break; ui(); }; });\n  document.querySelectorAll(\"[data-bass]\").forEach(function (b) { b.onclick = function () { bassMode = b.dataset.bass; bassMix(); ui(); }; });\n  ui();\n})();\n\n\u003c/script>\n\u003cscript>\n  // not the engine: just the agreement, and a note for the console\n  (function () {\n    var box = document.getElementById(\"agree\"), line = document.getElementById(\"agreed\");\n    box.onchange = function () { line.textContent = box.checked ? \"liar x\" : \"I have read and agree to these terms\"; };\n  })();\n  console.log(\"hello, source reader. no cookies, no analytics, see §9\");\n\u003c/script>\n\u003cscript>(function(){\ndocument.addEventListener('click',function(e){\n  var a=e.target.closest&&e.target.closest('a[href^=\"#\"]');\n  if(!a||e.defaultPrevented)return;\n  var id=decodeURIComponent(a.getAttribute('href').slice(1)),t=id&&document.getElementById(id);\n  if(id&&!t)return;\n  e.preventDefault();\n  t?t.scrollIntoView({block:'start'}):scrollTo(0,0);\n});\naddEventListener('keydown',function(e){\n  if(e.metaKey||e.ctrlKey||e.altKey)return;\n  if(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]'))return;\n  if(['ArrowLeft','ArrowRight','m'].indexOf(e.key)>-1)parent.postMessage({variantKey:e.key},'*');\n});\n})();\u003c/script>\u003c/body>\n\u003c/html>\n"}, {"label": "02", "note": "Severe black-on-white: KES FM slab beside a huge right-aligned name, one j cker span { padding-right: .5em; }\n.tracker { display: grid; grid-template-columns: repeat(16, 1fr); gap: 1px; text-align: center; font-size: 11px; }\n.tracker span { padding: 1px 0; }\n.tracker .rest { opacity: .35; }\n.tracker .rev { color: #ff8fc8; }\n.tracker .up { color: var(--yellow); }\n.tracker .roll { text-decoration: underline; }\n.tracker .on { background: var(--acid); color: var(--black); }\n.lcd-info { margin-top: .4rem; font-size: 11px; color: rgba(200, 250, 30, .7); display: flex; flex-wrap: wrap; gap: 0 1rem; }\n.lcd-info .rev { color: #ff8fc8; } .lcd-info .up { color: var(--yellow); }\n.keys { grid-area: keys; display: flex; flex-wrap: wrap; gap: .45rem .9rem; align-items: center; }\n.keys > div { display: flex; flex-wrap: wrap; gap: .3rem; align-items: center; }\n.keys .lbl { font: 11px var(--mono); color: #8a8a8a; margin-right: .15rem; }\n.keys button { font: 12px/1 var(--mono); background: var(--black); color: #eee; border: 1px solid #555; border-radius: 0; padding: .45rem .5rem; cursor: pointer; }\n.keys button:hover { border-color: #eee; }\n.keys button:active { translate: 0 1px; }\n.keys button[aria-pressed=\"true\"] { background: var(--acid); color: var(--black); border-color: var(--acid); }\n.keys .go, .keys .go[aria-pressed=\"true\"] { background: var(--pink); color: #fff; border-color: var(--pink); font-size: 14px; font-weight: 700; padding: .5rem .7rem; }\n.keys .stop { background: #eee; color: var(--black); border-color: #eee; font-size: 14px; font-weight: 700; padding: .5rem .7rem; }\n.keys .stop:hover { border-color: var(--acid); }\nbutton:focus-visible { outline: 2px solid var(--acid); outline-offset: 2px; }\n.vol { font: 11px var(--mono); color: #8a8a8a; display: flex; align-items: center; gap: .4rem; }\n.vol sup { font-size: 10px; vertical-align: .4em; }\n.vol input { width: 6.5rem; accent-color: var(--acid); }\n.textin { grid-area: textin; align-self: end; margin: 0; font-size: 14px; color: #aaa; }\n.deck a { color: var(--acid); } .deck a:hover { color: var(--black); background: var(--acid); }\n.floatstop { position: fixed; right: 1rem; bottom: 1rem; z-index: 5; font: 700 14px/1 var(--mono); background: var(--black); color: var(--acid);\n  border: 1px solid var(--acid); border-radius: 0; padding: .7rem .9rem; cursor: pointer; }\n.floatstop[hidden] { display: none; }\n@keyframes run { to { translate: -50% 0; } }\n@media (prefers-reduced-motion: no-preference) { .ticker > div { animation: run 70s linear infinite; } }\n\n/* the one big paragraph */\n.big { margin: 2.4rem 0 2.6rem; font-size: clamp(22px, 2.55vw, 46px); line-height: 1.14; letter-spacing: -.008em; text-align: justify; hyphens: auto; }\n\n/* everything else is a footnote. the browser does the numbering, from 0 */\n.notes { margin: 0; padding: 0; columns: 4 17rem; column-gap: 2.4rem; font-size: 17px; line-height: 1.38; overflow-wrap: break-word; }\n.notes > li { break-inside: avoid; margin: 0 0 1.15rem 1.9em; padding: .05rem .3rem .15rem; scroll-margin-top: 1rem; }\n.notes > li::marker { color: var(--pink); font: 13px var(--mono); }\n.notes > li:target { background: var(--pink); color: #fff; }\n.notes > li:target a { color: #fff; }\n.back { font: 12px var(--mono); text-decoration: none; color: var(--pink); }\nli:target .back { color: #fff; }\n.refs { list-style: none; margin: .25rem 0 0; padding: 0; }\n.refs li { padding-left: 1.1em; text-indent: -1.1em; margin-bottom: .2rem; }\nfigure { margin: .6rem 0 .1rem; }\nfigure img { display: block; max-width: 100%; height: auto; background: #e8e8e8; filter: grayscale(1); }\nfigure:hover img { filter: none; }\nfigcaption { font-size: 14px; margin-top: .25rem; }\n\nhr { border: 0; border-top: 1px solid var(--ink); margin: 1.6rem 0 .6rem; }\nfooter p { font-size: 15px; max-width: none; margin: 0; }\n\n@media (max-width: 1000px) {\n  .top { flex-direction: column; align-items: stretch; }\n  .who { text-align: left; }\n  .who br.wide { display: none; }\n  .fm { flex: none; }\n}\n@media (max-width: 640px) {\n  body { font-size: 17px; }\n  .deck { grid-template-columns: minmax(0, 1fr); grid-template-areas: \"lcd\" \"keys\" \"textin\"; padding: .6rem; }\n  .tracker { grid-template-columns: repeat(8, 1fr); }\n  .big { text-align: left; margin: 1.8rem 0 2rem; }\n  .notes { font-size: 16px; }\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003c!-- hello. this page is one paragraph and a pile of footnotes.\n     to add something: write an \u003cli> in the notes list, then put a \u003csup> where it belongs in the paragraph.\n     the browser numbers the notes itself (from 0), but the little \u003csup> numbers are typed by hand, so check they match.\n     lorem ipsum = still to write -->\n\n\u003cheader class=\"top\">\n\n\u003cdiv class=\"who\">\n\u003ch1>kes\u003cbr>inkersole\u003csup>\u003ca id=\"r1\" href=\"#n1\">1\u003c/a>\u003c/sup>\u003c/h1>\n\u003cp>london\u003cbr>\n\u003ca href=\"mailto:inkersolekesia@gmail.com\">inkersolekesia@gmail.com\u003c/a>\u003cbr>\nlast updated 1 october 2026\u003c/p>\n\u003c/div>\n\n\u003c!-- KES FM: keep every id, class, data-* and button below, the engine at the bottom needs them -->\n\u003csection class=\"fm\" id=\"fm\" aria-labelledby=\"fm-h\">\n\u003ch2 id=\"fm-h\">KES FM 170.0\u003csup>\u003ca id=\"r0\" href=\"#n0\">0\u003c/a>\u003c/sup>\u003c/h2>\n\u003cp class=\"ident\">a jungle machine that lives in this page. the breaks and basslines are synthesised in your browser as you listen: no samples, no files. nothing plays until you press on air, and stop always stops it.\u003c/p>\n\u003cdiv class=\"deck\">\n\u003cdiv class=\"lcd\">\n\u003cdiv class=\"lcd-top\">\u003cspan>KES FM ((( 170.0 )))\u003c/span>\u003cspan class=\"status\" id=\"status\" role=\"status\">off air\u003c/span>\u003c/div>\n\u003cdiv class=\"ticker\" aria-hidden=\"true\">\u003cdiv>\u003cspan>big up all the junglists ✦ big up everyone reading the source code ✦ big up the UAL lot, LCF + CCI ✦ big up Neu Futur, DAZED, co—matter, MØRNING, WeTransfer, Protein, Midnight Agency, Softer, Selfridges ✦ text in: inkersolekesia@gmail.com ✦ respect to the sound systems, pirates and producers who built all this ✦ lorem ipsum dolor sit amet ✦\u003c/span>\u003cspan>big up all the junglists ✦ big up everyone reading the source code ✦ big up the UAL lot, LCF + CCI ✦ big up Neu Futur, DAZED, co—matter, MØRNING, WeTransfer, Protein, Midnight Agency, Softer, Selfridges ✦ text in: inkersolekesia@gmail.com ✦ respect to the sound systems, pirates and producers who built all this ✦ lorem ipsum dolor sit amet ✦\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"tracker\" id=\"tracker\" aria-hidden=\"true\">\u003c/div>\n\u003cdiv class=\"lcd-info\" aria-hidden=\"true\">\u003cspan id=\"lcdinfo\">break: straight · bass: sub · cute: off\u003c/span>\u003cspan>\u003cspan class=\"rev\">pink\u003c/span> = reversed · \u003cspan class=\"up\">yellow\u003c/span> = pitched up · underline = roll\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"keys\">\n\u003cdiv>\u003cbutton class=\"go\" id=\"go\" type=\"button\" aria-pressed=\"false\">▶ on air\u003c/button>\u003cbutton class=\"stop\" id=\"stop\" type=\"button\">■ stop\u003c/button>\u003c/div>\n\u003cdiv role=\"group\" aria-label=\"break\">\u003cspan class=\"lbl\">break\u003c/span>\u003cbutton type=\"button\" data-break=\"straight\" aria-pressed=\"true\">straight\u003c/button>\u003cbutton type=\"button\" data-break=\"chopped\" aria-pressed=\"false\">chopped\u003c/button>\u003cbutton type=\"button\" data-break=\"rollin\" aria-pressed=\"false\">rollin'\u003c/button>\u003cbutton type=\"button\" id=\"chop\" aria-pressed=\"false\">✂ chop it\u003c/button>\u003c/div>\n\u003cdiv role=\"group\" aria-label=\"bass\">\u003cspan class=\"lbl\">bass\u003c/span>\u003cbutton type=\"button\" data-bass=\"sub\" aria-pressed=\"true\">sub\u003c/button>\u003cbutton type=\"button\" data-bass=\"reese\" aria-pressed=\"false\">reese\u003c/button>\u003cbutton type=\"button\" data-bass=\"off\" aria-pressed=\"false\">off\u003c/button>\u003c/div>\n\u003cdiv>\u003cbutton type=\"button\" id=\"cute\" aria-pressed=\"false\">✿ cute\u003c/button>\u003cbutton type=\"button\" id=\"pullup\">⟲ pull up\u003c/button>\u003cbutton type=\"button\" id=\"siren\">siren\u003c/button>\u003c/div>\n\u003clabel class=\"vol\">vol\u003csup>\u003ca id=\"r11\" href=\"#n11\">11\u003c/a>\u003c/sup> \u003cinput type=\"range\" id=\"vol\" min=\"0\" max=\"1\" step=\"0.05\" value=\"0.5\">\u003c/label>\n\u003c/div>\n\u003cp class=\"textin\">text in your shout-outs: \u003ca href=\"mailto:inkersolekesia@gmail.com\">inkersolekesia@gmail.com\u003c/a>\u003c/p>\n\u003c/div>\n\u003c/section>\n\n\u003c/header>\n\n\u003cmain>\n\n\u003cp class=\"big\">i'm a freelance creative strategist\u003csup>\u003ca id=\"r2\" href=\"#n2\">2\u003c/a>\u003c/sup> and internet equalities researcher\u003csup>\u003ca id=\"r3\" href=\"#n3\">3\u003c/a>\u003c/sup> in london. my practice focuses on understanding and critiquing the impacts of emerging technologies on people, culture, and the planet. i work collectively\u003csup>\u003ca id=\"r4\" href=\"#n4\">4\u003c/a>\u003c/sup> to rethink the narratives and behaviours surrounding technologies, prioritising collaborative research as a process for testing, imagining and prototyping\u003csup>\u003ca id=\"r5\" href=\"#n5\">5\u003c/a>\u003c/sup> more equitable, alternative futures. i'm also an associate lecturer at UAL (LCF + CCI)\u003csup>\u003ca id=\"r6\" href=\"#n6\">6\u003c/a>\u003c/sup>. some of it you can read\u003csup>\u003ca id=\"r7\" href=\"#n7\">7\u003c/a>\u003c/sup> and some of it you can listen to on the bus\u003csup>\u003ca id=\"r8\" href=\"#n8\">8\u003c/a>\u003c/sup>. i've worked with Neu Futur, DAZED, co&#8288;—&#8288;matter, MØRNING, WeTransfer, Protein, Midnight Agency, Softer and Selfridges\u003csup>\u003ca id=\"r9\" href=\"#n9\">9\u003c/a>\u003c/sup>, and \u003cmark>i'm available for work at the moment\u003c/mark>\u003csup>\u003ca id=\"r10\" href=\"#n10\">10\u003c/a>\u003c/sup>.\u003c/p>\n\n\u003col class=\"notes\" start=\"0\">\n\n\u003cli id=\"n0\">\u003ca class=\"back\" href=\"#r0\" title=\"back up\">↑\u003c/a> KES FM, the radio. it's note zero because it goes first, and because counting starts at 0 round here. not a real station: no licence, no tower block, just your browser doing 170bpm. quiet until you press on air.\u003c/li>\n\n\u003cli id=\"n1\">\u003ca class=\"back\" href=\"#r1\" title=\"back up\">↑\u003c/a> or kesia, if it's a formal email.\u003c/li>\n\n\u003cli id=\"n2\">\u003ca class=\"back\" href=\"#r2\" title=\"back up\">↑\u003c/a> the work for funds:\n\u003cul class=\"refs\">\n  \u003cli>\u003ca href=\"https://co-matter.com/project/networked-worlds\">networked worlds\u003c/a> for co&#8288;—&#8288;matter. lorem ipsum dolor sit amet.\u003c/li>\n  \u003cli>\u003ca href=\"https://www.protein.xyz/dirty-words-4-community/\">dirty words #4: community report\u003c/a> for Protein. lorem ipsum dolor sit amet.\u003c/li>\n  \u003cli>\u003ca href=\"https://www.instagram.com/p/CwOEAMetgc1/?img_index=1\">MØRNING Ø\u003c/a>. lorem ipsum dolor sit amet.\u003c/li>\n\u003c/ul>\n\u003cfigure>\u003cimg src=\"https://picsum.photos/seed/networked/640/426\" width=\"320\" height=\"213\" alt=\"placeholder photo, lorem ipsum\">\u003cfigcaption>fig. 2. networked worlds, lorem ipsum.\u003c/figcaption>\u003c/figure>\n\u003c/li>\n\n\u003cli id=\"n3\">\u003ca class=\"back\" href=\"#r3\" title=\"back up\">↑\u003c/a> MA internet equalities. BA creative direction. PhD …one day?\u003c/li>\n\n\u003cli id=\"n4\">\u003ca class=\"back\" href=\"#r4\" title=\"back up\">↑\u003c/a> out of the house, with other people:\n\u003cul class=\"refs\">\n  \u003cli>\u003ca href=\"https://www.instagram.com/p/DRjYCG8jARb/?img_index=1\">olden residency\u003c/a>\u003c/li>\n  \u003cli>\u003ca href=\"https://www.instagram.com/p/C52uHshIkjq/?img_index=1\">softer london\u003c/a>, talk + workshop\u003c/li>\n  \u003cli>\u003ca href=\"https://www.arts.ac.uk/creative-computing-institute/public-programme/ ToValueAtTime(.001, t + dec);\n      g.gain.setValueAtTime(0, t + dec + .01);\n      metalHP.connect(g); g.connect(bus);\n      hiss(t, \"highpass\", 8500, .7, v * .3, dec * .8);\n    }\n    var at = function (s) { return .01 + s * OSTEP + (Math.random() - .5) * .003; };\n    [0, 2, 10, 11, 18, 19, 26].forEach(function (s) { kick(at(s), s === 11 || s === 19 ? .7 : .95); });\n    [[4, 1], [7, .45], [9, .55], [12, 1], [15, .5], [14, .15], [17, .3], [20, 1], [22, .14], [23, .45], [25, .55], [30, .9], [31, .2]]\n      .forEach(function (p) { snare(at(p[0]), p[1]); });\n    for (var s = 0; s \u003c 32; s += 2) if (s !== 26 && s !== 28) ride(at(s), s % 4 ? .45 : .7, .32);\n    ride(at(26), 1, 1.2); hiss(at(26), \"highpass\", 4500, .5, .45, 1);   // the crash\n\n    return new Promise(function (ok) {\n      oc.oncomplete = function (e) { ok(e.renderedBuffer); };\n      var p = oc.startRendering();\n      if (p && p.then) p.then(ok);\n    }).then(function (buf) {\n      var d = buf.getChannelData(0), peak = 0;\n      for (var i = 0; i \u003c d.length; i++) peak = Math.max(peak, Math.abs(d[i]));\n      for (i = 0; i \u003c d.length; i++) d[i] *= .9 / (peak || 1);\n      var rb = oc.createBuffer(1, d.length, sr), r = rb.getChannelData(0);\n      for (i = 0; i \u003c d.length; i++) r[i] = d[d.length - 1 - i];\n      breakBuf = buf; revBuf = rb;\n    });\n  }\n\n  // ---------- the live rig ----------\n  function vol() { return +$(\"#vol\").value * .9; }\n  function build() {\n    ac = new Ctx();\n    master = ac.createGain(); master.gain.value = vol();\n    comp = ac.createDynamicsCompressor();\n    comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 4; comp.attack.value = .004; comp.release.value = .18;\n    comp.connect(master); master.connect(ac.destination);\n    drums = ac.createGain(); drums.gain.value = .85; drums.connect(comp);\n    bassBus = ac.createGain(); bassBus.gain.value = .6; bassBus.connect(comp);\n    // a dub echo, for the siren and the cute  1);\n    var off = tok.rev ? revBuf.duration - (tok.s + 1) * OSTEP : tok.s * OSTEP;\n    g.gain.value = 0;\n    g.gain.setValueAtTime(0, t);\n    g.gain.linearRampToValueAtTime(v, t + (tok.rev ? .01 : .0015));\n    g.gain.setValueAtTime(v, t + d - .004);\n    g.gain.linearRampToValueAtTime(0, t + d + .002);\n    s.connect(g); g.connect(drums);\n    s.start(t, Math.max(0, off)); s.stop(t + d + .01);\n    live.push({ s: s, end: t + d + .01 });\n  }\n  function hz(semi) { return 43.65 * Math.pow(2, semi / 12); }\n  function midi(m) { return 440 * Math.pow(2, (m - 69) / 12); }\n  function bass(i, t) {\n    if (bassMode === \"off\") return;\n    var line = BASS[bassMode];\n    line.forEach(function (n) {\n      if (n[0] !== i) return;\n      var f = hz(n[1]), end = t + n[2] * STEP, glide = bassMode === \"reese\" ? .045 : .01;\n      var legato = line.some(function (m) { return m[0] === (n[0] + n[2]) % 32; });\n      B.sub.frequency.setTargetAtTime(f, t, glide);\n      B.o1.frequency.setTargetAtTime(f * 2, t, glide);\n      B.o2.frequency.setTargetAtTime(f * 2, t, glide);\n      B.env.gain.setTargetAtTime(1, t, .006);\n      if (!legato || bassMode === \"sub\") B.env.gain.setTargetAtTime(0, end - .03, .02);\n    });\n  }\n  function bell(t, m) {\n    [[1, .3, .9], [2, .07, .3], [3.01, .04, .18]].forEach(function (p) {\n      var o = ac.createOscillator(), g = ac.createGain();\n      o.frequency.value = midi(m) * p[0];\n      g.gain.setValueAtTime(p[1], t); g.gain.exponentialRampToValueAtTime(.0005, t + p[2]);\n      o.connect(g); g.connect(cuteBus); o.start(t); o.stop(t + p[2] + .02);\n    });\n  }\n  function pad(t, notes) {\n    var len = 32 * STEP / 2;\n    notes.forEach(function (m, k) {\n      var o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();\n      o.type = \"triangle\"; o.frequency.value = midi(m); o.detune.value = (k % 2 ? 6 : -6);\n      f.type = \"lowpass\"; f.frequency.value = 1400;\n      g.gain.value = 0; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.035, t + .6);\n      g.gain.setValueAtTime(.035, t + len - .5); g.gain.linearRampToValueAtTime(0, t + len);\n      o.connect(f); f.connect(g); g.connect(cuteBus); o.start(t); o.stop(t + len + .05);\n      live.push({ s: o, end: t + len + .05 });\n    });\n  }\n\n  function play(i, t) {\n    var tok = (pats[pattern] || pats.straight)[i];\n    if (tok) for (var k = 0; k \u003c tok.n; k++) slice(tok, t + k * STEP / tok.n, STEP / tok.n, tok.n > 1 ? .55 + .45 * (k + 1) / tok.n : 1);\n    bass(i, t);\n    if (cute) { if (BELLS[i]) bell(t, BELLS[i]); if (PADS[i]) pad(t, PADS[i]); }\n  }\n  function tick() {\n    if (!ac) return;\n    var ahead = document.hidden ? 1.5 : .12, now = ac.currentTime;\n    while (nextT \u003c now + ahead) {\n      var i = step % 32;\n      play(i, nextT);\n      queue.push([i, nextT]);\n      nextT += STEP; step++;\n    }\n    live = live.filter(function (x) { return x.end > now; });\n  }\n  function draw() {\n    if (!ac) return;\n    var now = ac.currentTime;\n    while (queue.length && queue[0][1] \u003c= now) light(queue.shift()[0]);\n    raf = requestAnimationFrame(draw);\n  }\n  function light(i) {\n    var cells = tracker.children;\n    if (cells[shown]) cells[shown].classList.remove(\"on\");\n    cells[i].classList.add(\"on\"); shown = i;\n    if (i % 4) return;                          // the rest happens on the beat\n    if (!happy) look(i % 8 ? null : \"^\");\n    if (still) return;\n    if (tower) tower.classList.toggle(\"lit\", i % 8 === 0);\n    sounds.forEach(function (s) { s.classList.remove(\"thump\"); void s.offsetWidth; s.classList.add(\"thump\"); });\n  }\n  function hush(t) {\n    live.forEach(function (x) { try { x.s.stop(t); } catch (e) {} });\n    live = []; queue = [];\n    if (B) {\n      B.env.gain.cancelScheduledValues(t); B.env.gain.setTargetAtTime(0, t, .015);\n      [B.sub, B.o1, B.o2].forEach(function (o) { o.frequency.cancelScheduledValues(t); });\n    }\n  }\n\n  // ---------- the buttons ----------\n  function say(s) { statusEl.textContent = s; }\n  function ui() {\n    document.body.classList.toggle(\"on-air\", onAir);\n    $(\"#go\").setAttribute(\"aria-pressed\", onAir);\n    floatStop.hidden = !onAir;\n    document.querySelectorAll(\"[data-break]\").forEach(function (b) { b.setAttribute(\"aria-pressed\", b.dataset.break === pattern); });\n    $(\"#chop\").setAttribute(\"aria-pressed\", pattern === \"chop\");\n    document.querySelectorAll(\"[data-bass]\").forEach(function (b) { b.setAttribute(\"aria-pressed\", b.dataset.bass === bassMode); });\n    $(\"#cute\").setAttribute(\"aria-pressed\", cute);\n    infoEl.textContent = \"break: \" + (pattern === \"chop\" ? \"your chop\" : pattern) + \" · bass: \" + bassMode + \" · cute: \" + (cute ? \"on ✿\" : \"off\") + \" · \" + BPM + \"bpm\";\n    var html = \"\";\n    pats[pattern].forEach(function (t) {\n      html += t ? '\u003cspan class=\"' + (t.rev ? \"rev \" : \"\") + (t.up ? \"up \" : \"\") + (t.n > 1 ? \"roll\" : \"\") + '\">' + t.label + \"\u003c/span>\" : '\u003cspan class=\"rest\">--\u003c/span>';\n    });\n    tracker.innerHTML = html;\n    if (tracker.children[shown] && onAir) tracker.children[shown].classList.add(\"on\");\n  }\n  function go() {\n    if (onAir) return;\n    wantOn = true;\n    if (!ac) build();\n    if (ac.resume) ac.resume();\n    say(\"tuning in…\");\n    (breakBuf ? Promise.resolve() : recordBreak()).then(function () {\n      if (!wantOn || !ac) return;\n      onAir = true; step = 0; queue = []; nextT = ac.currentTime + .08;\n      clearInterval(timer); timer = setInterval(tick, 25); tick();\n      cancelAnimationFrame(raf); raf = requestAnimationFrame(draw);\n      say(\"● on air ♪\");\n      ui();\n    }).catch(function (e) { say(\"no signal, your browser said no\"); console.warn(e); });\n  }\n  function stop() {\n    wantOn = false; onAir = false;\n    clearInterval(timer); timer = null; cancelAnimationFrame(raf);\n    if (ac) {\n      var a = ac, m = master;\n      hush(a.currentTime);\n      m.gain.setTargetAtTime(0, a.currentTime, .01);\n      ac = null; B = null;\n      setTimeout(function () { if (a.close) a.close(); }, 150);\n    }\n    if (tower) tower.classList.remove(\"lit\");\n    if (!happy) look();\n    say(\"off air\");\n    ui();\n  }\n  // ⟲ the DJ pulls the record back by hand and drops it again from the top\n  function pullUp() {\n    if (!onAir || !ac) return;\n    clearInterval(timer);\n    var t = ac.currentTime + .01;\n    hush(t);\n    var s = ac.createBufferSource(), g = ac.createGain(), pos = ((shown + 1) % 32) * OSTEP;\n    s.buffer = revBuf; s.loop = true;\n    s.playbackRate.setValueAtTime(RATE, t);\n    s.playbackRate.linearRampToValueAtTime(RATE * 3, t + .4);\n    s.playbackRate.exponentialRampToValueAtTime(.2, t + 1.05);\n    g.gain.value = 0; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.8, t + .02);\n    g.gain.setValueAtTime(.8, t + .75); g.gain.linearRampToValueAtTime(0, t + 1.05);\n    s.connect(g); g.connect(drums);\n    s.start(t, Math.max(0, revBuf.duration - pos)); s.stop(t + 1.1);\n    live.push({ s: s, end: t + 1.1 });\n    say(\"⟲ pull up! from the top…\");\n    if (!happy) look(\"@\");\n    step = 0; nextT = t + 1.15;\n    timer = setInterval(tick, 25);\n    setTimeout(function () { if (onAir) { say(\"● on air ♪\"); if (!happy) look(); } }, 1150);\n  }\n  // a dub siren, sound system style\n  function siren() {\n    if (!ac) build();\n    if (ac.resume) ac.resume();\n    var t = ac.currentTime + .02, o = ac.createOscillator(), l = ac.createOscillator(), lg = ac.createGain(), g = ac.createGain(), f = ac.createBiquadFilter();\n    o.type = \"square\"; o.frequency.setValueAtTime(380, t); o.frequency.exponentialRampToValueAtTime(820, t + 1.2);\n    l.type = \"square\"; l.frequency.setValueAtTime(4, t); l.frequency.linearRampToValueAtTime(10, t + 1.4);\n    lg.gain.value = 90; l.connect(lg); lg.connect(o.frequency);\n    f.type = \"lowpass\"; f.frequency.value = 1800;\n    g.gain.value = 0; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.09, t + .03);\n    g.gain.setValueAtTime(.09, t + 1.25); g.gain.linearRampToValueAtTime(0, t + 1.5);\n    o.connect(f); f.connect(g); g.connect(comp); g.connect(echoIn);\n    o.start(t); l.start(t); o.stop(t + 1.55); l.stop(t + 1.55);\n    live.push({ s: o, end: t + 1.55 }, { s: l, end: t + 1.55 });\n  }\n\n  $(\"#go\").onclick = go;\n  $(\"#stop\").onclick = stop;\n  floatStop.onclick = stop;\n  $(\"#pullup\").onclick = pullUp;\n  $(\"#siren\").onclick = siren;\n  $(\"#chop\").onclick = function () { chop(); pattern = \"chop\"; ui(); };\n  $(\"#cute\").onclick = function () { cute = !cute; ui(); };\n  $(\"#vol\").oninput = function () { if (ac) master.gain.setTargetAtTime(vol(), ac.currentTime, .03); };\n  document.querySelectorAll(\"[data-break]\").forEach(function (b) { b.onclick = function () { pattern = b.dataset.break; ui(); }; });\n  document.querySelectorAll(\"[data-bass]\").forEach(function (b) { b.onclick = function () { bassMode = b.dataset.bass; bassMix(); ui(); }; });\n  ui();\n})();\n\n\u003c/script>\n\n\u003cscript>\nconsole.log(\"hi, it's kes\");\nconsole.log(\"if you've opened the console you're either a developer or one of my students. hello x\");\nconsole.log(\"the footnotes start at 0 on purpose\");\n\u003c/script>\n\n\u003cscript>(function(){\ndocument.addEventListener('click',function(e){\n  var a=e.target.closest&&e.target.closest('a[href^=\"#\"]');\n  if(!a||e.defaultPrevented)return;\n  var id=decodeURIComponent(a.getAttribute('href').slice(1)),t=id&&document.getElementById(id);\n  if(id&&!t)return;\n  e.preventDefault();\n  t?t.scrollIntoView({block:'start'}):scrollTo(0,0);\n});\naddEventListener('keydown',function(e){\n  if(e.metaKey||e.ctrlKey||e.altKey)return;\n  if(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]'))return;\n  if(['ArrowLeft','ArrowRight','m'].indexOf(e.key)>-1)parent.postMessage({variantKey:e.key},'*');\n});\n})();\u003c/script>\u003c/body>\n\u003c/html>\n"}, {"label": "03", "note": "Black KES FM block beside “Inkersole, Kes”; the whole site is a book index across full-width ruled columns, circular “see” jokes, photos as numbered plates.", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en-GB\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Inkersole, Kes\u003c/title>\n\u003cmeta name=\"description\" content=\"Kesia Inkersole — freelance creative strategist &amp; internet equalities researcher, based in london.\">\n\u003cmeta name=\"author\" content=\"Kes Inkersole\">\n\u003cmeta name=\"keywords\" content=\"Kesia Inkersole, Kes Inkersole, creative strategist, internet equalities, researcher, London, UAL\">\n\u003cmeta name=\"color-scheme\" content=\"light\">\n\u003clink rel=\"icon\" href=\"/favicon.ico\" sizes=\"any\">\n\u003cmeta property=\"og:type\" content=\"website\">\n\u003cmeta property=\"og:title\" content=\"kes inkersole\">\n\u003cmeta property=\"og:description\" content=\"kes inkersole — freelance creative strategist &amp; internet equalities researcher, based in london.\">\n\u003cmeta property=\"og:image\" content=\"https://kesia-coral.vercel.app/square.png\">\n\u003cmeta property=\"og:url\" content=\"https://kesia-coral.vercel.app\">\n\u003cmeta name=\"twitter:card\" content=\"summary_large_image\">\n\u003cmeta name=\"twitter:title\" content=\"kes inkersole\">\n\u003cmeta name=\"twitter:description\" content=\"kes inkersole — freelance creative strategist &amp; internet equalities researcher, based in london.\">\n\u003cmeta name=\"twitter:image\" content=\"https://kesia-coral.vercel.app/square.png\">\n\u003c!--\n  kes: this page is an index, like the one at the back of a book.\n  to add something, find its letter and put it in alphabetical order.\n  file it under two or three words if people might look for it under two or three words.\n  \"see\" points somewhere else on the page (href=\"#...\"). a photo is a plate: pl. 1, pl. 2...\n-->\n\u003cstyle>\n/* black, white, link blue, and one pink. that's it */\n:root {\n  --ink: #000;\n  --paper: #fff;\n  --pink: #ff2e88;\n  --yellow: #ffd60a;\n  --mono: ui-monospace, Menlo, Consolas, \"DejaVu Sans Mono\", \"Courier New\", monospace;\n}\nbody {\n  margin: 0;\n  padding: 1.5rem 2rem 2rem;\n  background: var(--paper);\n  color: var(--ink);\n}\n::selection { background: var(--pink); color: #000; }\na:hover { background: var(--pink); color: #000; }\n:target { background: var(--pink); scroll-margin-top: 2rem; }\n\n/* the top: my name the way an index would print it, and the radio right next to it */\n.top {\n  display: grid;\n  grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);\n  grid-template-areas: \"who fm\" \"about fm\";\n  grid-template-rows: auto 1fr;\n  gap: 1.25rem 3rem;\n  align-items: start;\n}\n.who { grid-area: who; }\n.fm { grid-area: fm; }\n.about { grid-area: about; }\nh1 { font-size: clamp(2.6rem, 5.4vw, 5rem); line-height: .95; letter-spacing: -.025em; margin: 0 0 .9rem; }\n.who p, .about p { font-size: 1.125rem; line-height: 1.4; margin: 0 0 .7em; max-width: 46rem; }\n.about p:last-child { margin-bottom: 0; }\n\n/* ===== KES FM, in black ===== */\n.fm { background: #000; color: #fff; padding: .8rem 1rem 1rem; }\n.fm h2 { font: 700 13px/1.2 var(--mono); letter-spacing: .08em; margin: 0 0 .3rem; }\n.ident { font: 12.5px/1.45 var(--mono); color: #bbb; margin: 0 0 .8rem; }\n.lcd { border: 1px solid #555; color: #fff; font: 12px/1.4 var(--mono); padding: .55rem .65rem .5rem; }\n.lcd-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .2rem 1rem; font-size: 13px; }\n.status { color: var(--pink); }\n.ticker { overflow: hidden; white-space: nowrap; border-block: 1px solid #333; margin: .45rem 0; padding: .15rem 0; color: #ccc; }\n.ticker > div { display: inline-block; }\n.ticker span { padding-right: .5em; }\n.tracker { display: grid; grid-template-columns: repeat(16, 1fr); gap: 2px; text-align: center; font-size: 11.5px; }\n.tracker span { padding: 1px 0; }\n.tracker .rest { opacity: .35; }\n.tracker .rev { color: var(--pink); }\n.tracker .up { color: var(--yellow); }\n.tracker .roll { text-decoration: underline; }\n.tracker .on { background: var(--pink); color: #000; }\n.lcd-info { margin-top: .4rem; font-size: 11px; color: #999; display: flex; flex-wrap: wrap; gap: 0 1rem; }\n.lcd-info .rev { color: var(--pink); } .lcd-info .up { color: var(--yellow); }\n.keys { display: flex; flex-wrap: wrap; gap: .55rem 1rem; align-items: center; margin-top: .8rem; }\n.keys > div { display: flex; flex-wrap: wrap; gap: .3rem; align-items: center; }\n.keys .lbl { font: 11px var(--mono); color: #999; margin-right: .15rem; }\n.keys button { font: 700 11.5px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase; background: #000; color: #fff;\n  border: 1px solid #fff; border-radius: 0; padding: .45rem .55rem; cursor: pointer; }\n.keys button:hover { border-color: var(--pink); color: var(--pink); }\n.keys button:active { translate: 0 1px; }\n.keys button[aria-pressed=\"true\"] { background: #fff; color: #000; }\n.keys .go, .keys .go[aria-pressed=\"true\"] { background: var(--pink); border-color: var(--pink); color: #000; font-size: 13px; padding: .5rem .7rem; }\n.keys .stop { font-size: 13px; padding: .5rem .7rem; }\nbutton:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }\n.vol { font: 11px var(--mono); color: #999; display: flex; align-items: center; gap: .4rem; }\n.vol input { width: 6.5rem; accent-color: var(--pink); }\n.textin { margin: .8rem 0 0; font: 12px var(--mono); color: #bbb; }\n.fm a { color: #fff; }\n.fm a:hover { color: #000; }\n.floatstop { position: fixed; right: 1rem; bottom: 1rem; z-index: 5; font: 700 13px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase;\n  background: #000; color: #fff; border: 2px solid var(--pink); border-radius: 0; padding: .7rem .9rem s\u003c/h1>\n\u003cp>(Kesia), creative strategist and internet equalities researcher, London; associate lecturer, UAL (LCF + CCI); available for work right now, \u003ci>see\u003c/i> \u003ca href=\"#i-email\">email\u003c/a>.\u003c/p>\n\u003c/div>\n\n\u003c!-- KES FM. leave the ids and buttons alone, the engine at the bottom needs them -->\n\u003csection class=\"fm\" id=\"fm\" aria-labelledby=\"fm-h\">\n\u003ch2 id=\"fm-h\">KES FM 170.0\u003c/h2>\n\u003cp class=\"ident\">not a real station. it's this website: a jungle machine running in your browser, every drum and bassline synthesised live, no samples, no files. nothing plays until you press on air, and stop always stops it.\u003c/p>\n\u003cdiv class=\"deck\">\n\u003cdiv class=\"lcd\">\n\u003cdiv class=\"lcd-top\">\u003cspan>KES FM ((( 170.0 )))\u003c/span>\u003cspan class=\"status\" id=\"status\" role=\"status\">off air\u003c/span>\u003c/div>\n\u003cdiv class=\"ticker\" aria-hidden=\"true\">\u003cdiv>\u003cspan>big up all the junglists ✦ big up everyone reading the source code ✦ big up the UAL lot, LCF + CCI ✦ big up Neu Futur, DAZED, co—matter, MØRNING, WeTransfer, Protein, Midnight Agency, Softer, Selfridges ✦ text in: inkersolekesia@gmail.com ✦ respect to the sound systems, pirates and producers who built all this ✦ lorem ipsum dolor sit amet ✦\u003c/span>\u003cspan>big up all the junglists ✦ big up everyone reading the source code ✦ big up the UAL lot, LCF + CCI ✦ big up Neu Futur, DAZED, co—matter, MØRNING, WeTransfer, Protein, Midnight Agency, Softer, Selfridges ✦ text in: inkersolekesia@gmail.com ✦ respect to the sound systems, pirates and producers who built all this ✦ lorem ipsum dolor sit amet ✦\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"tracker\" id=\"tracker\" aria-hidden=\"true\">\u003c/div>\n\u003cdiv class=\"lcd-info\" aria-hidden=\"true\">\u003cspan id=\"lcdinfo\">break: straight · bass: sub · cute: off\u003c/span>\u003cspan>\u003cspan class=\"rev\">pink\u003c/span> = reversed · \u003cspan
